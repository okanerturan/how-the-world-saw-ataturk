# Checks every record and translation (npm run validate) on pull requests and on pushes to main,
# then builds the exhibition from the data (the guided tour's stops must all exist and be verified).
# Problems appear as annotations on the changed lines of the pull request and in the job summary.
name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - "package*.json"
      - "viz/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
      - "package*.json"
      - "viz/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the validator compares `verification` blocks with the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate

  exhibition:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viz/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: viz
      - run: node scripts/validate-tour.mjs
        working-directory: viz
      - run: npm run build
        working-directory: viz
