voice: Dimitri Atschkow
role: >-
  Bulgar milletvekili; gazete onu tanınmış bir Makedo-Bulgar siyasetçi, Makedonya icra komitesi üyesi ve
  Stambolov partisinin bir siması olarak nitelendiriyor. Neue Freie Presse'teki mülakat
quote: >-
  Makedonya kökenli olan Mustafa Kemal, Çanakkale savunmasında üstün başarı gösterdikten sonra, henüz genç bir
  adamken 16. Kolordu Komutanı olarak generallik görevini aldı. Askerî yetenekleri sayesinde, Diyarbekir
  cephesindeki büyük Rus saldırılarını püskürterek Türk silahlarını şanla donatmayı başardı.
quote_kind: translated
summary: >-
  Mustafa Kemal'i Türkiye'nin öne çıkan liderleri arasında saydı: Makedonya kökenli, Çanakkale'de üstün başarı
  göstermiş, genç yaşta general olmuş ve Rusları püskürtmüş bir isim.
caveat: >-
  9 Eylül 1916 tarihli Neue Freie Presse'nin 2. sayfasında, 'Wien, 8. September.' tarihli ve Bulgarlar ile
  Türklerin silah kardeşliği üzerine 'Die Befreiung der Dobrudscha durch den Sieg bei Tutrakan. Die
  Waffenbrüderschaft zwischen Bulgaren und Türken. Unterredung mit Dimitri Atschkow. Bulgarischer
  Abgeordneter.' başlıklı mülakat; gazete onu 'Der bekannte mazedo-bulgarische Politiker Dimitri Atschkow, der
  sich seit einigen Tagen in Wien aufhält' olarak tanıtıyor. Kapanış notu onun Makedonya icra komitesinde yer
  aldığını, Stambolov partisinde tanınmış bir sima olduğunu, Makedonya cephesinde savaşıp Krivolak'tan sonra
  nişan aldığını, Balkan Savaşı'na katıldığını ve Türkiye ile Bulgaristan'ın yakınlaşması için çalıştığını
  ekliyor. Bu bilgiler, Bulgarca Wikipedia biyografisinde aynı komite üyeliği, Balkan Savaşı hizmeti ve savaş
  dönemi nişanı yer alan Pirlepe doğumlu Dimitar Achkov (doğumu 1869) ile örtüşmektedir; bu kimlik tespiti
  arşive aittir. Aynı biyografi Achkov ile Mustafa Kemal arasındaki bir dostluk için 2006 tarihli bir gazete
  yazısına ve 2007 tarihli bir kitaba atıfta bulunmaktadır; bunlar incelenmemiştir ve mülakatın kendisi
  birbirlerini tanıdıklarını söylememektedir. Enver'in doğru adamları bulma yeteneğinin kanıtı olarak, 'der
  türkische Nationalheros Enver Pascha'dan sonra ikinci sırada onun adını verir; bu övgü mülakatın temasına
  hizmet etmektedir. 'Diarbekirfront' ve 'henüz genç bir adamken' general rütbesi onun yaklaşık ifadeleridir.
  Kütüphanenin görüntüleyicisinde, Fraktur harfleriyle dizilmiş tam sayfa üzerinden okunmuştur.
