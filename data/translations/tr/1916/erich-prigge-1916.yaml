id: erich-prigge-1916
voice: Erich R. Prigge
role: >-
  Alman binbaşı, Mareşal Liman von Sanders'in yaveri; Der Kampf um die Dardanellen adlı kitap
quote: >-
  Durumun tehlikesini fark ederek, beraberinde kaçınılmaz olarak Boğaz hâkimiyetini getirecek olan Maydos'a
  yönelik bir düşman yarma harekâtı için bu muazzam tepelere sahip olmanın belirleyici önem taşıdığını doğru
  biçimde kavrayıp emrindeki alaylardan birini bir dağ bataryasıyla birlikte derhal Kocaçimen Dağı'na
  gönderdi. Ancak 19. Tümen Komutanı yarım tedbirlerle yetinmez.
quote_kind: translated
summary: >-
  Liman'ın yaveri, onu 25 Nisan 1915'te tehlikeyi derhal kavrayıp yarım tedbirlerle yetinmeksizin alaylarını
  tepelere gönderirken gösterir.
caveat: >-
  Ernst Jäckh'in önsözüyle yayımlanan Der Kampf um die Dardanellen (Deutsche Orientbücherei XIII; Weimar:
  Gustav Kiepenheuer, 1916): Liman'ın yaveri tarafından Alman kamuoyu için yazılmış bir savaş dönemi kitabı.
  Alıntı s. 44–45'ten olup 25 Nisan 1915 hakkındadır; pasaj, General Esat Paşa'nın 'die energischen Maßnahmen
  seines verantwortungsfreudigen Divisionskommandeurs'u onaylamasıyla sona erer. Ayrıca bkz. s. 11 (karargâhı
  'yere adını vermiştir') ve 10 Ağustos hakkındaki s. 98–99: 'Er stellt sich an die Spitze der stürmenden
  Truppen … Ein Geschoß durchschlägt den Rock Mustapha Kemals. Seine Taschenuhr rettet ihm das Leben.' S.
  98'de Prigge, 'Fehzi' adlı bir albayın aniden hastalandığını ve yerine onun getirildiğini söyler; Liman'ın o
  sonbahardaki kendi mektubu ise (liman-von-sanders-1915-09-30) kolordu komutanının taarruz emrini yerine
  getirmediğini belirtir. Metinde adı 'Mustapha' olarak, s. 48'den sonraki portre levhasında ise 'Oberst
  Mustafa Kemal Bey' olarak yazılmıştır. Fraktur harfleriyle basılmıştır; uzun s harfi ve yer adlarındaki çift
  tireler burada standartlaştırılmıştır.
