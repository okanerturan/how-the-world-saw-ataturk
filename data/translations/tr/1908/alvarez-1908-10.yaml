id: alvarez-1908-10
voice: J. Alvarez
role: Trablusgarp'taki İngiliz konsolosu; Büyükelçi Lowther'a gönderdiği raporlar
quote: >-
  Geçen gün beni ziyaret etti ve kendisinin çok sessiz ve mesafeli bir tabiata sahip olduğunu gözlemleme
  fırsatı buldum. Bende, ileride doğrulanacağını umduğum üzere, enerjik bir karaktere ve kararlı bir mizaca
  sahip olduğu izlenimini bıraktı; yerel olarak gözlemlediğim birtakım anarşik eğilimlerin sürmesi hâlinde,
  sonunda bu iki özelliğe de ihtiyaç duyulabilir. […] Tanıklık edebileceğim üzere belagatli ve akıcı bir
  hatiptir; yaklaşık beş gün önce partisinin izlediği ilke ve amaçları dikkate değer bir berraklıkla
  açıklarken kendisini dinledim; o sırada halkın her sınıfını temsil eden kalabalık bir dinleyici kitlesi
  tarafından coşkuyla alkışlandı.
quote_kind: translated
summary: >-
  Jön Türk temsilcisi 'Adjutant Kemal Bey'i sessiz ve mesafeli, enerjik ve kararlı, ayrıca kalabalık bir
  Trablusgarp dinleyici kitlesi tarafından alkışlanan belagatli bir hatip olarak buldu.
caveat: >-
  Şimdiye dek bulunan en erken tarihli dış gözlem. Alvarez, 'Adjutant Kemal Bey' ve 'Kemal Bey', 'a
  representative of the Salonica Committee of the Young Turkey party' diye yazar; bu kişinin Mustafa Kemal ile
  özdeşleştirilmesi, onun Trablusgarp görevine ilişkin kendi sonraki anlatımına ve bir İtalyan konsolosluk
  raporuna dayanan Rachel Simon'a aittir. Hangi pasajın hangi rapordan geldiği Simon'ın dipnotlarına
  dayanmaktadır ve 16 ile 17 numaralı dipnotları arasında bir karışıklık olasılığı göz ardı edilemez. Foreign
  Office dosyası çevrimiçi değildir ve görülmemiştir. İkinci rapor, görevinin 'to a large extent of an
  educational character' olduğunu ekler. Simon, Bingazi konsolosunun aynı göreve ilişkin raporu hakkında 'has
  some inaccuracies' diye belirtir.
