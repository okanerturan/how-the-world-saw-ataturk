voice: Mary McAleese
role: >-
  İrlanda Cumhurbaşkanı; bir İrlanda devlet başkanının Türkiye'ye ilk ziyareti: Green Hill Mezarlığı'ndaki ve
  Valilik öğle yemeğindeki konuşmaları, Çanakkale
quote: >-
  O sözde "Büyük Savaş"ın yakıcı anısı ve acısı insanların zihinlerinde hâlâ taze ve çiğken, olağanüstü bir
  devlet adamı ve asker tarafından yazılan bu gerçekten olağanüstü sözler, yalnızca o insanın değil, Türk
  halkının ruh yüceliğinin de bir kanıtıdır. […] Yalnızca muharebenin travmatik hararetine ve dehşetine bizzat
  tanık olmuş bir asker böylesine alicenap ve iyileştirici sözler söyleyebilirdi. […] Bize o barışa giden
  yolun, ölenlerin hepsini kardeş olarak görmekten geçtiğini uzun zaman önce gösteren, o büyük, korkusuz Türk
  kahramanı Mustafa Kemal Atatürk'tü.
quote_kind: translated
summary: >-
  Gelibolu'da hayatını kaybedenlerin annelerine söylediği sözlerle bağışlamayı öğreten 'olağanüstü bir devlet
  adamı ve asker', 'büyük, korkusuz bir Türk kahramanı'.
caveat: >-
