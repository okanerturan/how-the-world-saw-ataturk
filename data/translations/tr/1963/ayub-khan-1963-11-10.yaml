voice: Ayub Khan
role: Pakistan Cumhurbaşkanı; Atatürk'ün ölümünün 25. yıldönümü mesajı
quote: >-
  Kemal Atatürk, yalnız bu asrın en büyük adamlarından biri değildir. Biz Pakistan'da O'nu, gelmiş geçmiş
  bütün çağların en büyük adamlarından biri olarak görüyoruz. Askeri bir dehâ, doğuştan bir lider ve büyük bir
  vatanperver olan Kemal Atatürk, memleketinizi yeniden büyüklük yoluna koydu. O, yalnız sizin milletinizin
  sevgili lideri değildi. Dünyadaki bütün Müslümanlar gözlerini sevgi ve hayranlık hisleriyle O'na
  çevirmişlerdi. O, Müslüman dünyasında yeniden siyasi uyanış istikametinde ileriye doğru cesur bir adım atan
  bir avuç insandan biriydi.
quote_kind: original-turkish
summary: >-
  Tüm çağların en büyük insanlarından biri: her yerdeki Müslümanların sevdiği, Türkiye'yi yeniden büyüklük
  yoluna sokan bir askeri deha.
