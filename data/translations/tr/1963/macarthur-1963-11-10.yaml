voice: Douglas MacArthur
role: Orgeneral (emekli); Atatürk'ün ölümünün 25. yıldönümü mesajı
quote: >-
  Bu asker - devlet adamı, çağımızın en büyük liderlerinden biri idi. Kendisi, Türkiye'nin dünyanın en ileri
  memleketleri arasında hak ettiği yeri almasını sağlamıştır. Keza O, Türklere, bir milletin büyüklüğünün
  temel taşını teşkil eden, kendine güvenme ve dayanma duygusunu vermiştir. Ben Atatürk'ün sadık
  arkadaşlarından biri olmakla büyük iftihar duyuyorum.
