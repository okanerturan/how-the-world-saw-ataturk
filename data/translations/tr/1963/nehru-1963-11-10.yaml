id: nehru-1963-11-10
voice: Jawaharlal Nehru
role: Hindistan Başbakanı; Atatürk'ün ölümünün 25. yıldönümü mesajı
quote: >-
  Kemal Atatürk veya, bizim O'nu o zamanlar tanıdığımız adıyla Kemal Paşa, gençlik günlerimde, benim
  kahramanımdı. Biz o tarihlerde kendi bağımsızlık hareketimizle son derece meşguldük ve ben, diğer birçok
  kimselerle birlikte hapishane hayatıma başlamıştım. Kemal Paşa'nın Türkiye'yi yabancı hâkimiyet ve
  nüfuzundan kurtarmak yolundaki faaliyetleri ve mücadelesi ile ilgili haberleri hapishanede dahi büyük bir
  alâka ve heyecanla takip etmekte idik. Anadolu'da Yunanlılara karşı kazanılan büyük zaferin haberi
  hapishanede bize geldiği zaman bundan ne büyük bir memnuniyet duyduğumuzu ve bunu hapishanede dahi nasıl
  kutladığımızı çok iyi hatırlıyorum. […] O'nun dinamizmi, yılmak ve yorulmak bizmezliği insanda büyük bir
  tesir yaratıyordu... O, Doğuda modern çağın yapıcılarından biridir. O'nun en büyük hayranları arasında
  bulunmakta devam ediyorum.
quote_kind: original-turkish
summary: >-
  'Gençliğimin kahramanı': Nehru onun Anadolu'daki zaferini hapishanede kutlamıştır ve 'en büyük hayranları
  arasında' yer almaya devam etmektedir.
caveat: >-
