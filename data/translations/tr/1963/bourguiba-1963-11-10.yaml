voice: Habib Bourguiba
role: Tunus Cumhurbaşkanı; Atatürk'ün ölümünün 25. yıldönümü mesajı
quote: >-
  Milletimiz «Gazi» nin ölmez eseri için en büyük hayranlığı duymakta, hâtırasına da en büyük hürmeti
  beslemektedir. Biz O'nun şahsında, savaş meydanlarında, büyük bir asker olduğunu ispat ettikten sonra,
  herşeyin tamamen kaybolduğu zannedildiği bir anda, milletinden ümidini kesmeyi ve mağlûbiyeti kabul etmeyi
  şiddetle reddeden Tanrının seçtiği büyük insanı tebcil ediyoruz. […] Atatürk böylece, ölümü esarete tercih
  eden bir milletin neler yapabileceğini hayretler içinde bulunan dünyaya göstermiştir. Bu örnek
  unutulmayacaktır. Memleketinin eğemenliğinin mimarı olarak, biz Atatürk'ün şahsında, parçalanmak yolunda
  olan bir İmparatorluğun enkazı üstünde ilerlemeye yönelmiş, müessir ve modern bir devlet kurmuş devrimciye
  hayranlık duymaktayız. O'nun ölmez eseri, egemenliklerini elde etmiş milletlerin kaderlerine hükmedenler
  için ışıklı bir örnek ve bir ilham kaynağı olarak kalacaktır.
quote_kind: original-turkish
summary: >-
  Her şey kaybedilmiş görünürken yenilgiyi reddeden, ülkesinin egemenliğini yeniden kuran ve modern bir devlet
  inşa eden 'Gazi': yeni bağımsızlığına kavuşmuş uluslar için bir ilham kaynağı.
caveat: >-
