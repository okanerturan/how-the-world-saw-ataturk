role: Çin Cumhuriyeti (Tayvan) Cumhurbaşkanı; Atatürk'ün ölümünün 25. yıldönümü mesajı
quote: >-
  Türkiye Cumhutiyetinin kurucusu Mustafa Kemal Atatürk'ün ölümünün 25 inci yıldönümü münasebetiyle,
  memleketim ve milletim adına, milletini hürriyet ve demokrasiye kavuşturmak uğrunda mücadele ederek başarı
  kazanan büyük Türk önderi hakkındaki engin duygularımı ve hayranlığımı iletmek isterim, Atatürk'ün hayatı ve
  eseri sadece Türkiye için değil fakat dünyanın bütün hür milletleri için bir ilham kaynağı olmakta devam
  edecektir.
