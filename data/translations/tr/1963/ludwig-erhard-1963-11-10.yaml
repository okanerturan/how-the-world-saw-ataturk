voice: Ludwig Erhard
role: Batı Almanya Şansölyesi (Ekim 1963'ten itibaren); Atatürk'ün ölümünün 25. yıldönümü mesajı
quote: >-
  Bütün dünya 10 Kasımda, biz Almanların da dostluk ve saygı ile bağlı olduğumuz bir insanın, hayatını ve
  eserlerini takdirle anmaktadır... Atatürk bir asker olarak, amansız ve hattâ bâzı anlarında ümitsiz gözüken
  bir mücadeleden muzaffer çıkmış ve sonra da devlet sorumluluğunu üzerine almıştır. 29 Ekim 1923 te Türkiye
  Cumhuriyetini ilânı, onun diplomatik dehâsının bir eseridir. […] Cesurâne ve azimkârane ideallere sahipti ve
  yılmak bilmeyen bir yaratıcılıkla eserlerini gerçekleştirmeğe başladı... Atatürk, biz Almanlarla geleneksel,
  yürekten ve karşılıklı itimada dayanan münasebetler idame ettirmiştir... Atatürk, daima Türkiye ile Avrupa
  arasında sıkı bağlar kurmağa çalışmıştır.
