voice: John F. Kennedy
role: Amerika Birleşik Devletleri Başkanı
quote: >-
  Ulusal çapta kendi gücüne dayanmanın, Türkiye Cumhuriyeti'nin doğuşundan ve o zamandan beri Türkiye ile
  Atatürk tarafından başlatılan köklü değişimlerden daha başarılı bir örneği kuşkusuz yoktur.
quote_kind: translated
summary: >-
