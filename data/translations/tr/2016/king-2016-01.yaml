id: king-2016-01
voice: Steve King
role: ABD Temsilciler Meclisi Iowa Üyesi (Cumhuriyetçi)
quote: >-
  Atatürk'ün Türkiye'de yaptığı çalışmalara, Doğu ile Batı arasında nasıl bir köprü kurduğuna — ki bu Erdoğan
  yönetiminde biraz tersi yöne doğru kaymaktadır — baktığımda … Müslüman dünyası ile Hristiyan dünyası ve Batı
  arasında o köprüyü kuracak, dünyanın Atatürk'ü olabilir
quote_kind: translated
summary: >-
  Mısır lideri Sisi'yi överken Atatürk'ü Doğu ile Batı arasında bir köprü olarak anar ve Sisi'nin 'dünyanın
  Atatürk'ü' olabileceğini umar.
caveat: >-
  Mısır üzerine bir dakikalık tarzda genel kurul konuşması; Atatürk, Sisi'nin olmasını istediği kişinin
  şablonudur. İkinci parça H267'ye geçen sayfa sonundan sonra gelir. King'in 13 Temmuz 2017 tarihli ikinci bir
  beyanı (s. H5823), Atatürk'ün 'for 40 years, moved Turkey to the West' olduğunu söyler (ayrı olarak yer
  verilmedi). Kaynak gösterimi: House of Representatives, 11 Ocak 2016, 'Egypt Talking Points', Congressional
  Record c. 162, s. H264-H267 (granül CREC-2016-01-11-pt1-PgH264).
verification_note: >-
