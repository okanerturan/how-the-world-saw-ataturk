  Sayfada tarih yoktur; '80 yıl önce' ifadesi ve başbakanlık dönemi (2002–04) 2003 yılını verir. Şöyle devam
  eder: 'yurtta barış, dünyada barış' sözünde ifade edilen fikirler ve bağımsız, demokratik bir ülkenin
  modernleşmesi 'meyve vermeye devam etmektedir'. Kaynak: Anıtkabir Özel Defteri (basılı derleme, '1953'ten
  günümüze Anıtkabir'i ziyaret eden yerli ve yabancı heyet başkanlarının Atatürk hakkındaki duygu ve
  düşünceleri'), ataturkarsivi.com adresindeki sayfa görüntüleri, ana ajan tarafından görüntü üzerinden okundu
