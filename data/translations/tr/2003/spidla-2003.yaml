voice: Vladimír Špidla
role: Çek Cumhuriyeti Başbakanı
quote: >-
  80 sene önce, Türkiye Cumhuriyetini kendi liderliğinde Türk halkıyla birlikte kuran Kemal Atatürk'ün
  anısının önünde saygıyla eğiliyorum.
quote_kind: original-turkish
summary: >-
  Cumhuriyet'in kurucusunun anısı önünde eğiliyor; onun 'yurtta barış' düşüncesi ve modernleştirme hamlesi
  hâlâ meyve veriyor.
caveat: >-
