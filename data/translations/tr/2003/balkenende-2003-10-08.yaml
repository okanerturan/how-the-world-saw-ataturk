voice: Jan Peter Balkenende
role: Hollanda Başbakanı
quote: >-
  Türkiye'nin, Genç Cumhuriyet için Kurucusu Kemal Atatürk tarafından dile getirilen Avrupa hedeflerindeki bu
  tarihi anda burada bulunmaktan mutluluk ve onur duyuyorum.
quote_kind: translated
summary: >-
  Genç cumhuriyetin Avrupa hedeflerini dile getiren 'büyük Türk liderini', uygarlık yolunda ilerlemeye dair
  sözlerini alıntılayarak onurlandırır.
caveat: >-
