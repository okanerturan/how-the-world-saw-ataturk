  görüşü: 'ذلك ما افتتح به الكماليون عملهم؛ ... وكان أشدهم إفراطاً في ذلك الغازي مصطفى كمال باشا الذي كان
  المسلمون جميعهم يعدونه بطل أبطالهم غير مدافع'. Çeviri sadıktır. Uyarı notundaki çapraz referanslar kontrol
  edildi: sayı 101 hilafetin kaldırılması için 'ما كان ... ضرورة اقتضاها الإصلاح، ولكن إفراطاً أدت إليه
  الثورة' der (örtüşüyor); sayı 108'de (29-07-1935) kadın delegenin Gazi'ye 'أتاشرق' demesi ve Azzam'ın buna
  karşı çıkışı yer alır (örtüşüyor). Sayı 111'deki 'müzik üzerine başka bir kalemden' maddesi kontrol
