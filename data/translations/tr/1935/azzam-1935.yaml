id: azzam-1935
voice: Abd al-Wahhab Azzam
role: Mısırlı şarkiyatçı ve profesör (daha sonra Mısır'ın Suudi Arabistan elçisi)
quote: >-
  Bu konuda içlerinde en aşırıya kaçan, bütün Müslümanların tartışmasız kahramanlarının kahramanı saydığı Gazi
  Mustafa Kemal Paşa idi.
quote_kind: translated
summary: >-
  'Kemalistler'e karşı bir yazı dizisinde, Müslümanların Gazi'yi tartışmasız kahramanları saydığını, buna
  karşın Kemalistlerin İslam'dan kopuşuna onun önderlik ettiğini söyler.
caveat: >-
  Kaynak olarak al-Risala sayı 104, 1 Temmuz 1935, Wikisource sayfası 'مجلة الرسالة/العدد 104/النهضة التركية
  الأخيرة' gösterilmiştir. Dr. Abd al-Wahhab Azzam'ın al-Risala sayı 101 (10 Haziran 1935), 104 (1 Temmuz),
  108 (29 Temmuz) ve 111'de (19 Ağustos, müzik üzerine başka bir kalemden) yayımlanan 'The Latest Turkish
  Revival' başlıklı yazı dizisinin bir parçasıdır; alıntı 104. sayıdandır. 101. sayıda hilafetin
  kaldırılmasının 'ıslahatın gerektirdiği bir zorunluluk değil, devrimin yol açtığı bir aşırılık' olduğunu
  yazar; 108. sayıda Kemalistlerin kadın politikasını eleştirir ve Gazi'ye 'Atashark' diyen Mısırlı bir kadın
  delegeden söz eder. Çoğunlukla topluca 'Kemalistler'i suçlar; Gazi, Kur'an anekdotu dolayısıyla ve İslam'ı
  reddetmenin önderi olarak anılır. Wikisource transkripsiyonu; sayfa görüntüsü bağlantısı yoktur.
verification_note: >-
