voice: Ahmad Hasan al-Zayyat
role: al-Risala editörü, Kahire
quote: >-
  Fakat yenileşmede doğaya aykırı davranarak ve reformda mantıktan uzaklaşarak kendi tarihine haksızlık ettin.
quote_kind: translated
summary: >-
  Büyük Gazi Atatürk'e hitap eder: Hasta Adam'ı dirilttiği için onu över, ardından doğaya ve mantığa aykırı
  davranarak Türkiye'nin tarihine haksızlık ettiğini söyler.
caveat: >-
  Kaynak olarak al-Risala sayı 88, 11 Mart 1935, Wikisource sayfası 'مجلة الرسالة/العدد 88/إلى أين يساق
  الأتراك؟' gösterilmiştir. Ahmad Hasan al-Zayyat imzalı, ikinci tekil şahısla Atatürk'e hitap eden 'Where Are
  the Turks Being Driven?' başlıklı başyazı. Alıntının hemen öncesinde: 'Kırık kanadı onardın ve Hasta Adam'ı
  dirilttin ... adın onun modern tarihinin başlığıdır'. Hemen sonrasında: tarihin Atatürk'ün 'bir devleti
  diriltip bir milleti öldürdüğünü, bir anayasa kurup bir inancı yıktığını' yazacağından korkar. Veri
  kümesinde zaten yer alan al-Zayyat'ın 14 Kasım 1938 tarihli vefat başyazısından farklıdır. Wikisource
  transkripsiyonu; sayfa görüntüsü bağlantısı yoktur.
