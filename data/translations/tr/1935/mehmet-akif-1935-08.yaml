  medyundur.
quote_kind: original-turkish
summary: >-
  Aktarıldığına göre Antakya'da, Gazi'nin hayatını, şerefini ve mevkiini defalarca Rauf'a borçlu olduğunu,
  buna rağmen onu mahvetmeye çalıştığını söyledi.
caveat: >-
