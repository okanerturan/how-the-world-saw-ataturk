  his position to Rauf Bey time and again.' Düşmanca ve çıkar gözetir nitelikteki bir kaynak olan bir polis
  muhbirinin raporunda yer alan kulaktan dolma aktarım; rapor bunu 'Şair Akif ... Atatürk hakkında demişdir'
  şeklinde sunar. OCR düzeltilmiştir ('mevki- ini' → 'mevkiini'). Âkif yaklaşık üç hafta Antakya'da (o sırada
  Fransız mandası altındaki Sancak) bulunmuş ve 31 Ağustos 1935'te ayrılmıştır. Aynı raporlar onun hilafetin
  kaldırılmasını 'en büyük bir dinsizlik' olarak nitelendirdiğini ve Abdülmecid'i övdüğünü belirtir; bunlar
  şahsen Kemal'le değil rejimle ilgilidir. Aynı TBMM cildi, Kemal'in Âkif'in Burdur'dan seçilmesini ayarlayan
  1920 tarihli telgrafını da basar (Kemal tarafından bir temas). Âkif'in Mısır'dan yazdığı mektuplar açık
  kaynaklarda bulunamamıştır.
