voice: Leon Trotsky
role: Sürgündeki Bolşevik lider; 1929–33 yıllarında Ankara'nın izniyle Büyükada'da yaşadı
quote: >-
  Türkiye'de, Büyükada'da, Mustafa Kemal Paşa'nın polisinin gözetimi altında yaşadığım zamankinden daha fazla
  dış dünyadan koparılmıştım.
quote_kind: translated
summary: >-
  Fransa'daki alıkonuluşunun Mustafa Kemal Paşa'nın polisi altındaki Büyükada günlerinden daha sert olduğunu
  söyleyerek Türkiye'nin daha yumuşak tutumunu dolaylı olarak teslim eder.
caveat: >-
  Kemal hakkında değil, Fransız muamelesi hakkında açık bir mektup; görüş bildiren tek ifade bu
  karşılaştırmadır. Ayrıca okundu: 12 Şubat 1929'da Trotsky, Büyükdere'deki Türk polisine 'the President of
  the Turkish Republic, Kemal Pasha' hitaplı bir not vererek buraya 'not of my own choice' geldiğini ve sınırı
  yalnızca 'by submitting to force' geçtiğini belirtmiştir (My Life, 44. bölüm). Ayrı olarak kaydedilmedi:
  Sovyet sürgününü protesto etmektedir ve Kemal hakkında bir görüş bildirmez. Bu turda bizzat Kemalizm üzerine
  herhangi bir Trotsky metnine ulaşılamadı.
