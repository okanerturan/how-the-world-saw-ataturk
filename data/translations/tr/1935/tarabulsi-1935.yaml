role: Şamlı şair ve yazar ('Şam' imzasıyla)
quote: >-
  Eğer Arapları bir kenara atman çirkin idiyse ... kutsal dini bir kenara atman daha çirkindir
quote_kind: translated
summary: >-
  Ayasofya üzerinden Atatürk'ü adıyla azarlar: Arapları bir kenara atmak çirkindi, dini bir kenara atmak daha
  çirkindir ve Batı onu yutacaktır.
caveat: >-
  ÇEVİRİ (bu kayda ait): 'Eğer Arapları bir kenara atman çirkin idiyse, kutsal dini bir kenara atman daha
  çirkindir.' Hafiz Ibrahim'den bir epigrafla ('Ayasofya, ayrılık vakti geldi') açılan uzun bir kaside olan
  'Ayasufya' (Ayasofya) şiiri, al-Risala (Kahire) sayı 109, 5 Ağustos 1935'te yayımlanmıştır; metin sayının
  Arapça Wikisource transkripsiyonundan alınmıştır; orada sayfa numarası verilmemiştir. Atatürk'e iki kez
  adıyla hitap edilir ('Atatürk, buyruğun seni aldatmasın'; 'Atatürk, Batı'nın oğullarından gelecek bir
  sıçrayıştan sakın') ve şiirin ikinci yarısı onu hedef alır; dolayısıyla vesile kilise-cami olsa da muhatap
  odur. Şöyle kapanır: 'Batı'dan sakın ... onların barışı silahlı bir barıştır.' Yazar yalnızca 'Amjad
  al-Tarabulsi, Şam' imzasıyla tanımlanmaktadır; doğum-ölüm tarihleri tespit edilememiştir.
