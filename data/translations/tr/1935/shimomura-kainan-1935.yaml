id: shimomura-kainan-1935
voice: Shimomura Kainan
role: Asahi Shimbun yöneticisi, sonradan bakan ve NHK başkanı
quote: >-
  Söylemeye gerek yok, onlar gerçekten de büyüktür; fakat bu, yalnızca işleri gözü pekçe ve kesip atarak
  başardıkları sahne üzerindeki yiğitlik gösterilerini izleyip uzaktan alkış ve tezahürat tutmaktan ibaret
  kalmaktadır.
quote_kind: translated
summary: >-
  Kemal 'gerçekten büyüktür', ancak Japon hayranları yalnızca onun sahne performansını alkışlar ve harf
  devriminin ardındaki zorlu emeği bilmezler.
caveat: >-
  Honkegaeri (Shijō Shobō, 1935), 'Mussolini ya Kemal Pasha' başlıklı deneme, basılı s. 502-503 (NDL görüntü
  271, sayfa görüntüsünden okundu). 'Onlar' = Mussolini, Hitler, Kemal. Karşı sayfa Kemal'in Arap alfabesini
  değiştirmedeki kararlılığını över (alıntılanmadı). Ayrıca s. 447/NDL görüntü 243 Japonya için 'bir
  Mussolini, bir Hitler, bir Kemal Paşa' diler. Deneme tarihi gösterilmemiştir; kitap yılı kullanıldı. Özün
  çevirisi arşive aittir.
verification_note: >-
  Alıntı s. 502'de ('Mussolini ya Kemal Pasha' denemesi) birebir aynıdır; s. 503 yoğunluk 2'yi destekleyecek
  şekilde Kemal'in kararlılığını ve harf devrimini över. 'Onlar' = Mussolini, Hitler, Kemal; bu tespit
  (hayranların yalnızca sahne performansını görmesi) her üçü hakkında söylenir, ancak deneme daha sonra
  Kemal'i ayrı olarak ele alır. Tutulsun.
