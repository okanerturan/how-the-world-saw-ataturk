voice: Sidney Hook
role: Amerikalı filozof
quote: >-
  Bir yüzyıl sonra, Lenin, Troçki, Mussolini, Hitler, Atatürk, Metaksas ve diktatörlerin ortaya koyduğu
  kalıbın diğer cüce takipçileri, ya hükümdarlarını gömdüler ya da dünyadaki “en üstün” ailenin soyunu
  değersiz maiyet hizmetkârlarına dönüştürdüler.
