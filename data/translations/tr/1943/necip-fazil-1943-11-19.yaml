quote: Bir gün Atatürk dirilecektir!!!
quote_kind: original-turkish
summary: >-
  Dünyanın hesabı görülürken Atatürk'ün Etnografya Müzesi'ndeki kabrinden mareşal üniformasıyla kalkıp millete
  önderlik ettiğini hayal eder.
caveat: >-
  Deniz Gültekin'in 2025 İstanbul Üniversitesi doktora tezi 'Necip Fazıl Kısakürek'in Perspektifinden Atatürk
  ve Cumhuriyet Devrimlerinin Yansımaları'nda (s. 52, dipnot 122) basıldığı şekliyle Türkçe özgün metin. Savaş
  yılındaki bu yazı bütünüyle hayranlık doludur: 'O gün başımızda bulunacak şahıs ... Atatürk'ten başkası
  olmayacaktır'. Gültekin, bunun Necip Fazıl'ın Büyük Doğu'nun ikinci devresindeki (1948'den itibaren) Rıza
  Nur'un Hayat ve Hatıratım'ını tefrika ettiği daha sonraki muhalif dönemiyle oluşturduğu tezada dikkat çeker.
  Genellikle düşmanca sayılan bir sesin 1943'teki yüzü olarak kaydedilmiştir; 1967 kaydı ise diğer yüzüdür.
  122. dipnot s. 53'tedir.
