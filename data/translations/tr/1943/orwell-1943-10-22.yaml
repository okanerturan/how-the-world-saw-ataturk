id: orwell-1943-10-22
voice: George Orwell
role: İngiliz yazar ve Tribune köşe yazarı
quote: >-
  Faşizme karşı neredeyse her müttefikin kabul edilebilir göründüğü 1935-9 yıllarında solcular, kendilerini
  önce Mustafa Kemal'i överken, ardından da Romanyalı Carol'a karşı bir şefkat geliştirirken buldular.
quote_kind: translated
summary: >-
  Sol'un 1935–39 yıllarında Mustafa Kemal'i övmesini, Faşizme karşı 'son derece şüpheli müttefikleri' kabul
  etmeye hazır oluşunun bir örneği olarak gösterir.
caveat: >-
  'Who Are the War Criminals?', 'Cassius'un (Michael Foot) The Trial of Mussolini adlı eserinin incelemesi,
  Tribune, 22 Ekim 1943; Collected Essays, Journalism and Letters c. 2, madde 54 (archive.org açık metni).
  Yargı örtüktür: cümle, 'the Left has also been willing to shut its eyes to a great deal and to accept some
  very doubtful allies' ifadesinin ardından gelir. İpucunun 'Notes on Nationalism'e (1945) yaptığı atıf
  yanlıştır; o denemede Kemal'den söz edilmez.
