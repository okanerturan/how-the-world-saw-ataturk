role: Avustralya Başbakanı (2018–2022)
quote: >-
  Atatürk ülkesini modern bir ulusa, kucaklayıcı bir ulusa dönüştürmeye çalıştı ve bence bu yorumlar o ruhla
  ve Avustralyalılara verilen sözle çelişiyor
quote_kind: translated
summary: >-
  Christchurch açıklamalarının ardından Erdoğan'a karşı Atatürk'e atıfta bulunur: Atatürk modern, kucaklayıcı
  bir ulus yaratmaya çalışmış ve Avustralyalılara bir söz vermiştir.
caveat: >-
  Hayranlık barındırdığı kadar araçsaldır da: Atatürk, Christchurch saldırılarının ardından yaptığı
  açıklamalar nedeniyle Türkiye Cumhurbaşkanı Erdoğan'ı sertçe eleştirmek için bir ölçüt olarak kullanılır
  (basın toplantısında bu açıklamalar 'highly offensive' ve 'reckless' olarak nitelendirilir). Aynı gün 2GB'de
  (PM Transcripts 42207) Morrison, Erdoğan'ın yorumlarının 'very much at odds with what Ataturk said' olduğunu
  söylemiş, 28 Mart'ta da (42235) Erdoğan hakkında 'had failed on the promise made by Ataturk to the mothers
  of Anzacs' demiştir. Kutupluluk çelişkili: Atatürk'ü bir inceleme nesnesi olarak değil, Erdoğan'ın
  karşılayamadığı bir kıstas olarak ele alır. Anzak konuşmacılarının Atatürk'e atfettiği 'Johnnies and
  Mehmets' / 'your sons are now lying in our bosom' metninin kendisi tartışmalıdır: 1934 tarihli bir orijinal
  bulunamamıştır, metin ilk kez 1953'te İçişleri Bakanı Şükrü Kaya'nın hatırası aracılığıyla basılı olarak
  ortaya çıkmıştır ve 'Johnnies and Mehmets' ibaresi 1978 tarihli bir Avustralya eklemesidir (bkz. [[Johnnies
  and Mehmets]]). Dolayısıyla bu, övgüyü ödüllendiren bir anma töreni veya diplomatik vesileyle dile
  getirilmiş, konuşmacının Anzak efsanesindeki Atatürk'e dair görüşüdür. Kaynak gösterimi: Press conference,
  Canberra, 20 March 2019.
