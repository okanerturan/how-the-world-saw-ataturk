role: Bosnalı Müslüman aktivist, daha sonra Bosna-Hersek Başkanlık Konseyi'nin ilk Başkanı
quote: >-
  Böylece örneğin, açıkça bir kültür reformcusundan daha büyük bir askeri komutan olan ve Türkiye'ye
  hizmetlerinin gerçek ölçüsüne indirilmesi gereken Mustafa Kemal, reformlarından biriyle fes giyilmesini
  yasaklar.
quote_kind: translated
summary: >-
  Kemal'in bir kültür reformcusundan ziyade komutan olduğunu, hizmetlerinin aşağı çekilmesi gerektiğini ve
  reformlarının Türkiye'yi üçüncü sınıf bir Avrupa kopyası yaptığını söyler.
caveat: >-
