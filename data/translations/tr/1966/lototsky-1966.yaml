id: lototsky-1966
voice: Oleksandr Lototsky
role: Ukrayna Halk Cumhuriyeti'nin İstanbul elçisi (1919), bakan, anı yazarı
quote: >-
  Kurtuluş hareketinin başına geçerek Türk halkının ulusal duygusunu en yüksek dereceye çıkarmayı başardı. …
  Kemal'in eserinin bu niteliği, o güne kadarki siyasi ve kültürel koşullar altında uyuşuk düşmüş halkın ruh
  yapısını yeniledi ve o halkı büyük, özbilinçli bir eyleme sevk etti.
quote_kind: translated
summary: >-
  'Asi general' Mustafa Kemal'i askerî, siyasi, toplumsal ve kültürel alanlarda yetenekli, Türk ulusal
  duygusunu yükselten ve halkın ruh yapısını yenileyen biri olarak nitelendirir.
caveat: >-
  O. Lototsky, Сторінки минулого, 4. Kısım 'В Царгороді' (1966), 'Внутрішнє положення в Туреччині по
  замиренні' bölümünün Wikisource transkripsiyonu (tashih düzeyi 3), bağlantılı djvu dosyasının 24-27. tarama
  sayfaları; sayfada yazılış tarihi verilmemektedir. Parçada 'Ататюрк' adı kullanıldığından 1934'ten sonra
  yazılmıştır ve yazar 1939'da ölmüştür (ölüm tarihi hafızadandır, kademe M): metin muhtemelen 1934-39
  yıllarında yazılmış ve ölümünden sonra 1966'da yayımlanmıştır. 'По війні та мировій конференції' bölümündeki
  ikinci bir parça, Kemal'in Türkiye'nin 'mağluplar arasındaki tek galip' hâline geldiğine dair Ankara
  konuşmasını alıntılar. Tarama incelenmedi. Çeviri arşive aittir. Kontrol: 1966 yayın tarihidir (ABD Ortodoks
  Kilisesi baskısı); Lototsky 1939'da öldü ve metinde 'Ататюрк' geçiyor, dolayısıyla yakl. 1934–39'da
  yazılmıştır.
verification_note: >-
