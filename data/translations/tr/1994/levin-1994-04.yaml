role: ABD Michigan Senatörü (Demokrat)
quote: >-
  Nitekim modern Türkiye'nin kurucusu Kemal Atatürk, Osmanlı İmparatorluğu tarafından işlenen suçları kabul
  etmişti. Bu genel kurulda daha önce de ele aldığım gibi, 1926 tarihli bir mülakatta bizzat Atatürk,
  sorumluların "evlerinden acımasızca kitleler halinde sürülen ve katledilen milyonlarca Hristiyan tebaamızın
  hayatlarının hesabını vermeye mecbur edilmiş olmaları gerektiğini" ifade etmiştir.
