id: haydar-aliyev-1994
voice: Haydar Aliyev
role: Azerbaycan Cumhurbaşkanı
quote: >-
  böyük insan, bütün Türk dünyasının böyük şahsiyeti Mustafa Kemal Atatürk’ü bir daha yâd edirem; onun gördüğü
  işlere, onun koyduğu yola öz hörmetimi ve ihtiramımı bildirerem, onun hatırası karşısında baş eğirem.
quote_kind: original-turkish
summary: >-
  Türkiye Cumhuriyeti'nin temelini atan, bütün Türk dünyasının büyük şahsiyeti Mustafa Kemal Atatürk'ün
  hatırası önünde baş eğer.
caveat: >-
