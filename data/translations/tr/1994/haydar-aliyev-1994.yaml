  şekliyle Türkçe basılmıştır. Çeviri: "Büyük insanı, bütün Türk dünyasının büyük şahsiyeti Mustafa Kemal
  Atatürk'ü bir kez daha anıyorum; yaptığı işlere ve çizdiği yola saygı ve hürmetimi sunuyor, hatırası önünde
  baş eğiyorum." Köşeli parantez içinde Türkçe karşılıklarla birlikte Azerbaycan Türkçesi biçimleriyle
  basılmıştır; dolayısıyla konuşma Azerbaycan Türkçesiyle yapılmıştır. Başlık: 'Azerbaycan Cumhurbaşkanı
  Haydar Aliyev', 9 Şubat 1994 (PDF s. 96-97; bu bölüm 97'de). 6 Mayıs 1997 (PDF s. 106 vd.: 'Böyük Önder
  Mustafa Kemal Atatürk', Anıtkabir ziyareti) ve 13 Mart 2001 (PDF s. 149 vd.: 'beşer tarihinin meydana
  çıkardığı en büyük insanlardan biri'; Atatürk mirasını araştırma merkezi kurulacağını duyurur, s. 156-157)
  tarihlerinde de aynı övgülerle tekrar gelmiştir; kayıt olarak yalnızca 1994 konuşması saklanmıştır. Ayrıca
  Atatürk'ün Onuncu Yıl Nutku'ndan uzun alıntı yapar (PDF s. 101).
