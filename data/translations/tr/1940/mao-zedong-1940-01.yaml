id: mao-zedong-1940-01
voice: Mao Zedong
role: Çin Komünist Partisi Başkanı
quote: >-
  Kemalist Türkiye bile sonunda kendisini İngiliz-Fransız emperyalizminin kollarına atmak zorunda kaldı;
  giderek daha fazla bir yarı-sömürge ve gerici emperyalist dünyanın bir parçası haline geldi.
quote_kind: translated
summary: >-
  Türkiye'deki burjuva Kemalist diktatörlüğün özel koşullardan doğduğunu kabul eder, ancak Çin'in bunu
  tekrarlayamayacağını ve Kemalist Türkiye'nin sonunda bir yarı-sömürge haline geldiğini savunur.
caveat: >-
  Atatürk'ün ölümünden sonra, Ocak 1940'ta yazılmıştır (bu nedenle dönemi ölüm sonrasıdır). Şahsen Atatürk'ü
  değil, Kemalizmi ve 'Çin'in Kemal'ini' değerlendirir. Aynı pasaj, 'petty Kemalist dictatorship of the
  bourgeoisie' rejiminin 'owing to certain specific conditions (the bourgeoisie's success in repelling Greek
  aggression and the weakness of the proletariat)' ortaya çıktığını söyler. Arşivin kişi notu Mao'ya 1936'da
  Edgar Snow'a söylenmiş bir söz atfeder ('We are not going to be another Kemal Turkey'); bu cümle bu turda
  okunan hiçbir kaynakta bulunamadı ve doğrulanmamış olarak kalmaktadır.
