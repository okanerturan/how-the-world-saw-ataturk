voice: Mahmut Esat Bozkurt
role: Eski Adalet Bakanı (1924-30), Türk İnkılâp Enstitüsü profesörü
quote: >-
  Bu Türk oğlu, bu sade vatandaş, yarınki hür ve müstakil Türk milletinin, Türk ulusunun kurtarıcısı olacaktı.
  Ve oldu.
quote_kind: original-turkish
summary: >-
  Atatürk'ü, Erzurum'a sade bir vatandaş olarak girmek üzere komutanlıktan istifa eden ve milletin kurtarıcısı
  olan büyük bir feragat insanı olarak sunar.
caveat: >-
  ÇEVİRİ (bu kaydın): 'This son of the Turks, this plain citizen, was to become the saviour of the free and
  independent Turkish nation of tomorrow. And so he did.' Atatürk İhtilali, I (İstanbul Üniversitesi
  Yayınları, İnkılâp Enstitüsü dersleri; İstanbul: Burhaneddin Matbaası, 1940), s. 129 (archive.org OCR). Aynı
  sayfa 'Atatürk büyük ferağet sahibi idi' diye başlar ve birinci elden şunu ekler: 'Atatürkten bir çok
  defalar işittim'; sade bir vatandaş olduğunda kendisini en güçlü insan hissettiğine dair Kemal'in sözlerini
  aktarır. Arşiv notundaki 'realities of life, not revelations from the sky' (Medeni Kanun) Kemal hakkında
  değildir ve kontrol edilmemiştir.
