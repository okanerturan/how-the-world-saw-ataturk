voice: Charles Harington
role: >-
  Britanyalı general, 1920-23'te İstanbul'daki İtilaf kuvvetleri komutanı; anı kitabı Tim Harington Looks Back
quote: >-
  Bu durum, onları Sakarya Nehri'nde kesin bir biçimde durduran gerçek bir asker olan Mustafa Kemal'in
  yüreğini sevindirmiş olmalıdır.
quote_kind: translated
summary: >-
  Kemal'i, Yunanları Sakarya'da durduran ve Afyon'da 'fırsatını gören' 'gerçek bir asker' olarak nitelendirir;
  İtilaf silah depolarının onun ordusunu beslediğini söyler.
caveat: >-
  Tim Harington Looks Back (John Murray, 1940), s. 108 (sayfa alt bilgileri; Afyon satırı s. 110'dadır); açık
  DLI taraması in.ernet.dli.2015.176573. s. 110: 'With the Greeks weakened by their detachment in Eastern
  Thrace, Mustapha Kemal saw his chance and seized it. He struck a bit of the line near Afium Karahissar'.
  Kitabın başka bir yerinde Çanakkale komutanı, İtilaf Devletleri'nin 1918'den sonra depoladığı silahların
  Türklere bırakıldığını ve bunların 'formed the nucleus of the army which Mustapha Kemal built up' işlevi
  gördüğünü, ayrıca Kemal'in 'sent some very difficult men to Constantinople' hamlesini yaptığını söyler.
  Mudanya Anlaşması'ndan sonra Kemal ve İsmet'in mektuplarını yayımlar (yak. s. 150). Hayranlıktan ziyade
  ikircikli: Çanakkale komutanının yakınmasıyla karışık mesleki saygı. Çanakkale konusunda tarafsız üslup.
  'difficult men … lessening the authority of the Allied Forces' cümlesi s. 224'tedir.
verification_note: >-
