role: ABD Temsilciler Meclisi New York (Harlem) üyesi
quote: >-
  Bu ülkenin devasa görevlerinin üstesinden gelirken gösterdiği cesarete hayran kalmamak elde değildir.
  Türkiye, Mustafa Kemal Atatürk yönetiminde modern bir ulus olmak üzere yola çıktı ve şaşırtıcı bir canlılığa
  sahip sağlıklı bir cumhuriyet haline geldi.
