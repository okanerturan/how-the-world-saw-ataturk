id: buyuk-mecmua-1919-03-20
voice: Büyük Mecmua
role: >-
  M. Zekeriya'nın sahibi ve yayın yönetmeni olduğu İstanbul edebiyat ve bilim dergisi; imzasız portre yazısı
quote: >-
  Mustafa Kemal genç, azimkâr, metin bir kumandandır. Çanakkale'de ordu nevmid bir vaziyete düştüğü zaman
  ümidini bozmamış ve imanından aldığı kuvvetle ordunun da maneviyetini yükseltmişti. Büyüklerini tanımak
  mecburiyetinde olan gençlik, (Mustafa Kemal) namını da hafızalarına ilâve etmeli ve halâskârlarımızdan
  birinin de O olduğunu unutmamalıdır.
quote_kind: original-turkish
summary: >-
  'Büyüklerimiz' dizisinde: Çanakkale millete büyük bir kahraman kazandırdı; genç, azimli, metin bir komutan,
  'kurtarıcılarımız'dan biri.
caveat: >-
  'Büyüklerimiz: Mustafa Kemal Paşa', Büyük Mecmua sayı 3 (20 Mart 1919), s. 44, imzasız, üniformalı bir
  fotoğrafla birlikte: Samsun'a hareketinden iki ay önce işgal altındaki İstanbul'da basılmıştır. Zeki
  Arıkan'ın modern çeviriyazıyla yaptığı tam yeniden basımından bilinmektedir; derginin kendisi görülmemiştir.
  Yazar 'Gazeteci olmak itibariyle biliyorum ki' der; yazıyı derginin yayın yönetmeni M. Zekeriya'ya (Sertel)
  atfetmek bir tahminden ibaret olur. Sansür kesintileri alıntılanan pasajın hemen öncesinde '(sansür)' olarak
  işaretlenmiştir. Yazı, Çanakkale'nin 'bize birçok muvaffakiyetlerden maada, bir de (Mustafa Kemal)
  kazandırmıştı' sözleriyle açılır ve onu Cevat Paşa ile birlikte anar. Mart 1919'u Çanakkale'nin 'üçüncü'
  yıldönümü olarak adlandırır; oysa dördüncü yıldönümüydü.
