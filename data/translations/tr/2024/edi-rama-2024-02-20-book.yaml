  ile değerli vizyonunu kanıtlayan ekonomik reformları desteklemeye yöneltti. Burada, Atatürk'ün ebedi
  istirahatgahının kutsal mekanında, onun sevgi ve barış gibi beklenmedik yollarla başarılan modern Türkiye
