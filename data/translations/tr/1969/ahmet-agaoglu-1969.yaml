id: ahmet-agaoglu-1969
voice: Ahmet Ağaoğlu
role: Liberal milletvekili ve siyasi yazar, Serbest Cumhuriyet Fırkası'nın kurucularından (1930)
quote: >-
  Gazi'ye karşı takınılmasını daima bir namus ve şeref borcu, bir Vatan ve Türklüğün icabı olarak kabul etmiş
  olduğum doğruluktan ve açıklıktan bu kerre de ayrılmadım. "Bu biraz fazla sunidir!.." dedim
quote_kind: original-turkish
summary: >-
  1930'da Yalova'daki sofrasında Gazi'ye önceden kurgulanmış bir muhalefet partisinin fazla suni olduğunu
  söylediğini hatırlatır; Kemal önce sinirlenmiş, sonra gülmüştür.
caveat: >-
  ÇEVİRİ (bu kaydın): 'I did not depart this time either from the honesty and frankness that I had always
  held, towards the Gazi, to be a debt of honour and a duty to the Fatherland and Turkishness. I said: "This
  is a bit too artificial!"' Olay: Yalova, Ağustos 1930, Fethi'nin ve Kemal'in mektuplarının okunmasının
  ardından. TARİH: Soyak hatıratı 'kısmen neşredilen' olarak nitelendirir; ilk basım yılı olan 1969 kademe
  M'dir (doğrulanmamıştır); Ağaoğlu 1939'da öldüğünden 1930-39 yılları arasında yazılmıştır. Fethi
  aracılığıyla Kemal'in 'biraz hürriyet havası' istediğini ancak Cumhuriyet Halk Fırkası'nın bir kanadı olacak
  bir parti arzuladığını aktarır. Soyak Kemal'e sadık bir isimdir ve kendi notlarını ekler. archive.org OCR
  metninden okunmuştur; tırnak işaretleri standartlaştırılmış ve satır sonu bölünmesi 'suni- dir'
  birleştirilmiştir. Kontrol: 1969 tarihli bir Baha Matbaası baskısına atıf yapılmaktadır, ancak tarihsiz bir
  Nebioğlu baskısı da mevcuttur; 1969 ilk basım olmayabilir.
mediated_by: >-
  Soyak, Atatürk'ten Hatıralar (1973), c. 2, s. 416-417 ← Ağaoğlu, Serbest Fırka Hatıraları, s. 4, 10
