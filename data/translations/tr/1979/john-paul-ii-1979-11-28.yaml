  görmüştür, dolayısıyla Fransızca bir geri çeviridir: alıntıyı defter kaydının bir çevirisi olarak ele alın.
  Türk basını (Milliyet 30 Kasım 1979 s. 10) ayrıca Cumhurbaşkanı Korutürk'e söylediği, Anıtkabir'de
  'Türkiye'nin kurtarıcısı ve demokratik cumhuriyetinin kurucusu önünde' eğilen ilk papa olduğu ve 'Atatürk'e
  ve Türk Devleti'ne hayranlığın' azınlıklara yönelik muamelesine dayandığı yönündeki sözlerini aktarır
  (Türkçe metin; aynı cümleler Belenli & Birbudak 2021'de basılıdır). Defter kaydı Atatürk'ün adını anmaz.
  Kontrol: defter kaydının kendisi Atatürk'ün adını anmamaktadır; alıntı Korutürk'e yaptığı sözlü açıklamadır
  (basın haberinin Türkçesi: 'Atatürk'e ve Türk Devleti'ne hayranlığımın temelinde bu gerçekler yatmaktadır').
