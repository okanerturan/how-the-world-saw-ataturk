  edilmesine dayandığını söyler.
caveat: >-
  Alıntı, Vatikan'ın İspanyolca metninden (vatican.va libro-oro-ataturk, 28 Kasım 1979) yeniden kurgulanan
  Fransızca orijinaldir; arşiv yalnızca İspanyolcayı ('El gobierno de los pueblos está en las manos del Señor.
