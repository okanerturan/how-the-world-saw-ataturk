voice: Carlo Azeglio Ciampi
role: İtalya Cumhurbaşkanı
quote: >-
  Kemal Atatürk'ün yenilenme tercihi, Batı ile yalnızca tarihi değil, aynı zamanda Batı'nın kendisini
  özdeşleştirdiği demokrasi ve özgürlük değerlerinin tamamını da paylaşabilen bir Türk devletinin temellerini
  atmıştır.
quote_kind: translated
summary: >-
  Ankara'da Cumhurbaşkanı Sezer onuruna kadeh kaldırırken: Kemal Atatürk'ün 'yenilenme tercihi', Batı'nın
  demokrasi ve özgürlüğünü paylaşan bir Türk devletinin zeminini hazırlamıştır.
caveat: >-
  Devlet ziyareti sırasında Cumhurbaşkanı Ahmet Necdet Sezer tarafından verilen devlet yemeğindeki kadeh
  kaldırma konuşması, Cumhurbaşkanlığı Köşkü, Ankara, 22 Kasım 2005. Cümle, Roma, Bizans ve Osmanlılar üzerine
  bir pasajı izler ve Atlantik ittifakı ile Avrupa dayanışmasına bağlanır. Ertesi gün, Meclis Başkanı Bülent
  Arınç'ın Dolmabahçe Sarayı'nda verdiği yemekte, sarayı 'significativo - come ultima residenza di Kemal
  Atatürk - della svolta storica compiuta dalla Turchia, ottant'anni orsono, sulla via della modernità e del
  rinnovamento democratico' olarak nitelendirmiştir. Ziyaret programında 22 Kasım sabahı mozoleye çelenk
  koyması ve Şeref Defteri'ni imzalaması da yer alır; bu yazının metni portalda bulunmamaktadır.
verification_note: >-
