  ikisi de Rusça bir kaydın Türkçe çevirisidir; Rusça özgün metne ulaşılamadı. Tam metin şöyle devam ediyor:
  'Ülkelerimiz arasındaki dostluğun gelişiminin başlangıcında da O'nun adı vardır. Bizim görevimiz O'nun
  hatırasına layık olmak ve O'nun yaptıklarını devam ettirmektir.' Diplomatik vesile; Putin'in 2005 Samsun
  konuşması sayılmadı (görüş belirtilmiyor).
