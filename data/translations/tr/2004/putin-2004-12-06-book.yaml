voice: Vladimir Putin
role: Rusya Devlet Başkanı; Anıtkabir özel defterindeki yazısı
quote: >-
  Rusya'da Türk halkının büyük oğlu Atatürk'ün hatırasına büyük değer veriliyor. Türk devletinin yeniden
  doğuşu, O'nun adıyla ilişkilendirilir.
quote_kind: original-turkish
summary: >-
  Bir devlet olarak Türkiye'nin yeniden doğuşunun Atatürk'ün adıyla bağlantılı olduğunu ve her iki ulusun
  görevinin onun eserini sürdürmek olduğunu söylüyor.
caveat: >-
  Mevcut putin-2004-12-06 kaydının (yalnızca Kremlin açımlaması) YÜKSELTMESİ: defter kaydının Türkçe metni.
