voice: Romano Prodi
role: Avrupa Komisyonu Başkanı
quote: Onun vizyonu, Türkiye'nin Avrupa uluslar ailesinin tam bir parçası olmasıydı.
quote_kind: translated
summary: >-
  Atatürk'ün çağdaş uygarlık standartlarına ulaşmayı en açık hedef olarak belirlediğini ve vizyonunun Avrupa
  uluslar ailesinde tam bir yer edinmek olduğunu söyler.
