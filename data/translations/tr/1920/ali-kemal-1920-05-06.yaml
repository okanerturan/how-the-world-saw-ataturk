  Kemal'in gözünde Mustafa Kemal ... Havza'dan başlayarak yayınladığı beyannameleriyle, "sahte bir taraftar
  ... aldatan" biriydi' diye yazıyor: alıntılanan sözcükler kendi cümlesinin içine yedirilmiş (fiil yok,
  'biriydi'), dolayısıyla başyazının tam metninden ziyade kırpılmış veya sadeleştirilmiş bir alıntı olabilir.
  Peyam-ı Sabah'taki özgün metne ulaşılamadı ve ifadeyi alıntılayan ikinci bir kaynak bulunamadı (arandı).
  Sayfayı 415 olarak düzeltin ve ifadenin gazetede görülmediğini, Çakmak'ın alıntısı olduğunu belirtin. Diğer
  unsurlar (23 Nisan 'küçük herifler', 7 Mayıs 'kanlı katil') aynı paragrafta, 13 ve 17. dipnotlardadır.
