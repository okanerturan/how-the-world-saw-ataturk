id: ali-kemal-1920-05-06
voice: Ali Kemal
role: Gazeteci, Peyam-ı Sabah editörü, eski Dahiliye Nazırı
quote: >-
  sahte bir taraftar, bir riya kisvesine bürünerek, haça karşı hilal cihadını açmış, ehli imanın safdillerini
  aldatan
quote_kind: original-turkish
summary: >-
  Kemal'i ikiyüzlülük kisvesine bürünen, haça karşı hilal cihadı ilan etmiş olan ve saf müminleri aldatan
  sahte bir taraftar olarak nitelendirir.
caveat: >-
  Fevzi Çakmak'ın (mareşal değil, tarihçi) 'Peyam-ı Sabah, 6 Mayıs 1920' künyeli 15. dipnota atıfla aktardığı
  Türkçe özgün metin: 'Milli Mücadele Dönemi Türk Mizahında Muhalif Bir Kimlik: Ali Kemal', Tarih İncelemeleri
  Dergisi 34/2 (2019), 413-441, DOI 10.18513/egetid.661569. Arşiv çevirisi: 'a false partisan, who, wrapped in
  the cloak of hypocrisy, has opened a crescent jihad against the cross, deceiving the simple-hearted of the
  faithful'. Çakmak bu ifadeyi Havza'daki Kemal hakkında kurduğu kendi cümlesinin içine yerleştirir;
  dolayısıyla bu, başyazının tam metni değil, ondan yapılmış bir alıntıdır. Aynı makale, Ali Kemal'in Ankara
  mebuslarına 'küçük herifler' dediğini (23 Nisan 1920) ve Kemal'i İttihat ve Terakki çevresinin 'kanlı ve
  zalim' mensupları arasında saydığını (7 Mayıs 1920) belirtir. Ali Kemal 6 Kasım 1922'de linç edilmiştir.
  Kontrol: s. 415; ifade Peyam-ı Sabah dipnotuyla Çakmak'ın kendi cümlesinin içinde yer aldığından kırpılmış
  veya sadeleştirilmiş olabilir; özgün metin görülmedi.
mediated_by: Çakmak 2019, s. 416 ← Peyam-ı Sabah, 6 Mayıs 1920
verification_note: >-
