id: senussi-1920-11-25
voice: Ahmed Sharif as-Senussi
role: Senusi tarikatı lideri, Türkiye Büyük Millet Meclisi'nin konuğu
summary: >-
  Meclis'in konuğu olarak Ankara'ya geldi; verilen ziyafette Kemal, 16 Mart 1920'den sonra milliyetçileri
  teşvik ettiği ve o zamandan beri hizmet verdiği için kendisine teşekkür etti.
caveat: >-
  Desteği, Kemal'in ziyafet konuşmasıyla (25 Kasım 1920) ve Haziran 1921 tarihli, mücadelenin başarısı için
  dua ettiği ve Kemal'in yanıtında özetlenen kendi Ramazan Bayramı tebrik telgrafıyla belgelenmektedir; kendi
  sözleri basılı değildir. Kemal, Senusilerin Libya'daki çalışmalarını bizzat gördüğünü hatırlatmıştır; onun
  hediye ettiği bir kılıç Kemal'in çalışma odasında asılıydı (Vakit, 10 Ocak 1922, ABE c. 12).
mediated_by: >-
