verification_note: >-
  Belirtildiği gibi. Editörlerin notunda 15 Kasım 1920'de Meclis'in konuğu olarak geldiği ve 'Kurtuluş
  Savaşı'nı yakından izleyen, çeşitli vesilelerle Türkleri destekleyen' biri olduğu belirtiliyor. Konuşmada
  Kemal, 16 Mart'ta Şeyh'in tutulan yolu hayırla karşılayıp onları teşvik ettiğini ve o zamandan beri onlarla
  birlikte çalıştığını söylüyor. 1921 telgrafı ülkenin kurtuluşu için dualar içeren bir Ramazan Bayramı
  tebriğidir; çekince notundaki 'Ramadan telegram' ifadesi gevşektir. Önemli bir dini lider, içeriği dolgun
