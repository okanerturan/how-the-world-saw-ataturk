voice: Nariman Narimanov
role: Sovyet Azerbaycanı Devrim Komitesi Başkanı
quote: Müslüman komünistleri sizin maksadınıza çatmak yolunda var kuvvetlerini sarf edeceklerdir.
quote_kind: original-turkish
summary: >-
  Kemal'e, Türkiye Büyük Millet Meclisi'nde okunan ve İngiliz liderliğindeki Avrupa emperyalizmine karşı onun
  amaçları uğruna Müslüman komünistlerin tüm gücünü ortaya koyacağı sözünü veren bir mektup gönderdi.
caveat: >-
