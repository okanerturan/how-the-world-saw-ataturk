  Türkçesi ifadeler; OCR'daki 'makstdunuza çatmak!' ifadesi 'maksadınıza çatmak' olarak normalleştirilmiştir.
  Halil Paşa tarafından taşınmıştır; Kemal mektubu okumuş ve Meclis yanıt verilmesini oylamıştır. Sovyet
  çizgisine hizmet eden ittifak dili.
