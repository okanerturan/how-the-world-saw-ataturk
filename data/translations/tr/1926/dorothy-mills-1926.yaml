id: dorothy-mills-1926
voice: Lady Dorothy Mills
role: >-
  Britanyalı romancı ve gezi yazarı; 1925'te Ankara'yı ziyaret etti (Beyond the Bosphorus, 1926)
quote: >-
  Şimdi o, takipçileri için, yani yeni Türkiye'nin çoğu için bir Tanrı'dır ve makamı ismen yalnızca
  Cumhurbaşkanlığı olsa da gücü bir Diktatörün gücüdür.
quote_kind: translated
summary: >-
  Onu yeni Türkiye'nin ilhamı ve canı, diktatör gücüne sahip 'takipçileri için bir Tanrı' olarak nitelendirir;
  parlak bir zekâ olduğunu söyler ama ticari anlayışından kuşku duyar.
caveat: >-
  Lady Dorothy Mills, Beyond the Bosphorus (London: Duckworth, 1926), 'Angora' bölümü, s. 35 (alıntı); s. 34:
  'To my great regret I did not have the pleasure of meeting the Ghazi ... The very inspiration and life of
  new Turkey, he must from all accounts be a man of amazingly powerful personality.' s. 35 şöyle devam eder:
  'Undoubtedly a very brilliant man; but ... he is a trifle over-inclined ... "to hitch his waggon to a
  star"'. Kendisiyle tanışmamıştır; dolayısıyla bu, anlatılanlara ve Anadolu'da gördüklerine dayanan bir
  görüştür; biyografik taslağında hatalar vardır (ör. 'Harbin'). s. 36, Türk'ü Ermenileri ve Rumları 'into the
  sea' 'casting' ile suçlar; bu, arşivin benimsemediği bir yargıdır.
verification_note: >-
  Alıntı s. 35'te birebir mevcut (üst başlık 'ANGORA 35'). s. 34'teki 'To my great regret I did not have the
  pleasure of meeting the Ghazi... The very inspiration and life of new Turkey' ifadesi s. 34'te; 'hitch his
  waggon to a star' ve ticaret değil vatanseverlik pasajı s. 35'te yer alıyor. Kendisiyle tanışmamıştır
  (kayıtta belirtiliyor). what_they_saw alanındaki 'doubts his commercial sense' ifadesi, 'seems inclined to
