id: eleanor-roosevelt-1959-03-24
voice: Eleanor Roosevelt
role: >-
  Eski Amerika Birleşik Devletleri First Lady'si; ortak yayımlanan 'My Day' gazete köşesinin yazarı
quote: >-
  Atatürk'ün anıtına arabayla gittik ama gün batımında kapandığı için içeri giremedik. Bütün gece çok parlak
  bir şekilde aydınlatıyorlar; böylece dört bir yanındaki sütun dizileriyle yamacın üzerinde belirginleşiyor
  ve Washington, D.C.'deki Lincoln Anıtı'na oldukça benziyor.
quote_kind: translated
summary: >-
  Ankara'daki bir gece aktarmasında Atatürk'ün ışıklandırılmış mozolesine arabayla gitmiş ve sütun dizileriyle
  burayı biraz Lincoln Anıtı'na benzetmiştir.
caveat: >-
  Tel Aviv mahreçli ve 24 Mart 1959'da yayımlanan, 13 Mart Cuma akşamını konu alan 'My Day' adlı köşe
  yazısından: torunu Nina ile Roma'dan Tahran'a uçarken Ankara'da birkaç saatlik bir aktarma. ABD
  Büyükelçiliği, onları elçilik arabasıyla karşılaması için personelinden Bay Butler'ı göndermiş; içeri
  girmemişler. Kendisi buradan 'Ataturk's monument' diye söz eder; bunun mozole olduğu bizim tespitimizdir.
  Butler'ın bir nöbetçiden duyduğunu söylediği şeyi, anıtın 'so as not to disturb Ataturk's slumbers' gün
  doğumunda açılıp gün batımında kapandığını ekler. Bu, kendisi hakkında hiçbir yargı içermeyen bir
  ziyaretçinin mozole tasviridir; Lincoln'ün anıtıyla yapılan karşılaştırma kendisine aittir. Dijital edisyon
  bu köşe yazısını düzeltilmiş olarak işaretler, ancak bu pasajın yakınındaki tek düzeltme Tahran'ın
  yazılışıdır.
