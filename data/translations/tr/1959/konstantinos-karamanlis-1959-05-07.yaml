voice: Konstantinos Karamanlis
role: >-
  Yunanistan Başbakanı; Kıbrıs'a ilişkin Zürih–Londra antlaşmalarından üç ay sonra Esenboğa Havalimanı'na
  (Ankara) varışında yaptığı açıklama
quote: >-
  Büyük Atatürk ve Elefterios Venizelos, Türk-Yunan dostluğunun temellerini attıkları zaman bu dostluk her iki
  memleket için faydalı olmuştur. Bugün ise Türk-Yunan müşterek çalışmaları bir tarihi zaruret halini
  almıştır.
quote_kind: original-turkish
summary: >-
  Venizelos ile birlikte her iki ülkeye de yarar sağlayan bir Türk-Yunan dostluğunun temellerini atan 'Büyük
  Atatürk'; yenilenen işbirliğini tarihi bir zorunluluk olarak sunmak için anıldı.
caveat: >-
  Basına varış açıklaması, 7 Mayıs 1959; aynı gün öğleden sonra Anıtkabir'i ziyaret etti (yalnızca anlatım).
