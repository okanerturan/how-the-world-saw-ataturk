  yer almaktadır; bu ise yaşlı Konstantinos'tur (1907–1998). Yunanca özgün metin görülmedi. Okuyucu ajan
  tarafından sayfa görüntüsünden (Okan'ın Milliyet arşivi girişi) okundu ve ana ajan tarafından kırpılmış
  görüntü üzerinden yeniden kontrol edildi.
