  hold him guilty for his mistakes.' Ciltteki ikinci eser olan ve Tercüman önsözünde ilk kez 1937'de
  yayımlandığı belirtilen Türkiye'nin Manevi Kuvvetleri'nden ('The Moral Forces of Turkey'); sayfa 212 olarak
  basılmıştır ve Farrère'in Türk kadınlarının şikâyet edecek bir şeyleri olmadığını eklediği 'but that does
  not mean there is nothing for them to complain of' pasajında yer alır. Aynı kitap, s. 209-210: 'Gazi Mustafa
  Kemal - let us call him Atatürk from now on - and the republican Turks began to despise their forefathers'
  heritage' ('Buna hakları yok') durumundan üzüntüyle yakınır ve Yavuz Sultan Selim zırhlısının adının sade
  Yavuz olarak değiştirilmesiyle alay eder. Fransızca metni okunmamış bir kitabın çevirisi olduğu için kanıt
  düzeyi P yerine S'dir; 1937 tarihlendirmesi editörün notuna dayanmaktadır. Henüz bulunamayan: Fransızca
  başlık ve baskı (Farrère'in 1937 cildi).
