role: Fransız romancı ve eski deniz subayı
quote: Bu bakımdan Gazi Mustafa Kemal'i tasvip ediyor ve hatalarından ötürü onu suçlu bulmuyorum.
quote_kind: original-turkish
summary: >-
  Gazi Mustafa Kemal'in modernleştirme çabalarını onaylar ve hatalarını bir şeyler yapmanın bedeli olarak
  bağışlar; cumhuriyetçileri ise Osmanlı atalarını hor gördükleri için eleştirir.
caveat: >-
