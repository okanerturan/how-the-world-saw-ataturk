role: Alman Roman filoloğu, İstanbul Üniversitesi profesörü (Mimesis'in yazarı)
quote: >-
  “Grand chef” sempatik bir otokrat; zeki, büyük ve hayal gücü geniş; Avrupalı muadillerinden tamamen farklı,
  çünkü bu ülkeyi gerçekten bizzat kendisi bir devlet haline getirdi ve kesinlikle belagatsiz.
quote_kind: translated
summary: >-
  Atatürk'ü ülkeyi gerçekten bir devlet haline getiren sevimli, zeki bir otokrat olarak nitelendirdi; ancak
  ortaya çıkan sonucun ulusal karakteri tahrip eden fanatik, gelenek karşıtı bir milliyetçilik olduğunu
  söyledi.
caveat: >-
  Walter Benjamin'e özel mektup, İstanbul-Bebek, 3 Ocak 1937. Almanca özgün metin: 'Der grand chef ist ein
  sympathischer Autokrat, klug, großzügig und witzig, vollkommen verschieden von seinen europäischen Kollegen
