id: nzhdeh-1937
voice: Garegin Nzhdeh
role: Ermeni askeri komutan (Zengezur 1921), siyasi düşünür, Bulgaristan'da sürgün
quote: Türkiye'yi Bolşevizm kurtardı, şanslı Kemal değil.
quote_kind: translated
summary: >-
  Türkiye'yi Kemal'in değil Bolşeviklerin kurtardığını savunur; Türk-Sovyet ittifakının 'bozkurt'un galip
  gelmesini sağladığını söyler ve ona 'şanslı' der.
caveat: >-
  'Իմ պատասխանը' ('Yanıtım'), alt başlığı 'Türk-Bolşevik belgeleri ışığında Ermenistan'ın trajedisi';
  Wikisource üstbilgisi ve dipnotu eserin 1937'de Sofya'da basıldığını belirtir. Hassas konu (Ermeni soykırımı
  hafızası, Zengezur/Sovyet politikası): Nzhdeh'in kendi polemiği. Deneme ayrıca Zinoviev'den ('Sovyet
  hükümeti Kemal'e yardım ediyor') ve Lenin-Kemal ittifakının Sovyet tanıklarından alıntı yapar. Çeviri arşive
  aittir. Tarama incelenmedi.
verification_note: >-
  Ermenice metin birebir aynı: 'Բոլշեւի՚զմը փրկեց Թուրքիան եւ ո՛չ թէ բախտահաս Քեմալը.' Samsun'a çıkış ve
  Türk-Sovyet ittifakı hakkındaki 'գորշ գայլ' (bozkurt) pasajı mevcut. Çeviri sadık. Yıl yalnızca Wikisource
  üstbilgisinden.
