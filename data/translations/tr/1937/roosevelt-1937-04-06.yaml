id: roosevelt-1937-04-06
voice: Franklin D. Roosevelt
role: Amerika Birleşik Devletleri Başkanı
quote: >-
  Nispeten kısa bir zamanda meydan getirdiğiniz pek çok hayret verici hususları görünce, hissettiğim şevk ve
  heyecanı size arz etmek istedim.
quote_kind: original-turkish
summary: >-
  Beyaz Saray'da Julian Bryan'ın Türkiye filmini izledikten sonra, bu kadar kısa sürede gerçekleştirilen
  şaşırtıcı değişimler karşısında duyduğu heyecanı Atatürk'e yazdı; tanışmayı umduğunu belirtti.
caveat: >-
  İngilizce bir mektubun Türkçe çevirisi; 'meydan' basıldığı gibidir ('meydana' olarak okunmalıdır). Çeviri:
  'Seeing the many astonishing things you have brought about in a relatively short time, I wanted to tell you
  of the enthusiasm I felt.' Ayrıca Atatürk'ün küçük kızıyla oynarken çekilmiş filminden ve Atatürk'ün
  gönderdiği pullardan da keyif almıştır. Atatürk 25 Mayıs 1937'de yanıt vermiştir. Kontrol: Şimşir'deki
  yanıtın İngilizce metni 6 Haziran 1937 tarihlidir.
mediated_by: >-
