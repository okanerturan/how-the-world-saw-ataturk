id: obama-2009
voice: Barack Obama
role: Amerika Birleşik Devletleri Başkanı
quote: >-
  Tarihin akışını şekillendirmek için böylesine çok şey yapmış bir adama adanmış bu güzel anıttan derinden
  etkilendim. Ancak şu da açıktır ki Atatürk'ün yaşamının en büyük anıtı, taş ve mermere dökülebilecek bir şey
  değildir. Onun en büyük mirası Türkiye'nin güçlü, canlı, laik demokrasisidir ve bugün bu meclisin sürdürdüğü
  çalışma da budur.
quote_kind: translated
summary: >-
  Mozoleyi ziyaret ettikten sonra, Atatürk'ü tarihin şeklini değiştiren ve en büyük mirası Türkiye'nin yaşayan
  laik demokrasisi olan bir lider olarak nitelendirir.
caveat: >-
  Özgün dildeki metin
  (https://obamawhitehouse.archives.gov/the-press-office/remarks-president-obama-turkish-parliament); TBMM
  tutanakları (Tarihe Düşülen Notlar-2, 2012) Türkçe bir metin yayımlamaktadır: "kendisi tarihin şeklini
  değiştiren bir liderdir. Ama Atatürk’ün yaşamına ait en büyük anıt hiçbir şekilde taştan ya da mermerden
  inşa edilemez, kendisinin bırakmış olduğu en büyük miras Türkiye’nin canlı laik demokrasisidir". TBMM kitabı
  PDF s. 254 (basılı s. 243).
verification_note: >-
