voice: Giorgio Napolitano
role: İtalya Cumhurbaşkanı
quote: >-
  Daha yakın zamanlarda, Osmanlı İmparatorluğu'nun yıkılışından sonra Kemal Atatürk ve genç Türkiye
  Cumhuriyeti tarafından izlenen yenilenme tercihinin izinde, Türkiye ile Avrupa değerler sistemi arasındaki
  ilişki giderek gelişmiştir.
quote_kind: translated
summary: >-
  Cumhurbaşkanı Gül onuruna kadeh kaldırırken: Türkiye'nin Avrupa değerleriyle bağı, Kemal Atatürk ve genç
  Cumhuriyet'in 'yenilenme tercihinin izinde' gelişmiştir.
caveat: >-
  'a distanza di quattro anni da quella del mio predecessore Carlo Azeglio Ciampi' gerçekleşen bir devlet
  ziyaretinde, Cumhurbaşkanı Abdullah Gül tarafından verilen devlet yemeğindeki kadeh kaldırma konuşması,
  Ankara, 17 Kasım 2009; selefi Ciampi'nin 'scelta rinnovatrice' ifadesini tekrarlar (bkz. ciampi-2005-11-22).
  Türkiye'nin Avrupa yolunu destekleyen diplomatik bir nezaket ifadesi. Ertesi gün Ankara Üniversitesinde
  verdiği konferansta, 'che culminò - dopo la caduta dell'Impero ottomano - nelle scelte della neonata
  Repubblica turca, sotto la guida di Kemal Ataturk : scelte di trasformazione della società turca in senso
  europeo, a partire dalla Costituzione del 1924' diyerek sancılı bir modernleşme yolculuğundan söz etmiştir.
  Programda 17 Kasım sabahı mozolenin Şeref Defteri'ni imzalaması yer alır; bu metin portalda bulunmamaktadır.
