voice: Sir Anand Satyanand
role: Yeni Zelanda Genel Valisi
quote: >-
  Atatürk vizyon sahibi bir insandı. Türkiye'nin geleceğinin ancak barış içindeki bir bölgede ve barış
  içindeki bir dünyada bir ulus olarak yerleşmesiyle güvence altına alınabileceğini açıkça anlamıştı. Yeni
  Zelanda'ya ve Gelibolu'da düşman olmuş diğer ülkelere elini uzattı. Bu asil jest, onun Yeni Zelandalıların
  kalplerindeki yerini perçinledi.
