voice: François Mitterrand
role: Fransa Cumhurbaşkanı
quote: >-
  Kemal Atatürk'ün "Yurtta barış, dünyada barış" sözleri hiçbir zaman bu kadar güncel olmamıştı.
quote_kind: translated
summary: >-
  Ankara'da, de Gaulle'ünkinden bu yana yapılan ilk Fransız devlet ziyaretini açarken: 'Kemal Atatürk'ün
  yurtta barış, dünyada barış sözleri hiçbir zaman bu kadar güncel olmamıştı.'
caveat: >-
  Devlet ziyaretinin ilk gününde Türkiye Cumhurbaşkanına verdiği yanıt, Ankara, 13 Nisan 1992, 'vingt-quatre
  ans exactement après la visite du Général de Gaulle'. İfadeleri ('près de cette ville capitale, que je ne
  connais pas') karşılama törenine işaret etmektedir; sitede yalnızca 'Ankara' yazar. Metnin daha önceki
  kısımlarında, (tarihçi René Grousset'ye atfettiği bir ifadeyle) 'depuis les premiers rois Hittites, à Kemal
  Atatürk en passant par Darius, les Seldjoukides, les Ottomans et Soliman' diyerek Atatürk'ü bu toprakların
  tarihinin 'figures de proue' [öncü şahsiyetleri] arasında sayar. O akşam Çankaya'da yapılan kadeh kaldırma
  konuşması ayrı bir kayıttır (mitterrand-1992-04-13).
