voice: Gerd Poppe
role: Bundestag Bündnis 90/Die Grünen milletvekili
quote: >-
  Kürt azınlıkla yaşanan kalıcı çatışma, modern Türkiye'nin doğuştan gelen en ağır kusurlarından birinin en
  açık ifadesidir: Kemalist dogma, tek devlette tek ulus kurgusu.
quote_kind: translated
summary: >-
  Tek devlette tek ulus şeklindeki Kemalist dogmayı, Kürt çatışmasının ardındaki, modern Türkiye'nin doğuştan
  gelen kurucu bir kusuru olarak adlandırır.
caveat: >-
