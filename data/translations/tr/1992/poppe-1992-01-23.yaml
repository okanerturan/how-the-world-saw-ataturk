  anahtar; basılı sayfa dserver PDF'inde kontrol edildi. Hassas konu (Kürt sorunu): arşiv kendi çerçevesini
  değil, konuşmacının çerçevesini kaydeder. Poppe, 'sözde Türklerin Babası Kemal Atatürk'ün bunu çok uluslu
  devletin daha fazla parçalanmasını önlemenin tek şansı olarak gördüğünü ekler (kendi sözleri, aynı sayfa
  aralığı). Hedef 'Kemalist dogma' ve ismen Atatürk'tür; kutupluluk çelişkilidir. Kaynak gösterimi: Deutscher
  Bundestag, Plenarprotokoll 12/73, 23 Ocak 1992 oturumu, s. 6171.
