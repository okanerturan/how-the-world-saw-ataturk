id: goff-2001
voice: Phil Goff
role: Yeni Zelanda Dışişleri ve Ticaret Bakanı (1999–2005)
quote: >-
  Hayatını kaybedenlerin dost bir ülkenin toprağında yattığını söyleyen, yiğit Türk komutanı ve daha sonra
  Türkiye Cumhuriyeti'nin kurucusu olan Mustafa Kemal Atatürk'tü.
quote_kind: translated
summary: >-
  Atatürk'ü 'yiğit Türk komutanı' ve cömert sözleri Yeni Zelanda–Türkiye dostluğunun temelini oluşturan
  Cumhuriyet'in kurucusu olarak nitelendirir.
caveat: >-
  Başbakan değil, hükümet heyeti başkanıdır. Goff daha sonra İşçi Partisi lideri ve Birleşik Krallık Yüksek
  Komiseri oldu. Anzak konuşmacılarının Atatürk'e atfettiği 'Johnnies and Mehmets' / 'your sons are now lying
  in our bosom' metninin kendisi tartışmalıdır: 1934 tarihli bir orijinal bulunamamıştır, metin ilk kez
  1953'te İçişleri Bakanı Şükrü Kaya'nın hatırası aracılığıyla basında yer almış ve 'Johnnies and Mehmets'
  ibaresi 1978 tarihli bir Avustralya eklemesidir (bkz. [[Johnnies and Mehmets]]). Dolayısıyla bu, övgüyü
  ödüllendiren bir anma veya diplomasi vesilesiyle dile getirilmiş, konuşmacının Anzak efsanesindeki Atatürk'e
  dair görüşüdür. Kaynak gösterimi: ANZAC Dawn Service speech, Gelibolu, 25 Nisan 2001.
verification_note: >-
  25 Nisan 2001 tarihli, Phil Goff, Foreign Affairs and Trade imzalı 'ANZAC Dawn Service speech - Gallipoli'
  başlıklı Beehive sayfasında birebir aynıdır. 'gallant Turkish commander', 'His generous words were the
  foundation for the warm friendship' kendi sözleridir. Görev tanımı doğrudur (Başbakan değil, Dışişleri
  Bakanı).
