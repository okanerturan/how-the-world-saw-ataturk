voice: Panagis Tsaldaris
role: Halk Partisi lideri, sonradan Başbakan
quote: >-
  Bununla birlikte, Sayın Hükümet Başkanı, Kemal'in Misak-ı Millî'sini biliyorsunuz ve sizin yapmış olduğunuz
  antlaşmayla onun seferi sürdürmek için hiçbir malzemeden mahrum kalmadığını da biliyorsunuz. Ne yazık ki
  Kemal bunların hiçbirini kabul etmiyordu.
quote_kind: translated
summary: >-
  Venizelos'a, Misak-ı Millî'ye bağlılık yemini etmiş olan Kemal'in Venizelos'un antlaşması uyarınca hiçbir
  savaş malzemesi kaybetmediğini ve önerilen uzlaşmaların hiçbirini kabul etmediğini söyler.
caveat: >-
