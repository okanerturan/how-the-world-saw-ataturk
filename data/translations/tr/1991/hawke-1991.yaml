quote: >-
  Kemal Atatürk'ün Gelibolu'da vatanını savunurken sergilediği liderlik ve ustalık, modern Türkiye devletini
  kurmasının önünü açtı.
quote_kind: translated
summary: >-
  Cumhurbaşkanı Özal'a, Atatürk'ün Gelibolu'daki liderliği ve ustalığının modern Türk devletini kurmasının
