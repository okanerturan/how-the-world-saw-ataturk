  l'Union européenne' olarak görmekte haklı olup olmadıkları sorulduğunda, Türkiye ve AB'nin 'sans aller
  jusqu'à l'intégration, qui ne profiterait en réalité ni à la Turquie ni à l'Union européenne' mümkün
  olduğunca yakın olmaları gerektiğini söyler ve bunun yerine 'l'UE et la Turquie, avec la Russie, seraient
  des piliers' olacağı ortak bir alan önerir. Alıntılanan cümle bu yanıtı kapatır: Kemal, kendi başına ele
  alınmak için değil, üyeliğe bir alternatif konusunda cesaret modeli olarak anılır. Bir sonraki soru onu
  Türkiye'ye bir Orta Doğu ülkesi muamelesi yapmak ve onu AB'den uzaklaştırmakla suçlar.
