summary: >-
  Bir Türk gazetesinde Türkiye'nin AB üyeliğine karşı çıkarken: 'geçmişte Mustafa Kemal gibi vizyonerlerin
  yapabildiği gibi' yeni çözümler üretilmelidir.
caveat: >-
  Ankara'ya yaptığı çalışma ziyaretinin günü olan 25 Şubat 2011'de yayımlanan, Türk günlük gazetesi Posta ile
