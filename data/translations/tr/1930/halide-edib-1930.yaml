role: Türk romancı ve milliyetçi, o sırada sürgünde
quote: Ardından Mustafa Kemal Paşa mükemmel bir siyasi oyun oynadı.
quote_kind: translated
summary: >-
  1925 Takrir-i Sükûn Kanunu için yaptığı hamleyi, bir demokrasiyi diktatörlüğe dönüştüren 'mükemmel bir
  siyasi oyun' olarak nitelendirir.
caveat: >-
  Turkey Faces West: A Turkish View of Recent Changes and Their Origin (Yale University Press, 1930; iç kapak
  karşısındaki sayfa Williamstown'daki Institute of Politics'e atıfta bulunur), böl. 'The Turkish Republic',
  s. 220 (bir sonraki üst başlık 221'dir; tarama archive.org in.ernet.dli.2015.183553, Digital Library of
  India nüshası). Bağlam, sonrasında 'the tribunals suppressed opposition and instituted a reign of terror
  which lasted nearly two years' ve 'the moral responsibility ... rests on the majority in the National
  Assembly' denilen Mart 1925 Takrir-i Sükûn Kanunu'dur. Ayrıca s. 222'de Mustafa Kemal'in kişiliğinin 'played
  a great role' olduğunu ancak her 'Great man' gibi onun da bir dalga tarafından taşındığını ve s. 182'de
  askeri ve dış politika çizgilerinde 'few men ... have shown better judgment and capacity than Mustafa Kemal
  Pasha' ifadelerini ekler. Hassas konu (Kürt ayaklanması, İstiklal Mahkemeleri): görüş arşivin değil,
  kendisinindir.
