voice: Emil Ludwig
role: Alman biyografi yazarı, dönemin diktatörleriyle söyleşi yapan yazar
quote: >-
  Yanında Napolyon'un yarı hayalperest gibi göründüğü bir adam, milliyetçi, diğer bütün halklara karşı
  güvensiz, tek bir fikre tutulmuş, aynı anda hem onun hizmetkârı hem de efendisi olan Gazi, sayılarla ifade
  edilemeyen bütün güdüleri hor görür
quote_kind: translated
summary: >-
  Yanında Napolyon'un yarı hayalperest gibi göründüğü soğuk bir akılcı; içtenlikle demokrat olmak ister, 'ama
  yine de diktatördür'.
