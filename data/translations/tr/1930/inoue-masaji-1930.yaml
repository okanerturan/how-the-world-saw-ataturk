role: Japon siyasetçi ve siyasi yazar, eski Dışişleri Bakanlığı mensubu ve dış göç teşvikçisi
quote: >-
  Türkiye onun sayesinde kurtarıldı. O olmasaydı Türkiye Avrupa topraklarından sürülecek, Asya'da da
  Anadolu'nun bir köşesine sığınarak tükenmekte olan ömrünü sürdürmekten başka yolu olmayan bir kaderle karşı
