role: Papa; Türkiye'ye apostolik ziyareti sırasında Anıtkabir ziyareti
quote: >-
  Türkiye Cumhuriyeti'nin kurucusunun sözlerini memnuniyetle benimsiyorum: 'yurtta sulh, cihanda sulh'
  diliyorum
quote_kind: translated
summary: >-
  Anıtkabir özel defterinde, kurucunun 'yurtta sulh, cihanda sulh' sözünü dinler arasında bir köprü için kendi
  dileği olarak benimsiyor.
caveat: >-
