voice: Arnold J. Toynbee
role: >-
  İngiliz tarihçi; Cumhuriyet'in 50. yıl dönümü dolayısıyla Milliyet'in hazırladığı dizide yer alan "İngiliz
  gözüyle" başlıklı imzalı yazısı
quote: >-
  TÜRKLER Kurtuluş Savaşında heyecan verici bir zafer kazandılar. Bu zafer, cesaret ve sabırlarının
  armağanıydı. Ulusal tarihlerinin bu bunalımlı noktasında Türkler büyük bir önder buldular: Mustafa Kemal
  Atatürk... Hareketli ve ilham verici bir kişiydi Atatürk. Ne var ki, Türkler bedelini ödemekte istekli
  olmasalardı, yurddaşlarını, Atatürk de zafere ulaştıramazdı. 1919 da Atatürk kendi halkına, ancak aşırı
  fedakârlık isteyen bir zafer ihtimali vaadedebilirdi. 1940'da Churchill'in yaptığı da buydu. Türk halkı
  Atatürk'ün çağrısına soylu bir cevap verdi.
quote_kind: original-turkish
summary: >-
  Türkler kriz anında, tıpkı 1940'ta Churchill'in yaptığı gibi yalnızca fedakârlık yoluyla zafer vaat
  edebilen, dinamik ve ilham verici 'büyük bir lider buldular'.
caveat: >-
