quote: >-
  Atatürk, Türkiye'nin yaşadığı en uzun barış döneminde zaferleri her zaman hatırlanan bir askerdi ve yönetimi
  askerî rejimden sivil rejime çevirmeyi başarmıştı. […] Doğuştan bir liderdi; buna rağmen örgütlenmeye ve
  yasal gereklere çok önem veriyordu. Bütün bu kutuplar, tek bir diyalektik gerilimin parçalarını oluşturdu ve
  Atatürk'ün yaratıcı önderliğinin katkısıyla bir sentez yarattı. Kurduğu Batılı Türk Ulusu ve devletinin
  gücü, bu sentezin değerini göstermektedir. […] Gerçekte, Atatürk, salt bir elitist değildi; bu ve buna
  benzer birçok nedenlerde, birtakım birbirine karşı unsurları bir araya getirmiş ve belirli çelişmezlikleri
  uzlaştırmıştı.
