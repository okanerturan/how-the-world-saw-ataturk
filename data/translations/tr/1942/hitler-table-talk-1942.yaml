id: hitler-table-talk-1942
voice: Adolf Hitler
role: Führer; karargâhtaki masa başı sohbetleri
quote: Mustafa Kemal Atatürk'ün papazlarından kurtulmasındaki hız
quote_kind: translated
summary: >-
  Mustafa Kemal Paşa'nın iktidarı ele geçirdikten sonra akıllıca davrandığını savunur ve din adamlarından ne
  kadar hızla kurtulduğuna hayranlık duyar.
caveat: >-
  Yalnızca archive.org tam metin arama kesitleri olarak görüldü (hitlerssecretcon0000hrtr; kesit 'chapters'
  kelimesinde kesiliyor). Kitabın dizini 'Ataturk; Kemal, 233, 372, 566' kaydını içerir (kesit sayfaları
  gösterilmiyor) ve aynı sohbetin bölüm başlığı 'Boris the Fox of Bulgaria—Political plots—Wisdom of Kemal
  Ataturk' şeklindedir. Aynı kitaptan diğer kesitler: 'That's why Kemal Pasha acted wisely, immediately after
  the seizure' ve 'Kemal Ataturk, who had nothing to do with his compatriots' (Kürtler ve Küçük Asya üzerine
  ırksal bir ara söz). 1942-08 tarihi görevdeki ipucudur (1 Ağustos 1942), sayfadan okunmamıştır: doğrulayın.
  Table Talk, Hitler'in kendi yazısı değil, Bormann'ın notlarının kaydıdır. Sohbet başlığına göre tarih '178,
  2nd April 1942, midday … Wisdom of Kemal Ataturk' (kontrol edin). Yalnızca kesit; cümlenin sonu ve sayfa
  (dizin: 233, 372, 566; muhtemelen 233) doğrulanmamıştır.
