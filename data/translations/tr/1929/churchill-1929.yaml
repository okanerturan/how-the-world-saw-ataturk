role: Eski Savaş Bakanı; The World Crisis kitabının yazarı
quote: Harekâtları karmaşık ve ustacaydı.
quote_kind: translated
summary: >-
  Kemal'i bir 'Savaşçı Prens'in niteliklerine sahip 'Kaderin Adamı' ve 1922 taarruzunu 'ustaca' diye
  nitelendirir; ancak ordusunu İzmir'in yakılmasıyla ilişkilendirir.
caveat: >-
  Aynı ciltteki ikinci alıntı, s. 367-368: 'Mustapha Kemal, the Man of Destiny whom we have met in these
