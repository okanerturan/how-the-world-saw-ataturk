summary: >-
  Bir Balkan gezisinin ardından Kemal'in Türkiye'sini, seçimleri tertipleyen ve iktidarı polis ile mahkemeler
  aracılığıyla elinde tutan 'parlamenter kılıflı bir diktatörlük' olarak değerlendirir.
caveat: >-
