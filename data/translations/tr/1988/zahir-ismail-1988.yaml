  dahi ve en çok ihtiyaç duyduğu anda Türk milletine Tanrı'nın bir armağanıdır." Aynı konuşmada: 'O bizi özgür
  olmağa cesaretlendirdi' (bizi özgür olmaya cesaretlendirdi); tutanaklarda sömürge yönetiminden kurtuluş yılı
