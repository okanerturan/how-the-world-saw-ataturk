voice: Tan Sri Dato Mohd Zahir Hacı İsmail
role: Malezya Temsilciler Meclisi Başkanı
quote: >-
  Ben kendim, gençliğimde, ateşli bir Atatürk hayranı idim. Atatürk bir dahi ve en çok muhtaç olduğu anda Türk
  Milletine Tanrı’nın bir ihsanıdır.
quote_kind: original-turkish
summary: >-
  Atatürk'ün yaptıklarına dair haberlerin sömürge yönetimi altındaki Malaya'ya ulaştığını, evlerde
  resimlerinin asılı olduğunu ve kendisinin de gençliğinde ateşli bir hayranı olduğunu söyler.
caveat: >-
