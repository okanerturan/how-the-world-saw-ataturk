voice: Rajiv Gandhi
role: Hindistan Başbakanı
quote: >-
  Kemal Atatürk, bize özgürlüğümüz için mücadele etme ilhamı veren Hindistan vizyonunu tarif ederken
  Jawaharlal Nehru'nun sık sık kendisinin ve halkının önüne koyduğu parlak örnekti.
quote_kind: translated
summary: >-
  Ankara'da, Atatürk'ü Nehru'nun Hindistan'ın özgürlük mücadelesi için örnek gösterdiği parlak örnek, onun
  laik Cumhuriyeti'ni ise dikkate değer, ilham verici bir örnek olarak nitelendirir.
caveat: >-
  Başbakan Turgut Özal'ın verdiği ziyafetteki konuşma, Ankara, 17 Temmuz 1988; Selected Speeches and Writings,
  c. 4, s. 361–364 (archive.org açık metni). Nehru'nun 1928'de Kalküta'da 'Kemal Pasha' için yaptığı övgüyü ve
  Atatürk'ün Cumhuriyet'in 'can never be the land of sheikhs, dervishes' sözünü alıntılar, ardından şöyle der:
  'The achievements of Ataturk's Republic of Culture remain a remarkable, inspiring example.' Ayrıca: 'Turkey
  under Ataturk became a byword for modernisation.' Diplomatik ziyafet konuşması. Türkçe kitaplarda dolaşan
  'Kendi özgürlük mücadelemizde Kemal Atatürk'ten ilham aldık' şeklindeki Türkçe aktarım anlam bakımından bu
  pasajla örtüşmektedir.
