id: macarthur-1953-11-10
voice: Douglas MacArthur
role: >-
  Ordu Generali, eski Uzak Doğu Müttefik Kuvvetler Başkomutanı; Atatürk'ün ölümünün 15. yıl dönümü dolayısıyla
  Basın-Yayın Genel Müdürlüğü aracılığıyla yayımlanan Türk milletine mesajı
quote: >-
  Bugün 10 kasım, eski dostum Kemal Atatürkün ölüm yıldönümüdür. O zamandan beri on beş sene geçmiş olmasına
  rağmen onun ufulüne kendimi henüz alıştıramıyorum. Eğer sağ olsaydı milletlerarası sahnenin bugünkü
  hercümerc hali esaslı bir şekilde değişik olurdu. Atatürk, Türkiyede daima memleketin bugünkü inkişafının
  modern atası olarak anılacaktır. Fakat, onun dünya çapında devlet adamı olarak yüksek kudreti belki de bazı
  vatandaşları tarafından bile tam mânasiyle anlaşılamamaktadır. O tanıdığım diğer insanlar gibi, hür
  insanlığın köleliğe karşı durması meselesinin cihanşümul mahiyetini idrak ediyordu, onun dünyayı sarsan
  mücadelenin vahim bir anında vefatı, telâfisi gayri kabil olmakta devam etmektedir.
quote_kind: original-turkish
summary: >-
  'Eski dostum', bazı Türklerin bile değerini yeterince takdir edemediği dünya çapında bir devlet adamı;
  yaşasaydı dünya sahnesi temelden farklı olurdu.
caveat: >-
  İngilizce özgün metin görülmemiştir. Anadolu Ajansı mahreç satırı Ankara, 9 Kasım'dır; mesajın kendisi
