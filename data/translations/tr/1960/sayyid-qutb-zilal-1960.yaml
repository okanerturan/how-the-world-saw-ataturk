voice: Sayyid Qutb
role: Müslüman Kardeşler ideoloğu; Kur'an müfessiri
quote: >-
  Bunların en açık örneği, İslami olan her şeye düşmanlığında tavizsiz olan Atatürk ve Türkiye'deki hareketi
  durumundaydı.
quote_kind: translated
summary: >-
  Atatürk'ün hareketini İslami olan her şeye düşmanlığında tavizsiz ve Müslümanları birleştiren son kurum olan
  hilafetin ortadan kaldırılması olarak tanımlar.
caveat: >-
  Çeviri. 9. Sure (Tevbe) tefsiri, 'Relations with Other Religions' bölümü, tarama s. 118 (s. 120'de Wilfred
  Cantwell Smith'in Atatürk okuması hakkında ek değerlendirme). Zilal 1952–65 yıllarında yazılmıştır ve sure
  ciltleri tarihsizdir, bu nedenle '1960' yaklaşık bir orta noktadır. Onu anan iki pasaj daha vardır: 6. Sure
  (En'am) tefsiri, tarama s. 118, 'Kemal Ataturk, the hero of Turkey' ve s. 289, 'the false hero they
  created'. Bu pasajlarda Qutb laikleştirme projesini Yahudi, Hristiyan ve Siyonist güçlere atfeder; bu
  kendisinin atfıdır ve burada onaylanmamaktadır. Milestones (archive.org MILESTONES_201903,
  milestones-syed-qutb) tarandı ve Atatürk'ün adını anmıyor. Sayfa numaraları taramanın basılı sayfa
  altbilgilerinden alınmıştır.
