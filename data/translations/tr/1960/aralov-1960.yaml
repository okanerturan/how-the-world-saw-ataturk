id: aralov-1960
voice: Semyon Aralov
role: Ankara'daki ilk Sovyet büyükelçisi (1922-23), anı yazarı
quote: >-
  Gazi ince, lirik bir yaradılışa sahipti. Vatan ve halk sevgisi, onu Türkiye'nin düşmanlarına karşı acımasız
  mücadele için gerekli olan sert, metin bir karakteri kendi içinde geliştirmeye mecbur bıraktı.
quote_kind: translated
summary: >-
  Gazi'yi vatan sevgisiyle sertleşmiş lirik bir insan olarak tasvir eder, ancak devriminden yalnızca
  burjuvazinin kazançlı çıktığı yargısına varır.
caveat: >-
  S. I. Aralov, Воспоминания советского дипломата. 1922-1923 (Moskova: Institute of International Relations,
  1960), s. 215 (veda yemeğinde Kemal'in eşi Latife'den bir Tchaikovsky romansı çalmasını istemesinin ardından
  gelen lirik yaradılış portresi). Aynı kitap, s. 211, yeni Türkiye'nin lideri olarak Kemal hakkındaki
  bölümde: 'Но надежды эти не оправдались. Выиграла от национальной революции и военных побед освободительной
  армии только буржуазия' (çevirisi: 'Fakat bu umutlar gerçekleşmedi. Ulusal devrimden ve kurtuluş ordusunun
  askeri zaferlerinden yalnızca burjuvazi kazançlı çıktı') ve Kemal'in 'не был последователен в борьбе с
  феодалами' olduğu belirtilir. Açık archive.org taramasından okundu (djvu metni, sayfa numaraları taramadan).
  Olaylar 1922-23'e ait olup 1960 Sovyet tarih yazımı altında yazılmış ve yayımlanmıştır; kitabın önsöz
  düzeyindeki kendi çerçevesi sınıf analizidir. Aralov'un Kemal'in taktik dehasına ve komünistlerin
  bastırılmasına ilişkin hükmü alıntılanan pasajlarda yer almaz.
