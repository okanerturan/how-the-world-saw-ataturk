voice: Richard von Weizsäcker
role: >-
  Batı Almanya Federal Cumhurbaşkanı; Uluslararası Atatürk Barış Ödülü'nü kabul ederken Ankara'da yaptığı
  konuşma
quote: >-
  Atatürk, yüzyılımızın gerçekten önemli devlet adamlarından biriydi. Çok az kişi onun yanına konulabilir. […]
  Bu anlamda Mustafa Kemal Atatürk tarihsel bir büyüklüğe sahiptir. İnsan anlayışı ve yanılsamalardan uzak,
  geniş ufuklu gerçeklik duygusu; ona bir devlete, bütün bir halka yeni bir özgüven kazandırma ve yeni
  hedefler koyma gücü verdi. […] Atatürk ülkesinin kaderinin sorumluluğunu üstlendiğinde Türkiye geri kalmış,
  feodal, otokratik olarak yönetilen, yenilgilerle aşağılanmış bir ülkeydi. Öldüğünde ardında modern,
  aydınlanmış, kendinden emin ve saygı duyulan bir devlet bıraktı.
quote_kind: translated
summary: >-
  Yüzyılın 'tarihsel büyüklüğe' sahip gerçekten önemli devlet adamlarından biri: geri kalmış, aşağılanmış bir
  ülkeyi modern ve saygın bir devlet olarak bıraktı.
caveat: >-
  Bulletin der Bundesregierung sayı 108 (20 Ekim 1987), bundesregierung.de adresinde dijitalleştirildiği
  şekliyle (tamamı küçük harf, umlaut'lar ae/oe/ue şeklinde; imla burada düzeltilmiştir). 'Burckhardt'
  cümlesi, Jacob Burckhardt'ın tarihteki büyük şahsiyetler üzerine sözlerini açımlamaktadır. 1986'daki devlet
  ziyaretinde Anıtkabir özel defterine, Atatürk'ün 'Özgürlük her türlü ilerlemenin anasıdır' sözünü
  alıntılayarak, "Bu anlayışla Türk halkına barışçı ve şanslı bir gelecek dilerim" yazmıştır (Milliyet 27
  Mayıs 1986 s. 7, Nur Batur; sayfa görüntüsünden okunmuştur); 1986 akşam yemeği kadeh konuşması, aktarıldığı
  kadarıyla Atatürk'ten söz etmemektedir.
