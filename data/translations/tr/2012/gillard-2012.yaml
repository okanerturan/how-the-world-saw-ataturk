id: gillard-2012
voice: Julia Gillard
role: Avustralya Başbakanı (2010–2013)
quote: >-
  büyük bir lider olmaya yazgılı bir adamın önderliğinde, usta bir düşman pusuda bekliyordu. ... ki bunun için
  Atatürk askerlerine yalnızca saldırmayı değil, ölmeyi de emretmişti.
quote_kind: translated
summary: >-
  Gelibolu'daki Türk liderini büyük bir lider olmaya yazgılı bir adam olarak nitelendirir; Atatürk'ün
  askerlerine yalnızca saldırmayı değil, ölmeyi de emrettiğini söyler.
caveat: >-
  Alıntı aynı konuşmanın iki pasajını birleştirir (üç noktayla işaretlenmiştir; ilki adını anmaz, ikincisi
  Atatürk adını anar). Övgüden ziyade betimleyicidir; bu konuşmada 'Johnnies' sözleri alıntılanmamıştır.
  Kutupluluk tanık: devlet adamı olarak kişiliğine değil, komutanlığına dair belirtilmiş bir görüş. Anzak
  konuşmacılarının Atatürk'e atfettiği 'Johnnies and Mehmets' / 'your sons are now lying in our bosom'
  metninin kendisi tartışmalıdır: 1934 tarihli bir orijinal bulunamamıştır, metin ilk kez 1953'te İçişleri
  Bakanı Şükrü Kaya'nın hatırası aracılığıyla basılı olarak ortaya çıkmıştır ve 'Johnnies and Mehmets' ibaresi
  1978 tarihli bir Avustralya eklemesidir (bkz. [[Johnnies and Mehmets]]). Dolayısıyla bu, övgüyü ödüllendiren
  bir anma töreni veya diplomatik vesileyle dile getirilmiş, konuşmacının Anzak efsanesindeki Atatürk'e dair
  görüşüdür. Kaynak gösterimi: Dawn Service address, Gallipoli, 25 April 2012.
verification_note: >-
  Her iki parça da 18532 sayılı tutanakta (Gillard, Dawn Service, Gelibolu, 25 Nisan 2012) birebir aynı, ancak
