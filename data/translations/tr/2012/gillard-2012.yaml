  betimleyicidir ('Ataturk ordered his men not only to attack but to die'). what_they_saw alanı 'skilled
  enemy' ifadesini yanlışlıkla komutan yapıyor; düşman Türk kuvvetidir. Düzeltme: 'Calls the Turkish leader at
  Gallipoli a man destined to become a great leader; says Ataturk ordered his men not only to attack but to
  die.' Tanık 1 makul.
