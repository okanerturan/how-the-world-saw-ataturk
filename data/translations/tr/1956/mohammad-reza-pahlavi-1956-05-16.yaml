id: mohammad-reza-pahlavi-1956-05-16
voice: Mohammad Reza Pahlavi
role: >-
  İran Şahı; resmî ziyareti sırasında Ankara fahri hemşehriliğini alırken yaptığı konuşma, Türk Ocağı
quote: >-
  Merhum hükümdar pederimle büyük Atatürk arasındaki derin dostluk râbıtaları, benim için daima şâyânı hürmet
  olmuştur. Onun için şimdi burada bu iki büyük rehberin hâtıralarını, derin bir heyecanla meşbû olarak
  yâdediyorum. Onların sağlam bir temel üzerine kurmuş oldukları büyük eseri, İran - Türk dostluğunu bizler
  ebedi kılmalıyız.
quote_kind: original-turkish
summary: >-
  Babası Rıza Şah ile derin dostluğuna daima hürmet duyduğu 'büyük Atatürk'; İran-Türk dostluğunu sağlam bir
  temel üzerine kuran iki 'büyük rehber'.
caveat: >-
  Vali Kemal Aygün'ün fahri hemşehrilik beratını takdim etmesinin ardından yaptığı kısa konuşma. Bir gün önce
  (15 Mayıs), Ankara Radyosu'na Farsça verdiği demeçte 'Merhum Rızâ Şâh'ın ve merhum Atatürk'ün aydınlık
  fikirleri ve kavi ellerinin rehberliği ile' (Milliyet 16 Mayıs 1956 s. 5, 'Şahın demeci') kurulan bir
  dostluktan söz etti. Anıtkabir ziyareti (15 Mayıs) yalnızca anlatımdır. Derlemedeki Rıza Şah kayıtları
  babasıyla ilgilidir. Okuyucu ajan tarafından sayfa görüntülerinden (Okan'ın Milliyet arşivi girişi) okundu;
  ana ajan tarafından kırpılmış görüntü üzerinden yeniden kontrol edildi.
