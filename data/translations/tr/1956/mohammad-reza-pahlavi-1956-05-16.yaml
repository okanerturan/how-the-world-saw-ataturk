id: mohammad-reza-pahlavi-1956-05-16
voice: Mohammad Reza Pahlavi
role: >-
  İran Şahı; resmî ziyareti sırasında Ankara fahri hemşehriliğini alırken yaptığı konuşma, Türk Ocağı
quote: >-
  Merhum hükümdar pederimle büyük Atatürk arasındaki derin dostluk râbıtaları, benim için daima şâyânı hürmet
  olmuştur. Onun için şimdi burada bu iki büyük rehberin hâtıralarını, derin bir heyecanla meşbû olarak
  yâdediyorum. Onların sağlam bir temel üzerine kurmuş oldukları büyük eseri, İran - Türk dostluğunu bizler
  ebedi kılmalıyız.
quote_kind: original-turkish
summary: >-
  Babası Rıza Şah ile olan derin dostluğunu saygıyla andığı 'büyük Atatürk'; İran-Türk dostluğunu sağlam bir
  temel üzerine inşa eden iki 'büyük rehber'.
caveat: >-
  Belediye Başkanı Orhan Eren'in fahri hemşehrilik beratını takdim etmesinin ardından yaptığı kısa konuşma.
  Bir gün önce (15 Mayıs), Ankara Radyosu'na Farsça verdiği demeçte, 'merhum Rıza Şah ile merhum Atatürk'ün
  aydınlık fikirleri ve güçlü ellerinin rehberliğinde' ('Merhum Rızâ Şâh'ın ve merhum Atatürk'ün aydınlık
  fikirleri ve kavî ellerinin rehberliği ile'; Milliyet 16 Mayıs 1956 s. 5, 'Şahın demeci') kurulan bir
  dostluktan söz etmişti. Anıtkabir ziyareti (15 Mayıs) yalnızca haber anlatımı olarak yer alır. Arşivdeki
  Rıza Şah kayıtları babasına aittir. Sayfa görüntülerinden okundu (Milliyet abone arşivi).
mediated_by: "Milliyet, 17 Mayıs 1956, s. 1 ('Şâh, Ankara hemşehrisi oldu'): gazetenin Türkçe aktarımı"
