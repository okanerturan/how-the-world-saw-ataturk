id: chirac-2002-11-22
voice: Jacques Chirac
role: Fransa Cumhurbaşkanı
quote: >-
  Türkiye laik bir ülkedir ve tarihsel olarak, bilhassa modern Türkiye'nin babası Kemal Atatürk tarafından
  kazanılmış olan bu laikliği sorgulamamasını beklediğimiz bir ülkedir.
quote_kind: translated
summary: >-
  Birliğe katılacak '65 milyon Türk Müslüman' hakkında soru sorulduğunda: Türkiye laiktir ve 'modern
  Türkiye'nin babası' tarafından kazanılan laikliği bozmamalıdır.
caveat: >-
  Prag'daki NATO zirvesinde düzenlenen basın toplantısı, 22 Kasım 2002, AKP'nin seçim zaferinden üç haftadan
  kısa bir süre sonra. Avrupa kamuoyunun 'l'entrée éventuelle de 65 millions de musulmans turcs au sein de
  l'Union'dan neden korkmaması gerektiği sorulduğunda, 'Vous dites 60 millions de musulmans turcs. C'est
  curieux, parce que vous ne dites pas 60 millions de chrétiens français' diye karşılık verir ve meselenin
  dini değil siyasi olduğunu söyler: Türkiye, Avrupa'nın değerlerini paylaştığı ölçüde Avrupa'da yere sahiptir
  ki bu da 'lui reste à démontrer' [henüz kanıtlaması gereken bir şeydir]. Atatürk bu argümana hizmet eder.
  Tutanakta 'Kamal ATATURK' yazılıdır. 19 Şubat 1998'de, Élysée'de Cumhurbaşkanı Demirel onuruna verilen
  devlet yemeğinde, Fransa'nın 'dès 1921, en écho à l'appel de Mustapha Kemal' [daha 1921'de, Mustafa Kemal'in
  çağrısına karşılık olarak] 'le fait national turc'ü [Türk ulusal gerçeğini] tanıyan ilk ülke olduğunu
  söylemişti.
