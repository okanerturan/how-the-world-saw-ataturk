id: aqqad-1945
voice: Abbas Mahmud al-Aqqad
role: Mısırlı deneme yazarı, şair ve eleştirmen
quote: ve buna rağmen, içinde Müttefik orduları varken İstanbul'u ikinci kez fethetmeyi başardı
quote_kind: translated
summary: >-
  Mustafa Kemal'i Hitler'in karşısına koyar: Hitler'in silahlanma harcamalarının çok küçük bir kısmını
  harcamış, yine de içinde Müttefik orduları varken İstanbul'u geri almıştır.
caveat: >-
  Kaynak olarak al-Risala sayı 619, 14 Mayıs 1945, Wikisource sayfası 'مجلة الرسالة/العدد 619/التربية
  السياسية' gösterilmiştir. Al-Aqqad, 'Hitler in the Balance' (1940) adlı kitabındaki daha önceki kendi sözünü
  alıntılar. Savı şudur: Kemal'in başarısı silah harcamalarına değil kıvrak zekâya dayanıyordu; ayrıca
  Türklerin kaleleri geri almalarını ve kapitülasyonları kaldırmalarını sağladı. Sayı 629'daki (23 Temmuz
  1945, 'Voice and Personality') bağlantılı bir ifadede Churchill ve Mustafa Kemal'in seslerinin kendisini
  şaşırttığını söyler ve Kemal'i 'Türklerin kahramanı' olarak adlandırır; sayı 400'de (3 Mart 1941) 'Mustafa
  Kemal'in Türkiye'deki deneyimi'ni devlet gücüne ihtiyaç duyan devrimler arasında sayar. Geçerken
  değinilmiştir ancak kendi sözleriyle ifade edilmiştir. Wikisource transkripsiyonu.
verification_note: >-
  Arapça alıntı birebir aynıdır; parantez içi bir öz-alıntının içinde yer alır: 'كما قلنا في كتاب هتلر في
