  فتحاً ثانياً وفيها جيوش الحلفاء ...)'. Üstbilgi yazarı 'عباس العقاد' ve imza 'عباس محمود العقاد', tarih
  14-05-1945. 'Çok küçük bir kısmı' ifadesi 'on binlerce milyonun binde birinin bir parçası' anlamını makul
  biçimde karşılamaktadır; kitabın '1940' tarihi sayfada yer almamaktadır (dış bilgi). Sayı 629 (23-07-1945,
  'الصوت والشخصية') Churchill ve Mustafa Kemal'in seslerinin kendisini şaşırttığını söyler ve ona 'بطل الترك'
  der (örtüşüyor); sayı 400 (03-03-1941, Aqqad imzalı) devlet gücüne ihtiyaç duyan deneyimler arasında 'تجربة
  مصطفى كمال في تركيا' ifadesini sıralar (örtüşüyor). Övgü Hitler'le karşıtlık kurmak için kullanılsa da
  hayran / 1 yerinde; şema uygun.
