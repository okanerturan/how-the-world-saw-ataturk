  tarihlendirme: Cavit Orhan Tütengil, Türk Dili no. 302 (Kasım 1976), yeniden basımı: Kanbak s. 72–74: Küçük
  Mecmua no. 20–21, Ekim 1922
verification_note: >-
  Beyit s. 20'de birebir yer alıyor ('Sen dâhisin, buna çoktan inandık.. / Mefküresiz rehberlerden pek
  yandık..'); 'Ey kurtaran bizi zâlim Yunan'dan!', 'Kurtar bizi cehâletten, noksândan!' ve 'Kurtar bizi artık
  Kara Sultan'dan!' dizeleri what_they_saw alanını destekliyor. 'İkinci İstid'â' ve 'Bu milletin hâli olur pek
  yaman, / Kulâğuzu olmazsa bir kahraman..' mevcut; Altın Işık dizesi 'Mustafa Kemal'dir baş kahramanı!' s.
  74'te. Tarihlendirme: Tütengil (s. 74) her iki İstid'â'yı Küçük Mecmua sayı 20 ve 21'e, '(ekim 1922)' (OCR
  'ekim 19—22') olarak yerleştiriyor; Şapolyo'nun Çankaya'ya çağrılma pasajı s. 73'te, E. B. Şapolyo, Fırka
  Nedir? (Zonguldak 1947), s. 6'dan alınma. Düzeltme: mediated_by tarihlendirme kaynağını adlandırmalı: '... ←
  Tütengil, Türk Dili no. 302 (Nov 1976), repr. Kanbak pp. 72-74 (dating to Küçük Mecmua nos. 20-21, Oct
  1922)'. Uyarı notundaki 'essay reprinted in the same compilation' Tütengil'in yazısıdır. Küçük Mecmua'nın
  kendisi görülmedi, dolayısıyla ay bilgisi Tütengil'e dayanıyor; S katmanı dürüst. Çeviri sadık ('pek yandık'
  = 'we have been badly burnt'; 'suffered enough' uygun). Şema tamam.
