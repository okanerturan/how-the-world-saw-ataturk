id: ziya-gokalp-1922-10
voice: Ziya Gökalp
role: Sosyolog ve şair, Türkçülük kuramcısı; Küçük Mecmua (Diyarbakır) editörü
quote: Sen dâhisin, buna çoktan inandık.. / Mefküresiz rehberlerden pek yandık..
quote_kind: original-turkish
summary: >-
  Gazi'ye sunduğu manzum dilekçelerde onu dâhi ve Yunanlılardan kurtarıcı olarak selamlar; Türkleri cehaletten
  ve geri kalmışlıktan kurtarması için yakarır.
caveat: >-
  ÇEVİRİ (bu kaydın): 'You are a genius, we long believed it.. / We have suffered enough from guides without
  an ideal..' Her kıtası 'Kurtar bizi...!' (Bizi kurtar!) diye biten ve 'the Black Sultan'dan (Vahideddin)
  kurtarılmayı da içeren 'İstid'â — Gazi Paşa Hazretleri'ne' şiiri. Aynı derlemede yeniden basılan makale, iki
  İstid'â şiirini Küçük Mecmua sayı 20 ve 21'e (Ekim 1922) tarihlendirir. İkincisinde ('İkinci İstid'â')
  Gökalp, Kemal'in barıştan sonra sade bir vatandaş olma yönündeki beyanına karşı çıkar: 'Bu milletin hâli
  olur pek yaman, / Kılavuzu olmazsa bir kahraman'. 1923 tarihli Altın Işık eseri 'Mustafa Kemal'dir baş
  kahramanı!' dizesini ekler. Küçük Mecmua'nın kendisi görülmemiştir. Temas: makale, E. B. Şapolyo'ya atıfla
  Kemal'in Gökalp'ı Çankaya'ya çağırdığını, bunun ardından Gökalp'ın fırkanın dokuz umdesi üzerine Doğru Yol'u
  yazdığını belirtir. Arşiv notundaki 'My flesh and bones belong to my parents...' sözü Gökalp'ın bakışı
  değil, Kemal'in Gökalp hakkındaki sözüdür ve kontrol edilmemiştir.
