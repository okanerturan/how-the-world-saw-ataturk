voice: Billy Hughes
role: Avustralya Başbakanı
quote: >-
  Biz barıştan yanayız ve Türklere adil davranılmasını istiyoruz; ancak savaş çıkacaksa Mustafa Kemal,
  Avustralya'nın savaşa girmesinin ne anlama geldiğini unutmamalıdır.
quote_kind: translated
summary: >-
  Çanakkale Krizi sırasında, Türklere 'adil davranılmasını' isterken Mustafa Kemal'i Avustralya'nın savaşa
  girmesinin ne anlama geldiğini unutmaması konusunda uyarır.
caveat: >-
  Temsilciler Meclisi oturumu kapandıktan sonra gazetecilere söylenmiş olup o gün Meclis'te yaptığı açıklamayı
  açımlamaktadır; bir önceki cümle: 'We shall do so again, if necessity arises, and it will be well if
  Mustapha Kemal remembers this.' Meclis'te ayrıca 'Australia had no bias against Kemal' ve Müttefiklerin
  'could yield nothing to force, but everything to reason' dediğini ifade etmiştir (The Register haberi). 4
  Kasım 2026'da arayüzlü bir tarayıcı aracılığıyla Trove üzerinden okundu. Bir hasma yönelik caydırıcı bir
  uyarı olduğundan kutupluluk yoğunluk 1 düzeyinde düşmanca; 29 Eylül 1922 tarihli Commonwealth Hansard
  okunmadı.
