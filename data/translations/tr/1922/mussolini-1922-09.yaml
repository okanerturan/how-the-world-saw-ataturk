id: mussolini-1922-09
voice: Benito Mussolini
role: >-
  Faşist lider, gazeteci (Il Popolo d'Italia çevresinde yayımlanan makale; 1930'da yeniden basıldı)
quote: Kemal Paşa'nın zaferi, Anadolu toprakları bakımından kesindir.
quote_kind: translated
summary: >-
  Kemal'in Yunanistan karşısındaki zaferini Anadolu için nihai, Fransa'nın Britanya'ya karşı
  silahlandırmasının bir ürünü ve Avrupa'nın kalıcı bir barışa ihtiyaç duyduğuna dair bir ders olarak okur.
caveat: >-
  'La luna crescente' makalesi (yaklaşık 2.000 kelime), Benito Mussolini, Tempi della Rivoluzione Fascista
  (1930), s. 108-110 vd., archive.org TempiDellaRivoluzioneFascista (açık erişim). OCR taramasında 'cbe'
  olarak çıkan kelime 'che' olarak düzeltilmiştir. Taramada orijinal yayın tarihi basılı değildir; Eylül 1922
  tarihi, kapanış satırındaki 'the flames of the burning of Smyrna' ifadesinden çıkarılmıştır. Mussolini'nin
  çerçevesi: Kemal'in İzmir yürüyüşü, Fransa'nın engellenen Ruhr yürüyüşünün 'a sort of compensation' (bir tür
  telafisi) niteliğindedir; 'La morale della vittoria kemalista' ise Avrupa'nın elli yıllık bir barışa ihtiyaç
  duyduğudur. İzmir yalnızca bir tarih işareti olarak anılır; derlemede yangının kendisine dair bir görüş
  kayıtlı değildir. 1928 tarihli mülakat kaydından daha öncedir ve ton olarak ondan farklıdır.
verification_note: >-
  s. 109'da birebir: 'La vittoria di Kemal pascià, è definitiva per ciò che riguarda il territorio anatolico'
  (OCR 'cbe'). Fransız/İngiliz rekabeti okuması ve 'La marcia di Kemal su Smirne è una specie di
  compensazione' ifadeleri s. 108-109'dadır. Tarih: Ihrig'in Türkçe baskısı makaleyi Benito Mussolini, 'La
  luna crescente', Gerarchia 9 (1922): 477-479 olarak kaynak gösterir; Gerarchia sayı 9 Eylül sayısıdır,
  dolayısıyla 1922-09 desteklenmektedir (Opera Omnia XVIII s. 425-27). Araçsal/2 uygun.
