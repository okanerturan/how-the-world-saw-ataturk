quote: Mustafa Kemal Paşa'nın zaferi, Anadolu toprakları bakımından nihaidir.
quote_kind: translated
summary: >-
  Kemal'in Yunanistan karşısındaki zaferini Anadolu için nihai, Fransa'nın Britanya'ya karşı
  silahlandırmasının bir ürünü ve Avrupa'nın kalıcı bir barışa ihtiyaç duyduğuna dair bir ders olarak okur.
caveat: >-
  'La luna crescente' makalesi (yaklaşık 2.000 kelime), Benito Mussolini, Tempi della Rivoluzione Fascista
  (1930), s. 108-110 vd., archive.org TempiDellaRivoluzioneFascista (açık). Çevirisi: 'Mustafa Kemal Paşa'nın
  zaferi, Anadolu toprakları bakımından nihaidir.' OCR 'cbe' olarak basmıştır, 'che' olarak düzeltildi. Özgün
