voice: Mikhail Frunze
role: Ukrayna SSC'nin Ankara olağanüstü temsilcisi, Kızıl Ordu komutanı
quote: Mustafa Kemal'i desteklemek ve onun daima bizim etkimiz altında kalmasına çalışmak
quote_kind: original-turkish
summary: >-
  Veda görüşmesinden önce izlenecek çizgide mutabık kaldı: Kemal'i desteklemek, onu Sovyet etkisi altında
  tutmak, kişisel diktatörlüğünü parti diktatörlüğüne yönlendirmek, reklamını yapmak.
caveat: >-
  Çeviri: 'to support Mustafa Kemal and work to keep him always under our influence'. Bu çizgi Abilov, Frunze
  ve Mikhailov tarafından ortaklaşa kararlaştırılmış ve Abilov tarafından kaydedilmiştir; dolayısıyla Frunze
  üç sesten biridir. Görüşmede Kemal, Meclis'teki grupları ve ordu üzerindeki denetimini anlatmıştır.
  frunze-1921-12-25 kaydından (ilk görüşme) ayrıdır.
