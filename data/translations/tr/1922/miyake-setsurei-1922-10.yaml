voice: Miyake Setsurei
role: Filozof-eleştirmen, Nihon oyobi Nihonjin editörü
quote: >-
  Son zamanlarda Türkiye'deki Kemal'in Yunanistan ile savaşıp İngiltere, Fransa ve İtalya gibi güçlü
  devletlerle müzakere etmesi, yerleşik diplomasi çevrelerinde beklenmedik bir şaşkınlık uyandırmaktadır.
  Türkiye uzun süredir ölüm döşeğindeki ülke diye adlandırılmış ve barış konferansında ölü muamelesi
  görmüşken, şimdi bu ölü dirilmiş ve yeniden güçlü devletlere karşı koyacak noktaya ulaşmıştır.
quote_kind: translated
summary: >-
  Yunanistan ile savaşan ve büyük güçlerle pazarlık eden Kemal'in, 'ölü bir adam' olan Türkiye'yi yeniden
  ayağa kaldırmasına ve diplomasiyi şaşkına çevirmesine hayret eder.
