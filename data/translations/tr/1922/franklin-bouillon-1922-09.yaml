role: 1921 Ankara Antlaşması'nı imzalayan Fransız siyasetçi ve eski bakan
quote: Telgraflaşmamız. karşılıklı dostluğumuz ve bu adamı tanımam beni umutlandırıyor
quote_kind: translated
