id: castro-1997-03-13
voice: Fidel Castro
role: Küba Devlet Başkanı; Türk sağlık bakanının heyetini kabulü, Devrim Sarayı, Havana
quote: >-
  "Atatürk büyük insan, büyük asker İngilizleri nasıl yendi?" durakladı... tekrar; "onları nasıl yendi?" dedi.
  "Asker ve fikir adamı Atatürk önemli insan olarak tarihe geçti."
quote_kind: original-turkish
summary: >-
  İngilizleri mağlup eden büyük bir adam ve büyük bir asker; harf inkılabı anlatıldığında Castro, kendisinin
  böyle bir değişikliği yapamayacağını söylemiştir.
caveat: >-
  Cumhurbaşkanı Demirel'den bir mektup sunan Sağlık Bakanı Yıldırım Aktuna'nın heyetinin 13 Mart 1997,
  22:00–23:50 tarihli kabulü. Harf devrimi konusunda Domaç yalnızca şunu kaydeder: 'Ben [böyle bir] düzen
  değişikliği yapamazdım'. Daha geniş kapsamlı olan 'Bu kadar büyük bir devrim yaptım ama Atatürk'ün
  başardığını başaramadım' sözü, Domaç'ın notlarına değil, Aktuna'nın görüşme sonrasında basına yaptığı
  açıklamaya dayanır (Sabah, 15 Mart 1997; aynı gün Milliyet, s. 19, Havana'dan Hülya Aydoğan imzalı 'Castro,
  irticayı sordu' haberi; burada Castro'nun Atatürk'ün bütün öyküsünü bildiğini ve iki kitabını okuduğunu
  söylediği de eklenir: 'Atatürk, iyi bir komutan ve liderdi. Büyük bir devrim yaptım, ama ben bile Atatürk'ün
  yaptığını yapamazdım'). TBMM tutanaklarında basılan resmî heyet raporu (Dönem 20, c. 35, 10. birleşim, 5
  Kasım 1997, s. 89), Atatürk'ün kişiliği, Kurtuluş Savaşı ve devrimler hakkındaki soru ve
  değerlendirmelerinin 'Türk heyetini çok etkilediğini' doğrular. Daha sonraki ifadeler ('ülkenize düşen bir
  yıldız', 'ölümünden sonra bile ülkesini yöneten tek lider') Vecdet Öz'ün 2020–2023 yıllarındaki sosyal medya
  paylaşımlarından gelmektedir ve 1997 tarihli hiçbir kayıtta yer almaz. Her üç kaynak da Türkçedir; çeviri
  derlemeye aittir.
mediated_by: >-
  Mehmet Domaç (Türk Eczacıları Birliği başkanı), İspanyolca tercüman Mehmet Necati Kutlu'nun aktarımlarından,
