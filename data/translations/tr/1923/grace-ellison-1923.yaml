voice: Grace Ellison
role: İngiliz gazeteci ve yazar, 1922–23 kışında Ankara'da bulundu
quote: >-
  Fiilî başarılarından tamamen ayrı olarak, bugün Türkiye'deki en büyük adam olduğunu anlamak için M. Kemal
  Paşa'yı görmek gerekli değildir.
quote_kind: translated
summary: >-
  Lozan başlarken Ankara'da Mustafa Kemal ile tanıştı ve öğle yemeği yedi; onu Türkiye'deki en büyük adam,
  devlet adamı, asker ve hatip olarak tam bir üstat diye nitelendirdi.
caveat: >-
  An Englishwoman in Angora (Londra: Hutchinson, 1923), böl. XVIII 'The Ghazi Mustapha Kemal Pasha — The
  Greatest Man in Turkey To-day', s. 159 (OCR'daki 'necessarv' düzeltildi); ardından ayrı bir mülakat bölümü
  gelmektedir (s. 174). Arşiv kartındaki, kendi hükümetine meydan okuduğu ve Britanya kamuoyunu değiştirdiği
  yönündeki iddialar burada sınanmamıştır.
verification_note: >-
