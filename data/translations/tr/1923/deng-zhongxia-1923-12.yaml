id: deng-zhongxia-1923-12
voice: Deng Zhongxia
role: Erken dönem Çinli komünist ve işçi hareketi lideri (Zhongguo Qingnian'da yazan)
quote: Türkiye'nin devriminde, Kemal ve diğerlerinin köylülerden gördüğü yardım az değildi.
quote_kind: translated
summary: >-
  Köylülerin devrim yaptığının kanıtı olarak Kemal'in Türk devrimini örnek gösterir: Kemal 've diğerleri'
  köylülerden çok yardım almış, bütün ülke onun peşinden gitmiştir.
caveat: >-
  Zhongguo Qingnian sayı 11, 中夏 imzalı, 29 Aralık 1923 tarihli (Wikisource notu), Wikisource sayfası '論農民運動'
  olarak kaynak gösterilmiştir. 'Köylü Hareketi Üzerine' (论农民运动) başlıklı yazıdan, basitleştirilmiş
  karakterlerle Wikisource transkripsiyonu; sayfa üstbilgisi yazarı 鄧中夏 olarak verir ve notlar alanı
  1923-12-29 tarihini ve özgün yayın yerini (Zhongguo Qingnian sayı 11) belirtir. Yazının ilerleyen
  kısımlarında, serflik olmadığı halde Yunan ordusunu boğazların ötesine sürmek için neden 'bütün ülkenin
  Milliyetçi Parti lideri Kemal'in peşinden gittiğini' sorar: 'neden Türkiye'de de serflik yoktu ama yine de
  bütün ülke ... Kemal'in peşinden gitti'. Kemal yazının konusu değil, bir argümandır; 基玛尔 olarak yazılmıştır.
  Köylü hareketine katılım çağrısı yapan bir argümanda araçsal kullanım.
