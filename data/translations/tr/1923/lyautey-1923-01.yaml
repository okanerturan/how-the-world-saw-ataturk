role: Fransa Mareşali, Fas Mukim Generali
quote: >-
  Mücadelelerinde onlara hayran oldum ve bunu kendilerine bildirdim. Fakat bugün onları anlıyamıyorum
quote_kind: original-turkish
summary: >-
  Berthe Georges-Gaulis'e Kemalistlerin mücadelesine hayran olduğunu ve bunu kendilerine bildirdiğini, ancak
  beş yüzyıllık tarihten kopan insanları artık anlayamadığını söyledi.
caveat: >-
  Gaulis'in yıllar sonra kaydettiği sözlerin Türkçe çevirisi. Çeviri: 'I admired them in their struggle and
  told them so. But today I do not understand them.' Aynı konuşma onların samimiyetini, enerjisini ve askeri
  değerini över, ancak bu tür adamlar için 'grow weak once they succeed' der. PDF metin katmanı Türkçe
  harfleri düşürmektedir ('onlar~~anhyam~yorum' olarak basılı); alıntı sayfadan aslına uygun hale
  getirilmiştir.
