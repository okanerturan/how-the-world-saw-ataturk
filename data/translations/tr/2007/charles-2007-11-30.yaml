id: charles-2007-11-30
voice: Charles, Galler Prensi (sonradan Kral III. Charles)
role: Britanya tahtının varisi; Anıtkabir özel defterindeki yazısı
quote: Burada, mezarı başında Mustafa Kemal Atatürk'e saygılarımı sunmaktan memnuniyet duyuyorum.
quote_kind: translated
summary: >-
  Mezarı başında Atatürk'e saygılarını sunuyor ve barış ile dostluk için Türk-Britanya çalışmalarının süreceği
  sözünü veriyor.
caveat: >-
  2007'de henüz devlet başkanı değildi. İngilizce kaydın iki Türkçe çevirisi birbirinden farklıdır
  (alıntılanan İHA; Milliyet: 'Mustafa Kemal'in mezarında ona saygılarımı sunmaktan mutluluk duyuyorum');
  İngilizce özgün metne ulaşılamadı. Nezaket cümlesinin ötesinde Atatürk hakkında bir değerlendirme yok. Tarih
  Türkçe Wikipedia'nın ziyaretçi listesinden; basın haberlerinde gün belirtilmiyor. İngilizce özgün metin
  yalnızca bir LondonNet kesiti olarak görüldü ('Turkey and Great Britain will continue to' ifadesinden
  sonrası kesik); İHA ve Milliyet iki farklı Türkçe çeviri veriyor. 30 Kasım tarihi muhtemeldir (ayrılış
  günü); bir Getty resim altı yazısı 28 Kasım diyor.
mediated_by: İHA ve Milliyet (iki farklı Türkçe çeviri)
verification_note: >-
  Türkçe metin İHA'da birebir aynı, ancak bir çeviridir: LondonNet tarafından basıldığı şekliyle İngilizce
  özgün metin 'I am pleased to pay homage to Mustafa Kemal Ataturk here by his tomb. Turkey and Great Britain
  will continue to...' şeklindedir (devamı kesik). Türkçedeki 'büyük mutluluk' ve 'huzurunda' ifadeleri
  çevirmene aittir. Milliyet farklı bir Türkçe versiyon veriyor; dolayısıyla ikisi bağımsız çevirilerdir,
  ifadeler için ikinci bir kaynak değildir. Tarih: İHA 'bugün' ayrılacağını söylüyor, LondonNet (30 Kasım)
  ayrılmadan önce imzaladığını belirtiyor, bu nedenle 30 Kasım makul; bir Getty resim altı yazısı 28 Kasım
  diyor (muhtemelen yanlış, Eyüp Camii ziyaretini de aynı güne koyuyor). Düzeltme: alıntıyı İngilizce metinle
  değiştir; 2007-11-30 tarihini muhtemel olarak işaretle.
