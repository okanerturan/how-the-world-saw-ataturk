id: peters-2007
voice: Winston Peters
role: Yeni Zelanda Dışişleri Bakanı (2005–2008; daha sonra Başbakan Yardımcısı)
quote: >-
  uzlaşmanın önünü açan kişi, Gelibolu'da bir tümen komutanı ve daha sonra Türkiye Cumhuriyeti'nin kurucusu
  olan Mustafa Kemal Atatürk'tü.
quote_kind: translated
summary: >-
  Gelibolu'da bir tümen komutanı ve daha sonra Cumhuriyet'in kurucusu olan Atatürk'ün cömert sözlerle
  uzlaşmanın önünü açtığını söyler.
caveat: >-
  O sırada başbakan değildi (hükümetin konuşmasını yapan Dışişleri Bakanıydı). Neredeyse birebir aynı bir
  pasaj Nathan Guy'ın 2012 Gelibolu konuşmasında da yer alır, yani bakanlığın hazır standart metnidir. Anzak
  konuşmacılarının Atatürk'e atfettiği 'Johnnies and Mehmets' / 'your sons are now lying in our bosom'
  metninin kendisi tartışmalıdır: 1934 tarihli bir orijinal bulunamamıştır, metin ilk kez 1953'te İçişleri
  Bakanı Şükrü Kaya'nın hatırası aracılığıyla basılı olarak ortaya çıkmıştır ve 'Johnnies and Mehmets' ibaresi
  1978 tarihli bir Avustralya eklemesidir (bkz. [[Johnnies and Mehmets]]). Dolayısıyla bu, övgüyü ödüllendiren
  bir anma töreni veya diplomatik vesileyle dile getirilmiş, konuşmacının Anzak efsanesindeki Atatürk'e dair
  görüşüdür. Kaynak gösterimi: Anzac Day Dawn Service address, Gallipoli, 25 April 2007.
verification_note: >-
  25 Nisan 2007 tarihli, imza satırında Winston Peters, Foreign Affairs yazan 'ANZAC Day Dawn Service Address,
  Gallipoli' başlıklı Beehive sayfasında birebir aynı. Kendi sözleri ('paved the way for reconciliation',
  'generous words ... will never be forgotten'). Görevi Başbakan değil, Yeni Zelanda Dışişleri Bakanı olarak
  doğru. 'Nathan Guy 2012' hazır metin notu kontrol edilmedi.
