role: Haydarabad (Dekkan) yargıcı, âlim ve şair; Islamic Culture dergisi yazarı
quote: Amansız, kalpsiz — güçlü olmak için, Fırtınalı bir iradeyle uzun adımlarla ilerledi
quote_kind: translated
summary: >-
  Mersiye: düşmüş bir milleti yücelten bir kanun kaçağı, 'amansız, kalpsiz', Avrupa'ya meydan okuyan bir
  kahraman; en karanlık eylemleri Tanrı'nın merhametine bırakılmıştır.
caveat: >-
