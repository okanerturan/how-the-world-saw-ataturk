voice: Ze'ev Jabotinsky
role: Revizyonist Siyonizmin kurucusu
quote: Kemal Paşa da bir keresinde Ermeni azınlıktan kurtulmuştu… onları katlederek.
quote_kind: translated
summary: >-
  Güney Tirol nakli üzerine, Kemal Paşa'yı azınlıklardan kurtulan yöneticiler arasında saydı: Ermenilerden
  katliamla, Rumlardan ise 1923'te sürgünle.
caveat: >-
  Hassas: Ermeni katliamlarının Kemal'e atfı Jabotinsky'ye aittir; kayda geçirilmiştir, benimsenmemiştir.
  Çevirinin çevirisidir. Deneme daha sonra, görünüşe göre Zangwill'in hatırlanan sözleri olarak, 1923
  mübadelesinin faydalı sonuç verdiğine dair bir görüşü aktarır. Kontrol: 1923 mübadelesinin faydalı sonuç
  verdiği görüşü Zangwill'e değil, 1936'da Cenevre'deki bir muhataba ('Ваше Сиятельство') aittir;
  Jabotinsky'nin kendisi ise bunu 'зверским изгнанием' (vahşice sürgün) olarak nitelendirir.
