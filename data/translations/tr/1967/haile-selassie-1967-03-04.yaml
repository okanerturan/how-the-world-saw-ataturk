voice: Haile Selassie
role: Etiyopya İmparatoru; Türkiye'ye devlet ziyareti, Anıtkabir'e çelenk koyma töreni, Ankara
quote: >-
  «Atatürk'ün yapmış olduğu işler karşısında bu çelengin hiç bir önemi yoktur. Ben sadece uzun zaman
  dayanamıyacak çiçekler yerine bunu tercih ettim.» […] «Hayatını vatanına ve milletine vakfetmiş olan Türk
  halkının kurtarıcısı Kemal Atatürk'ün nihaî istirahatgâhını ziyaret ettik. Memleketi için yaptığı hizmetler
  bütün dünya için çok güzel bir örnek teşkil etmiştir.»
quote_kind: original-turkish
summary: >-
  Türk halkının kurtarıcısı, hizmeti bütün dünyaya örnek olan lider; eserlerinin yanında gümüş bir çelengin
  hiçbir anlamı yoktur.
caveat: >-
