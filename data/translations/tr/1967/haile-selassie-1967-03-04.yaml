  plaketinde de Atatürk, "Türkiye'yi modernleştirmek için yaptığı örnek çalışmalarla daima herkesin
  hafızasında yaşayacak olan ve hayatını milletinin menfaatine, asaletine ve refahına vakfetmiş bulunan"
  sözleriyle anılmaktadır. Özel defterdeki yazının özgün dilindeki metni görülmemiştir; Türkiye-Etiyopya
  Dostluk Platformu çelengi ve hediyeleri Ocak 2023'te sergilemiştir. Sayfa görüntüsünden okunmuştur (Milliyet
  abone arşivi).
