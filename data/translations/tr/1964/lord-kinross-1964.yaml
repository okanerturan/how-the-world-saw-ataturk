role: "İngiliz tarihçi; Atatürk: The Rebirth of a Nation (Weidenfeld & Nicolson, 1964)"
quote: >-
  İnsani açıdan Kemal, doğasında sevgi barındırmayan bir adamdı. İnsanları anlardı. Fakat onları sevmezdi. […]
  Kemal, kariyerine, ülkesine ve başka erkeklerin dostluğuna bağlanmış bir adamdı; kadınlar onun için bir
  oyalanma kaynağı, arzularının bir çıkış yolu ve erkeklik gururunu okşayan bir dürtü dışında pek az anlam
  taşırdı. […] Kemal, gururu içinde, sevilmekten hoşlanırdı ve hayatı boyunca duygularını göstermekte ilk
  adımı atan kadınları seçti. Ancak aşırı sevilmeye tahammül edemezdi […]
