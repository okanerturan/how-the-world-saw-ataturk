id: dutch-east-indies-press-1924
voice: Hollanda Doğu Hint Adaları kamuoyu ve basını
role: Hollanda Doğu Hint Adaları'nın Müslüman kamuoyu ve gazeteleri
summary: >-
  Bir tarihçinin yazdığına göre, 1924 sonlarına kadar Doğu Hint Adaları kamuoyu Osmanlı yenilgisiyle
  ilgilenmiyordu ve Kemal'i destekliyordu; basın onun cesaretini övüyordu.
caveat: >-
  Dönemin sözleri değil, bir tarihçinin 2020'de kaleme aldığı bir nitelendirmedir; cümlenin kendine ait bir
  dipnotu yoktur (paragraf s. 129'daki 26 numaralı dipnotla biter, görülmedi), dolayısıyla hangi gazetelere
  dayandığı belirtilmemiştir. Van Bruinessen de (Studia Islamika 1995) aynı şeyi söyler: Kemal'in direniş
  hareketi 'enjoyed widespread sympathy among newspaper-reading Indonesian Muslims'. 18 Kasım 2026'ya kadar bu
  kayıt, Formichi'nin ifadesini sanki basının kendi sözleriymiş gibi aktarıyordu ve kaynak bağlantısı Doğu
  Hint Adaları ile ilgili olmayan, Malaya hakkındaki bir IIUM teziydi. Surabaya toplantısının kendisi için:
  al-islam-congress-committee-1924-10, tjokroaminoto-1924-10.
mediated_by: "Chiara Formichi, Islam and Asia: A History (Cambridge UP, 2020), 4. bölüm, s. 128"
verification_note: >-
  18 Kasım 2026'da bulundu: kayıttaki 'Cambridge chapter', Formichi'nin Islam and Asia kitabının 4. bölümüdür
