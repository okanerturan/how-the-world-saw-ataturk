voice: Refik Halid Karay
role: >-
  Hiciv yazarı, 1919'da Damad Ferid kabinesinin Posta ve Telgraf Umum Müdürü, 1922-1938 yıllarında sürgünde
quote: Mustafa Kemal Paşa'nın rakipleri bu kudrette, bu idrakte adamlardı!
quote_kind: original-turkish
summary: >-
  1919'u hatırlayarak, Kemal'e karşı hükümeti elde tutmaya çalışan İstanbul yetkililerinin sınırlı kudret ve
  kavrayışta insanlar olduğunu söyler.
caveat: >-
  Türkçe özgün metin; Minelbab İlelmihrab ilk olarak 1924'te tefrika edilmiş (baskı notuna göre) ve 1964'te
  notlarla kitap halinde yayımlanmıştır (buradaki metin bunu belirten 2009 İnkılâp baskısıdır). Karay, Sivas
  Kongresi'nden önceki haftalarda İstanbul'u anlatır ve bu cümle Kemal hakkında bir yargı değil, İstanbul
  tarafı hakkındadır. O sırada İstanbul'da bir nazırın memuruydu ve bu anlamda Kemal'in rakibiydi; 1922'de
  Ankara hükümeti tarafından sürgüne gönderildi ve 1938'de dönmesine izin verildi. OCR pasajı varak 282-283
  civarına yerleştirir; kesin sayfa belirli değildir. Geçerken değinilen bir görüş, yoğunluk düzeyi 1'de
  tutuldu. Kontrolde tarihlendirildi: Minelbab İlelmihrab 1924 başlarından itibaren Akşam'da tefrika
  edilmiştir (10.1.1924 tarihli telgraf; 'Lübnan-3 Şubat 1924'); 1964, sonradan eklenen notları içeren kitap
  baskısıdır. Sayfa 283.
