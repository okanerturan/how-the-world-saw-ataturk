id: vahideddin-1924
voice: VI. Mehmed Vahideddin
role: Son Osmanlı Padişahı, San Remo'da sürgünde; Şerif Paşa'nın tuttuğu notlar
quote: >-
  Bildiğiniz gibi Mustafa Kemal Paşa'yı Anadolu'ya biz gönderdik ve o açık bir şekilde bize isyan etti.
quote_kind: original-turkish
summary: >-
  Kemal'in Anadolu'ya saray tarafından gönderildiğini ve açıkça isyan ettiğini; ne Damad Ferid'in ne de Tevfik
  Paşa'nın onu hizaya getirebildiğini söyler.
caveat: >-
  Bardakçı'nın belgeler bölümündeki Belge 2: San Remo'daki özel görüşmelere (1924-25) dair Şerif Paşa'nın
  Fransızca kaydının bazı kısımlarının Türkçe çevirisi; yıl, bu aralığın başlangıcıdır. Aynı notlar Kemal'in
  'farklı rollerini' (hareketin başında kalmak için ülke savunmasının arkasına saklanmak, saraya karşı
  propaganda yürütmek, sarayı yabancı para almakla suçlamak) sıralar ve bu suçlamaları 'yalanlar' olarak
  nitelendirir. Bardakçı cümleyi metin içinde de (s. 215) biraz farklı sözcüklerle 'hatıralarından' diyerek
  alıntılar. Padişah'ın kendi metni değil, bir saray mensubunun kaydıdır; Belge 2'nin kitaptaki sayfa numarası
  OCR'da okunamamaktadır.
mediated_by: >-
  Şerif Paşa'nın Vahideddin ile görüşmelerine dair Fransızca notları (1924-25) ← Bardakçı 2006, Belge 2
