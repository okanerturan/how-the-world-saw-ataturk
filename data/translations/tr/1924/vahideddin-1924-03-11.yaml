id: vahideddin-1924-03-11
voice: VI. Mehmed Vahideddin
role: Son Osmanlı Padişahı, San Remo'da sürgünde; Mısır uleması başkanına mektup
quote: >-
  Mustafa Kemal ve hempaları Müslümanlar'ın sevgisi, Osmanlılar'ın şehameti ve Allah'ın inayetiyle Yunanlılara
  galip geldi
quote_kind: original-turkish
summary: >-
  Hilafetin kaldırılmasının ardından, Kemal ve arkadaşlarının Müslümanların sevgisiyle Yunanlılara galip
  geldiğini, sonra da şeriata cephe aldığını söyler.
caveat: >-
  Mısır Ulema Birliği başkanı Sheikh Muhammad Farraj al-Minyawi'ye yazılmış (muhtemelen Arapça) bir mektubun
  Bardakçı tarafından yapılan Türkçe çevirisi. Cümle ('(...ama)' işaretiyle) şöyle devam eder: 'fakat bunun
  kaynağı olan şeriata derhal karşı çıktılar'. OCR'da kısmen bozulmuş olan sonraki satırlar peçenin
  kaldırılmasını, bar ve kafelerde kadınları, Müslüman-Hristiyan evliliğine izin verilmesini, çok eşliliğin
  kaldırılmasını, haccın 'bir bahane' haline getirilmesini ve Kemal'in 'hilafeti ve Âl-i Osman'ı
  aşağıladığını' sıralar. Vahideddin'in kendi şikâyet listesidir; arşiv bunu onaylamaz. Alıntı: s. 377 (OCR
  varak).
mediated_by: Vahideddin'in 11 Mart 1924 tarihli mektubu ← Bardakçı 2006
