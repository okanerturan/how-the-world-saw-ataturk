  hilafet-saltanat ayriligini Turk idaresini islah etmek icin ortaya atmis degildir.' Bir sonraki paragraftaki
  'two aims' (Kemal'in saltanatı zorla alması; gerçek niyeti gizlemek) ihtirazi kayıtla örtüşüyor. Tarih: Kara
  dipnot 39 Beyrut, Matbaatu'l-Abbasiye, 1342 h. (1924) bilgisini verir; Arapça kapakta 1342 yazar (Türkçe iç
