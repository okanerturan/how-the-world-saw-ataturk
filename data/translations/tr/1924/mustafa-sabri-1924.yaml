id: mustafa-sabri-1924
voice: Mustafa Sabri Efendi
role: Son Osmanlı Şeyhülislamı, Beyrut ve Kahire'de sürgünde
quote: >-
  Çünkü Mustafa Kemal hilafet-saltanat ayrılığını Türk idaresini ıslah etmek için ortaya atmış değildir.
quote_kind: original-turkish
summary: >-
  Kemal'in hilafeti saltanattan Türk yönetimini ıslah etmek için değil, iktidarı kendi eline almak için
  ayırdığını ileri sürer.
caveat: >-
  Cildin çevirmeninin yaptığı Türkçe çeviriden alıntılanmıştır (Arapça özgün metin okunmamıştır); OCR'da
  'aynlığmı' olarak geçen kelime 'ayrılığını' şeklinde okunmuştur. Bir sonraki paragraf Kemalistlerin 'only
  two aims' olduğunu söyler: birincisi, saltanatı Osmanlı hanedanından zorla alıp Mustafa Kemal'e devretmek ve
  hilafeti ondan ayırmak; Meclis'e devir ise 'nothing other than hiding the real intent' idi. Kara kitabı
  1923'e tarihlendirir; ilk olarak 1 Receb 1342 / 7 Şubat 1924'te tamamlanmış, hilafetin kaldırılmasının
  ardından 20 Mart 1924 tarihli 15 sayfalık bir ek konulmuştur. Sabri'nin kendi yargısıdır; arşiv bunu
  onaylamaz. Editörün sayfa numaralandırmasına göre cildin s. 405'inde listelenen risale 59 ('Hilafetin
  Saltanattan Tefriki') olarak atıf yapılmıştır; basılı yaprak numarası OCR'da okunamamaktadır (archive.org
  taraması, PDF s. 403-405). Kontrol: risale 59 PDF s. 395'te başlar; alıntı PDF s. 405'tedir. Sabri, daha
  önce al-Mukattam ve al-Ahram'da yazdıklarını tekrarladığını söyler.
mediated_by: İsmail Kara (ed.), Hilafet Risaleleri 6 (2014) içinde Özgür Kavak'ın Türkçe çevirisi
verification_note: >-
