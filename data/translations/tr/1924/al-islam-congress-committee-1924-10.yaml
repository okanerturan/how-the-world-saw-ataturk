id: al-islam-congress-committee-1924-10
voice: Al-Islam Kongresi Daimi Komitesi
role: >-
  1924 başlarında (muhtemelen Mayıs 1924'teki Garut kongresinde) seçilen El-İslam Kongresi daimi komitesi
summary: >-
  Ekim 1924'teki Surabaya hilafet toplantısından Mustafa Kemal'i halife adayı göstermesini istedi; toplantı
  kimseyi aday göstermedi ve halifelik makamını Mekke olarak belirledi.
caveat: >-
  Yalnızca van Bruinessen'in aktarımından bilinmektedir; bu anlatım görünüşe göre Hollandalı danışmanın
  raporuna dayanmaktadır (dipnotu raporu yalnızca Tjokroaminoto'nun açılış konuşmasıyla ilişkilendirir);
  mektubun sözleri verilmemiştir. Teklifi, birçok Endonezyalının Türkiye'ye yönelik tutumunun belki de tipik
  bir örneği olarak nitelendirir. Tjokroaminoto'nun buna cevabı tjokroaminoto-1924-10 kaydındadır.
mediated_by: >-
  Martin van Bruinessen, 'Muslims of the Dutch East Indies and the Caliphate Question', Studia Islamika 2(3),
  1995 ← görünüşe göre R.A. Kern'in toplantı hakkında genel valiye sunduğu rapor, 23 Ekim 1924
  ('Kalifaatsaktie', KITLV, Kern koleksiyonu H 797 sayı 316)
verification_note: >-
  Makale: 'elected earlier that year' [o yılın başlarında seçilen] daimi komite, 'sent a letter to the
  Surabaya meeting requesting it to nominate Mustafa Kemal as the new caliph' [Surabaya toplantısına Mustafa
  Kemal'i yeni halife olarak aday göstermesini talep eden bir mektup gönderdi]. Garut'ta seçilmiş olduğu bir
  çıkarımdır: Garut (Mayıs 1924), makalede 1924 yılının Ekim ayından önceki tek kongredir. 18 Kasım 2026'da
  yalnızca makaleden girilmiştir; Kern'in raporu görülmemiştir. İkinci bir okuyucu 18 Kasım 2026'da kaynağı
  yeniden okudu; Garut tarihi ve Kern atfı artık çıkarım olarak işaretlendi ve 'chose Mecca instead' [bunun
  yerine Mekke'yi seçti] ifadesi düzeltildi (toplantı hiçbir aday göstermemiştir).
