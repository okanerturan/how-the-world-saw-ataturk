id: irfan-orga-1950
voice: İrfan Orga
role: >-
  İngiltere'de yaşayan Türk hava subayı ve yazar; Atatürk'le tanışmasını anlatan bir anı kitabı olan Portrait
  of a Turkish Family (1950)
quote: >-
  O zayıf, fanatik yüzün, düşmanlarının bile ona pek çok şeyi bağışlamasını sağlayan göz kamaştırıcı bir
  gülümsemeyle nasıl aydınlanabildiğini ve daha sık olarak, gözler karanlık, kasvetli ve meydan okur halde
  kalırken birbirine bastırılmış dudakların nasıl gülümsediğini hatırladım. […] o kadar aniden yumuşayabilen
  sert gözleri, omuza konan sıcak karşılayıcı eli ve eğlenen, sert sesiyle 'Ee, Teğmen, hâlâ Hava
  Kuvvetleri'ni yönetiyor musun?' diyen uzun boylu, haşin lider. Resmi vesilelerle etrafındaki törensizlik
  belki de onun sabırsız, otokratik mizacına pek uygun değildi, ama bazen sadelik takındığı olurdu.
quote_kind: translated
summary: >-
  Göz kamaştırıcı bir gülümsemeye ve 'sabırsız, otokratik bir mizaca' sahip 'zayıf, fanatik bir yüz';
  kendisiyle tanışmış olan Orga, 'sanki bir dost gitmiş gibi' yas tutmuştu.
caveat: >-
  28. Bölüm, Kasım 1938 üzerine; Eland baskısının sayfa numarası bulunmayan dijitalleştirilmiş metninden
  okunmuştur. Daha sonraki Atatürk kitabı (Margarete Orga ile birlikte, Michael Joseph, 1962), Ateş Orga'nın
  sonsözüne göre, 'Atatürk'ün karakterini betimlemek için kullanılan sözler' ('the words used to describe
  Ataturk's character') nedeniyle Türkiye Büyükelçiliği'nin protestosuna yol açmıştır (Evening Standard, Ocak
  1962).
