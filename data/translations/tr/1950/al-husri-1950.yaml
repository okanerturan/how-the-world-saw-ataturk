voice: Sati' al-Husri
role: Arap milliyetçisi kuramcı, eski Osmanlı eğitimcisi
quote: >-
  İşgalcileri Türk vilayetlerinden çıkardıktan sonra Arap vilayetlerini geri almaya tamah etmemekle bilgelik
  ve incelik gösterdiğine şüphe yoktur.
quote_kind: translated
summary: >-
  Hifni Mahmud Paşa'ya itirazla: Kemal etkin milliyetçilikle, dil ve tarihe dayalı bir Türk devletiyle ve Arap
  vilayetlerinden bilgece vazgeçerek başarılı oldu.
caveat: >-
  Hifni Mahmud Paşa'nın al-Musawwar'daki yazısına (tarih OCR'da bozulmuş, yakl. Mart 1950) yanıt olan
  'Al-istishhad bi-tarikh al-Atrak', Ara' wa ahadith fi al-qawmiyya al-'arabiyya (1951; 1985 yeniden basım)
  içinde, s. 79–82, alıntı s. 81; Arapça OCR, noktalama işaretleri standartlaştırıldı. Arap birliğini savunmak
  için Kemal'i örnek gösterir.
verification_note: >-
