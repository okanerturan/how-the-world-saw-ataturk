  mübadelesi) hareket ederek 'قطع على الاستعمار طريق الفتن والدسائس' dediğini ve homojen bir Türk devleti
  istediğini belirtiyor. Dipnot al-Musawwar yazısını 1 Mart olarak tarihliyor (yıl OCR'da bozulmuş, '1460' ≈
