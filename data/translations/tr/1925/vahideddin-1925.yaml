id: vahideddin-1925
voice: VI. Mehmed Vahideddin
role: Son Osmanlı Padişahı, San Remo'da sürgünde; başyaveri Avni Paşa'ya yazdırdığı hatırat
quote: >-
  Ertesi gün Mustafa Kemal'in şahsımız ve hanedanımız aleyhinde tefevvühâtını gazetelerde görünce, benim de
  karar verecek zamanım geldi.
quote_kind: original-turkish
summary: >-
  Yazdırdığı hatıratında, Kemal'in kendisi ve hanedanı aleyhindeki saldırıları gazetelerde çıkınca karar verme
  zamanının geldiğini hatırlar.
caveat: >-
  Türkçe özgün metin (Osmanlı üslubu). Belge 1, 'Sultan Vahideddin'in Hatıraları (1925)', San Remo'da Avni
  Paşa'ya dikte ettirilmiş ve yarım kalmıştır; ilk dört paragraf Padişah'ın kendi el yazısı, geri kalanı
  Avni'ninkidir. Bardakçı bazı ifadeleri çıkarmıştır (noktalarla işaretlenmiştir); örneğin Anadolu'ya
  gönderdiği yaver olarak Kemal hakkındaki cümle ('...Mustafa Kemal'in ..... karşısında kalmıştım'). Pasaj,
  bir ziyaretçinin Ankara'yı tanıması halinde kendisine yetkileri kısıtlanmış bir hilafet teklif ettiği
  görüşmenin ertesi gününü anlatır; olayların akışı bunu Kasım 1922'deki ayrılışından hemen öncesine
  yerleştirir (OCR o kısımda bozuktur). Belge 1'in sayfa numarası OCR'da okunamamaktadır.
