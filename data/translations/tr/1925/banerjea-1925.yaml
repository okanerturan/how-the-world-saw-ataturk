id: banerjea-1925
voice: Surendranath Banerjea
role: Ilımlı Hint milliyetçisi, eski Bengal bakanı
quote: >-
  Bu artık, Hindistan Hükümeti'nin Hindistan'daki kamuoyunca desteklenen ve Mustafa Kemal Paşa'nın askeri
  zaferleriyle pekiştirilen ısrarı sayesinde büyük ölçüde başarılmıştır.
quote_kind: translated
summary: >-
  Hilafet meselesinin çözümünü kısmen, Hint kamuoyunu pekiştiren 'Mustafa Kemal Paşa'nın askeri zaferleri'ne
  bağlar.
caveat: >-
  A Nation in Making (Oxford, 1925), 31. bölüm, taranmış kitabın Wikisource transkripsiyonu (Page:A Nation in
  Making.djvu/314, basılı s. 298 ve devamı). Banerjea, 1919'da Hilafet sorunu üzerine bir Müslüman
  toplantısına başkanlık ettiğini yazar ve Sevr revizyonunu kısmen Kemal'in ordusunun bir zaferi olarak
  değerlendirir; Kemal hakkında kişisel bir değerlendirme yoktur. Tarama incelenmedi.
verification_note: >-
