quote: Sarhoşluk âlemlerine engel olması dışında onu kınayabileceği hiçbir şey de yoktu
quote_kind: translated
summary: >-
  Türklerin bir millet olarak varlıklarını Gazi'ye borçlu olduklarını söyler, ancak terörden ve keyfi bir
  mahkemeden söz eder ve içkiyle ilgili bir karalamayı tekrarlar.
caveat: >-
  Clare Sheridan, A Turkish Kaleidoscope (Londra: Duckworth, 1926), 'Civilisation Revealed' bölümü, s. 215;
  Mustafa Kemal'in Latife Hanım'dan boşanması hakkında (Ocak 1925; Sheridan'ın metni boşanmanın 'just'
  gerçekleştiğini söyler). Aynı bölüm, s. 214: 'The Turkish people are easily led; and they owe to their Ghazi
  the fact of their existence to-day as a nation.' ve 'Terror reigns, and the Tribunal of Independence is as
  arbitrary as the Cheka.' Bölüm, İnebolu şapka nutkunu (24 Ağustos 1925) Cumhuriyet'in 29 Ağustos 1925
  tarihli Fransızca nüshasından aktarır ve nutkun gerekçelendirmesini ('we will, if necessary, sacrifice human
  lives') 'no one is able to explain' diye nitelendirir. Tarih, ayrılışının arifesinde yazılan bölüme aittir;
  kitap 1926'da yayımlanmıştır. 'orgies of drunkenness' ifadesi kendisinin kaynaksız dedikodusudur; gerçek
  olarak değil, Batı bulvar basını bakışının bir kaydı olarak tutulmuştur. Ayrıca s. 133: 'During the life of
  Mustapha Kemal Pasha, yes' (Ankara başkent kalacaktır).
