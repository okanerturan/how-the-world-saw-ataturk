id: shant-1925
voice: Levon Shant
role: Ermeni oyun yazarı, Taşnak lideri ve eğitimci
quote: >-
  Yani eski Türkler ve yeni Türkler; sonuncular dün İttihatçı diye anılıyordu, bugün Kemalist; yarın, hizip
  kıskançlığı Kemal'i de devirdiğinde, yeni bir adla meydana inecekler.
quote_kind: translated
summary: >-
  Kemalistleri İttihatçıların ardılları olan yeni Batılılaşmış Türkler olarak okur; kıskançlık Kemal'i
  devirdiğinde başka bir ad altında geri dönmelerini bekler.
caveat: >-
  'Մեր անկախութիւնը' ('Bağımsızlığımız'); Wikisource üstbilgisi yılı 1925 olarak verir. Hassas konu (Ermeni
  soykırımı hafızası): Shant'ın siyasi analizi; burada Kemalist olaylar İttihatçı ruh halinin meyveleri olarak
  'Ermeni katliamları'ndan sonra sıralanır. Kutupluluk açık bir hakaretten değil, pasajın bütününden (kuşkucu
  süreklilik tezi) okunmuştur. Çeviri arşive aittir. Tarama incelenmedi. Kontrol: cümle, Kemal hakkında açık
  bir yargı içermeyen eski ve yeni Türkler tipolojisidir; kutupluluk düşmanca → ikircikli ve okuma
  konuşmacının çerçevelemesidir.
verification_note: >-
  Alıntı birebir aynı, çeviri sadık, 1925 yılı üstbilgiden. 'Düşmanca' kutupluluğu kaydın çıkarımıdır (çekince
