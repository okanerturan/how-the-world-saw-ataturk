voice: Le Corbusier
role: İsviçreli-Fransız mimar ve yazar
quote: >-
  Ve daha bugünden karşımızda Ankara ve Mustafa Kemal anıtı var! Olaylar hızla gelişiyor. Zarlar atıldı:
  asırlık bir uygarlık daha yıkıma gidiyor.
quote_kind: translated
summary: >-
