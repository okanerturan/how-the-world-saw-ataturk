  oireachtas.ie üzerindeki resmi tutanak etkileşimli bir insan doğrulaması kontrolünün arkasında yer
  aldığından açılmadı; dolayısıyla kanıt düzeyi S. Veri kümesindeki diğer Dáil sonuçları bir görüş
  belirtmemektedir: Lynch 1973 ve Ahern 2003 (bir çelenk), 'the war of the oil owners against Kemal Pasha'
  savaşında çarpışmayı reddetmek üzerine 1922 tarihli bir konuşma (veri kümesinde şüpheli biçimde Cosgrave'e
