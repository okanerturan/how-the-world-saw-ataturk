id: john-m-kelly-1983-11-30
voice: John M. Kelly
role: Dublin South-Central Fine Gael Milletvekili (TD), anayasa hukukçusu ve eski Başsavcı
quote: >-
  Türkler, büyük liderleri Atatürk'ün gözünde, Avrupa'ya kültürel ve ekonomik bakımdan kenarda kalmış olmanın
  dezavantajları altındaydı. Onlara dilleri için kullandıkları Arap yazısını kaldırıp attırdı, peçelerini ve
  feslerini kaldırıp attırdı, Batı Avrupalılar gibi giyinmelerini sağladı. Sanırım bu, insanlara yapılacak
  acımasızca bir şeydi.
quote_kind: translated
summary: >-
  Türkiye'nin 'büyük lideri', ülkenin kenarda kalmışlığına son vermek için zorla Batılılaştırma uyguladı:
  yazı, peçe ve fes kaldırılıp atıldı; 'insanlara yapılacak acımasızca bir şey'.
caveat: >-
