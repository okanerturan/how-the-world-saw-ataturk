  gösterir; yani Türk-Amerikan lobisi tarafından sağlanan bir şablondur; bir görüş olmasının yanı sıra bir
  nezaket metnidir. Kaynak: Extensions of Remarks (Temsilciler Meclisi), 22 Mayıs 2008, 'Commemorating May 19
