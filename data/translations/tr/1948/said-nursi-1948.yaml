voice: Said Nursi
role: İslam âlimi, Nur hareketinin kurucusu
quote: Bu kahraman hocayı burada bulundurmamız lazım!
quote_kind: translated
summary: >-
  Afyon Cezaevi'nden yazdığı bir mektupta, savaş dönemindeki kendi hizmetinin kanıtı olarak Mustafa Kemal'in
  Ankara'ya gelmesi için iki kez şifreyle gönderdiği talepleri aktarır.
caveat: >-
  Nursi'nin kendi mektubu, ancak alıntılanan cümle Mustafa Kemal'in kendisine söylediğini belirttiği sözdür;
  dolayısıyla bağımsız bir kaydı değil, Nursi'nin bu ilişkiyi nasıl sunmayı seçtiğini gösterir. Çıkarımla
  belirlenen tarih: Vahide mektubu Nursi Afyon Cezaevi'ndeyken (1948–49) bir 29 Ekim Cumhuriyet Bayramı'na
  yerleştirir ki bu da geriye yalnızca 29 Ekim 1948'i bırakır. Hareket kaynaklı barındırma; barındırılan
  metnin baskı künyesi doğrulanmamıştır. Mevcut 1923 kaydından (Ankara'daki yüzleşme) ayrıdır. Nursi'nin
  'abominable current of atheism' pasajı (Lem'alar s. 170, Flashes s. 233) Atatürk'ün adını anmaz ve
  kaydedilmemiştir. Çıkarımla belirlenen tarih: yaklaşık 29 Ekim 1948, Afyon tutukluluğu sırasındaki tek
  Cumhuriyet Bayramı (tutuklanma 23 Ocak 1948, yeniden yargılama başlangıcı 31 Ağustos 1949).
