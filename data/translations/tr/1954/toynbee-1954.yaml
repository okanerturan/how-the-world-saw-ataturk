role: Britanyalı tarihçi, A Study of History
quote: >-
  Gazi Mustafa Kemal Atatürk'ün siyasi dehasının en belirgin kanıtlarından biri, şunu açıkça kavramasıydı: bu
  Yeni Turan serabının peşinde hayalperest bir arayış
