voice: Josip Broz Tito
role: >-
  Yugoslavya Devlet Başkanı; resmî ziyareti sırasında Cumhurbaşkanı Bayar'ın verdiği akşam yemeğinde kadeh
  kaldırırken yaptığı cevabî konuşma, Çankaya, Ankara
quote: >-
  Türkiyenin hükûmet merkezinde bulunmaktan derin bir memnunluk duymaktayım. Bu Türk milletinin büyük,
  Atatürkün efsanevî şahsiyeti hatırasından mülhem olan kuvvetinin ve canlı millî şuurunun vakur bir
  ifadesidir.
quote_kind: original-turkish
summary: >-
  Atatürk'ün 'efsanevî şahsiyeti'nin hatırasından ilham alan millî bir kudretin vakur ifadesi olarak Ankara.
caveat: >-
  Karşılık olarak yaptığı kadeh konuşmasının açılış satırları; geri kalanı Yugoslav sempatisi, Ankara Paktı ve
  Balkan barışı hakkındadır. Sayfada 'büyük' kelimesinden sonra virgül basılmıştır ('büyük, Atatürkün'),
  dolayısıyla 'büyük' sıfatı milletin kudretiyle birlikte okunmaktadır; eğer virgül bir dizgi hatasıysa ibare
  'büyük Atatürk' olur. Aynı gün Anıtkabir'e çelenk koydu (Milliyet s. 1); herhangi bir özel defter yazısı
  basılmamıştır. Özgün metin (Borba / Politika, 14 Nisan 1954; Govori i članci c. IX) görülmedi. Anıtkabir
  özel defteri yazısına atfedilen ve Instagram'da paylaşılan 'Sizi hayatım boyunca daima ilham kaynağı olarak
  yaşattım' sözünün kaynağı yoktur. Sayfa görüntüsünden okundu (Milliyet abone arşivi).
