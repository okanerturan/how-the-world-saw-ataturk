quote: >-
  Türkiyenin hükûmet merkezinde bulunmaktan derin bir memnunluk duymaktayım. Bu Türk milletinin büyük
  Atatürkün efsanevî şahsiyeti hatırasından mülhem olan kuvvetinin ve canlı millî şuurunun vakur bir
  ifadesidir.
quote_kind: original-turkish
summary: >-
  'Büyük Atatürk'ün efsanevi kişiliğinin' hatırasından ilham alan ulusal bir gücün vakur ifadesi olarak Ankara.
caveat: >-
  Cevabî kadeh konuşmasının açılış satırları; devamı Yugoslav sempatisi, Ankara Paktı ve Balkan barışı
  hakkındadır. Aynı gün Anıtkabir'e çelenk koydu (Milliyet s. 1); herhangi bir defter yazısı basılmamıştır.
  Özgün Sırpça-Hırvatça metin (Borba / Politika, 14 Nisan 1954; Govori i članci c. IX) görülmedi. Anıtkabir
  defterindeki yazısına atfedilen Instagram'daki 'Sizi hayatım boyunca daima ilham kaynağı olarak yaşattım'
  sözünün kaynağı yoktur. Sayfa görüntüsünden okundu (Milliyet'in abonelere açık arşivi).
