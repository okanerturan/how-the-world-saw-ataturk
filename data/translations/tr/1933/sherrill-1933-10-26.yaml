voice: Charles H. Sherrill
role: >-
  ABD'nin Türkiye büyükelçisi (1932–33), emekli general; A Year's Embassy to Mustafa Kemal (1934) kitabının
  yazarı
quote: bugün dünyanın iki büyük lideri
quote_kind: translated
summary: >-
  Kemal ile bir yıl süren görüşmelerin ardından Mussolini ve Kemal Paşa'yı dünyanın iki büyük lideri olarak
  nitelendirdi; kitabı Kemal'i Musa'ya benzetti.
caveat: >-
  Kitabın İngilizce aslı (Scribner 1934) HathiTrust'ta (uc1.$b57581) yalnızca arama yapılabilir durumdadır ve
  okunmamıştır. Alıntı kitapta değil, dönüşünde yaptığı açıklamaya dair Brisbane'in haberinde yer alır. Musa,
  kalp ve başkentin Ankara'ya taşınması pasajları yalnızca Özdemir'in Türkçe alıntısından okunmuştur, örn. s.
  77: 'Mustafa Kemal aynı zamanda büyük bir kalp adamı olduğunu da ispat ediyordu' [İngilizce çevirisi:
  Mustafa Kemal was proving at the same time that he was a man of great heart]. Birinci elden tanıklık: Kemal
  onun için Ankara ve Yalova'da kroki haritalar çizmiştir (Özdemir s. 78–79). Washington Post'un 28 Ekim 1933
  tarihli bir başyazısı da onun, Kemal'in 'has a splendid army and uses it as an instrument for peace'
  (gazetenin ifadeleri) yönündeki görüşünü aktarır.
