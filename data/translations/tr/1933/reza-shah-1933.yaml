role: İran Şahı
quote: >-
  Sizin söylediğinize göre Gazi Hazretleri benimle görüşmek istemektedirler. Bende kendileri ile görüşmeyi son
  derece arzu etmekteyim.
quote_kind: original-turkish
summary: >-
