id: sabahattin-ali-1933-04-14
voice: Sabahattin Ali
role: Türk romancı ve şair; Konya Hapishanesi'nde tutuklu Almanca öğretmeni
quote: >-
  Beni en çok üzen yediğim ceza değil, sizin büyük isminizin şahsî intikam vasıtası olarak kullanılabilmesi ve
  buna müsamaha edilmesi keyfiyetidir.
quote_kind: original-turkish
summary: >-
  Gazi'ye hakaret ettiği söylenen bir şiir yüzünden hapse atılınca ona mektup yazarak suçlamayı reddeder,
  büyük isminin şahsi intikama alet edilmesinden üzüntü duyduğunu belirtir ve af diler.
caveat: >-
  ÇEVİRİ (bu kaydın): 'What grieves me most is not the sentence I received, but that your great name could be
  used as an instrument of personal revenge, and that this is tolerated.' 'Reisicumhur Gazi Mustafa Kemal
  Hazretlerine' başlıklı, '14- IV - 1933' tarihli, 'Konya Hapisanesinde mevkuf, Konya Muhtelit Ortamektep
  almanca muallimi Sabahattin Ali' imzalı, damga pullu, kalem kayıtlı ve 'Cumhurbaşkanlığı Arşivi' damgalı
  daktilo dilekçe. Tıpkıbasımdan (Wikimedia Commons, kaynak 10 Ağustos 2018 tarihli bir Habertürk görseli
  olarak verilmiş) ve tashih edilmiş tr.wikisource transkripsiyonundan (kalite düzeyi 4) okunmuştur; ikisi
  birbiriyle uyuşmaktadır. Bir şiirde Cumhurbaşkanı'na 'implicitly and allusively insulting' suçundan bir
  yıllık hapis cezasını çekiyordu; önce kendisine inanılmasını ('Ben böyle bir şey yapmadım'), ardından af
  ('Beni affedecek kadar büyük ve iyi kalpli olduğunuzdan eminim') talep eder. Af dilekçesi içinde övgü
  niteliğindedir, bu nedenle araçsaldır (instrumental). Kemal'in yanıt verip vermediği burada tespit
  edilmemiştir (1933 affıyla serbest bırakılması M katmanıdır, doğrulanmamıştır). Şiirin kendisi
  bulunamamıştır.
