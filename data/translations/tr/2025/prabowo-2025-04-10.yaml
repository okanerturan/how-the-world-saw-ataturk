voice: Prabowo Subianto
role: Endonezya Cumhurbaşkanı
quote: >-
  Cakarta'daki ofisime gelirseniz, Cakarta'daki evime gelirseniz, ofisimde, evimde bir Mustafa Kemal Atatürk
  heykeli vardır. Bizim için, yalnızca Endonezya'dan söz etmiyorum, Küresel Güney'de, gelişmekte olan
  ülkelerde, Mustafa Kemal Atatürk bir ikondur, bir cesaret örneği, liderlik örneği, vatanseverlik örneği,
  teslim olmayı bilmeyen bir ruh örneğidir.
quote_kind: translated
summary: >-
  Türkiye parlamentosuna Atatürk'ün gençlik kahramanı olduğunu söyler, ofisinde ve evinde onun heykelini
  bulundurur ve onu Küresel Güney'in cesaret ikonu olarak adlandırır.
caveat: >-
  Resmî Endonezce tutanak, Sekretariat Negara (setneg.go.id), 'Pidato Kenegaraan Presiden di Hadapan Parlemen
  Turki', 10 Nisan 2025, tamamı okundu. Aynı pasajda ayrıca 'sebagai anak muda pahlawan saya, ikon saya adalah
  Mustafa Kemal Atatürk dan Mehmed Sang Penakluk' denmektedir; Atatürk'ü II. Mehmed ile eşleştirir ve
  Türkiye'yi Osmanlıların devamı olarak nitelendirir. AA English bunu 'My hero, my icon was Mustafa Kemal
  Ataturk along with Ottoman Sultan Mehmed II' biçiminde aktarır. BBC Indonesia (16 Nisan 2025), AKP
  çoğunluklu bir parlamento önünde Atatürk'ün övülmesi üzerine çıkan sosyal medya tartışmasını haberleştirir.
