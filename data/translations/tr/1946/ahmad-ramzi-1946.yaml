id: ahmad-ramzi-1946
voice: Ahmad Ramzi
role: al-Risala yazarı, Ahmad Ramzi Bey imzalı, Türkiye'de yedi yıl ikamet etmiş
quote: >-
  Zira o, Doğu'da uzun bir düşüncenin ardından harekete geçen ve eylemlerini ilk fikirlerine tabi kılan az
  sayıdaki kişilerden biridir.
quote_kind: translated
summary: >-
  Gazi'yi Doğu'da uzun uzadıya düşündükten sonra harekete geçen az sayıdaki kişiden biri olarak görür;
  yazısını onun 'şaşkın ruhu'nun açıklığa kavuşacağı öngörüsüyle bitirir.
caveat: >-
  al-Risala sayı 698, 18 Kasım 1946, Wikisource sayfası 'مجلة الرسالة/العدد 698/الغازي مصطفى كمال' olarak
  kaynak gösterilmiştir. Ahmad Ramzi Bey imzalı ('Bu sözleri Türkiye'de yedi yıl kaldıktan sonra yazıyorum'),
  'Gazi Mustafa Kemal: onu liderliğe götüren psikolojik saiklerin incelenmesi ve tahlili' başlıklı yazının ilk
  bölümü. Bölümün kapanış satırı, kelimesi kelimesine: 'Mustafa Kemal de yalnızca [iman yolundan ayrılıp ona
  geri dönecek olan] bunlardan biridir; günler onun şaşkın ruhuna dair pek çok şeyi ortaya çıkaracaktır'.
  Ramzi ayrıca Kont Sforza'nın 'Türk lideri Mustafa Kemal' başlıklı denemesini sayı 836-838'de (Temmuz 1949)
  çevirmiştir — Khalil Mutran'ın yazdığından şüphelenilen metin; Sforza arşivde zaten ayrı bir sestir (1931).
  'Ahmad Ramzi Bey'in kimliği metnin ötesinde tespit edilememiştir. Din: konuşmacının çerçevelemesi olarak
  aktarılmıştır. Wikisource transkripsiyonu. Kontrol: ülke olarak Mısır, Kahire'de yayımlanmasından
  çıkarılmıştır; sayfada kimlik tespit edilmemiştir.
