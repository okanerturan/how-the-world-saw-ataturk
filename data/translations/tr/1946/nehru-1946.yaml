id: nehru-1946
voice: Jawaharlal Nehru
role: Hindistan Ulusal Kongresi lideri; The Discovery of India (yazılışı 1944, yayımlanışı 1946)
quote: >-
  Bununla birlikte, tam da bu politika onu hem Hinduların hem de Müslümanların genç kuşağı arasında daha
  popüler hale getirdi.
quote_kind: translated
summary: >-
  Atatürk'ün laik reformlarının ona ortodoks Müslümanların hayranlığına mal olduğunu ama gençleri
  kazandırdığını ve hilafetin çekirdeğini ortadan kaldırmasının Hindistan Hilafet hareketini çökerttiğini
  söyler.
caveat: >-
  The Discovery of India, 'Kemal Pasha; Nationalism in Asia: Iqbal' bölümü, s. 416-417 (kitabın dizini: 'Kemal
  Pasha, The Ataturk, 416-17'); açık taramalar dli.scoerat.12288 (temiz metin) ve in.gov.ignca.14765. Aynı
  pasaj: 'Kemal Pasha was naturally popular in India with Moslems and Hindus alike. He had not only rescued
  Turkey from foreign domination and disruption but had foiled the machinations of European imperialist
  powers, especially England'; 'The Ataturk partly destroyed the dream structure that had gradually grown up
  in the Indian Moslem mind'; 'when the core itself was eliminated by the Ataturk the superstructure
  collapsed'. 1944'te Ahmadnagar Kalesi'nde yazılmıştır. Nehru'nun mevcut kaydı 1934 tarihlidir (Glimpses).
  Nehru'nun eyalet başbakanlarına yazdığı daha sonraki bir mektupta (yakl. Ağustos 1951, Letters to Chief
  Ministers c. 2, s. 459) Kamal Ataturk'ün 'drove out the allied occupation forces from Turkey and later
  defeated the Greek Army, which was supported by the British' ifadeleri yer alır (yalnızca bağlam için,
  kaydedilmedi).
