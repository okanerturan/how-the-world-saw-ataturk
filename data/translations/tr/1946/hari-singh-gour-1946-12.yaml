voice: Hari Singh Gour
role: Hukukçu, Sagar Üniversitesi kurucusu; Kurucu Meclis üyesi (C.P. ve Berar)
quote: >-
  Kemal Paşa Atatürk, siyaseti dinle birleştirmenin beyhudeliğini ve akılsızlığını gördü. Yaptığı ilk şey
  Pakistan'a son vermek ve Türkiye Cumhuriyeti'ni kurmak oldu.
quote_kind: translated
summary: >-
  Kurucu Meclis'in ilk oturumunda Müslümanlara, Mustafa Kemal Paşa'nın din ile siyaseti karıştırmanın
  akılsızlığını gördüğünü söyler; onları Jinnah'ın Pakistan'ını reddetmeye çağırır.
caveat: >-
  Constituent Assembly of India Debates, c. I, 19 Aralık 1946, s. 149 (pasajın ardından 150 sayfa üstbilgisi
  gelir). Lok Sabha Secretariat / Government of India Press tarafından dijitalleştirilen resmi tutanak,
  archive.org OCR üzerinden. Gour'un buradaki 'Pakistan' ifadesi eski Osmanlı Hilafet-Saltanat düzeni anlamına
  gelmektedir (kelimeyi kendi kullanımı); arşiv onun Müslüman siyasetine ilişkin çerçevesini benimsemez.
  Pasajdan önce 'Dr. Sir Hari Singh Gour (C. P. and Berar' konuşmacı başlığı yer alır. Metin resmi tutanağın
  OCR çıktısından okunmuştur; bariz OCR hataları alıntıda sessizce düzeltilmiştir.
verification_note: >-
  Alıntı birebir aynı ('Kemal Pasha Ata-Turk saw the futility and unwisdom of combining politics with
  religion. The first thing he did was to put an end to Pakistan and establish the Republic of Turkey.').
