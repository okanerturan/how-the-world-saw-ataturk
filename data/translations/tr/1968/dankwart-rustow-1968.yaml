voice: Dankwart A. Rustow
role: Amerikalı siyaset bilimci; 'Atatürk as Founder of a State', Daedalus 97, sayı 3 (1968)
quote: >-
  İkinci evre (1923-27), Kemal'in gençliğinin kişisel deneyimini bir bütün olarak Türkiye'nin kültürel
  durumuyla ilişkilendirebildiği, diktatörlüğünü pekiştirme dönemiydi. Üçüncü evre (1927-38), ülkenin
  tartışmasız hükümdarı olduğu, ancak daha önce çok keskin biçimde odaklanmış olan kişilik kaynaklarının
  bulanıklaşmaya ve gerilemeye başladığı hayatının son on yılını kapsıyordu.
