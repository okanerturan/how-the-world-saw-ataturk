quote: >-
  «Türklerin en sevgilisi, büyük dosta... 20. yüzyılın en büyük devlet ve siyaset adamının hâtırasına.» […]
  «Birinci Dünya Savaşı, Osmanlı İmparatorluğu için bir son, Atatürk için bir başlangıçtı. Gelibolu harekâtı
  sırasında, üstün kuvvetler karşısında, İstanbul ve Boğazları kurtarması, Atatürk'ün en büyük başarısıdır.
  Mustafa Kemal, 1918'de bile hâlâ mağlûp edilmemiş bir kumandandı. İstiklâl Savaşı için, Anadolu'nun bağrında
  halkı birleştiren bu büyük adam, bütün zorlukları da yenmesini bilmiştir. İstiklâl mücadelesi, sadece askerî
  yönü ile değil, politik yönü ile de büyük önem taşır. Mücadele, Sakarya ile tam bir zafere ulaşmıştır.»
