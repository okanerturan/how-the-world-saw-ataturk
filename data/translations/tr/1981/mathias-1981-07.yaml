role: Maryland ABD Senatörü (Cumhuriyetçi)
quote: >-
  Olağanüstü kararlılığı, adanmışlığı ve dinamik liderliği, Türkiye'nin dünyadaki rolüne ilişkin sarsılmaz bir
  vizyonla birleşerek onu Türkiye'nin toplumsal ve siyasal yapısında amansız bir reforma yöneltti. Doğu ile
  Batı arasında parçalanmış, yenik ve bölünmüş bir hanedandan, Batı'ya sarsılmaz bir bağlılığa sahip modern,
  demokratik bir cumhuriyet yarattı.
