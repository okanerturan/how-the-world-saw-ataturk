id: mbow-1981-11-06
voice: Amadou-Mahtar M'Bow
role: UNESCO Genel Direktörü
quote: >-
  Atatürk'ün bu muazzam yolculuğunun pek çok yönü evrensel bir boyuta sahiptir. […] bu halklar, Atatürk'ün
  yarım yüzyılı aşkın bir süre önce, henüz bakir olan zirvelerde ve onun çapındaki öncülerin hâlâ yalnız birer
  insan olduğu bir dünyada giriştiği uzun yürüyüşten değerli dersler çıkarabilirler.
quote_kind: translated
summary: >-
  Doğumunun yüzüncü yılında Ankara'da fahri doktora: uzun yürüyüşü Üçüncü Dünya için dersler barındıran, 'bu
  yüzyılın en dikkate değer şahsiyetlerinden biri'.
caveat: >-
  Ankara Üniversitesi (Dil ve Tarih-Coğrafya Fakültesi) fahri doktora unvanını kabul ederken devlet başkanının
  huzurunda yaptığı konuşma, Ankara, 6 Kasım 1981 (UNESCO belgesi DG/81/43, bir kapak ve daktiloyla yazılmış
  üç sayfa). Bu, mbow-1980-06-09'dan sonra on sekiz ay içindeki ikinci ziyaretiydi. Ayrıca UNESCO'nun 16–18
  Aralık 1981'de Paris'te düzenleyeceği sempozyumu ve 'Atatürk: fondateur d'un Etat moderne' adlı kitabını
  duyurdu. 1980'de olduğu gibi, belgede konuşmayı hangi dilde yaptığı belirtilmemektedir.
