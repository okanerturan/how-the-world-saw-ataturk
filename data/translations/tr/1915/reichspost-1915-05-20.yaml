quote: >-
  Mustafa Kemal Bey komutasındaki Türk piyadesi burada olağanüstü bir biçimde kendini gösterdi.
quote_kind: translated
summary: >-
  İstanbul'dan, 'Mustafa Kemal Bey komutasındaki' Türk piyadesinin Arıburnu'ndaki İtilaf taarruzunu geri
  püskürtürken kendini gösterdiğini bildirdi.
caveat: >-
  Şimdiye dek yabancı basında adının geçtiği en erken tarihli kayıt. Reichspost, 20 Mayıs 1915, s. 16,
  'Konstantinopel, 18. Mai' mahreçli haber: on altı Avustralya ve Yeni Zelanda taburunun saldırdığı ve bir
  süngü karşı taarruzunun onları geri püskürttüğü, Arıburnu'nda genel bir İtilaf yarma girişiminin
  başarısızlığa uğraması üzerine 'Ein Bericht aus dem Hauptquartier in den Dardanellen'. Gazete hangi karargâh
  olduğunu belirtmez. Övgü, kendisinden ziyade komutasındaki piyadeye yöneliktir ve bu bir savaş dönemi resmî
  tebliğ metnidir; bir sonraki cümlede ağır düşman kayıpları ileri sürülür. İlk okuyucu aynı metni Deutsches
  Volksblatt (21 Mayıs), Das interessante Blatt (27 Mayıs) ve Mühlviertler Nachrichten (29 Mayıs 1915)
  gazetelerinde de görmüştür; bunlar yeniden kontrol edilmemiştir. Taranmış sayfanın kırpılmış kesitlerinden
  okunmuştur; başlık ('Der Durchbruchsversuch bei Ari Burun gescheitert') yalnızca OCR metninden bilinmektedir
  ve tam sayfa kütüphane görüntüleyicisinin bot kontrolünün arkasında yer almaktadır.
