voice: Reichspost
role: İstanbul kaynaklı bir ajans haberine yer veren günlük Viyana gazetesi
quote: >-
  Mustafa Kemal Bey komutasındaki Türk piyadesi burada olağanüstü bir biçimde kendini gösterdi.
quote_kind: translated
summary: >-
  İstanbul'dan, 'Mustafa Kemal Bey komutasındaki' Türk piyadesinin Arıburnu'ndaki İtilaf taarruzunu geri
  püskürtürken kendini gösterdiğini bildirdi.
caveat: >-
  Yabancı basında şimdiye kadar tespit edilen en erken adının geçişi. Reichspost, 20 Mayıs 1915, s. 16,
  'Konstantinopel, 18. Mai' mahreciyle: on altı Avustralya ve Yeni Zelanda taburunun saldırdığı ve bir süngü
  karşı taarruzunun onları geri püskürttüğü Arıburnu'ndaki genel bir İtilaf yarma girişiminin başarısızlığı
  üzerine 'Ein Bericht aus dem Hauptquartier in den Dardanellen'. Gazete kimin karargâhı olduğunu belirtmiyor.
  Övgü kendisinden ziyade komutası altındaki piyadeye yöneliktir ve bir sonraki cümlede ağır düşman
  kayıplarının ileri sürüldüğü bir savaş dönemi tebliği metnidir. İlk okuyucu aynı metni Deutsches Volksblatt
  (21 Mayıs), Das interessante Blatt (27 Mayıs) ve Mühlviertler Nachrichten (29 Mayıs 1915) gazetelerinde de
  görmüştür; bunlar yeniden kontrol edilmemiştir. Kütüphanenin görüntüleyicisinde tam sayfa olarak okunmuştur:
  haber 'Der Durchbruchsversuch bei Ari Burun gescheitert.' başlığını taşımaktadır (altındaki metinde 'Ari
  Burnu' olarak yazılmıştır), sayfanın kendisi ise 'Seite 2 … Reichspost … 20. Mai 1915 … Nr. 235' başlığını
  taşımaktadır; o günkü taramanın 16. sayfasıdır.
