id: tasvir-i-efkar-1915-10-29
voice: Tasvir-i Efkâr
role: İstanbul'da çıkan günlük gazete; birinci sayfadaki portresinin alt yazısı
quote: >-
  Çanakkale muharebât-ı berriyesinde fevkalâde yararlıkları görülen ve emr-i müdafaadaki iktidar ve mahareti
  ile bihakkın ihrâz-ı şan ü şeref eyleyerek Boğazları ve makam-ı hilâfeti kurtaran kumandanlarımızdan
  celâdet-i fıtriye ve havârık-ı hamâset ile mümtaz Miralay Mustafa Kemal Bey Efendi
quote_kind: original-turkish
summary: >-
  Birinci sayfadaki portre alt yazısı: Çanakkale'de olağanüstü hizmetler görmüş, savunmadaki maharetiyle
  Boğazları ve hilafet merkezini kurtarmış bir komutan.
caveat: >-
  Tasvir-i Efkâr sayı 1589, 29 Ekim 1915 Cuma (20 Zilhicce 1333 / 16 Teşrinievvel 1331). Birinci sayfa, solda
  Cevat Paşa'nın, sağda ise 'Miralay Mustafa Kemal Bey Efendi'nin birbirine eş portreleriyle Osmanlı'nın
  savaşa girişinin birinci yıl dönümünü anmaktadır; iki alt yazı birbirini tamamlayan bir çifttir. Askerî
  sansür altındaki savaş dönemi basını. Sayfadaki bir makale Yunus Nadi imzalıdır. Sayfanın bir
  röprodüksiyonunun 1365 piksellik fotoğrafından okunmuştur; daha iyi bir tarama memnuniyetle karşılanır.
  Resmin Enver Paşa'dan habersiz gazeteye sokulduğuna dair daha sonraki hikâye bir anekdottur ve bu sayfanın
  bir parçası değildir.
verification_note: >-
  Beş satırlık alt yazı, sayfa görüntüsü üzerinden iki okuyucu tarafından bağımsız olarak okunmuştur:
  Osmanlıca metin, çeviriyazı ve çeviri kelimesi kelimesine örtüşmektedir. Gazete künyesindeki sayı numarası
  ve üç takvimdeki tarih görüntü üzerinden okunmuştur. 16 Teşrinievvel 1330 tarihli manşetler, sayfanın
  savaşın yıl dönümü nüshası olduğunu göstermektedir.
verification_method: gazete başlığı, manşetler ve her iki portre alt yazısının büyütülmüş kesitleri
