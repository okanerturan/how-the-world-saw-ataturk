id: helen-clark-2000-04-25
voice: Helen Clark
role: Yeni Zelanda Başbakanı; Anzak Günü şafak ayini ve uluslararası tören, Gelibolu
quote: >-
  Atatürk'ün burada ölenlerin anne ve babalarına yönelik teselli sözleri, uluslarımızın Gelibolu travmasına
  uyum sağlamasına yardımcı oldu. Burada hayatını kaybedenleri Türkiye'nin kendi evlatları olarak kabul edip
  burada bakılmalarını sağlamaktaki ruh yüceliği, ülkelerimiz arasındaki dostluk bağlarının temelini attı. […]
  Ayrıca, Atatürk'ün ilham verici liderliği altında ülkelerini savunmak için büyük bir cesaretle savaşan Türk
  askerlerinin sarsılmaz cesaretini de saygıyla anmak istiyorum.
quote_kind: translated
summary: >-
  Gelibolu'daki Türk savunmasının ilham verici lideri; İtilaf Devletleri'nin ölülerine gösterdiği yüce
  gönüllülük Türkiye ile Yeni Zelanda arasındaki dostluğun temelini attı.
caveat: >-
  Scoop'ta yeniden yayımlanan hükümet konuşma metinleri. Doğumunun 125. yıldönümü dolayısıyla gönderdiği mesaj
  (Mayıs 2006'da Washington'da, Ataturk Society of America'da Yeni Zelanda büyükelçisi tarafından okunmuştur):
  'Kemal Ataturk will always have a special place in history as that remarkable soldier who led the defence of
  his country on the Gallipoli Peninsula and who went on to found the modern Turkish republic. It is not only
  in Turkey that this great statesman is remembered.'
