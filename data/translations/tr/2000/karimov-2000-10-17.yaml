voice: Islam Karimov
role: Özbekistan Cumhurbaşkanı
quote: >-
  Kim ki Türkiye'de Atatürk'ün düşmanıdır; o kişi benim de düşmanımdır. Kim ki Atatürk'ü sever; o benim de
  dostumdur. Benim yolum Atatürk'ün yoludur. Kendime Atatürk'ü model aldım.
quote_kind: original-turkish
summary: >-
  Türk gazetecilere kendi yolunun Atatürk'ün yolu olduğunu, Atatürk'ü kendine model aldığını ve Türkiye'deki
  Atatürk düşmanlarının kendi düşmanları olduğunu söyler.
caveat: >-
  Cumhurbaşkanı Sezer'in ziyareti sırasında Taşkent'te, Timurlular Tarihi Müzesi'nde, Sezer'in Türkmenistan'a
  ayrıldığı gün söylenmiştir. Cumhuriyet'teki ifadeler farklıdır: 'Büyük Kemal Atatürk'ün yolu bizim için
  makbul yol... Türkiye'de kim ki Kemal Atatürk'e karşı çıkarsa, o bana karşı çıkmış demektir.' Aynı
  açıklamalarda Türk Genelkurmayı'nın 'irtica' ile mücadelesini över ve İstanbul'daki Özbek İslamcı
  sürgünlerden yakınır; övgünün çerçevesini laik otoriterliği oluşturur. 1998 tarihli bir açıklama ('follows
  Ataturk's precepts', Jamestown Monitor 14 Nisan 1998, ajanslar) tek kaynaklıdır ve seçkiye alınmamıştır.
mediated_by: Hürriyet, 18 Ekim 2000 ve Cumhuriyet, 18 Ekim 2000 s. 10 (Türk basınındaki aktarımlar)
