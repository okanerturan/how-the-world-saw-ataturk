id: howard-2000
voice: John Howard
role: Avustralya Başbakanı (1996–2007)
quote: >-
  1915 harekâtlarının ardından ulusların uzlaştırılma biçiminden dolayı Türkiye Cumhuriyeti'nin birbirini
  izleyen liderlerine, özellikle de büyük Kemal Atatürk'e saygılarımı sunmak istiyorum.
quote_kind: translated
summary: >-
  Gelibolu uluslararası töreninde, 1915'ten sonra ulusların uzlaşmasından dolayı 'büyük Kemal Atatürk'e
  saygılarını sunar.
caveat: >-
  'reconcilled' yazımı tutanağa aittir. Gelibolu'da Türkiye ve Yeni Zelanda başbakanlarının huzurunda
  yapılmıştır. İki gün önce Ankara'da (PM Transcripts 22713, 23 Nisan 2000) Howard Türkleri 'honoured'
  hasımlar olarak nitelendirmiştir ancak zamirin Atatürk'e işaret ettiği açık değildir, bu nedenle o pasaj
  kullanılmamıştır; 26 Nisan'da Paris'te (11503) Howard değil, bir gazeteci Atatürk'ün 1934 tarihli sözlerini
  eski düşmanların uzlaşmasına yardımcı olan sözler olarak tanımlar. Anzak konuşmacılarının Atatürk'e
  atfettiği 'Johnnies and Mehmets' / 'your sons are now lying in our bosom' metninin kendisi tartışmalıdır:
  1934 tarihli bir orijinal bulunamamıştır, metin ilk kez 1953'te İçişleri Bakanı Şükrü Kaya'nın hatırası
  aracılığıyla basılı olarak ortaya çıkmıştır ve 'Johnnies and Mehmets' ibaresi 1978 tarihli bir Avustralya
  eklemesidir (bkz. [[Johnnies and Mehmets]]). Dolayısıyla bu, övgüyü ödüllendiren bir anma töreni veya
  diplomatik vesileyle dile getirilmiş, konuşmacının Anzak efsanesindeki Atatürk'e dair görüşüdür. Kaynak
  gösterimi: Turkish International Service at Mehmetcik Abide, 25 April 2000.
