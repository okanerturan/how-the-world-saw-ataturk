id: joseph-luns-1986-05-19
voice: Joseph Luns
role: >-
  Eski NATO Genel Sekreteri (1971–84) ve Hollanda Dışişleri Bakanı; ilk Uluslararası Atatürk Barış Ödülü'nü
  kabul konuşması, Ankara
quote: >-
  […] bu hedeflere ulaşıldıktan sonra Gazi bir daha asla askerî harekâta başvurmadı ve tam bağımsızlığını
  kazandıktan sonra Türkiye'nin tek bir hedefi olduğunu, bunun da tüm komşularıyla barış içinde yaşamak ve tüm
  uluslar arasında barışçıl ilişkileri teşvik etmek olduğunu her zaman dile getirdi. Böylelikle ünlü dünya
  liderleri arasında çok nadir görülen bir nitelik sergiledi: itidal. […] Bu büyük insanın bu kadar kısa
  sürede başardıkları hayret vericidir. […] Dünya sahnesinde böylesine çok yönlü bir deha çok nadiren ortaya
  çıkar. […] NATO Antlaşması ile birbirine bağlanmış olan biz Batılıların, Atatürk'e büyük bir minnet duymak
  için güçlü nedenlerimiz var; çünkü müttefikleriyle aynı idealleri, aynı özgürlük ve barış sevgisini paylaşan
  modern Türkiye, Atatürk'ün başarıları olmadan düşünülemez.
quote_kind: translated
summary: >-
  Nadir görülen niteliği itidal olan bir asker: bağımsızlıktan sonra bir daha asla silaha başvurmadı; NATO
  müttefiklerinin minnet borçlu olduğu çok yönlü bir deha.
caveat: >-
  Dergi, konuşmayı İngilizce ve Türkçe çevirisiyle yayımlamıştır; derginin imlasıyla İngilizcesinden
  alıntılanmıştır. Konuşma ayrıca Türkiye'yi bugünkü büyüklüğüyle sınırlandırmayı ve hilafetten vazgeçmeyi 'a
  wise and farsighted perception' (bilgece ve ileri görüşlü bir anlayış) olarak nitelendirmektedir. NATO Genel
  Sekreteri olarak Evren'e gönderdiği yüzüncü yıl mesajında (Milliyet 21 Mayıs 1981 s. 9), Atatürk'ün engin
  yeteneği ve üstün stratejik anlayışıyla Türk devletinin Batı uygarlıkları düzeyine ulaştığını söylemişti
  (dolaylı anlatım, Türkçe).
