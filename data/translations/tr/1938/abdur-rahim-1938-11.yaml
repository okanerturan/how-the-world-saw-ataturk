role: Merkezi Yasama Meclisi Başkanı
quote: >-
  Kemal Atatürk, askeri dehasıyla Türkiye'yi siyasi yok oluştan kurtarmakla kalmamış, aynı zamanda ileri
  görüşlü bir devlet adamı olarak halkının ulusal yaşamı için yeni bir temel, çok güçlü bir temel atmıştır
