voice: Zafar Ali Khan
role: Urdu şairi ve Zamindar'ın editörü
quote: >-
  Dünyadan o en büyük mücahit göçüp gitti ... Ey gönül sahipleri, bu keder Mustafa Kemal'in kederidir
quote_kind: translated
summary: >-
  Topluluğun sıkıntılarını hafifleten, haçlılara karşı Türklerin onurunu yeniden kazandıran ve Kabil'den
  Ankara'ya dek ayakta duran 'en büyük mücahid'in yasını tutan bir mersiye.
caveat: >-
