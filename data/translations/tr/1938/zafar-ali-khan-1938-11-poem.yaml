  bu keder Mustafa Kemal'in kederidir.' 'Ataturk Mustafa Kemal, nawwara llahu marqadahu' başlıklı şiir, Delhi,
  12 Kasım 1938 tarihli. Kaynak: Diwan-e Zafar Ali Khan, haz. Tanvir Ahmad (Ali Hujwiri Publishers, Lahore,
  1995 bas.), s. 210 (archive.org taramasının 210. PDF sayfası; OCR kullanılamaz durumda, sayfa görüntü
  üzerinden okundu), görüntü üzerinden okundu (4 Kasım 2026). 14 Kasım tarihli Meclis konuşmasından ayrıdır.
  Eşlik eden bir diğer şiir 'Congressi ulama' (s. 211, Delhi 13 Kasım 1938) Tanrı'dan bir başka Mustafa Kemal
  göndermesini dileyerek biter; ayrı olarak kaydedilmemiştir. Kontrol: mısralar sayfadaki sırayı izleyecek
  şekilde yeniden sıralanmalı (keder mısrası 'mujāhid-i aʿẓam' mısrasından önce gelir).
