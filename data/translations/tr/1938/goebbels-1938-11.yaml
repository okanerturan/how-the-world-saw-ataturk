voice: Joseph Goebbels
role: Reich Propaganda Bakanı; günlük
quote: Bize karşı olumlu bir tutum içinde, ki Mustafa Kemal Paşa için bu her zaman söylenemezdi.
quote_kind: translated
summary: >-
  İsmet İnönü'nün seçilmesi üzerine, onun Almanya'ya karşı olumlu bir tutum içinde olduğunu ve 'Mustafa Kemal
  Paşa için bunun her zaman söylenemeyeceğini' kaydeder.
caveat: >-
  Die Tagebücher von Joseph Goebbels: sämtliche Fragmente kitabının metin içi arama kesiti (archive.org
  dietagebuchervon0003goeb; kesit 'gewählt.', yani 'seçildi' kelimesinden başlıyor); dolayısıyla günlük
  kaydının tarihi (yaklaşık 11-12 Kasım 1938, İnönü'nün seçimi) çıkarımla bulunmuştur ve sayfa görülmemiştir.
  Çevirisi: 'Bize karşı olumlu bir tutum içinde, ki Mustafa Kemal Paşa için bu her zaman söylenemezdi.' Aynı
  kitapta daha erken bir kayıt (12 Haziran 1937): 'Über Kemal Paschas abenteuerliches Leben weiter gelesen'
  (Kemal'in bir biyografisini okuyor) — yargı yok. İngilizce Goebbels Diaries 1942-43 kitabında ise Atatürk
  üzerine yalnızca bir editör notu vardır.
verification_note: >-
  Birebir ve eksiksiz: '... 4. Dezember festgelegt. Ismet Inönü als Nachfolger Atatürks gewählt. Er ist gut zu
  uns eingestellt, was man von Kemal Pascha nicht immer sagen konnte.' Aynı kesit 4 Aralık için belirlenen
  Reichstag oylamasını ve İnönü'nün seçilmesini gösterir; bu da kaydı 11 Kasım 1938'den sonraki günlere
  sabitler, dolayısıyla 1938-11 desteklenmektedir (kesin gün, 11 veya 12 Kasım ve sayfa desteklenmemektedir).
  Yalnızca kesit. 'Çelişkili' kutupluluğu zorlamadır: Atatürk'ün Almanya'ya karşı tutumu hakkında hafif
  olumsuz tek bir ara sözdür (yoğunluk 1); 'tanık' veya hafif-hasmane bir etiket daha adil olurdu.
