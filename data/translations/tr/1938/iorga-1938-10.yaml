id: iorga-1938-10
voice: Nicolae Iorga
role: Rumen tarihçi, eski başbakan, üniversite profesörü
quote: >-
  Geçenlerde Bay Atatürk hastalandığında, bütün Türklerin ruhunda ne derin bir kaygı, bir acı duygusu vardı:
  Öyle görünüyor ki, artık ulusal hâle gelmiş olan İmparatorluğun eski ihtişamını yeniden kuran o kişinin yok
  oluşunun, vatanın çöküşü ve ulusun dünyada bir şey ifade eden halklar arasından silinişi anlamına geleceğine
  inanmışlardı.
quote_kind: translated
summary: >-
  Bir ulusun, İmparatorluğun ihtişamını yeniden kuran tek bir adamda toplanabileceğinin kanıtı olarak Atatürk
  hastalandığında Türklerin duyduğu acıyı örnek gösterir.
caveat: >-
  Bükreş Üniversitesindeki açılış dersi, 31 Ekim 1938 (Atatürk'ün ölümünden on gün önce); Vălenii-de-Munte,
  Datina Românească, 1939 basımı, Revista Istorică, yıl XXV, sayı 1-3'ten ayrıbasım (tümü Wikisource
  sayfasında belirtilmiştir). Iorga, ulusların tek bir önderde toplandığı savında Atatürk'ü (Hitler ve
  Mussolini ile birlikte) bir örnek olarak kullanır ve devamında Rumen kralının etrafında kenetlenme çağrısı
  yapar: övgü bu sava hizmet etmektedir. Basılı broşürün Wikisource transkripsiyonu; tarama incelenmedi.
  Çeviri arşive aittir.
