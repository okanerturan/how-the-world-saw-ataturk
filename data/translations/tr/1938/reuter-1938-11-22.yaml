id: reuter-1938-11-22
voice: Ernst Reuter
role: >-
  Ankara'da ders veren sürgündeki Alman Sosyal Demokrat; daha sonra Batı Berlin Belediye Başkanı
quote: >-
  Büyük ve genel bir yas var ve herkes kaybın büyüklüğünü muhakkak hissediyor; bu da halefiyet meselesinin
  gayet pürüzsüz ve olağan bir biçimde çözülmüş olmasıyla hafifliyor…
quote_kind: translated
summary: >-
  Definden sonra annesine yazdığı mektupta, okulunun öğretim kadrosuyla birlikte Atatürk'ün tabutunun önünden
  saygı geçişinde bulunduğunu belirtti; herkes kaybın büyüklüğünü hissediyordu.
caveat: >-
  Yalnızca ödünç alınabilen tarama (schriftenreden0000reut_d8g2, 1972 takımı olarak kataloglanmış); sayfa
  gösterilmiyor. Mektup başlığı ile Atatürk pasajı ('Gestern haben wir Atatürk beerdigt, und vorgestern bin
  ich im Lehrkörper meiner Schule an dem Sarg vorbeidefiliert') ayrı kesitlerden gelmektedir, dolayısıyla aynı
  mektupta yer aldıkları metnin devamlılığından çıkarsanmıştır. Tarih, editörlerin köşeli parantez içinde
  verdiği tarihtir ve 21 Kasım 1938'deki Ankara töreniyle örtüşmektedir. Kısa bir özel nottur: görüş Kemal'in
  eserine dair bir yargı değil, ortak bir kayıp duygusunun ifadesidir. Kontrol: s. 497; birbiriyle örtüşen
  kesitler başlık ile Atatürk pasajının tek bir mektup olduğunu göstermektedir.
