id: roncalli-1938
voice: Angelo Roncalli (daha sonra Papa XXIII. John)
role: Türkiye ve Yunanistan Apostolik Delegesi
quote: Şimdi göçüp gitmiş olan bu iki hayatın beslediği soğuk duyguları paylaşmıyorum.
quote_kind: translated
summary: >-
  Başkalarının beslediği soğuk duyguları reddederek Atatürk ve Rum Ortodoks patriği için dua eder; hükmü,
  yumuşak huylu ve şefkatli olduğunu düşündüğü Rabbe bırakır.
caveat: >-
  Vakıf müdürü tarafından Roncalli'nin günlüğünden İngilizce çevirisiyle alıntılanmıştır; İtalyanca orijinale
  ve Journal of a Soul metnine ulaşılamamıştır. Verilen günlük tarihi .. died' şeklindedir - konuşmada bir dil
  sürçmesi; tarih yalnızca 1938 olarak kaydedilmiştir. Kayıt Atatürk'ü Rum Patriği Chrysostomos ile bir araya
  getirir; konuşmacı Roncalli'nin naaşı ziyaret edip dua ettiğini ekler. Papa XXIII. John hakkındaki mevcut
  not yalnızca Roma'ya dünyanın büyük bir adamı kaybettiğini söylediğini belirtir; bu kayıt ise günlüğe
  dayanmaktadır. Aktarılan '19 Oct 1938' günlük tarihi imkânsızdır (Atatürk 10 Kasım'da, Chrysostomos yaklaşık
  22 Ekim'de ölmüştür); kayıt 10 Kasım sonrasına aittir. Kayıt Atatürk ile ilgilidir: pasaj 'the leader of the
  Turks, secular reformer of that people' ifadesini kullanır. İngilizce bir çevirinin tekil ikincil
  aktarımıdır (Bolis, EWTN); İtalyanca orijinal görülmemiştir.
mediated_by: >-
  Ezio Bolis (Direktör, Pope John XXIII Foundation, Bergamo), 'What Was John XXIII Really Like?', EWTN,
  günlüğü İngilizce alıntılayarak
