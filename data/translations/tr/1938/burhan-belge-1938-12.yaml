id: burhan-belge-1938-12
voice: Burhan Belge
role: Basın Genel Müdürü, Türk yazar ve Atatürk'ün çevresinden
quote: >-
  Atatürk, eserini tamamlamanın sevincini duymuş talihli bir Şef oldu … Atatürk kurtuluş mücadelesini yönetti
  ve Devrim'i yaptı.
quote_kind: translated
summary: >-
  Atatürk'ün ölümünün ardından onu, eserini tamamlamış ve ulusal 'dava'yı İnönü'ye devretmiş talihli bir şef
  olarak nitelendirir; böylelikle tutulan yol devam etmektedir.
caveat: >-
  Türk Basın Genel Müdürlüğü'nün (Direction Générale de la Presse, İçişleri Bakanlığı) resimli dergisi olan ve
  yayımladıklarını seçip basan (ve bazı yazıları tercüme eden) bir Kemalist devlet propaganda mecrası
  niteliğindeki La Turquie kémaliste'te yayımlanmıştır; archive.org'daki la_turquie_kemaliste kaydının OCR
  metninden okunmuştur. Dergiyi yayımlayan Basın Genel Müdürlüğü'nün başkanının imzalı yazısı, 'D'Atatürk à
  İnönü', sayı 28 (Aralık 1938), cenazeden sonraki ilk sayı; aynı sayı 'La mort d'Atatürk' başlıklı imzasız
  bir başyazıyla açılmaktadır. Amaç, yabancı okurlara İnönü yönetiminde süreklilik konusunda güvence vermektir
  ('nul, parmi nos amis de l'étranger, ne doit en douter'), dolayısıyla araçsaldır ve Belge bağımsız bir ses
  değil, rejimin bir yetkilisiydi. Kayıtta 'Atatürk'den İnönü'ye' başlıklı Türkçe çevirisi de yer almaktadır.
  OCR metninde sayfa numarası görünmemektedir. Kaynak gösterimi: La Turquie kémaliste sayı 28 (Aralık 1938),
  'D'Atatürk à İnönü'.
