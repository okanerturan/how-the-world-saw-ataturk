id: jinnah-1938-12-26
voice: Muhammad Ali Jinnah
role: Tüm Hindistan Müslüman Birliği Başkanı
quote: Kemal Atatürk'ün şahsında İslam dünyası büyük bir kahramanı kaybetmiştir.
quote_kind: translated
summary: >-
  Atatürk'ü Müslüman Doğu'nun en önde gelen şahsiyeti ve yitirilmiş büyük bir kahraman olarak nitelendirir ve
  Hindistan Müslümanlarının batağın içinde kalmaya devam edip etmeyeceğini sorar.
caveat: >-
  26-29 Aralık 1938'de Patna'da irticalen yapılan başkanlık konuşması; Jamiluddin Ahmad, Some Recent Speeches
  and Writings of Mr. Jinnah, s. 66'da basılan metin (Internet Archive DLI taraması, OCR okuması; 'batak'
  cümlesi: 'With the example of this great man in front of them as an inspiration, will the Muslims of India
  still remain in quagmire?'). Geniş çapta dolaşımda olan Kasım 1938 tarihli 'greatest Musalman in the modern
