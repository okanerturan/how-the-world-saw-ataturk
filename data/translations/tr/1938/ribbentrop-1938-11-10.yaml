voice: Joachim von Ribbentrop
role: Almanya Dışişleri Bakanı
quote: >-
  Türkiye Cumhuriyeti'nin, büyük kurucusu Ekselansları Cumhurbaşkanı Kemal Atatürk'ün vefatıyla uğradığı yeri
  doldurulamaz kayıp dolayısıyla, Ekselanslarının şahsımın ve Alman Reich Hükümeti'nin en içten taziyelerinden
  emin olmalarını rica ederim.
quote_kind: translated
summary: >-
  Dışişleri Bakanı Aras'a, Türkiye Cumhuriyeti'nin "büyük kurucusu"nun "yeri doldurulamaz kaybı" dolayısıyla
  gönderilen taziye telgrafı.
caveat: >-
  Tevfik Rüştü Aras'a gönderilen, resmi haber ajansı (DNB) tarafından 10 Kasım'da yayımlanan ve 11 Kasım
