role: Arap milliyetçisi düşünür; Ulusal Eylem Birliği'nin Antakya temsilcisi
quote: >-
  Ondan önce de bir Araptım; bir Arap ailesinin içine doğduğumu hissediyordum; zevk ve yaşam biçimi bakımından
  komşularım olan Türklerden farklı olduğumu hissediyordum.
