voice: Sir Jerry Mateparae
role: Yeni Zelanda Genel Valisi
quote: >-
  Gelibolu'da hayatını kaybeden askerlerimiz hakkında Mustafa Kemal Atatürk tarafından dile getirilen uzlaşı
  ruhuyla diyorum ki: / Ailelere / Gözyaşlarınızı silin / Atalarınız burada yatıyor / Topraklarımızın bağrında
  / Huzur içinde / Onlar hepimizin atalarıdır
quote_kind: translated
summary: >-
  Gate Pā'nın 150. yıl anma töreninde, Atatürk'ün Gelibolu'da ölenler için söylediği uzlaşı sözlerini Yeni
  Zelanda Savaşları'nda ölenlere uyarladı.
caveat: >-
  Gate Pā (Pukehinahina, Tauranga, 1864), İngiliz kuvvetleri ile Maoriler arasındaki bir muharebeydi. Son
  dizeler, Atatürk'ün 1934'te Anzak annelerine söylediği sözleri bu muharebenin ölüleri için yeniden uyarlar;
  konuşmacı ardından bu dizeleri Maorice söyler. Dört gün önce, Anzak Koyu şafak töreninde Atatürk'ü 'a leader
  in the art of peace and the art of nation-building as much he was in the art of war' olarak nitelendirmişti
  (gg.govt.nz/publications/dawn-service-gallipoli, 25 Nisan 2014).
