id: enver-pasha-1921-07-22
voice: Enver Paşa
role: Eski Osmanlı Harbiye Nazırı, Moskova'da; Kabil'deki Cemal Paşa'ya mektup
quote: Anadolu'da Mustafa Kemal Paşa şahsen beni rakib telâkki
quote_kind: original-turkish
summary: >-
  Cemal'e, Anadolu'da Mustafa Kemal'in şahsen kendisini rakip olarak gördüğünü söyler; buna karşın Kemal'e
  karşı bir hareketleri olmadığını iddia eder.
caveat: >-
  Türkçe özgün metin; arşivin çevirisi: 'in Anatolia Mustafa Kemal Pasha personally regards me as a rival'.
  120 sayılı mektup, Enver'den Cemal Paşa'ya (Kabil), 22 Temmuz 1921; aynı mektupta Kemal'in Hâkimiyet-i
  Milliye'de 'yalnız bana yönelik' bir makale yazdırdığı ve 'Mustafa Kemal Paşa aleyhinde bir hareketimiz
  olmadığı, bilakis olumsuz düşünen arkadaşları yatıştırmaya çalıştığımız' belirtilir. Kemal'e değil, bir
  müttefike yazılmıştır; s. 234-235 olarak atıf yapılmıştır (OCR işareti 235 cümleyi izler). Alıntı s.
  235'tedir; 'Kemal aleyhinde bir hareket olmadığı' cümlesi s. 236'dadır.
verification_note: >-
  Kelimeler birebir aynı ('Bildiğiniz gibi Anadolu'da Mustafa Kemal Paşa şahsen beni rakib telâkki ise burada
  temâs samimi ve açık anlatmamıza rağmen hattâ Hâkimiyet-i Milliye ile şimdilik yalnız bana müteveccih bir
  makâle yazdırdı'). Sayfa düzeltmesi: mektup folyo 234'ten sonra başlıyor, dolayısıyla bu cümle s. 235'tedir
  (234-235 değil); 'Mustafa Kemal Paşa aleyhinde bir hareket değil ... menfi olan arkadaşları da teskin' s.
  236'dadır. Kaydın çevirisi kabul edilebilir; parçada 'ise' kelimesi atlanmıştır, bu da cümle tamamlanmamış
  olduğu halde tamamlanmış gibi görünmesine yol açmaktadır. Enver'in bir müttefike yazdığı kendi mektubu.
  Çelişkili/1 yerinde.
