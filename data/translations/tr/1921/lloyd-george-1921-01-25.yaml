id: lloyd-george-1921-01-25
voice: David Lloyd George
role: İngiltere Başbakanı, Paris'teki Müttefikler konferansında
quote: >-
  Kendisi (Bay Lloyd George), Mustafa Kemal'in eski Türk İmparatorluğu'nu diriltmek ve kendisini yeni bir
  Sultanlar hanedanının ilki yapmak gibi boş bir hırsla dolu olmadıkça barışçıl bir çözüme düşman
  olabileceğini tasavvur edemiyordu.
quote_kind: translated
summary: >-
  Müttefiklere, Kemal'in barışı ancak eski İmparatorluğu canlandırmak ve yeni Sultanların ilki olmak yönündeki
  boş bir hırs yüzünden reddedebileceğini söyledi.
caveat: >-
  İngiliz tutanaklarında dolaylı anlatım; biçim olarak koşullu. Aynı toplantı: Müttefiklerin Kemal'den barış
  dileniyormuş gibi görünmemesi gerektiği konusunda Briand ile hemfikir oldu. Mevcut Lloyd George
  kayıtlarından (Aralık 1920, Ağustos 1922, 1938) farklıdır.
mediated_by: >-
  Şimşir, İngiliz Belgelerinde Atatürk c. III (TTK 1973) No. 20, s. 73 ← British Secretary's Notes of an
  Allied Conference, Quai d'Orsay, 25 Ocak 1921, 16.00 (DBFP 1. seri c. XV s. 28–39 No. 4)
verification_note: >-
