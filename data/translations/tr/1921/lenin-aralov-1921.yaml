id: lenin-aralov-1921
voice: Vladimir Lenin
role: Sovyet Rusya Halk Komiserleri Konseyi Başkanı
quote: >-
  Elbette, Mustafa Kemal Paşa sosyalist değil, diyordu Vladimir İlyiç, ama görünüşe göre iyi bir örgütçü,
  yetenekli bir komutan, burjuva-ulusal bir devrim yürütüyor, ilerici düşünceli bir insan, akıllı bir devlet
  adamı.
quote_kind: translated
summary: >-
  Elçisini bilgilendirirken Mustafa Kemal'in sosyalist olmadığını, ancak burjuva-ulusal bir devrim yürüten iyi
  bir örgütçü, yetenekli bir komutan ve akıllı bir devlet adamı olduğunu söyler.
caveat: >-
  Yaklaşık 38 yıl sonra Sovyet dönemi bir anı kitabında hatırlanmıştır; Lenin'in sözleri Aralov'un yeniden
  kurgusudur. Görüşme Moskova'da, Aralov'un Kasım 1921 başlarında geri çağrılması ile Aralık 1921 sonunda
  Ankara'ya hareket etmesi arasında gerçekleşmiştir (s. 23, 33–36). Taramada 'не социалист' ifadesi '—: е
  социалист' (OCR) olarak görünmektedir. Lenin devamında Kemal'in 'emperyalistlerin kibrini kıracağından' emin
  olduğunu ve Rusya'nın Türk halkına yardım etmesi gerektiğini söyler. archive.org açık metninden okundu.
mediated_by: >-
  S. I. Aralov, Vospominaniya sovetskogo diplomata 1922–1923 (Moskova: IMO, 1960), s. 34–35, Lenin'in
  kendisini bilgilendirmesini anımsarken
verification_note: >-
