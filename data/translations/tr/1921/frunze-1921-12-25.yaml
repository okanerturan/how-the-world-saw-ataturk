id: frunze-1921-12-25
voice: Mikhail Frunze
role: >-
  Ukrayna SSC'nin Ankara olağanüstü temsilcisi, Kızıl Ordu komutanı (daha sonra Sovyet savaş komiseri)
quote: >-
  Hâkimiyetten söz ederken, sizi —Paşa'yı— göz önüne alıyorum ve sizin hiçbir mal ve mülkünüzün olmadığını ve
  kendi hizmetiniz ve emeğinizle geçindiğinizi biliyorum. Buradan, komünist ihtilal olsa bile sizin hiçbir şey
  kaybetmeyeceğiniz sonucu çıkmaktadır.
quote_kind: original-turkish
summary: >-
  Kemal ile görüşmelerinde Türkiye'nin mücadelesini devlet sosyalizmine doğru ilerleyen ulusal-demokratik bir
  hareket olarak nitelendirdi ve mülksüz Paşa'nın komünist bir devrimden hiçbir şey kaybetmeyeceğini söyledi.
caveat: >-
  Rusça bir kaydın Türkçe çevirisi. Çeviri: 'When I speak of power I have you, the Pasha, in mind, and I know
  you have no property and live by your own service and labour. It follows that even if there were a communist
  revolution you would lose nothing.' 4 Ocak 1922'de ikinci bir görüşme izlemiştir.
