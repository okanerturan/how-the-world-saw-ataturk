voice: Aristide Briand
role: Fransa Başbakanı ve Dışişleri Bakanı, Londra Konferansı'nda
quote: >-
  Mustafa Kemal, Fransızlara karşı usulünce kabul görmüş biçimde savaş yürüten açık bir düşmandı.
quote_kind: translated
summary: >-
  Faysal ile masaya oturmayı reddederken, Mustafa Kemal'i Fransa'ya karşı kabul görmüş usullerle savaşan açık
  bir düşman, bir araya gelebileceği onurlu bir düşman olarak nitelendirir.
caveat: >-
