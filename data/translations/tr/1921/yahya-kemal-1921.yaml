voice: Yahya Kemal Beyatlı
role: Milli Mücadele sırasında İstanbul basını için yazan şair ve deneme yazarı
quote: >-
  Bu eser bir şahsın değil bir milletindir. Mustafa Kemal'i bir şahıs zannedenler aldanıyorlar.
quote_kind: original-turkish
summary: >-
  İzmir'e Yunan çıkarmasından bu yana Mustafa Kemal'in artık bir birey değil, ayağa kalkan milletin simgesi
  olduğunu savunur.
caveat: >-
  ÇEVİRİ (bu kaydın): 'This work belongs not to one person but to a nation. Those who take Mustafa Kemal for
  one person are mistaken.' Şöyle devam eder: 'Mustafa Kemal İzmir'e efzunlar çıktığı günden evvel bir fertti.
  O günden beri artık bir fert değil bir timsaldir.' Aynı ifadeler ('Efzunlar' ve 'bir fertdi' imlasıyla),
  anlaşıldığı kadarıyla Atatürk Araştırma Merkezi Dergisi'nden alınmış olan Kanbak (der.), Yahya Kemal
  Beyatlı, s. 78-79'daki 'Atatürk - Yahya Kemal dostluğu' başlıklı yazıda da yer alır. ÇIKARSANAN TARİH: Eğil
  Dağlar onun 1919-1922 yazılarını bir araya getirir; 'Eser', hareketin kendi simgesini Mayıs 1919
  çıkarmasından sonraki 'within one year' zarfında yarattığından söz eder, dolayısıyla yakl. 1920-21'dir;
  kesin gazete ve tarih tespit edilememiştir. 'Onun Sesi'nde Kemal'in bir konuşmasını şatafattan, benlik
  iddiasından ve ihtirastan uzak diyerek över (Eğil Dağlar s. 35). Temaslar: 21 Aralık 1933'te Çankaya'da bir
  barışma yemeği, daha sonraki sofra davetleri ve milletvekili seçilmesi (Kanbak s. 82-84); Afet İnan onun
  Atatürk'ün sofrasında şiirler okuduğunu hatırlatır (Hatıralar ve Belgeler, s. 396). 1938 cenaze yazıları
  bulunamamıştır.
