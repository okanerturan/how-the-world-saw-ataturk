  immediately turned the subject to poetry'); sayfa gösterilmiyor ve görülen 'Va-Nu, 56-67' atfı komşu cümleye
  ait, dolayısıyla görüşme pasajının kesin kaynağı doğrulanmadı. Nâzım'ın görüşmedeki kendi sözleri
  verilmiyor. Tarih bağlamdan (1921, şairlerin Ankara'ya varışı). Zayıf: kitap sayfasına veya Vâlâ Nureddin'in
  anılarına ihtiyaç var. Kontrol: kesit Kemal'in 'I recommend you to write poetry with a purpose' (Va-Nu, 95)
  tavsiyesiyle devam ediyor; şairler 1 Ocak 1921'de İstanbul'dan gemiyle ayrıldı.
