role: Millî Mücadele'ye katılmak üzere Anadolu'ya geçen genç şair
summary: >-
  Ankara'da Vâlâ Nureddin ile birlikte 'iki genç şair' olarak kabul edildi; Kemal sohbeti derhal şiire getirdi.
