voice: Bill Clinton
role: Amerika Birleşik Devletleri Başkanı
quote: >-
  Bir bakıma, bugün hepimiz Kemal Atatürk sayesinde buradayız. Yalnızca Ankara'yı başkent olarak seçtiği için
  değil, yalnızca Ankara'yı sizin başkentiniz olarak seçtiği için değil, Türkiye'nin geleceğini bu gururlu
  meclisin simgelediği demokrasiye adadığı için.
quote_kind: translated
summary: >-
  Atatürk'ü Amerikalıların hayal gücünü cezbeden büyük cumhuriyet kurucusu olarak anar ve salondaki herkesin
  onun sayesinde orada olduğunu söyler.
