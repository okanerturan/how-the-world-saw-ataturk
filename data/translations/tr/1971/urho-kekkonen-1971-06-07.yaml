quote: >-
  Hem bugünkü Türkiye Cumhuriyeti hem de Finlandiya Cumhuriyeti Birinci Dünya Savaşı bağlamında doğmuştur. Bu
  yüzyılın en büyük devlet adamlarından biri, bugün mezarına Finlandiya hükümetinin çelengini koyma onuruna
  eriştiğim Kemal Atatürk idi. O, Anadolu'nun sadık köylülerini bu Ankara şehrine toplamayı ve onları nihai
  zafere ulaştırmayı başardı. Tarihimizde pek çok kader tayin edici evreden geçmiş olan biz Finler, ne
  tereddüt eden ne de korkan ve hayatının sonuna kadar anavatanının geleceğine inanan bir adama tam
  takdirimizi sunabiliriz.
