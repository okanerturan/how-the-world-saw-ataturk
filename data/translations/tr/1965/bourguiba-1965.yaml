  Bire bir eşleşme; konuşmacı, makam ve tarih kitap başlığıyla uyuşmaktadır ('Tunus Cumhurbaşkanı Habib
  Burgiba, 81. Birleşim, 25 Mart 1965' (başlık PDF s. 42'de)). Atıf yapılan özet ifadelerin dayanakları da
  doğrulandı: s. 43'te 'Atatürk'ün mucizesi' ve 'Mustafa Kemal ... bir kahramanın tam örneği'; PDF s. 44'te
