id: bourguiba-1965
voice: Habib Bourguiba
role: Tunus Cumhurbaşkanı
quote: Sakarya Harbi, Sakarya Zaferi, 20 yaşımın en kuvvetli hâtırası olmuştur.
quote_kind: original-turkish
summary: >-
  Sakarya'yı Atatürk'ün mucizesi, Mustafa Kemal'i ise örnek kahraman olarak nitelendirir; ancak Arapların
  çekincesini Atatürk'ün dine karşı tavrıyla açıklar.
caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF s. 43 (basılı s. 32). Konuşma, TBMM tutanaklarında yer aldığı
  şekliyle Türkçe basılmıştır. Çeviri: "Sakarya Savaşı, Sakarya Zaferi, yirmi yaşımın en güçlü hatırası oldu."
  Aynı konuşmada: 'Sizin Kemalist ihtilâliniz ise, bizlere maya oldu' (PDF s. 48, 'Kemalist devriminiz bizim
  için maya oldu') denir ve PDF s. 44'te Arapların tereddüdü 'bu liderin din ve din müessesesine karşı
  takındığı tavırlar'a (bu liderin dine ve din kurumlarına karşı aldığı tavırlar) dayandırılır; Bourguiba ise
  bu 'çok radikal yargılar'a katılmaz. Başlık: 'Tunus Cumhurbaşkanı Habib Burgiba', 25 Mart 1965. Mevcut kişi
  notu onun daha sonraki Kemalist programını kapsamaktadır. Kontrol edenin notu: Bourguiba, Atatürk ve din
  konusundaki 'radikal yargılar'la arasına mesafe koyar; eleştirel bölüm kendi hükmünü belirtmekten ziyade
  Arapların çekincesini açıklamaktadır.
mediated_by: TBMM tutanakları (Türkçe sözlü çeviri)
