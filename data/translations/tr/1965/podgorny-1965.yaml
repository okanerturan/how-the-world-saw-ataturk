id: podgorny-1965
voice: Nikolay Podgorny
role: Sovyet Parlamento Heyeti Başkanı
quote: >-
  Türk Milletinin önderi Kemal Atatürk, o zaman vuku bulan hâdiselerin azametini lâyıkıyla takdir etmişti.
quote_kind: original-turkish
summary: >-
  Atatürk'ün Rus halkına yönelik hayranlık mesajını hatırlatır ve Lenin–Atatürk döneminin iyi geleneklerine
  dönülmesi çağrısında bulunur.
caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF s. 36 (basılı s. 25). Konuşma, TBMM tutanaklarında yer aldığı
  şekliyle Türkçe basılmıştır. Çeviri: "Türk milletinin önderi Kemal Atatürk, o dönemde meydana gelen
  olayların büyüklüğünü hakkıyla takdir etmişti." Podgorny devamında Atatürk'ün Sovyet hükümetine gönderdiği
  mesajı ve 1935 CHP kurultayında Sovyet–Türk dostluğu üzerine söylediği sözü aktarır (PDF s. 38: 'Lenin ve
  Atatürk devrinde doğmuş olan iyi geleneklere dönmek zamanı gelmiştir'). 1965'teki daha iyi ilişkiler kurma
  yönündeki Sovyet girişimine hizmet eder. Kitaptaki başlık: 'Sovyet Parlamento Heyeti Başkanı Nikolay
  Podgorni', 33. Birleşim, 5 Ocak 1965.
