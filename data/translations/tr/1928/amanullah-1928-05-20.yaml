voice: Amanullah Khan
role: Afganistan Kralı
quote: >-
  Sizi bunun yegâne amili bildiğim cihetle Zatı biraderinize karşı büyük bir hissi muhabbet ve halel-i napezir
  bir imtina duymaktayım.
quote_kind: original-turkish
summary: >-
  Ankara'daki ziyafette Atatürk'e kardeşi ve Türkiye'nin dokuz yıllık yükselişinin tek yaratıcısı diye hitap
  etti ve büyük bir sevgi duyduğunu söyledi.
caveat: >-
