voice: Benito Mussolini
role: İtalya Başbakanı (Duce)
quote: >-
  Ekselansları Gazi Mustafa Kemal, Türkiye'ye en yüce nimet ve faydayı bahşetmiş büyük bir şahsiyettir.
quote_kind: translated
summary: >-
  Bir Türk gazeteciye Kemal'in Türkiye'ye en yüce faydayı sağlamış büyük bir şahsiyet olduğunu söyler ve
  Ankara'daki örnek çiftliği över.
caveat: >-
  İkinci elden ve iki kez çevrilmiş; Yunus Nadi mülakatının kendisi (Cumhuriyet, 1928; gün belirtilmemiş)
