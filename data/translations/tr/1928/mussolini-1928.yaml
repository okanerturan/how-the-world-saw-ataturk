  sırada ve Kemal'in onun oğullarına bir hediye gönderdiği yıl geldiğini belirtir; Kasım 1929'da Mussolini,
  Kemal'e bir traktör göndermiştir. 1920'lerdeki Antalya/Anadolu rekabeti bu kaydın kapsamında değildir.
  Çeviri zinciri: Mussolini (İtalyanca) → Yunus Nadi'nin Türkçe mülakatı → Çelebi s. 89 → Doğar 2026'nın
  İngilizcesi; mülakat günü bilinmiyor. Yunus Nadi daha sonra faşist rejimle mali ilişkilere girmiştir
  (1931–32).
