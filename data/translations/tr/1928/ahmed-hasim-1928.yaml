id: ahmed-hasim-1928
voice: Ahmed Haşim
role: Türk sembolist şair (1884–1933), deneme yazarı
quote: >-
  Yüzyıllar süren bir çağı yaşlandıran Adamın yüzü, tıpkı eski tanrılarınkiler gibi, yaşın hiçbir izini
  taşımıyor. … Bu günün benim için büyük nimeti, bu genç ve efsanevi yüzü yakından görmek oldu.
quote_kind: translated
summary: >-
  Atatürk'le Dolmabahçe'de bizzat tanışmasını anlatır: yaşsız, ışıltılı bir yüz; 'yüzyıllar süren bir çağı
  yaşlandıran' adam.
caveat: >-
  Yayımladığı metinleri seçip basan (ve bazı yazıları çeviren) Kemalist bir devlet propaganda yayın organı
  olan Türk Basın Genel Müdürlüğü'nün (Direction Générale de la Presse, İçişleri Bakanlığı) resimli dergisi La
  Turquie kémaliste'te yayımlanmıştır; archive.org'daki la_turquie_kemaliste kaydının OCR metninden
  okunmuştur. Haşim'in ölümünden iki yıl sonra, sayı 10'da (Aralık 1935) 'Quelques essais d'Ahmed Hasim'
  başlığı altında basılan 'Atatürk' adlı kısa denemenin Fransızca çevirisidir; Türkçe özgün metin ve tarihi
  tespit edilememiştir (metin 'geçen hafta' Dolmabahçe'de 'autour de la nouvelle écriture' bir toplantıdan söz
  eder ki bu da Ağustos 1928'deki alfabe istişarelerine işaret eder; doğrulanmamış bir çıkarımdır). OCR'da
  sayfa numarası görünmemektedir. Çevirmen belirtilmemiştir. Şairin kendi yayını değil, Kanıt S (derginin
  seçtiği ölüm sonrası bir çeviri). Kaynak gösterimi: La Turquie kémaliste sayı 10 (Aralık 1935), 'Quelques
  essais d'Ahmed Hasim — Atatürk'. Kontrol: özgün metin Haşim'in Bize Göre (tr.wikisource) eserindeki 'Gazî'
  denemesidir; burada 'Gazi' denir ('Atatürk'ü dergi eklemiştir) ve 'Altı yüz senelik bir devri' (altı yüz
  yıl) ifadesi geçer; bu ifade Fransızcada esnetilerek 'une ère longue de siècles' yapılmıştır. Yeni harfler
  üzerine Dolmabahçe toplantısından hareketle yaklaşık 1928'e tarihlenmiştir (çıkarım).
