voice: Mustafa Sabri Efendi
role: Eski Şeyhülislam; Yarın gazetesi (İskeçe, Batı Trakya) yazarı
quote: Merhum Sultan Vahidüddin'e ve hükümetine Anadolu'da Mustafa Kemal asi geldiği zaman
quote_kind: original-turkish
summary: >-
  Kemal'i Sultan Vahideddin'e karşı bir asi olarak nitelendirir ve devleti dinden ayırmasını dinsizlik sayar.
caveat: >-
  Kahire gazetesi Müsavat'ı ve II. Abdülmecid'i hedef alan 'Sıyrılan İkinci Maske (Abdülmecid Komedisi)'
  başlıklı yazı; basılı metindeki 'Yarı[n], sayı: 23, 23 Haziran 1928, sh: 2-4' kaynak notuyla kapanır. Cümle
  şöyle devam eder: 'Abdülmecid'in bu isyanı gizli ve açık ne derece desteklediğini burada tekrarlamaya gerek
  yoktur'. Bardakçı'nın Şahbaba adlı eserinde (1998 baskısında s. 276, 'âsi' imlasıyla) Albayrak üzerinden
  alıntılanmıştır. Aynı yazıda Sabri, Kemal'in 'dinden devleti ayırması' eyleminin 'dinsizlik' olduğunu, İslam
  dışında dinsiz bir hükümet tasavvur edilebilse de dinsiz bir hilafetin tasavvur edilemeyeceğini yazar (OCR
  biraz bozuk olduğundan mealen aktarılmıştır). 1992 baskısının 172-173. sayfaları. Sabri'nin kendi
  yargısıdır; arşiv bunu onaylamaz.
