voice: Stuttgarter Neues Tagblatt
role: Stuttgart'ta yayımlanan günlük gazete
quote: >-
  Mustafa Kemal Paşa gibi bir adam, Hindenburg'un doğum günü tebriğini kesinlikle atlamamalıydı; üstelik bu
  yıl mantar gibi yerden biten Kemal anıtlarına gösterilen müsamahanın herkese açıkça kanıtladığı üzere,
  kendisi de şahsının onurlandırılmasına çok önem vermektedir.
quote_kind: translated
summary: >-
  İstanbul'dan yıl sonu raporu: Türk-Alman ticari ilişkileri gelişti ancak Kemal, kendi heykellerinden
  hoşlanmasına rağmen Hindenburg'un doğum gününü kutlamayı ihmal etti.
caveat: >-
  Gazetenin İstanbul muhabirinden ('d. Konstantinopel, Ende Dezember 1927') 'Das Jahr 1927 in der Türkei'
  başlıklı yazı, akşam baskısının ön sayfası, 2 Ocak 1928. Bu serzeniş, 1927'de yaklaşık 500 km demiryolunun
  açıldığını ve elektrik santralleri ile fabrikaların 'fast ausschließlich in deutschen Händen' olduğunu
  belirten bir değerlendirmenin sonunda yer alır. Bu ihmali genç bir devlette 'internationale Höflichkeit'
  eksikliği olarak nitelendirir ve Türk halkını barışçıl yeniden inşa sürecindeki başarılarından dolayı 'von
  Herzen' kutlayarak sona erer.
