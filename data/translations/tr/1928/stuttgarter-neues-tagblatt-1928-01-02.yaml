id: stuttgarter-neues-tagblatt-1928-01-02
voice: Stuttgarter Neues Tagblatt
role: Stuttgart'ta yayımlanan günlük gazete
quote: >-
  Mustafa Kemal Paşa gibi bir adam, Hindenburg'un doğum günü tebriğini kesinlikle göz ardı etmemeliydi;
  üstelik bu yıl mantar gibi yerden biten Kemal anıtlarına gösterilen müsamahanın herkese açıkça kanıtladığı
  üzere, kendisi de şahsının onurlandırılmasına fazlasıyla önem verirken.
quote_kind: translated
summary: >-
  İstanbul'dan yıl sonu raporu: Türk-Alman ticari ilişkileri gelişti, ancak Kemal her yerde kendi heykellerine
  müsamaha gösterirken Hindenburg'un doğum gününü kutlamayı ihmal etti.
caveat: >-
  Gazetenin İstanbul muhabirinin ('d.' imzalı) kaleme aldığı 'Das Jahr 1927 in der Türkei' başlıklı yazı,
  akşam baskısının birinci sayfası, 2 Ocak 1928. Bu sitem, 1927 yılında büyük ölçüde Alman firmaları
  tarafından inşa edilen demiryollarını ve sanayiyi öven bir değerlendirmenin sonunda yer alır; yazı, Türk
  halkına barışçıl yeniden inşa çalışmaları için 'von Herzen Glück' dileğiyle sona erer. Hindenburg, 2 Ekim
  1927'de 80 yaşına girmişti.
