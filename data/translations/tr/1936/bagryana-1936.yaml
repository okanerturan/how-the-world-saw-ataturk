quote: Efsane hayat oluyor (yaşasın hayat!), balyoz ve çekiçle dövülmüş bir hayat!
quote_kind: translated
summary: >-
  'Yeni Atlantis' şiirini Kemal Atatürk'e ithaf eder: çölden yeniden doğan Ankara, çekiç ve balyozla dövülmüş
  hayata dönüşen efsane.
