role: İstanbul'daki Robert Kolej ve Amerikan Kız Koleji Başkanı
quote: >-
  Yenilmiş, aşağılanmış, bitkin düşmüş Türkiye halkı, olağanüstü yetenek ve cesarete sahip bir lider buldu. …
  Onun liderliği altında Türkiye halkı işgalcileri denize döktü
quote_kind: translated
summary: >-
  Atatürk'ü, yeni doğmuş ulusun yaşam gücünü kavrayıp işgalcileri denize döken olağanüstü cesarete sahip lider
  olarak kabul eder.
