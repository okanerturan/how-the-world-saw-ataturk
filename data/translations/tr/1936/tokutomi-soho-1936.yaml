  metni. Aynı iddia Gendai Nihon to sekai no ugoki'de de yer alır (1931, pid 1268736, 'Kemal Paşa ... da
  Japonya'dan öğrendi'). Bu, Kemal'in kendi görüşünün aktarımı değil, Tokutomi'nin Japonya merkezli
  sahiplenmesidir.
verification_note: >-
  Alıntı s. 110'da (görüntü 65) birebir aynıdır; Mısır, Türkiye ve Hindistan'ın hepsinin Japonya'yı
