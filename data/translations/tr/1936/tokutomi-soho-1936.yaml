voice: Tokutomi Sohō
role: Japon gazeteci-tarihçi, Kokumin Shimbun yayıncısı
quote: >-
  En azından Kemal Paşa, kesinlikle Japonya'yı ideal edinerek ayağa kalkmıştır; bu, asla şüphe götürmez.
quote_kind: translated
summary: >-
  Mısır, Türkiye ve Hindistan'ın Japonya'yı kopyaladığı iddiasının bir parçası olarak, en azından Kemal
  Paşa'nın Japonya'yı ideal edinerek ayağa kalktığında ısrar eder.
caveat: >-
