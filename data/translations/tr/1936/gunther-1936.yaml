role: Amerikalı dış haberler muhabiri; Inside Europe kitabının yazarı
quote: Kamal Atatürk diktatörlerin kabadayısıdır.
quote_kind: translated
summary: >-
  Atatürk'e 'diktatörlerin kabadayısı' (Hitler'e muhallebi çocuğu, Mussolini'ye züppe) der; onu yine de
  çürümüş bir ulusu yeniden yaratan psikopat bir vatansever olarak tanımlar.
caveat: >-
  Bölüm XXXI 'The Turkish Colossus', s. 418-423, Hamish Hamilton gözden geçirilmiş resimli baskısı (1938
  taraması, DLI in.ernet.dli.2015.13600; alıntılanan cümle s. 419'dadır). İlk baskı Ocak 1936: bölümdeki
  'Father of Turks' cümlesinin 1936 basımında yer aldığı yalnızca archive.org kitap içi arama parçacığıyla
  (insideeurope00gunt, ödünç nüsha) doğrulandığından, okunan metin 1938 metnidir. Aynı bölümde: 'The blond,
  blue-eyed combination of patriot and psychopath who is dictator of Turkey'; 'Kamal Ataturk, who strides the
  Turkish landscape like a colossus'; 'This man ... resembles no one so much as Peter the Great'; ve s.
  422'de, 'Other people have created nations. Kamal's job was harder.' Ayrıca 1926 idamlarını ve tokatlanan
  Mısır elçisini sayar ve padişah ile halifeyi kovmasının 'it is no tribute to Kamal' olduğunu söyler.
  Gunther'ın anekdotları (idamların gecesindeki şampanya partisi, tokat olayı) kendi röportaj aktarımlarıdır
  ve burada doğrulanmamıştır. Cümle, 3 Kasım 2026 tarihli archive.org tam metin aramasının gösterdiği üzere
  1936 ilk basımında (Harper, New York; archive.org insideeurope00gunt, ödünç nüsha) ve diğer dört 1936
  nüshasında yer almaktadır; atıf yapılan sayfalar tamamı okunan 1938 gözden geçirilmiş baskısındandır.
