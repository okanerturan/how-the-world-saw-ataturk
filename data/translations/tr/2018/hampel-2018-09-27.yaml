summary: >-
  Atatürk'ü, döneminde Türkiye'nin NATO'nun ve Avrupa'nın Doğu'ya doğru köşe taşı olduğu devlet kurucusu
  olarak nitelendirir; bugünkü Türkiye'nin ise farklı yanıt vereceğini söyler.
