voice: Anwar Ibrahim
role: Malezya Başbakanı
quote: >-
  Elbette benim de güçlü kişisel görüşlerim var, çünkü o liderlik ederken ve yönetimi elinde tutarken, İslam,
  dil değişikliği, yazı ve benzeri konularda benim görüşlerimle bağdaşmadığını düşündüğüm bazı kararlar vardı.
  …fakat bu durum, ülkelerini eritip Avrupalı sömürgecilerin idaresindeki toprakların bir parçası haline
  getirme girişimlerinden kurtarmayı başaran büyük bir şahsiyete ilişkin katkıyı, rolü ve Türkiye halkının
  tutumunu silemez.
