voice: Hans Kannengiesser
role: Alman subay, Gelibolu'da Türk 5. Tümeni komutanı; anı kitabı The Campaign in Gallipoli
quote: >-
  Bu dönemde kendisi hakkında edindiğim izlenim, berrak düşünen, faal, sakin, ne istediğini bilen bir adam
  olduğuydu.
quote_kind: translated
summary: >-
  Gelibolu'daki Kemal'i berrak düşünen, sakin, kendi kendine yeten, ne istediğini bilen bir komutan olarak
  hatırlar; artık 'Türkiye'nin dünyaca ünlü Cumhurbaşkanı'dır.
caveat: >-
  The Campaign in Gallipoli (Hutchinson, İngilizce baskı 1928; Almancası Gallipoli, der Wendepunkt des
  Weltkrieges, 1927), s. 126 (üst başlık '126 THE CAMPAIGN IN GALLIPOLI'); açık tarama
  campaigngallipolikannengiesser. Aynı pasaj: 'Mustapha Kemal Bey is the now world-famous President of
  Turkey'; 'He weighed and decided everything for himself, without looking elsewhere for support or
  agreement'; 'He did not appear to be very strong bodily, although extremely wiry'. Kitaptaki bir levhanın
  altında 'Mustapha Kemal Bey, now Pasha and President of the Turkish Republic' yazmaktadır. s. 48'de
  Kannengiesser, Cavit Bey'in 'for rebelling against the government of Mustapha Kemal Pasha' gerekçesiyle
  asılmasını kaydeder (bir olgu, yargı yok). 5. Tümen'i devralmaya gelmiş ve tüm cephedeki harekâtı Kemal'in
  yürütmesini kabul etmişti. Tarafsız üslup korundu.
