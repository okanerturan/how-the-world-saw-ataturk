voice: Mitsukawa Kametarō
role: Pan-Asyacı aktivist ve yazar, Yūzonsha / Kokuryūkai çevresi
quote: >-
  Kemal Paşa, Türkiye'nin bir vatanseveridir. Bundan dolayı onun gerçekleştirdiği Türk devriminde baştan sona
  vatanseverlik ruhu akmaktadır.
quote_kind: translated
summary: >-
  Kemal'in Lenin ve Gandhi ile birlikte 'üç büyük devrimci' olarak selamlandığını aktarır; Lenin'in
  materyalizminin aksine onun devriminin baştan sona vatansever olduğunu söyler.
caveat: >-
