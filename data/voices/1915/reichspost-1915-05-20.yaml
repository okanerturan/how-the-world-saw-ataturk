date: "1915-05-20"
era: contemporary
polarity: admiring
intensity: 1
artifact: article
evidence: P
summary: >-
  Reported from Constantinople that Turkish infantry 'under the command of Mustafa Kemal Bey' distinguished
  itself in throwing back the Allied assault at Arıburnu.
quote:
  text: >-
    Türkische Infanterie unter dem Befehle Mustafa Kemal Beis zeichnete sich hiebei in hervorragender Weise
    aus.
  translation: >-
    Turkish infantry under the command of Mustafa Kemal Bey distinguished itself here in outstanding fashion.
  language: de
caveat: >-
  The earliest naming of him in the foreign press found so far. Reichspost, 20 May 1915, p. 16, dateline
  'Konstantinopel, 18. Mai': 'Ein Bericht aus dem Hauptquartier in den Dardanellen' on the failure of a
  general Allied attempt to break through at Arıburnu, in which sixteen battalions of Australians and New
  Zealanders attacked and a bayonet counter-attack threw them back. The paper does not say whose headquarters.
  The praise goes to the infantry under his command more than to him, and it is wartime communiqué copy, with
  heavy enemy losses claimed in the next sentence. The first reader saw the same text in Deutsches Volksblatt
  (21 May), Das interessante Blatt (27 May) and Mühlviertler Nachrichten (29 May 1915); those were not
  re-checked. Read in crops of the scanned page; the headline ('Der Durchbruchsversuch bei Ari Burun
  gescheitert') is known from the OCR text only, and the full page sits behind the library viewer's bot check.
