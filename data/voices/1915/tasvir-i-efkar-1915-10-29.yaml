evidence: P
summary: >-
  Front-page portrait caption: a commander of extraordinary service at Çanakkale whose skill in the defence
  saved the Straits and the seat of the Caliphate.
quote:
  text: >-
    Çanakkale muharebât-ı berriyesinde fevkalâde yararlıkları görülen ve emr-i müdafaadaki iktidar ve mahareti
    ile bihakkın ihrâz-ı şan ü şeref eyleyerek Boğazları ve makam-ı hilâfeti kurtaran kumandanlarımızdan
    celâdet-i fıtriye ve havârık-ı hamâset ile mümtaz Miralay Mustafa Kemal Bey Efendi
  translation: >-
    Colonel Mustafa Kemal Bey Efendi, one of our commanders who rendered extraordinary services in the land
    battles of Çanakkale and who, rightly winning glory and honour by his ability and skill in the defence,
    saved the Straits and the seat of the Caliphate; distinguished by inborn valour and prodigies of heroism.
  note: >-
    The page prints it in Ottoman script; the Latin transliteration is this archive's. As printed: چناق قلعه
    محاربات بريه‌سنده فوق‌العاده يارارلقلرى كورولن وامر مدافعه‌ده‌كى اقتدار ومهارتى ايله بحق احراز شان وشرف
    ايليه‌رك بوغازلرى و مقام خلافتى قورتاران قوماندانلرمزدن جلادت فطريه وخوارق حماست ايله ممتاز ميرالاى مصطفى
    كمال بك افندى
  language: ota
caveat: >-
  Tasvir-i Efkâr no. 1589, Friday 29 October 1915 (20 Zilhicce 1333 / 16 Teşrinievvel 1331). The front page
  marks the first anniversary of the Ottoman entry into the war, with matching portraits of Cevat Paşa on the
  left and 'Miralay Mustafa Kemal Bey Efendi' on the right; the two captions are a pair. Wartime press under
  military censorship. An article on the page is signed Yunus Nadi. Read from a 1365-pixel photograph of a
  reproduction of the page; a better scan would be welcome. The later story that the picture was slipped past
  Enver Paşa is anecdote and is not part of this page.
