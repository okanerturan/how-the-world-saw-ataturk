summary: >-
  Turkey's 'great leader' forced Westernisation to end its peripherality: script, veils and fezes scrapped, 'a
  brutal thing to do to people'.
quote:
  text: >-
    The Turks were under the disadvantages, as their great leader, Ataturk, saw it, of being culturally and
    economically peripheral to Europe. He made them scrap the Arabic writing which they used for their
    language, he made them scrap their veils and their fezes, making them dress like western Europeans. That
    was, I suppose, a brutal thing to do to people.
