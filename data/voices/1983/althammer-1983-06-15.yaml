summary: >-
  Defends the Turkish army's tie to Atatürk's principles: the man who led Turkey out of an outdated structure
  towards modern Western development.
quote:
  text: >-
    Das Militär in der Türkei hat eine jahrzehntealte Verpflichtung an die Grundsätze Atatürks, der dieses
    Land aus einer veralteten Struktur herausgeführt und sich bemüht hat, durch seine Grundsätze die Türkei
    einer modernen westlichen Entwicklung zu öffnen.
  translation: >-
    The military in Turkey has a decades-old commitment to the principles of Atatürk, who led this country out
    of an outdated structure and tried through his principles to open Turkey to a modern Western development.
