summary: >-
  Writing on Menderes's fall, calls Mustafa Kemal 'praised by the world' and the creator of a new Turkey of
  renaissance and freedom.
quote:
  text: >-
    குவலயம் புகழப் பணியாற்றிய முஸ்தபா கமால், சமைத்தளித்த புதிய துருக்கியில் எழுச்சி, மறுமலர்ச்சி, விடுதலை
    உணர்ச்சி பூத்திடச் செய்திடும் ஆற்றலையும் பெற்றிருந்தவர்தான், மெண்டாரிஸ்.
  translation: >-
    Menderes was one who also had the power to make revival, renaissance and the feeling of freedom bloom in
    the new Turkey that Mustafa Kamal, who had served to the praise of the whole world, had prepared and
    handed over.
  language: ta
caveat: >-
  Letter 105 ('பெரிய புள்ளிகள்') of 'தம்பிக்கு அண்ணாவின் கடிதங்கள்' vol. 4 (Tamil Arasi Pathippagam, 2003
  edition, as transcribed on ta.wikisource). The page gives no date: the letter discusses the army's seizure
  of Menderes (the Turkish coup of 27 May 1960), so it dates from mid-1960 (an inference). Passing praise
  inside an essay about Menderes; letter 106 (page /003) calls Menderes's rise a 'holy war' under 'Kamal
  Pasha'. Translation is the vault's own. Scan not viewed.
