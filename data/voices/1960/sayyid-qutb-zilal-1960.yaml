summary: >-
  Describes Atatürk's movement as uncompromising in its enmity to everything Islamic and as the removal of the
  last unifying Muslim institution, the Caliphate.
quote:
  text: >-
    The clearest example of these was in the case of Ataturk and his movement in Turkey which was
    uncompromising in its enmity to everything Islamic.
  language: en
mediated_by: >-
  English translation of Fi Zilal al-Qur'an (In the Shade of the Qur'an, Islamic Foundation trans.) as scanned
  on archive.org (Volume1Surah12); Arabic original not read
caveat: >-
  Translation. Commentary on Surah 9 (al-Tawbah), section 'Relations with Other Religions', scan p. 118
  (further remark on p. 120 about Wilfred Cantwell Smith's reading of Atatürk). Zilal was written 1952–65 and
  the surah volumes are undated, so '1960' is an approximate midpoint. Two other passages name him: Surah 6
  (al-An'am) commentary, scan p. 118, 'Kemal Ataturk, the hero of Turkey', and p. 289, 'the false hero they
  created'. In these passages Qutb ascribes the secularising project to Jewish, Christian and Zionist forces;
  that is his attribution and is not endorsed here. Milestones (archive.org MILESTONES_201903,
  milestones-syed-qutb) was searched and does not name Atatürk. Page numbers come from the scan's printed page
  footers.
node: Islamic Thinkers on Atatürk in Their Own Words
