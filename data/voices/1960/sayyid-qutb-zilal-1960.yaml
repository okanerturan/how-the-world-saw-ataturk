    djvu.txt (Islamic Foundation translation, uploader JpnMuslim)
  method: curl of the archive.org djvu texts; located the lines and their printed page footers
  note: >-
    Verbatim in vol. 8 (surah 9, 'Relations with Other Religions'), p. 118 footer: 'The clearest example of
    these was in the case of Ataturk and his movement in Turkey which was uncompromising in its enmity to
    everything Islamic. They needed to reveal its reality because of the urgency they felt to bury the
    Caliphate system which was the last aspect of Muslim unity.' (a line break falls after 'case'). p. 120:
    Wilfred Cantwell Smith, Islam in Modern History, passage verified. Vol. 5 (surah 6): 'Kemal Ataturk, the
    hero of Turkey' (p. 118 footer) and 'the false hero they created' (p. 289 footer) verified. Date '1960' is
    an approximate midpoint, as stored. Hostile polarity and what_they_saw fair; Qutb's attribution of the
    project to outside forces is his own. No correction.
