summary: >-
  Portrays the Ghazi as a lyrical man hardened by love of country, yet judges that only the bourgeoisie gained
  from his revolution.
quote:
  text: >-
    Гази обладал тонкой, лирической натурой. Любовь к родине, народу заставила его выработать в себе суровый,
    стойкий характер, необходимый для беспощадной борьбы с врагами Турции.
  translation: >-
    The Ghazi had a delicate, lyrical nature. Love of country and people made him forge in himself a stern,
    steadfast character, needed for the merciless struggle against Turkey's enemies.
  language: ru
caveat: >-
  S. I. Aralov, Воспоминания советского дипломата. 1922-1923 (Moscow: Institute of International Relations,
  1960), p. 215 (the lyrical-nature portrait, after Kemal asks his wife Latife to play a Tchaikovsky romance
  at the farewell dinner). The same book, p. 211, in the section on Kemal as leader of the new Turkey: 'Но
  надежды эти не оправдались. Выиграла от национальной революции и военных побед освободительной армии только
  буржуазия' (translation: 'But those hopes were not fulfilled. Only the bourgeoisie gained from the national
  revolution and the liberation army's victories') and that Kemal 'не был последователен в борьбе с
  феодалами'. Read in the open archive.org scan (djvu text, page numbers from the scan). Events 1922-23,
  written and published under 1960 Soviet historiography; the book's own preface-level frame is class
  analysis. Aralov's verdict on Kemal's tactical genius and on the communists' repression is not in the quoted
  passages.
