  The same portal page prints a further excerpt from Kashf al-Asrar (p. 189) that does not name Atatürk. Kashf
  al-Asrar (1943) itself was not read for this round. Date: Sahifeh vol. 3 (English) covers Oct 1973 – Oct
  1978 and p. 309 falls before the 18 Feb 1978 speech, so probably 1977–78; the portal names no occasion.
