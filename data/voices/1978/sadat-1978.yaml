caveat: >-
  Memoir written 1975-77, so the admiration is retrospective, and Sadat wrote it as president after breaking
  with Nasser's legacy. The earlier Zahran passage (about p. 12) says there was a photograph of Atatürk in the
  family's Cairo house, that his father called him 'a great man', and that 'Kemal Atatürk was idealized in the
  Islamic world; his name was familiar as a leader who wanted to liberate and rebuild his country.' Sadat also
  names H. C. Armstrong's The Gray Wolf as the book he was absorbed in on arriving at the War Ministry. Time
  (20 Mar 1978) says the same at second hand. Snippets are OCR (the name prints as 'Atatiirk' in some);
  intensity 3 on the strength of the career-long ideal he describes, not on page-checked text. The 'photograph
  of Atatürk in the family home' detail is unverified and not part of this record.
node: Postwar and Third World Leaders on Atatürk in Their Own Words
