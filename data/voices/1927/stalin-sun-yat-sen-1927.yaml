summary: >-
  Defined a Kemalist revolution as a top-stratum revolution of the national merchant bourgeoisie, turned
  against peasants and workers, and unsuitable for China.
quote:
  text: >-
    A Kemalist revolution is a revolution of the top stratum, a revolution of the national merchant
    bourgeoisie, arising in a struggle against the foreign imperialists, and whose subsequent development is
    essentially directed against the peasants and workers, against the very possibility of an agrarian
    revolution.
  language: en
caveat: >-
  Gaze is on 'the Kemalist revolution' as a type, used as a foil for China, not on Mustafa Kemal personally.
