caveat: >-
  Article 'Cuhela Marifetleri' (printed pp. 306-310 (quote p. 308) of Albayrak's edition; the OCR reads 'Nasil
  ki ... hükü- met'). The speech is Mustafa Kemal's Dolmabahçe address of July 1927, in which, as Sabri
  reports it, he said the palace now belonged to the nation, not to 'Zıllullah'; Sabri quotes Ağaoğlu Ahmed in
  Milliyet, 7 July 1927 ('Mustafa Kemal Allah'ın gölgesi değil, milletin gölgesidir'). Sabri then adds that
  he, unlike others, is not afraid of Mustafa Kemal when he criticises his words. DATE UNCERTAIN: the closest
  source note in Albayrak's print is 'Yarın, sayı: 2, 29/7/1927, sh: 2-3', which sits at the end of the next
  piece, so the issue of this article is inferred, year only. Sabri's own judgment; the vault does not endorse
  it. Check: the source note '(Yarın, sayı: 2, 29/7/1927, sh: 2-3)' closes this article (printed p. 310), so
  the date is stated; pages are printed pp. 306-310, quote p. 308.
