summary: >-
  Recalls Kemal at Gallipoli as a clear-thinking, quiet, self-reliant commander who knew what he wanted; now
  'world-famous President of Turkey'.
quote:
  text: >-
    The impression that I gained of him during this period was that of a clear-thinking, active, quiet man who
    knew what he wanted.
  language: en
caveat: >-
  The Campaign in Gallipoli (Hutchinson, English edition 1928; German Gallipoli, der Wendepunkt des
  Weltkrieges, 1927), p. 126 (running head '126 THE CAMPAIGN IN GALLIPOLI'); open scan
  campaigngallipolikannengiesser. The same passage: 'Mustapha Kemal Bey is the now world-famous President of
  Turkey'; 'He weighed and decided everything for himself, without looking elsewhere for support or
  agreement'; 'He did not appear to be very strong bodily, although extremely wiry'. A plate in the book is
  captioned 'Mustapha Kemal Bey, now Pasha and President of the Turkish Republic'. On p. 48 Kannengiesser
  records the hanging of Djavid Bey 'for rebelling against the government of Mustapha Kemal Pasha' (a fact, no
  judgement). He had come to take over the 5th Division and agreed that Kemal should conduct the action over
  the whole front. Neutral voice kept.
node: Soldiers on Mustafa Kemal in Their Own Words, 1915–1940
