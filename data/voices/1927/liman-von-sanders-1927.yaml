caveat: >-
  Five Years in Turkey (English translation, US Naval Institute, 1927), p. 86 (running head '86 FIVE YEARS IN
  TURKEY'); open DLI scan in.ernet.dli.2015.24341. Same passage, p. 85: 'Mustapha Kemal, who earned his first
  military laurels in Cyrenaica, was a leader that delighted in responsibility' (OCR reads 'reponsibility').
  His farewell order of 31 Oct 1918 (p. 320) hands over to 'H. E. General Mustapha Kemal' 'proved in many a
  glorious battle'. The German original is Fünf Jahre Türkei (1920). In the same book Liman says Kemal 'did
  not want' the Seventh Army command in 1918 and 'did not keep it'. He writes as Kemal's commander and later a
  defeated ally; no later verdict on the president.
node: Soldiers on Mustafa Kemal in Their Own Words, 1915–1940
