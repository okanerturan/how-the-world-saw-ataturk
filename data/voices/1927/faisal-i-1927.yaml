summary: >-
  Told Turkey's ambassador in London he followed its reforms, could only revere the Gazi's genius, and that
  Turkey would be every Asian nation's model.
quote:
  text: Bütün Asyaî milletlere nümune-i imtisal olacağınız şüphesizdir.
  language: tr
mediated_by: >-
  Saygı, Yalova Sosyal Bilimler Dergisi 7/15 (2017) p. 215 ← Balkaya 2015 p. 572 (Turkish diplomatic report of
  the London conversation)
caveat: >-
  Translation: 'There is no doubt that you will be a model to be followed by all Asian nations.' Same passage:
  'it is not possible ... not to revere [the Gazi's] genius' and he had not expected such results at the start
  of the national movement. Words reach us through a Turkish envoy's report, at two removes.
node: Statesmen and Royals in Contact with Kemal, 1919–1938
