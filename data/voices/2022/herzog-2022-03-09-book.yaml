  'let us sincerely embrace the many truths of the promise of a safer, more stable world'. Cumhuriyet is dated
  10 Mar 2022; the visit date 9 Mar 2022 is taken from the Turkish Wikipedia visitor list, so check against an
  agency stamp. Cumhuriyet and Yurt Gazetesi are the same AA copy.
