summary: >-
  A distinguished leader and wise statesman who loved his people and became the symbol of the modern Turkish
  state.
quote:
  text: >-
    Modern Türkiye Cumhuriyeti'nin kurucusu Mustafa Kemal Atatürk'ün mozolesinin önünde saygıyla dururken,
    seçkin bir lider ve devlet adamını selamlamaktan onur duyuyorum. Halkını seven, ona sevgi ve saygı
    gösteren, politikası, ileri görüşlülüğü ve mücadelesi ile çağdaş, ileri bir devlet olarak kurulan çağdaş
    Türk devletinin simgesi haline gelen seçkin lider ve bilge devlet adamı.
  translation: >-
    Standing in respect before the mausoleum of Mustafa Kemal Atatürk, founder of the modern Republic of
    Türkiye, I am honoured to salute a distinguished leader and statesman — a distinguished leader and wise
    statesman who loved his people and showed them love and respect, and who through his policy, foresight and
    struggle became the symbol of the modern Turkish state, founded as a modern, advanced state.
  is_translation: true
  language: tr
mediated_by: "Anadolu Agency, 1 Feb 2022: Turkish rendering of the entry"
caveat: >-
  Probably written in Arabic; original not seen. The entry goes on to praise Atatürk's successors for
  preserving his legacy.
