summary: >-
  Offers Mustafa Kemal as a model for coal-state members of Congress: a 'fervent patriot' banished for his
  views who later became Ataturk and President.
quote:
  text: >-
    He was a fervent patriot who as a youth learned that his political views were not acceptable to incumbent
    government leaders; in fact, he was at one time banished to Damascus for publicly expressing his views.
  language: en
caveat: >-
  From an address to the American Mining Congress (Cincinnati) printed in the Extensions of Remarks; an
  analogy for the coal industry's lobbying ('we took somewhat the same course of action that Mustafa Kemal
  followed'), so Atatürk is a vehicle for the speaker's point. Two-column OCR; quote rebuilt from the
  interleaved lines. Cited as Extensions of Remarks, 7 May 1956, Congressional Record vol. 102 (bound), p.
  ~7669 (granule CRECB-1956-pt6-6-3). Page 7679; his own address to the American Mining Congress, inserted by
  him.
