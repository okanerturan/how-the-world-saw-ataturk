evidence: J
summary: >-
  'The great Atatürk', whose deep friendship with his father Reza Shah he reveres; the two 'great guides' who
  built Iranian–Turkish friendship on a solid foundation.
quote:
  text: >-
    Merhum hükümdar pederimle büyük Atatürk arasındaki derin dostluk râbıtaları, benim için daima şâyânı
    hürmet olmuştur. Onun için şimdi burada bu iki büyük rehberin hâtıralarını, derin bir heyecanla meşbû
    olarak yâdediyorum. Onların sağlam bir temel üzerine kurmuş oldukları büyük eseri, İran - Türk dostluğunu
    bizler ebedi kılmalıyız.
  translation: >-
    The deep bonds of friendship between my late father the sovereign and the great Atatürk have always
    commanded my respect. So here and now I remember these two great guides with deep emotion. We must make
    eternal the great work they built on a solid foundation, Iranian–Turkish friendship.
  language: tr
mediated_by: "Milliyet, 17 May 1956, p. 1 ('Şâh, Ankara hemşehrisi oldu'): the paper's Turkish rendering"
caveat: >-
  Short speech after Governor Kemal Aygün presented the honorary-citizenship certificate. The day before (15
  May), in a statement to Ankara Radio in Persian, he spoke of a friendship founded 'under the guidance of the
  enlightened ideas and strong hands of the late Reza Shah and the late Atatürk' ('Merhum Rızâ Şâh'ın ve
  merhum Atatürk'ün aydınlık fikirleri ve kavi ellerinin rehberliği ile'; Milliyet 16 May 1956 p. 5, 'Şahın
  demeci'). His Anıtkabir visit (15 May) is narration only. The census's Reza Shah records concern his father.
  Read on the page images (Milliyet's subscriber archive) by a reader agent; re-checked on the crop by the
  main agent.
