id: castro-1997-03-13
voice: Fidel Castro
voice_type: person
role: >-
  President of Cuba; audience for the Turkish health minister's delegation, Palace of the Revolution, Havana
country: Cuba
country_now: Cuba
domain: politics
date: "1997-03-13"
era: posthumous
polarity: admiring
intensity: 2
artifact: meeting
evidence: P+J+J
summary: >-
  A great man and a great soldier who somehow beat the British, a soldier and a thinker who entered history;
  told that Atatürk changed the Turkish script, Castro said he himself could not have made such a change in
  the order of things.
quote:
  text: >-
    "Atatürk büyük insan, büyük asker İngilizleri nasıl yendi?" durakladı... tekrar; "onları nasıl yendi?"
    dedi. "Asker ve fikir adamı Atatürk önemli insan olarak tarihe geçti."
  translation: >-
    Atatürk, a great man, a great soldier — how did he beat the British?' He paused… again: 'How did he beat
    them?' 'Atatürk, soldier and man of ideas, has gone down in history as an important person.
  language: tr
mediated_by: >-
  Mehmet Domaç (president of the Turkish Pharmacists' Association), notes taken during the audience in a
  notebook Castro signed, from the Spanish interpreter Mehmet Necati Kutlu's renderings; printed in TEB
  Haberler, May–June 1997, p. 8
caveat: >-
  Audience of 13 Mar 1997, 22:00–23:50, for Health Minister Yıldırım Aktuna's delegation, which handed him a
  letter from President Demirel. On the alphabet reform Domaç records only: 'Ben [böyle bir] düzen değişikliği
  yapamazdım' ('I could not have made such a change of order'). The wider line 'I made such a great revolution
  but could not achieve what Atatürk did' rests on Aktuna's account to the press after the meeting (Sabah, 15
  Mar 1997; Milliyet the same day, p. 19, 'Castro, irticayı sordu' by Hülya Aydoğan in Havana, which adds that
  he said he knew Atatürk's whole story and had read two of his books: 'Atatürk, iyi bir komutan ve liderdi.
  Büyük bir devrim yaptım, ama ben bile Atatürk'ün yaptığını yapamazdım'), not on Domaç's notes. The official
  delegation report printed in the TBMM record (Term 20, vol. 35, 10th sitting, 5 Nov 1997, p. 89) confirms
  that his questions and remarks on Atatürk's person, the War of Independence and the reforms 'greatly
  impressed the Turkish delegation'. Later wordings ('a star that fell on your country', 'the only leader who
  governed his country even after his death') come from Vecdet Öz's social-media posts of 2020–2023 and are
  not in any 1997 record. Turkish in all three sources; translation by the census.
node: World Leaders on Atatürk — Round 30 Sweep
