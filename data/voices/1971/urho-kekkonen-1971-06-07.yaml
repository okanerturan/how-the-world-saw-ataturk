summary: >-
  One of the greatest statesmen of the century, who 'neither hesitated nor feared' and believed in his
  country's future to the end.
quote:
  text: >-
    Sekä nykyinen Turkin tasavalta että Suomen tasavalta syntyivät ensimmäisen maailmansodan yhteydessä. Tämän
    vuosisadan suurimpia valtiomiehiä oli Kemal Atatürk, jonka haudalle minulla oli tänään kunnia laskea
    Suomen hallituksen seppele. Hän kykeni keräämään Anatolian uskolliset talonpojat tähän Ankaran kaupunkiin
    ja johtamaan heidät lopulliseen voittoon. Me suomalaiset, jotka olemme läpikäyneet historiassamme monia
    kohtalokkaita vaiheita, pystymme antamaan täyden tunnustuksen miehelle, joka ei epäröinyt eikä pelännyt ja
    joka elämänsä päättymiseen saakka uskoi isänmaansa tulevaisuuteen.
  translation: >-
    Both the present Republic of Turkey and the Republic of Finland were born in connection with the First
    World War. Among the greatest statesmen of this century was Kemal Atatürk, on whose grave I had the honour
    today to lay the wreath of the Finnish government. He was able to gather the loyal peasants of Anatolia to
    this city of Ankara and lead them to final victory. We Finns, who have been through many fateful phases in
    our history, can give full recognition to a man who neither hesitated nor feared and who, until the end of
    his life, believed in the future of his fatherland.
  language: fi
caveat: >-
  Finnish text from the President's office typescript (Urho Kekkonen archive, UKK926522 XIX) digitised by the
  National Library of Finland (Doria, handle 10024/7433); read via the Wayback Machine copy because doria.fi
  now sits behind a bot check. Milliyet 8 Jun 1971 p. 1 and p. 9 reports the Anıtkabir visit and that 'both
  heads of state gave speeches praising Turkish–Finnish friendship', without the text. Translation ours.
