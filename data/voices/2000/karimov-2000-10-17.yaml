summary: >-
  Tells Turkish journalists his path is Atatürk's, that he took Atatürk as his model, and that Atatürk's
  enemies in Turkey are his enemies.
quote:
  text: >-
    Kim ki Türkiye'de Atatürk'ün düşmanıdır; o kişi benim de düşmanımdır. Kim ki Atatürk'ü sever; o benim de
    dostumdur. Benim yolum Atatürk'ün yoludur. Kendime Atatürk'ü model aldım.
  translation: >-
    Whoever is Atatürk's enemy in Turkey is my enemy too. Whoever loves Atatürk is my friend. My path is
    Atatürk's path. I took Atatürk as my model.
  is_translation: true
  language: tr
mediated_by: Hürriyet, 18 Oct 2000, and Cumhuriyet, 18 Oct 2000 p. 10 (Turkish press renderings)
caveat: >-
  Said in Tashkent during President Sezer's visit, at the Timurid History Museum, the day Sezer left for
  Turkmenistan. Cumhuriyet's wording differs: 'Büyük Kemal Atatürk'ün yolu bizim için makbul yol... Türkiye'de
  kim ki Kemal Atatürk'e karşı çıkarsa, o bana karşı çıkmış demektir.' In the same remarks he praises the
  Turkish General Staff's fight against 'irtica' and complains of Uzbek Islamist exiles in Istanbul; his
  secular authoritarianism frames the praise. A 1998 statement ('follows Ataturk's precepts', Jamestown
  Monitor 14 Apr 1998, agencies) is single-source and not staged.
node: World Leaders on Atatürk — Round 30 Sweep
