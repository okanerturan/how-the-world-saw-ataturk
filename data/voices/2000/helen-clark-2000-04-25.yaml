summary: >-
  The inspired leader of the Turkish defence at Gallipoli, whose generosity towards the allied dead founded
  the friendship between Turkey and New Zealand.
quote:
  text: >-
    Ataturk's words of comfort to the parents of those who died here helped our nations adjust to the trauma
    of Gallipoli. His generosity of spirit in accepting those who had fallen as sons of Turkey to be cared for
    here laid the foundation for bonds of friendship between our countries. […] I also want to pay tribute to
    the steadfast courage of the Turkish soldiers who, under the inspired leadership of Ataturk, fought so
    bravely to defend their country.
  language: en
caveat: >-
  Government speech texts republished on Scoop. Her message for the 125th anniversary of his birth (read by
  the NZ ambassador at the Ataturk Society of America, Washington, May 2006): 'Kemal Ataturk will always have
  a special place in history as that remarkable soldier who led the defence of his country on the Gallipoli
  Peninsula and who went on to found the modern Turkish republic. It is not only in Turkey that this great
  statesman is remembered.'
