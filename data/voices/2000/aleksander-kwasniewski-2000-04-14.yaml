summary: >-
  The founder of modern Turkey, 'a great political realist, but also a preeminent visionary', whose reforms
  set Turkey on its pro-European road.
quote:
  text: >-
    …the city so closely linked with the founder of modern Turkey, Mustapha Kemal Ataturk who was a great
    political realist, but also a preeminent visionary. […] When Poland regained independence, and Turkey,
    having made a pro-European choice, started to move along the road of reforms introduced by a great man,
    Mustapha Kemal Ataturk - we reestablished our bilateral ties.
