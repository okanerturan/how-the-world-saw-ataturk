summary: >-
  Says the Turks have embraced Australians in peace and that Atatürk's words about Johnnies and Mehmets 'speak
  to us still down the ages'.
quote:
  text: >-
    the words of Ataturk (who saw no difference between our Johnnies and their Mehmets) speak to us still down
    the ages.
  language: en
caveat: >-
  The line adopts the Anzac-legend attribution without hedging. In a 2008 Lone Pine planting speech (PM
  Transcripts 16100, 4 September 2008) Rudd likewise says Turkey's leader Kemal Ataturk 'offered solace to the
  parents of those young Australians' in 1934. The 'Johnnies and Mehmets' / 'your sons are now lying in our
  bosom' text that Anzac speakers attribute to Atatürk is itself contested: no 1934 original has been found,
  it first appears in print in 1953 via Interior Minister Şükrü Kaya's recollection, and the 'Johnnies and
  Mehmets' clause is a 1978 Australian addition (see [[Johnnies and Mehmets]]). So this is a speaker's view of
  the Atatürk of the Anzac legend, spoken at a commemorative or diplomatic occasion that rewards praise. Cited
  as: Speech at the Anzac Day national ceremony, Australian War Memorial, Canberra, 25 April 2010.
node: Anzac Day Leaders on Atatürk, 1990–2024 — Australian and New Zealand Speeches
