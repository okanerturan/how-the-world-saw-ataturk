summary: >-
  Supports Turkey's path toward Europe and says Atatürk opened that road; closes by quoting his peace maxim.
quote:
  text: >-
    …hofft, dass Sie den Weg nach Europa fortsetzen, der durch Ihren großen Staatsmann Mustafa Kemal Atatürk
    geöffnet worden ist.
  language: de
caveat: >-
  Original-language text
  (https://www.bundespraesident.de/SharedDocs/Reden/DE/Christian-Wulff/Reden/2010/10/20101019_Rede.html); the
  TBMM minutes (Tarihe Düşülen Notlar-2, 2012) print a Turkish version: "bu yol Büyük Mustafa Kemal Atatürk
  tarafından açılmıştır.". TBMM book PDF p. 285 (printed p. 274). English: '…hopes that you will continue on
  the road to Europe opened by your great statesman Mustafa Kemal Atatürk.' Closes with Atatürk's 'peace at
  home, peace in the world'.
