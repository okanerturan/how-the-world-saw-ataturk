summary: >-
  'A remarkable statesman and soldier', a 'great, fearless Turkish hero' whose words to the mothers of the
  Gallipoli dead taught forgiveness.
quote:
  text: >-
    These truly remarkable words, by a remarkable statesman and soldier, written when the searing memory and
    bitterness of that so called "Great War" was still fresh and raw in peoples' minds, is a testament not
    only to the man, but to the generosity of spirit of the Turkish people. […] Only a soldier who has
    witnessed at first hand the traumatic heat and horror of battle could have uttered such gracious and
    healing remarks. […] It was that great, fearless Turkish hero Mustafa Kemal Ataturk who long ago showed us
    that the way to that peace lay in seeing all those who died as brothers.
  language: en
caveat: >-
  The 1934 'Johnnies and Mehmets' text she praises is of disputed authorship (possibly drafted by Şükrü Kaya);
  her own judgment of the man is clear. Her Ankara state-dinner toast of 23 Mar 2010 does not mention Atatürk.
  Read on Wayback copies (president.ie is behind a bot check).
