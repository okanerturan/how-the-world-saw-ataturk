summary: >-
  Writing for Turkish readers before his visit, says he deeply respects Atatürk as an outstanding reformer
  whose contribution to new Turkey cannot be overestimated.
quote:
  text: >-
    У меня вызывает глубокое уважение личность Мустафы Кемаля Ататюрка – выдающегося реформатора, вклад
    которого в создание новой Турции трудно переоценить. [English translation (Kremlin): I feel great respect
    for Mustafa Kemal Ataturk, an outstanding reformer whose contribution to building modern Turkey cannot be
    overestimated.]
  needs_split: true
  language: ru
caveat: >-
  Article 'Россия – Турция: не останавливаясь на достигнутом' for the Turkish daily Zaman, published on
  kremlin.ru on 10 May 2010 (English version dated 9 May). The next sentence turns to Russia as the first
  country to recognise the young Republic and its aid in the independence war. His Anıtkabir book entry on 12
  May (kremlin.ru news 7720) adds that Atatürk 'helped to develop all-round relations with Russia'.
