date: "1916-08-14"
era: contemporary
polarity: admiring
intensity: 1
artifact: article
evidence: P
summary: >-
  Its Sofia telegram credited the victories at Bitlis and Muş to the 'exceedingly energetic' General Mustafa
  Kemal Pasha, well remembered in Bulgaria as military attaché.
quote:
  text: >-
    Die türkischen Erfolge gegen die Russen bei Bitlis und Musch wurden von der türkischen Armee errungen,
    welche der überaus energische General Mustafa Kemal Pascha befehligt. Dieser steht in Bulgarien als
    gewesener Militärattaché in bester Erinnerung.
  translation: >-
    The Turkish successes against the Russians at Bitlis and Muş were won by the Turkish army commanded by the
    exceedingly energetic General Mustafa Kemal Pasha. He is very well remembered in Bulgaria as the former
    military attaché.
  language: de
caveat: >-
  Item headed 'Mustafa Kemal Pascha Kommandant der Kaukasusarmee.', dated Sofia, 13 August, in the Neue Freie
  Presse of 14 August 1916, p. 6. The headline overstates his post: he commanded a corps on that front.
  Unsigned, and whose memory 'in Bulgaria' is meant is not said. It is the only trace of his years as attaché
  in Sofia (1913–14) found in print from before 1919. The first reader also saw it reprinted in the
  Militärische Rundschau (23 September 1916) and Die Presse of Thorn (19 August 1916); those were not
  re-checked. Read on the whole page in the library's viewer; the line '[Telegramm der „Neuen Freien
  Presse“.]' under the headline marks it as the paper's own telegram.
