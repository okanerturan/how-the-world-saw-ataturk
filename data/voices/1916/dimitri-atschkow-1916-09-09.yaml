voice: Dimitri Atschkow
voice_type: person
role: >-
  Bulgarian deputy; the paper calls him a well-known Macedo-Bulgarian politician, a member of the Macedonian
  executive committee and a figure in the Stambolov party. Interview in the Neue Freie Presse
country: Bulgaria
country_now: Bulgaria
domain: politics
date: "1916-09-09"
era: contemporary
polarity: instrumental
intensity: 1
artifact: quote
evidence: P
summary: >-
  Named Mustafa Kemal among Turkey's outstanding leaders: of Macedonian origin, distinguished at the
  Dardanelles, a general while young, who repelled the Russians.
quote:
  text: >-
    Mustafa Kemal, der mazedonischer Herkunft ist, bekam, nachdem er sich bei der Verteidigung der Dardanellen
    ausgezeichnet hatte, noch als junger Mann den Generalposten als Kommandierender des 16. Armeekorps. Dank
    seinen militärischen Talenten gelang es ihm, die türkischen Waffen mit Ruhm zu bedecken, indem er die
    großen russischen Angriffe bei der Diarbekirfront abwehrte.
  translation: >-
    Mustafa Kemal, who is of Macedonian origin, received, after distinguishing himself in the defence of the
    Dardanelles, while still a young man the general's post of commander of the 16th Army Corps. Thanks to his
    military talents he succeeded in covering Turkish arms with glory by repelling the great Russian attacks
    on the Diyarbekir front.
  language: de
caveat: >-
  Interview headed 'Die Befreiung der Dobrudscha durch den Sieg bei Tutrakan. Die Waffenbrüderschaft zwischen
  Bulgaren und Türken. Unterredung mit Dimitri Atschkow. Bulgarischer Abgeordneter.', dated 'Wien, 8.
  September.', in the Neue Freie Presse of 9 September 1916, p. 2, on the brotherhood in arms of Bulgarians
  and Turks; the paper introduces him as 'Der bekannte mazedo-bulgarische Politiker Dimitri Atschkow, der sich
  seit einigen Tagen in Wien aufhält'. A closing note adds that he sits on the Macedonian executive committee,
  is a well-known figure in the Stambolov party, fought on the Macedonian front and was decorated after
  Krivolak, took part in the Balkan War and worked for the rapprochement of Turkey and Bulgaria. That matches
  Dimitar Achkov of Prilep (born 1869), whose Bulgarian Wikipedia biography has the same committee seat,
  Balkan War service and wartime decoration; the identification is the archive's. The same biography cites a
  2006 newspaper article and a 2007 book for a friendship between Achkov and Mustafa Kemal; those were not
  opened, and the interview itself does not say they knew each other. He names him second, after 'der
  türkische Nationalheros Enver Pascha', as proof of Enver's gift for finding the right men; the praise serves
  the theme of the interview. 'Diarbekirfront' and a general's post 'while still a young man' are his loose
  wording. Read on the whole page in the library's viewer, set in Fraktur.
