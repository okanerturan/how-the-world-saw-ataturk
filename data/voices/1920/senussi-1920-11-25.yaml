  - url: https://archive.org/details/butuneserler/Atat%C3%BCrk%27%C3%BCn%20B%C3%BCt%C3%BCn%20Eserleri%20-%20Cilt%2011%20%281921%29%20-%20Kaynak%20Yay%C4%B1nlar%C4%B1%2C%202005%20%282.%20Bas%C4%B1m%29%2C%20452%20sf.pdf
verification:
  verdict: confirmed
  checked_against: >-
    archive.org butuneserler, djvu text of ABE vol. 10, pp. 117–119 (banquet speech, 25 Nov 1920; ← Hâkimiyeti
    Milliye 27 Nov 1920); ABE vol. 11 p. 202 (to the Sheikh at Diyarbekir, 12 Jun 1921; ← Hâkimiyeti Milliye
    14 Jun 1921)
  method: archive.org open djvu text read
  note: >-
    As cited. The editors' note says he arrived 15 Nov 1920 as the Assembly's guest, 'Kurtuluş Savaşı'nı
    yakından izleyen, çeşitli vesilelerle Türkleri destekleyen'. In the speech Kemal says that on 16 March the
    Sheikh blessed the course taken and urged them on, and has worked with them since. The 1921 telegram is a
    Ramazan Bayramı (Eid) greeting with prayers for the country's salvation; 'Ramadan telegram' in the caveat
    is loose. A major religious leader, a meeting of substance and support shown by his acts, so it passes.
    Admiring rests on Kemal's account plus the editors' note, and the caveat says so.
  resolution: corrected 2026-11-05 — see LEDGER § Source-check corrections (round 31)
  checked_on: "2026-11-05"
