id: senussi-1920-11-25
voice: Ahmed Sharif as-Senussi
voice_type: person
role: Head of the Senussi order, guest of the Grand National Assembly
country: Libya (Senussi order, in exile in Anatolia)
country_now: Libya
domain: religion
date: "1920-11-25"
era: contemporary
polarity: admiring
intensity: 2
artifact: meeting
evidence: J+S
summary: >-
  Came to Ankara as the Assembly's guest; at the banquet Kemal thanked him for urging the nationalists on
  after 16 March 1920 and serving since.
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 10 (Kaynak 2004) pp. 117–119 ← Hâkimiyeti Milliye 27 Nov 1920; vol. 11 p. 202
  ← Hâkimiyeti Milliye 14 June 1921
caveat: >-
  His support is attested by Kemal's banquet speech (25 Nov 1920) and by his own Eid (Ramazan Bayramı)
  greeting telegram of June 1921 praying for the struggle's success, summarised in Kemal's reply; his own
  words are not printed. Kemal recalled seeing the Senussis' work in Libya himself; a sword he gave hung in
  Kemal's study (Vakit, 10 Jan 1922, ABE vol. 12).
node: Statesmen and Royals in Contact with Kemal, 1919–1938
sources:
