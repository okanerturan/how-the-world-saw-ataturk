summary: >-
  Kemal's Nationalists as one of three threats to Mesopotamia; their junction with the Bolsheviks would be
  'formidable'.
quote:
  text: >-
    There are the Turkish Nationalists under Mustapha Kemal, who repudiate the authority of the Government at
    Constantinople so far as it is convenient to them to do so. […] the Bolshevik forces will be in close
    touch with the doubtful Republics of Azerbaijan and Georgia, and not only with them, but also with the
    hostile forces of Mustapha Kemal. On military grounds this junction is formidable.
  language: en
caveat: >-
  A threat assessment in his reply on the Army Estimates (Number of Land Forces), within a survey of the
  Middle East; he adds that it 'is not certain that it will necessarily be followed by the ordinary military
  consequences'.
