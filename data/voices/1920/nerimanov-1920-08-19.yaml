  method: archive.org open djvu text read
  note: >-
    Quote faithful. The OCR reads 'makstdunuza çatmak!'; the '!' is a footnote marker and the normalisation is
    honest. The letter was carried by 'Yoldaş Halil Paşa' and read out at Kemal's request ('okunacak'). Kemal
    proposed a reply and a congratulation, and the Assembly approved unanimously. The text names 'İngiltere ve
    onun kuvvetiyle yaşayış eden Avrupa emperyalisti', which supports what_they_saw. The ABE contents page
    calls it a 'telgraf' and the text calls it a 'mektup'; 'letter' is right. Nerimanov is a head of
    government with a stated view, so it passes.
