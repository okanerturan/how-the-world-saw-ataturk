  note: >-
    Quote verbatim. what_they_saw overstates slightly: Pinon says the plot has three centres (Moscow,
    Constantinople, Berlin) and that 'sous le masque d'un insurgé, Mustapha Kemal est le véritable chef du
    gouvernement' (the Young-Turk government in Constantinople), not that Kemal heads the whole plot. Suggest:
    'real head of the Young-Turk government behind the Moscow-Constantinople-Berlin plot'. Date 1920 only
    (issue not printed).
