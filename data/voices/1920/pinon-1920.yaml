summary: >-
  Treats Kemal as continuator and accomplice of Enver, Talaat and Djemal, and 'the real head of the
  government' in a three-centred plot.
quote:
  text: Mustapha Kemal est le continuateur et le complice des Enver, des Talaat et des Djemal.
  translation: Mustapha Kemal is the continuator and accomplice of the Envers, Talaats and Djemals.
  language: fr
caveat: >-
  Cited as Pinon, 'L'Offensive de l'Asie', Revue des Deux Mondes, 6e période, tome 56 (1920), pp. 799–815,
  quote on p. 808 (the 'masque d'un insurgé' line on p. 813). Wikisource transcription; the piece is dated by
  the tome (March–April 1920, so 1920), the exact issue is not printed. Written before the Ankara Assembly's
  victories; Pinon's reading is the 'Unionists in disguise' thesis of the Allied press in 1920, which he
  states as fact.
node: >-
  French Pens on Kemal, 1920–1944 — Herriot, Pernot, Pinon, Delarue-Mardrus and Franklin-Bouillon
