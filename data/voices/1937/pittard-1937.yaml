  note: >-
    Both passages verbatim. Referent is clear: the address opens 'Monsieur le Président de la République', the
    same issue reports the congress opened 20 Oct 1937 'en présence d'Atatürk', and the second quote is the
    explicit homage to 'Monsieur le Président de la République Turque, chef suprême de cet Etat'; but Atatürk
    is never named in the address, so say so in the caveat (already done). Courtesy speech: 'instrumental'
    would be as defensible as admiring. Date 1937-10 acceptable (address on the opening day).
