summary: >-
  The greatest soldier of the Ottoman army; like Edward VIII a man of action 'filled with a new, live spirit',
  free of obsolete conceptions.
quote:
  text: >-
    […] none other than Mustafa Kemal, the greatest soldier in the Ottoman Army and Enver's most unrelenting
    opponent. […] men of action, both filled with a new, live spirit, free from all prejudices and burdens and
    obsolete conceptions.
  is_translation: true
  language: en
caveat: >-
  Quoted from the English translation by Kenneth Kirkness (London, 1937), pp. 61 and 250; the German original
  was not seen. On p. 61 the phrase reports whom a conspirator named as Enver's successor. The p. 250 passage
  describes Kemal's meeting with Edward VIII in September 1936 and calls him 'his former Majesty', so it was
  written after the abdication of December 1936.
