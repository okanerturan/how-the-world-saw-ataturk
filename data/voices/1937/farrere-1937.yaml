    ötürü onu suçlu bulmuyorum.' The source is the Turkish translation by Orhan Bahaeddin (title page), second
    work in the volume ('Türkiye'nin Manevi Kuvvetleri', which the Tercüman introduction says first appeared
    in 1937); the French original and its date were not seen, so 1937 is second-hand. Page: the quote lies
