summary: >-
  Approves Gazi Mustafa Kemal's modernizing and forgives his mistakes as the price of doing anything; faults
  the republicans for scorning their Ottoman ancestors.
quote:
  text: Bu bakımdan Gazi Mustafa Kemal'i tasvip ediyor ve hatalarından ötürü onu suçlu bulmuyorum.
  language: tr
mediated_by: >-
  Orhan Bahaeddin's Turkish translation (Tercüman '1001 Temel Eser', 1970s); the French original was not seen
caveat: >-
  TRANSLATION, quote is the Turkish text; in English: 'In this respect I approve of Gazi Mustafa Kemal, and I
  do not hold him guilty for his mistakes.' From the second work in the volume, Türkiye'nin Manevi Kuvvetleri
  ('The Moral Forces of Turkey'), which the Tercüman introduction says was first published in 1937; the page
  is printed 212, in a passage where Farrère adds that Turkish women have nothing to complain of 'but that
  does not mean there is nothing for them to complain of'. Same book, p. 209-210: he deplores that 'Gazi
  Mustafa Kemal - let us call him Atatürk from now on - and the republican Turks began to despise their
  forefathers' heritage' ('Buna hakları yok'), and mocks the change of the battleship Yavuz Sultan Selim to
  plain Yavuz. Evidence S rather than P because it is a translation of a book whose French text was not read;
  the dating to 1937 rests on the editor's note. Not yet found: the French title and edition (Farrère's 1937
  volume).
node: Famous Pens on Atatürk II — Farrère, Halide Edib, Toynbee, Pamuk, Nesin
