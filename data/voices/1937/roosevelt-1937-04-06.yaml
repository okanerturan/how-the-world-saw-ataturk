summary: >-
  After watching Julian Bryan's film of Turkey at the White House, wrote Atatürk of his enthusiasm at
  astonishing changes made so quickly; hoped to meet.
quote:
  text: >-
    Nispeten kısa bir zamanda meydan getirdiğiniz pek çok hayret verici hususları görünce, hissettiğim şevk ve
    heyecanı size arz etmek istedim.
  language: tr
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 29 (Kaynak 2011) p. 228 fn. 2 ← Şimşir, Atatürk ve Yabancı Devlet Başkanları
  vol. 1 (1993) pp. 259–260, 718–719 (English original, Turkish Foreign Ministry archive)
caveat: >-
  Turkish translation of an English letter; 'meydan' is as printed (read 'meydana'). Translation: 'Seeing the
  many astonishing things you have brought about in a relatively short time, I wanted to tell you of the
  enthusiasm I felt.' He also enjoyed the film of Atatürk playing with his small daughter and the stamps
  Atatürk sent. Atatürk replied 25 May 1937. Check: Şimşir's English text of the reply is dated 6 June 1937.
node: Statesmen and Royals in Contact with Kemal, 1919–1938
