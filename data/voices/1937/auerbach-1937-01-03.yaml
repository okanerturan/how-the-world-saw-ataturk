id: auerbach-1937-01-03
voice: Erich Auerbach
voice_type: person
role: German Romance philologist, professor at Istanbul University (author of Mimesis)
country: Turkey (German exile)
country_now: Turkey
domain: letters
date: "1937-01-03"
era: contemporary
polarity: conflicted
intensity: 2
artifact: letter
evidence: P
summary: >-
  Called Atatürk a likeable, clever autocrat who truly made the country a state, but his result a fanatical
  anti-traditional nationalism destroying national character.
quote:
  text: >-
    The “grand chef” is a sympathetic autocrat, smart, grand, and imaginative, completely different from his
    European counterparts because he has actually himself turned this country into a state and because he is
    absolutely without eloquence.
  translation: Elsky, Vialon and Stein, PMLA 2007
  language: en
mediated_by: >-
  We Refugees Archive edition ← Barck, Zeitschrift für Germanistik 9:6 (1988) pp. 691–692; English: PMLA 122:3
  (2007) pp. 750–751
caveat: >-
  Private letter to Walter Benjamin, Istanbul-Bebek, 3 Jan 1937. German original: 'Der grand chef ist ein
  sympathischer Autokrat, klug, großzügig und witzig, vollkommen verschieden von seinen europäischen Kollegen
  ... und das Resultat ist ein fanatischer antitraditioneller Nationalismus.' The PMLA translation renders
  'witzig' as 'imaginative' and 'phrasenlos' as 'without eloquence'. Not a meeting: Auerbach was an employee
  of Kemal's university reform, not a personal contact.
node: Writers, Scientists and Artists in Contact with Kemal, 1919–1938
sources:
