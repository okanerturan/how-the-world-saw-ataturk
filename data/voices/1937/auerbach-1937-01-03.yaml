  method: curl
  note: >-
    English quote verbatim (PMLA translation, curly quotes around 'grand chef' as on the page). The German in
    the caveat matches the original ('Der grand chef ist ein sympathischer Autokrat, klug, großzügig und
    witzig, vollkommen verschieden von seinen europäischen Kollegen'; '... und das Resultat ist ein
    fanatischer antitraditioneller Nationalismus'); 'Nationalismus im Superlativ bei gleichzeitiger Zerstörung
    des geschichtlichen Nationalcharakters' supports the last clause of what_they_saw. Heading
    'Istanbul-Bebek, 3. Januar 1937' matches. Conflicted is right; P is fair for a published edition of the
    letter. Gaze test passes strongly. No correction.
