summary: >-
  A psychological portrait: an able, withdrawn general who mastered his ambivalence about authority, but whose
  personality 'began to blur and decline' in his last decade.
quote:
  text: >-
    The second phase (1923-27) was that of consolidation of his dictatorship, when Kemal was able to relate
    the personal experience of his youth to the cultural situation of Turkey as a whole. The third phase
    (1927-38) included the last decade of his life, when he was the country's unchallenged ruler, but when the
    resources of his personality, so sharply focused earlier, began to blur and decline.
  language: en
caveat: >-
  Read in an open DLI scan of the Popular Prakashan (Bombay) reprint of the Daedalus issue 'Philosophers and
  Kings' (catalogued as 1949). The essay's concluding 'triple accomplishment' sentence (liberator, creator of
  the Republic, radical reformer) is garbled in the two-column OCR and is summarised, not quoted. Milliyet
  printed an article by him on 31 Oct 1973 (dankwart-rustow-1973-10-31).
