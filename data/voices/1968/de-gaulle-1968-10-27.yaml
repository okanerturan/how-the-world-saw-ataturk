summary: >-
  At Dolmabahçe, where Atatürk died, writes that he could die because the light shone, the flame burned and
  the country was marching.
quote:
  text: >-
    Atatürk pouvait mourir, puisque la lumière brillait, puisque la flamme brûlait, puisque le pays était en
    marche
  language: fr
mediated_by: >-
  Belleten 51/200 (Aug 1987), TTK conference text on the de Gaulle visit (French in brackets after the Turkish
  rendering)
caveat: >-
  Second-hand: Belleten prints the book entry in French. The same article reports a remark on the flight out
  of Ankara on 29 Oct, noted by Ambassador Roger Vaurs: 'Vous avez vu vous-même l'influence exercée par un
  grand homme d'Etat sur son pays, même après sa mort' (not stored as a record: it is a recalled remark,
  relayed twice). Original Discours et messages text of the 25-28 Oct toasts not found open this round.
