summary: >-
  Calls the 'rebel general' Mustafa Kemal gifted in military, political, social and cultural fields, who
  raised Turkish national feeling and renewed the people's psyche.
quote:
  text: >-
    Ставши на чолі визвольного руху, він здолав піднести національне почуття турецького народу до найвищого
    ступня. [translation: Having put himself at the head of the liberation movement, he managed to raise the
    national feeling of the Turkish people to its highest degree.] … Той характер Кемалевого діла оновив
    психіку народу, оспалого за дотеперішніх політичних та культурних умовин, і подвигнув той народ до
    великого самосвідомого чину.
  translation: >-
    That character of Kemal's work renewed the psyche of a people drowsy under the former political and
    cultural conditions and moved that people to a great self-conscious deed.
