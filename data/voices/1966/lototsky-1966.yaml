caveat: >-
  Wikisource transcription (proofread level 3) of O. Lototsky, Сторінки минулого, Part 4 'В Царгороді' (1966),
  chapter 'Внутрішнє положення в Туреччині по замиренні', scan pages 24-27 of the linked djvu; the page does
  not give the composition date. The passage uses the name 'Ататюрк', so it was written after 1934, and the
  author died in 1939 (his death date is from memory, tier M): the text was probably written 1934-39 and
  published posthumously in 1966. A second passage in the chapter 'По війні та мировій конференції' quotes
  Kemal's Ankara speech that Turkey became 'the only victor among the vanquished'. Scan not viewed.
  Translation is the vault's own. Check: 1966 is the publication date (US Orthodox Church edition); Lototsky
  died in 1939 and the text says 'Ататюрк', so written c. 1934–39.
