summary: >-
  Describes Kemal as an unexpected 'portent' at the Conference, the Gallipoli commander who stopped the
  British at Suvla, who rallied Turkish pride; Allied intelligence 'unintelligent'.
quote:
  text: >-
    It was owing to his prompt and daring leadership that the ineffective and bungled British attack at Suvla
    Bay had been checked, and the last hope of forcing the Dardanelles in the Great War for ever lost.
  language: en
caveat: >-
  Vol. II, p. 1285 (running heads 'EUROPEAN AND ASIATIC TURKEY 1285'; the quote sits between that head and
  '1286'), open DLI scan in.ernet.dli.2015.523826. Same chapter, p. 1292: 'Kemal roused the pride of a
  governing caste'; elsewhere he calls Turkey's rule a 'misgoverning' of centuries. Written in 1938 about
  1920; hostile to the Greek enterprise he himself had backed in Parliament (see his 1920 and 1922 records).
  Chapter headings: 'Mustapha Kemal takes the field', 'Kemal the strong man of Turkey'.
