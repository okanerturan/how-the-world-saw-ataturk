summary: >-
  Led France's funeral delegation personally; as a former ambassador in Ankara he told the Turkish press he
  had felt 'deep admiration' for Atatürk since then, while a Dutch daily read his leading the delegation as a
  sign of the Western powers' weight on Turkey's friendship.
quote:
  text: I felt admiration and affection for him
  language: en
mediated_by: >-
  Toksoy 2006 (Ulus 15 Nov 1938; Aksam 20 Nov 1938) ; Tüylü Turan 2019 (Spanish press); Havas via Delpher
caveat: >-
  Quote and 'deep admiration' are English renderings of Toksoy's Turkish summaries of Sarraut's statements.
  The 'courtship of Ankara' reading belongs to a Dutch daily, not to Sarraut. Tüylü Turan 2019 not read
  directly.
