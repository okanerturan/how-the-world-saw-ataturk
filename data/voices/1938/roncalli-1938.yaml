id: roncalli-1938
voice: Angelo Roncalli (later Pope John XXIII)
voice_type: person
role: Apostolic Delegate to Turkey and Greece
country: Turkey (Vatican envoy)
country_now: Turkey
domain: religion
date: "1938"
era: funeral
polarity: conflicted
intensity: 2
artifact: memoir
evidence: S
summary: >-
  Prays for Atatürk and the Greek Orthodox patriarch, rejecting the cold feelings others held; leaves judgment
  to the Lord, whom he thinks meek and kind.
quote:
  text: >-
    I do not share the cold sentiments entertained by these two lives which have now passed away.
  language: en
mediated_by: >-
  Ezio Bolis (Director, Pope John XXIII Foundation, Bergamo), 'What Was John XXIII Really Like?', EWTN,
  quoting the diary in English
caveat: >-
  Quoted in English translation by the Foundation director from Roncalli's diary; the Italian original and the
  Journal of a Soul text were not reached. The diary date given is .. died' - a slip in the lecture; date
  stored as 1938 only. The entry joins Atatürk with the Greek Patriarch Chrysostomos; the speaker adds that
  Roncalli visited the body and prayed. The existing note on Pope John XXIII says only that he told Rome the
  world had lost a great man; this record rests on the diary. The relayed diary date '19 Oct 1938' is
  impossible (Atatürk died 10 Nov, Chrysostomos c. 22 Oct); the entry is after 10 Nov. It concerns Atatürk:
  the passage names 'the leader of the Turks, secular reformer of that people'. Single secondary relay of an
  English translation (Bolis, EWTN); Italian original not seen.
node: Western Statesmen and Churchmen on Atatürk in Their Own Words
