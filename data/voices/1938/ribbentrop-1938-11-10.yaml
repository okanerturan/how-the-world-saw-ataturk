summary: >-
  Condolence telegram to Foreign Minister Aras on the 'irreplaceable loss' of the Turkish Republic's 'great
  founder'.
quote:
  text: >-
    „Eure Exzellenz bitte ich, anläßlich des unersetzlichen Verlustes, den die türkische Republik durch das
    Hinscheiden ihres großen Begründers, Seiner Exzellenz des Herrn Präsidenten Kemal Atatürk erlitten hat,
    meiner und der deutschen Reichsregierung wärmste Anteilnahme versichert zu sein.“
  language: de
  translation: >-
    I ask Your Excellency, on the occasion of the irreplaceable loss which the Turkish Republic has suffered
    through the passing of its great founder, His Excellency President Kemal Atatürk, to be assured of my own
    and the German Reich Government's warmest sympathy.
  translated_by: "machine: claude-opus-5-5"
caveat: >-
  A formal condolence telegram to Tevfik Rüştü Aras, released by the official news agency (DNB) on 10 Nov and
  printed in German papers of 11 Nov with Hitler's telegram (hitler-1938); the portal finds it in 37 papers.
  Ribbentrop was away from Berlin; State Secretary von Weizsäcker paid the condolence call at the Turkish
  embassy in his name.
