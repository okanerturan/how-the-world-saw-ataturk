summary: >-
  An elegy mourning the 'supreme mujahid' who eased the community's troubles, restored the Turks' honour
  against the crusaders and stood from Kabul to Ankara.
quote:
  text: دنیا سے وہ مجاہدِ اعظم گزر گیا ... صاحب دلو یہ غم ہے غمِ مصطفیٰ کمال
  language: ur
caveat: >-
  Quote is two half-lines, translation: 'That supreme mujahid has passed from the world ... O men of heart,
  this grief is the grief of Mustafa Kemal.' Poem titled 'Ataturk Mustafa Kemal, nawwara llahu marqadahu',
  dated Delhi, 12 Nov 1938. Source: Diwan-e Zafar Ali Khan, ed. Tanvir Ahmad (Ali Hujwiri Publishers, Lahore,
  1995 ed.), p. 210 (PDF page 210 of the archive.org scan; OCR unusable, page read on the image), read on the
  image (4 Nov 2026). Distinct from his 14 Nov Assembly speech. A companion poem 'Congressi ulama' (p. 211,
  Delhi 13 Nov 1938) ends by asking God to send another Mustafa Kemal; not recorded separately. Check:
  half-lines reordered to follow the page (the grief half-line precedes 'mujāhid-i aʿẓam').
node: Zafar Ali Khan — Ataturk Mustafa Kemal Nur Allah Marqadahu, Delhi 12 November 1938
