summary: >-
  Wrote his mother after the burial that he had filed past Atatürk's coffin with his school's staff; everyone
  felt the greatness of the loss.
quote:
  text: >-
    Es ist eine große und allgemeine Trauer, und jeder fühlt wohl die Größe des Verlustes, die gemildert wird
    dadurch, daß die Nachfolgerfrage ganz glatt und selbstverständlich gelöst worden …
  translation: >-
    It is a great and general mourning, and everyone surely feels the greatness of the loss, which is softened
    by the succession question having been settled quite smoothly and as a matter of course.
