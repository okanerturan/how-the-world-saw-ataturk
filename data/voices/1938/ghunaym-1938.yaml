    imposed Latin alphabet and hat, and 'I lean toward dictatorship ... fear for Turkey without a successor'
    all present. One omission worth adding to the caveat: right after the caliphate question he writes that he
    'acquits of atheism the translator of the Quran'. Era funeral correct (21 Nov 1938). Page not given on
    Wikisource (transcription, scan not viewed). Schema OK.
