artifact: article
evidence: S
summary: >-
  Calls Atatürk 'the shrewd' who knew the Turkish people's nature, a reformer who weakened every element out
  of tune with Turkey's spirit.
quote:
  text: >-
    تلك حقائق لم تخف على الداهية أتاتورك فأنه عرف ما هي فطرة الشعب التركي وما هي الحالة الاجتماعية التي تتفق
    وما كمن في حوافزه.
  translation: >-
    These facts were not hidden from the shrewd Atatürk, for he knew what the Turkish people's nature was and
    what social condition accorded with what lay hidden in its drives.
  language: ar
caveat: >-
  Cited as al-Risala no. 257, 6 Jun 1938, Wikisource page 'مجلة الرسالة/العدد 257/بين الشرق والغرب'. From the
  first part of 'Between East and West' (continued next issue), signed Felix Faris, replying to an opponent
  ('al-munazir') who praised Westernising and the end of Ottoman rule; Faris argues the Ottomans did not
  spread Arab culture, and that Atatürk understood this. Next sentence: 'Thinkers know what this reformer of
  his state aimed at, weakening every element that did not keep pace with its spirit, so that he made Arabic
  letters and words his enemy.' Neutral on the Arabic-letters point; reported as the speaker's framing.
  Wikisource transcription.
