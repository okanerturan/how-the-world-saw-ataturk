summary: >-
  On Ismet Inönü's election, notes that he is well disposed to Germany, 'which could not always be said of
  Kemal Pasha'.
quote:
  text: Er ist gut zu uns eingestellt, was man von Kemal Pascha nicht immer sagen konnte.
  language: de
caveat: >-
  Search-inside snippet of Die Tagebücher von Joseph Goebbels: sämtliche Fragmente (archive.org
  dietagebuchervon0003goeb; the snippet starts at 'gewählt.', i.e. 'elected'), so the entry date (about 11-12
  Nov 1938, Inönü's election) is inferred and the page not seen. Translation: 'He is well disposed toward us,
  which could not always be said of Kemal Pasha.' Same book, an earlier entry (12 June 1937): 'Über Kemal
  Paschas abenteuerliches Leben weiter gelesen' (reading a biography of Kemal) — no judgement. The English
  Goebbels Diaries 1942-43 have only an editor's note on Atatürk.
