  method: tools/fts.py snippets, 3 queries (lending copy; no page numbers)
  note: >-
    Verbatim and complete: '... 4. Dezember festgelegt. Ismet Inönü als Nachfolger Atatürks gewählt. Er ist
    gut zu uns eingestellt, was man von Kemal Pascha nicht immer sagen konnte.' The same snippet shows the
    Reichstag poll set for 4 December and Inönü's election, which fixes the entry to the days after 11 Nov
    1938, so 1938-11 is supported (exact day, 11 or 12 Nov, and the page are not). Snippet-only. Polarity
    'conflicted' is a stretch: it is one mildly negative aside about Atatürk's attitude to Germany (intensity
    1); 'witness' or a hostile-mild label would be fairer.
