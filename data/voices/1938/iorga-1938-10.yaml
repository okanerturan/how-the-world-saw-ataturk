summary: >-
  Cites the Turks' grief when Atatürk fell ill as proof that a nation can concentrate in one man who restored
  the Empire's glory.
quote:
  text: >-
    Cînd s'a îmbolnăvit în urmă d. Atatürk, ce adînc sentiment de îngrijorare, de durere a fost în sufletul
    tuturor Turcilor: pare că ar fi crezut că dispariția aceluia care a restabilit gloria de odinioară a
    Imperiului, devenit național acum, ar însemna prăbușirea patriei și dispariția națiunii din rîndul
    popoarelor care înseamnă ceva în lume.
  translation: >-
    When Mr Atatürk recently fell ill, what a deep feeling of worry and grief there was in the soul of all the
    Turks: it seems they believed that the disappearance of the man who restored the former glory of the
    Empire, now become national, would mean the collapse of the homeland and the disappearance of the nation
    from among the peoples that mean something in the world.
  language: ro
caveat: >-
  Opening lecture at the University of Bucharest, 31 Oct 1938 (ten days before Atatürk's death); printed
  Vălenii-de-Munte, Datina Românească, 1939, extract from Revista Istorică, year XXV, nos. 1-3 (all stated on
  the Wikisource page). Iorga uses Atatürk as one example (with Hitler and Mussolini) in an argument that
  nations gather in one leader, and goes on to urge rallying round the Romanian king: the praise serves that
  argument. Wikisource transcription of the printed pamphlet; scan not viewed. Translation is the vault's own.
