summary: >-
  Asks why no delegation goes to the Ghazi to remind him that grudge against the Arabs should not erase their
  gift of faith to Turkey.
quote:
  text: >-
    هل فكرت في إرسال وفد إلى الغازي مصطفى كمال يذكره بأن الحقد على العرب الذين خذلوا تركيا في الحرب لا يصح أن
    ينسيه فضل العرب الأبرار الذين نقلوا إلى تركيا بذور الإيمان بالله والرسول؟
  translation: >-
    Has it thought of sending a delegation to the Ghazi Mustafa Kemal to remind him that grudge against the
    Arabs who let Turkey down in the war must not make him forget the merit of the righteous Arabs who carried
    to Turkey the seeds of faith in God and the Prophet?
  language: ar
caveat: >-
  Cited as al-Risala no. 257, 6 Jun 1938, Wikisource page 'مجلة الرسالة/العدد 257/ليلى المريضة في العراق'.
  Rhetorical question in an article on the Arabic language abroad, signed Zaki Mubarak, written from Iraq five
  months before Atatürk's death. Accepts, as the premise, that the Ghazi bears a grudge against the Arabs.
  Mubarak returns to the theme in no. 433 (20 Oct 1941), saying that because of a foolish article on the
  Arabs' merit over the Turks 'Atatürk swore he would abandon the Arabic letters'. Wikisource transcription.
  Check: no praise of Kemal on the page; polarity conflicted → hostile (mild).
node: Egyptian Pens in al-Risala on Atatürk, 1935–1946
