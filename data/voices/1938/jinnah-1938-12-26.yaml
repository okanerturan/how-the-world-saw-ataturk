summary: >-
  Calls Atatürk the foremost figure of the Muslim East and a great hero lost, and asks whether India's Muslims
  will stay in the quagmire.
quote:
  text: In Kemal Ataturk the Islamic world has lost a great hero.
  language: en
caveat: >-
  Presidential address delivered extempore at Patna, 26-29 Dec 1938; text as printed in Jamiluddin Ahmad, Some
  Recent Speeches and Writings of Mr. Jinnah, p. 66 (Internet Archive DLI scan, OCR read; the 'quagmire'
  sentence: 'With the example of this great man in front of them as an inspiration, will the Muslims of India
  still remain in quagmire?'). The widely circulated November 1938 'greatest Musalman in the modern Islamic
  world' press interview is NOT in this text and its primary source was not found (only Dawn 2020 and a
  Wikipedia talk page citing 'Quaid-e-Azam and the Islamic World', 1981): see candidates file.
