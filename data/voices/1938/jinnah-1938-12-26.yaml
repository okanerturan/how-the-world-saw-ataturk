  quote_found: true
  checked_against: >-
    Jamiluddin Ahmad, Some Recent Speeches and Writings of Mr. Jinnah, p. 66 (archive.org
    in.ernet.dli.2015.189842 djvu.txt)
  method: fetched the archive.org djvu text directly with curl; located the passage and page header
  note: >-
    Verbatim on p. 66 (header 'RECENT SPEECHES AND' / '66'; the Patna address begins on p. 65): 'Another great
    figure, a world figure, that has passed away is Mustafa Kemal Ataturk. His death has come as the greatest
    blow to the Muslim world. He was the foremost figure in the Muslim East. … In Kemal Ataturk the Islamic
    world has lost a great hero. With the example of this great man in front of them as an inspiration, will
    the Muslims of India still remain in quagmire ? (Cries of no, no.)' Heading on p. 65: 'Full text of the
    Presidential Address delivered extempore at the annual session of the All-India Muslim League held at
    Patna, 26th-29th December, 1938.' Caveat: the book gives the session span, not a day for this passage; 26
    Dec is the opening day and presidential address day from outside knowledge (not shown in the book), so the
    date field is sound but could read '1938-12 (Patna session 26-29 Dec)'. what_they_saw fair. No other
    correction.
