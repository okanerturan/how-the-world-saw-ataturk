caveat: >-
  Published in La Turquie kémaliste, the illustrated review of the Turkish Press Directorate (Direction
  Générale de la Presse, Ministry of the Interior), a Kemalist state propaganda venue that chose and printed
  (and for some items translated) what it ran; read in the OCR of archive.org item la_turquie_kemaliste.
  Signed English original, 'Land of Pioneers', no. 27 (October 1938, the fifteenth-anniversary number,
  published a month before Atatürk's death); a Turkish translation ('Öncüler ülkesi') is in the archive.org
  item. The byline gives him as of the Department of Government, Harvard University; nothing else is verified
  about him. A passing evaluative clause inside a travel-and-development article (he also speaks of 'the many
  reforms instituted by Atatürk'); intensity 1. Page not shown in the OCR. Cited as La Turquie kémaliste no.
  27 (October 1938), 'Land of Pioneers'.
