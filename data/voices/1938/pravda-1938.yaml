  Per the NYT (13 Nov 1938) ran a long laudatory biography stressing his friendliness to the USSR, which may
  signal Moscow's wish to improve relations with Ankara; the Turkish ministry's compilation prints from Pravda
  of 10 Nov only a list of his reforms.
