    I have the good fortune to have known Atatürk personally. I have a deep respect for him. When I was in
    Ankara I always looked at the sun. But I did not see the sun on the horizon; I saw it in Çankaya. For the
    true sun was the sun called Atatürk in Çankaya. Atatürk's loss is a great loss not only for Turkey but for
    the whole world.
