artifact: quote
evidence: P
summary: >-
  Answers an article in Hâkimiyet-i Milliye by charging Kemal with treating him and his friends as obstacles
  to personal ambition and lying about them.
quote:
  text: >-
    Şimdi muvaffakiyet belirince tabi'i maksadınızı gösterdiniz. Beni ve arkadaşlarımı şahsi emellerinize
    engel sayıyorsunuz.
  language: tr
caveat: >-
  Turkish original; vault translation: 'Now that success is in sight you have naturally shown your aim. You
  regard me and my friends as obstacles to your personal ambitions.' Letter No. 118, Enver (Moscow) to Mustafa
  Kemal (Ankara), 17 July 1921, sent after Enver read Hâkimiyet-i Milliye's article against him in the
  Istanbul papers (Yamauchi's archive ref: Klasör 7/Mustafa Kemal Dosyası). It ends: 'I regret to see that the
  personal character I have known since Tripoli has not changed in the position you have reached ... I pity
  you, beaten by your personal ambition and made so small.' Pages: OCR marker 233 falls inside the letter
  (cited as pp. 233-234).
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
sources:
  - url: https://archive.org/details/masayuki-yamauchi-hosnut-olamams-adam-enver-pasa-0-baglam-libgen.li-1
