    foot of the page holding the quote)
  method: archive.org djvu + PDF page check
  note: >-
    Verbatim: 'Şimdi muvaffakiyet belirince tabi'i maksadınızı gösterdiniz. Beni ve arkadaşlarımı şahsi
    emellerinize engel sayıyorsunuz.' Letter signed 'Enver.', dated 17 Temmuz 1921, after the Hâkimiyet-i
    Milliye article; ending lines ('Trablus'tan beri bildiğim ahlâk-ı şahsiyeniz', 'şahsi hırsınıza mağlüb
    olarak bu kadar küçülmüş gördüğümden dolayı te'essüf ederim') are as in the caveat. The quote is on p.233
    (letter runs 232/233-234). Hostile/2 fair.
