verification:
  verdict: secondary-only
  quote_found: true
  checked_against: >-
    archive.org sahbaba-murat-bardakci (Şahbaba, İnkılâp 2006), djvu text, p.215 and ch.14 note 1
  method: archive.org djvu download
  note: >-
    Verbatim in Şahbaba p.215 as direct quotation ('Londra'da yirmi veya otuz sene oturtsanız ve sonra 24
    saatliğine dağın tepesine götürseniz derhal eski halini alır'), followed by 'Zorla bir halife ilan
    edebilirler...'. Ch.14 note 1 says it is from Rumbold's dispatch to Curzon of 23 Mart 1921 on a 2.5-hour
    private interview, with 'some phrases removed' and the full text in Şimşir, British Documents III/262. So
    the sentence is Bardakçı's Turkish of a British report of the Sultan's speech, the English was not seen,
    and 23 March is the DISPATCH date, not necessarily the interview date. Evidence S is correct (not P); keep
    the hedge and add 'date = dispatch date'.
