summary: >-
  Tells Rumbold that Kemal is a revolutionary, whom twenty years in London would turn back to his old self.
quote:
  text: >-
    Londra'da yirmi veya otuz sene oturtsanız ve sonra 24 saatliğine dağın tepesine götürseniz derhal eski
    halini alır
  language: tr
mediated_by: Rumbold to Curzon, 23 Mar 1921 (Şimşir, İngiliz Belgelerinde...) ← Bardakçı 1998/2006
caveat: >-
  Bardakçı's Turkish rendering of Vahideddin's words as reported in Sir Horace Rumbold's English dispatch; the
  sentence is a back-translation, not the Sultan's own Turkish. Vahideddin also said Kemal 'is a
  revolutionary' and that Bekir Sami was 'a Circassian, all the same', and that a forced caliph would be 'an
  instrument in the hands of wolves who like foggy weather' (same page). The date 23 March 1921 is taken from
  Bardakçı's chapter note for this chapter ('a two-and-a-half-hour private interview'), which the OCR does not
  attach by number to this passage; treat the day as inferred, the year as safe. Cited from the 2006 İnkılâp
  edition, p. 215 (OCR folio). Check: 23 March is the dispatch date, not necessarily the interview day;
  Rumbold's English not seen.
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
