date: "1921-01-25"
era: contemporary
polarity: hostile
intensity: 1
artifact: speech
evidence: P
summary: >-
  Told the Allies that Kemal could only reject peace from vain ambition to revive the old Empire and become
  the first of new Sultans.
quote:
  text: >-
    He (Mr. Lloyd George) could not imagine that Mustapha Kemal was hostile to a peaceable solution unless
    indeed he was filled with the vain ambition of resurrecting the old Turkish Empire and constituting
    himself the first of a new line of Sultans.
  language: en
mediated_by: >-
  Şimşir, İngiliz Belgelerinde Atatürk vol. III (TTK 1973) No. 20, p. 73 ← British Secretary's Notes of an
  Allied Conference, Quai d'Orsay, 25 Jan 1921, 4 p.m. (DBFP 1st ser. vol. XV pp. 28–39 No. 4)
caveat: >-
  Reported speech in British minutes; conditional in form. Same meeting: he agreed with Briand that the Allies
  must not seem to sue Kemal for peace. Differs from the existing Lloyd George records (Dec 1920, Aug 1922,
  1938).
node: Statesmen and Royals in Contact with Kemal, 1919–1938
sources:
