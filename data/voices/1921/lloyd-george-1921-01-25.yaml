    Salle de l'Horloge, Quai d'Orsay, 25 Jan 1921, 4 p.m.), p. 73
  method: archive.org open djvu text read
  note: >-
    Verbatim on p. 73. The next sentence ('most cordially agreed with M. Briand that ... the Allies should not
    give Mustapha Kemal any justification for thinking that they were suing for peace') matches the caveat.
    Not a duplicate: the existing Lloyd George records are lloyd-george-1920 (Commons, 22 Dec 1920),
    lloyd-george-1922 (4 Aug 1922) and lloyd-george-1938 (memoir), all different utterances and dates. Hostile
    is defensible for a conditional suspicion, and the caveat flags the conditional form.
