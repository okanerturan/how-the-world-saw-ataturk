  method: archive.org open OCR text read
  note: >-
    Russian verbatim apart from the OCR slip '—: е социалист' (= 'не социалист'). Edition and pages match (p.
    34 runs to 'кни-', p. 35 holds the quote). Context: Chicherin brings Aralov to Lenin before his departure;
    recalled in early Nov 1921 (OCR line 'В начале ноября 1921 года'), left end Dec 1921 ('В конце декабря
    1921 года'). Tier: P is Aralov's memoir, not Lenin's own text; it is acceptable only because mediated_by
    and the caveat name the reconstruction (cf. reza-shah-1933 via an ambassador's memoir). Era contemporary
