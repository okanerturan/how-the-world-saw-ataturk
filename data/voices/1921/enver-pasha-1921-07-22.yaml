  note: >-
    Words verbatim ('Bildiğiniz gibi Anadolu'da Mustafa Kemal Paşa şahsen beni rakib telâkki ise burada temâs
    samimi ve açık anlatmamıza rağmen hattâ Hâkimiyet-i Milliye ile şimdilik yalnız bana müteveccih bir makâle
    yazdırdı'). Page correction: the letter opens after folio 234, so this sentence is on p.235 (not 234-235);
    'Mustafa Kemal Paşa aleyhinde bir hareket değil ... menfi olan arkadaşları da teskin' is on p.236. The
    record's translation is acceptable; the fragment omits 'ise', which makes the sentence look complete when
    it is not. Enver's own letter to an ally. Conflicted/1 fair.
