caveat: >-
  Turkish original; vault translation: 'in Anatolia Mustafa Kemal Pasha personally regards me as a rival'.
  Letter No. 120, Enver to Cemal Pasha (Kabul), 22 July 1921; the same letter says Kemal had a Hâkimiyet-i
  Milliye article written 'aimed only at me' and that 'we have no movement against Mustafa Kemal Pasha, on the
  contrary we try to calm the negative friends'. Written to an ally, not to Kemal; cited as pp. 234-235 (OCR
  marker 235 follows the sentence). Quote on p. 235; the 'no movement against Kemal' sentence is on p. 236.
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
