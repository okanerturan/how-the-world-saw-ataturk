id: frunze-1921-12-25
voice: Mikhail Frunze
voice_type: person
role: >-
  Ukrainian SSR envoy extraordinary to Ankara, Red Army commander (later Soviet war commissar)
country: Ukrainian SSR
country_now: Ukraine
domain: diplomacy
date: "1921-12-25"
era: contemporary
polarity: instrumental
intensity: 2
mirror: bourgeois-revolutionary
artifact: meeting
evidence: S
summary: >-
  In talks with Kemal, cast Turkey's struggle as national-democratic, headed toward state socialism, and told
  him a communist revolution would cost the propertyless Pasha nothing.
quote:
  text: >-
    Hâkimiyetten söz ederken, sizi —Paşa'yı— göz önüne alıyorum ve sizin hiçbir mal ve mülkünüzün olmadığını
    ve kendi hizmetiniz ve emeğinizle geçindiğinizi biliyorum. Buradan, komünist ihtilal olsa bile sizin
    hiçbir şey kaybetmeyeceğiniz sonucu çıkmaktadır.
  language: tr
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 12 pp. 177–179 ← Soviet record of the Abilov–Frunze talk with Mustafa Kemal,
  25 Dec 1921 (Azerbaijan State Archive of Recent History, f. 28, op. 1, d. 68, ll. 10–16) ← Y. Aslan, Mustafa
  Kemal–M. Frunze Görüşmeleri (2002) pp. 35–46
caveat: >-
  Turkish translation of a Russian record. Translation: 'When I speak of power I have you, the Pasha, in mind,
  and I know you have no property and live by your own service and labour. It follows that even if there were
  a communist revolution you would lose nothing.' A second talk followed on 4 Jan 1922.
node: Statesmen and Royals in Contact with Kemal, 1919–1938
sources:
