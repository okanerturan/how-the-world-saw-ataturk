  quote_found: true
  checked_against: >-
    archive.org butuneserler, djvu text of ABE vol. 12, pp. 177–179 ('Frunze ve Abilov ile Görüşme', 25 Dec
    1921; footnote: Azerbaijan State Archive f. 28, op. 1, d. 68, ll. 10–16; Aslan 2002 pp. 35–46)
