summary: >-
  In closed session on the Commander-in-Chief law, said he would kiss the Pasha's forehead on the Assembly's
  behalf and find any praise too little.
quote:
  text: >-
    Meclis namına Reis Paşa’nın, Başkumandan Paşa’nın alnından öperek ne tabirler varsa hepsini
  language: tr
caveat: >-
  The quoted clause is on p. 192 and ends mid-sentence at a page break and editor's footnote; it continues 'az
  görürüm' ('I would find it too little'), p. 193. The same speech also urges the Pasha to 'trespass on the
  Assembly's authority', reported in the edition as 'ey Paşa sen Meclisin salahiyetine tecavüz et'.
