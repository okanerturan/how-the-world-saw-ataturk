summary: >-
  Told Curzon Kemal was no longer a brigand chief: Angora governed Anatolia with average efficiency and Muslim
  support, holding native Christians in a stranglehold.
quote:
  text: It is useless to regard Mustapha Kemal any longer as a brigand chief.
