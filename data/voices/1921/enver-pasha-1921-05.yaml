summary: >-
  Writes to Kemal as a brother, praising his ability but begging him not to turn his success into the rule of
  one person.
quote:
  text: >-
    Şimdi muvaffakiyetinize bakarak, size iğvâ edenlere uyup memlekette bir şahsın veyâ yalnız bir kısmının
    tahakkümüne doğru gitmeyiniz.
  language: tr
caveat: >-
  Turkish original (Ottoman-style transliteration by Yamauchi); the vault's translation: 'Now that you are
  succeeding, do not follow those who lead you astray towards the domination of the country by one person or
  one group.' Letter No. 97, undated (May 1921), Moscow to Ankara, printed in Yamauchi's documents section;
  OCR page markers 205-207 bracket the letter, the sentence falls just after the marker 207 (cited as pp.
  205-208). Enver's archive reference given by Yamauchi: Klasör 7/Mustafa Kemal Dosyası. Immediately before,
  Enver writes that he had valued Kemal's ability since his own War Ministry ('İktidârınızı ... takdir
  ettim'). The letter also reports his claim that Kemal's circle had made him the dictator of an 'Ankara
  Communist Party'. Enver's own account of his conduct, written to a man he saw as a rival. Authorship is the
  editor's inference: Yamauchi's note (1) calls letter No. 97 'anonim' (unsigned) and attributes it to Enver
  from its content.
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
sources:
