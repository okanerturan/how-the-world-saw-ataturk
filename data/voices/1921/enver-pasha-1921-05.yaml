verification:
  verdict: partial
  quote_found: true
  checked_against: >-
    archive.org Yamauchi, Hoşnut Olamamış Adam Enver Paşa (PDF/djvu), letter No. 97 and its note (1)
  method: archive.org djvu download; page folios tested against the PDF (folios are at page foot)
  note: >-
    Quote is verbatim, OCR p.208 (letter runs pp.205-208; heading 'No. 97, Enver Paşa'dan (Moskova) Mustafa
    Kemal Paşa'ya (Ankara), Târihsiz (Mayıs 1921)'). BUT the letter's own note (1) says: 'Bu mektup Büyük
    Ermenistan Teşkili Meselesi başlığındaki ANONİM bir mektuptur. Ancak yazar, metnin içindekileri gözönünde
    bulundurarak, Enver Paşa'ya ait olduğunu zanneder.' So it is an unsigned letter that Yamauchi ATTRIBUTES
    to Enver from its content (it also has no signature, unlike No. 118, signed 'Enver.'). Content fits Enver
    (Berlin prison with Radek, flights, Halil, Cemal), but the attribution is the editor's inference. Fix the
    caveat to say so, keep evidence P for the text but record 'authorship attributed by the editor, letter
    unsigned' in mediated_by/caveat. Polarity/intensity fair.
  resolution: corrected/hedged 2026-11-03 — see LEDGER § Source-check corrections (round 17)
