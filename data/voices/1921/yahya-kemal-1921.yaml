  note: >-
    Quote verbatim in Enginün, who says the sentences are from 'Eser' (Eğil Dağlar 1966, pp. 31-33) and that
    'Onun Sesi' is p. 35. Translation faithful. DATE: 1921 is an inference, but internal evidence supports it.
    In the passage Enginün quotes with 'Eser' he writes 'Evet iki sene evveline kadar ... milli hareket bir
    sene içinde ... Mustafa Kemal'i milletin timsali olarak yarattı', two years from the May 1919 landing. The
    next pieces (pp. 35-37) discuss a Kemal speech and the London conference (early 1921). c. 1920-21 holds;
    exact paper and day remain unknown (FTS found no dated printing). Correction: caveat 'Same wording ... in
    Kanbak' → 'near-identical wording'. Kanbak reads 'Evet, Efzunlar İzmir'e çıktığı günden evvel Mustafa
    Kemal bir fertdi. Ama o günden sonra artık bir fert değil, bir timsaldir'. The Kanbak attribution to ATAM
    Dergisi no. 12 is printed there, so 'apparently' can go. 21 Dec 1933 Çankaya dinner present (Kanbak).
    Admiring/contemporary are right. Schema ok.
