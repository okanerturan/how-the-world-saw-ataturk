summary: >-
  Argues that since the Greek landing at İzmir Mustafa Kemal is no longer an individual but the symbol of the
  risen nation.
quote:
  text: >-
    Bu eser bir şahsın değil bir milletindir. Mustafa Kemal'i bir şahıs zannedenler aldanıyorlar.
  language: tr
mediated_by: >-
  Enginün, Yeni Türk Edebiyatı: Tanzimat'tan Cumhuriyet'e 1839-1923 (Dergâh), pp. 124-125 ← Eğil Dağlar
  (1966), pp. 31-33, article 'Eser'
caveat: >-
  TRANSLATION (this record's): 'This work belongs not to one person but to a nation. Those who take Mustafa
  Kemal for one person are mistaken.' He goes on: 'Mustafa Kemal İzmir'e efzunlar çıktığı günden evvel bir
  fertti. O günden beri artık bir fert değil bir timsaldir.' Same wording (with 'Efzunlar' and 'bir fertdi')
  in the essay 'Atatürk - Yahya Kemal dostluğu' in Kanbak (comp.), Yahya Kemal Beyatlı, pp. 78-79, apparently
  from Atatürk Araştırma Merkezi Dergisi. DATE INFERRED: Eğil Dağlar collects his 1919-1922 articles; 'Eser'
  speaks of the movement creating its symbol 'within one year' of the May 1919 landing, so c. 1920-21; the
  exact paper and date are not established. In 'Onun Sesi' he praises a speech of Kemal's as free of bombast,
  egotism and ambition (Eğil Dağlar p. 35). Contacts: a reconciliation dinner at Çankaya on 21 Dec 1933, later
  table invitations and his election as deputy (Kanbak pp. 82-84); Afet İnan recalls him reading poems at
  Atatürk's table (Hatıralar ve Belgeler, p. 396). His 1938 funeral writings were not found.
