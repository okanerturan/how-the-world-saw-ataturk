summary: >-
  On the South Tyrol transfer, counted Kemal Pasha among rulers who rid themselves of minorities: the
  Armenians by massacre, the Greeks by deportation in 1923.
quote:
  text: Кемаль Паша тоже однажды избавился от армянского меньшинства… перебив их.
  translation: Kemal Pasha too once got rid of the Armenian minority… by slaughtering them.
  language: ru
mediated_by: >-
  Russian translation by 'B. Ts.' (Wikisource, from Khroniki Ierusalima) ← 'A Talk with Zangwill', Hadegel
  (Revisionist journal, Manchuria/China), 1939
caveat: >-
  Sensitive: the attribution of the Armenian massacres to Kemal is Jabotinsky's, recorded, not adopted. A
  translation of a translation. The essay then quotes, apparently as Zangwill's recalled words, a view that
  the 1923 exchange proved beneficial. Check: the view that the 1923 exchange proved beneficial is a 1936
  Geneva interlocutor's ('Ваше Сиятельство'), not Zangwill's; Jabotinsky himself calls it a 'зверским
  изгнанием' (brutal expulsion).
