summary: >-
  At the funeral: a career of 'savage violence and moody self-indulgence', yet mourned by weeping crowds ten
  days after his death.
quote:
  text: >-
    It was a curious experience to watch the coffin of Kemal Ataturk carried to the unusual resting-place of
    the Ankara Ethnographic Museum, surrounded by international honours, and saluted by his old British
    antagonist of the Dardanelles. His career had been one of savage violence and moody self-indulgence, yet
    his people mourned him by hysterical weeping beside his coffin even ten days after his death.
  language: en
caveat: >-
  Year of Reckoning (London: Cassell, 1939), p. 343, read in the open DLI scan. In his memoir Extra-Special
  Correspondent (Harrap, 1957; lending copy, snippets only) he credits Kemal with 'such a national
  reconstruction as contemporary history had never witnessed'. His own Daily Mail interviews with Kemal were
  not reached (British Newspaper Archive is paywalled).
