  note: >-
    Verbatim on p. 68 (running head '68 THE PROCESS OF DISINTEGRATION' precedes it): 'the Ghazi set himself a
    task with which none but a hero could grapple'. 'Third Ottoman saviour' is on p. 222 (not p. 68; the
    record merges the two). Polarity 'admiring' is arguable: the same page calls the method eviction of the
    Greek and Armenian middle class and the Turks 'mentally sluggish', and the purge an 'awe-inspiring
    spectacle'. 'Conflicted' would be fairer.
