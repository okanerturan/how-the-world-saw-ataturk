summary: >-
  Calls Atatürk's purge of Arabic and Persian words from Turkish a task 'none but a hero could grapple' with,
  and the 'third Ottoman saviour'.
quote:
  text: the Ghazi set himself a task with which none but a hero could grapple
  language: en
caveat: >-
  A Study of History vol. VI (Oxford UP, 1939; scan in.ernet.dli.2015.208032), 'The Disintegration of
  Civilizations', p. 68 (language reform). Toynbee does not spare the method: he says Mustafa Kemal 'had
  evicted from Turkey an old-established and apparently indispensable Greek and Armenian middle class' on the
  calculation that the vacuum would force the Turks to do their own work, and he treats the language purge on
  the same principle ('what an astonishing intellectual stimulus can be given to mentally sluggish peoples
  (such as his Turks and our English are)'). Same volume, p. 222: 'A totalitarian Westernizer was needed ...
  in our own day this third Ottoman saviour has appeared in the person of President Mustafa Kemal Ataturk.'
  The volume appeared in 1939 and was written before Atatürk's death; date and era follow the publication.
  Adds to the existing 1922 record (Western Question), which is guarded. Sensitive thread (Greek and Armenian
  populations): Toynbee's framing is recorded as his, not the vault's. Polarity conflicted at check: the same
  page mocks the method and calls the Turks 'mentally sluggish'.
node: Famous Pens on Atatürk II — Farrère, Halide Edib, Toynbee, Pamuk, Nesin
