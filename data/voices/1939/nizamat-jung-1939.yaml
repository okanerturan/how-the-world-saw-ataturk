caveat: >-
  Original English verse, five quatrains headed '[Died on the 10th of November 1938] May he rest in peace!',
  in Islamic Culture (Hyderabad), vol. XIII no. 1, January 1939, p. 98 per the contents page (item VIII).
  Composition date within Nov 1938 - Jan 1939 inferred from the heading, so 'posthumous' by publication date
  only. Last stanza: 'A bearer of the Prophet's name! His darkest deeds God's mercy claim, Who gave him power
  - to save once more A Moslem nation's honour, fame.' Nizamat Jung (1871-1955) is placed from memory (tier
  M); the volume gives only his name and title. Text read from the open archive.org OCR (identifier
  in.ernet.dli.2015.92011).
