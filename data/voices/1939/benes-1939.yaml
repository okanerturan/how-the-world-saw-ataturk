  democracies'; the lectures were given at the University of Chicago, 1939. Open scan democracytodayto00bene
  (Univ. of Florida copy); the index lists 'Attaturk, Kemal, 90'. A descriptive aside inside an argument about
  the rise of Fascism, so both labels (dictatorship, courageous modernisation) are Beneš's.
