summary: >-
  Counts Atatürk's dictatorship among the interwar post-war dictatorships, but credits his victory over Greece
  and 'courageous modernisation' with the authority that kept him in power.
quote:
  text: >-
    It must, besides, be remembered that from 1923 the dictatorship of Kemal Ataturk was established in full
    force in Turkey: his victory over Greece and his courageous modernisation of the whole social, cultural,
    and national life of Turkey endowed him with sufficient authority to preserve his dictatorship
    successfully up to his death in 1938.
  language: en
caveat: >-
