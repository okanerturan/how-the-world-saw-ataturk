    it reads instrumental, but the entry states an explicit admiring view (great leader, honoured). Suggested
    fix: polarity admiring, intensity 1 (keeping the EU-vocation point in the caveat), or keep instrumental
    but extend the quote to include 'In memory of the great Turkish leader'. Current record (what_they_saw
    says 'Honours the great Turkish leader') is internally inconsistent with instrumental. Printed Turkish
    also says Ataturk 'bizzat cizdigi Avrupa yonelimi' (personally drew the European orientation), which
    supports the caveat.
