summary: >-
  Credits Atatürk with saving Turkey from partition by Greece by leading a strong Muslim force, noting that he
  himself claimed to be a secularist.
quote:
  text: >-
    Turkey itself would have become a part of Greece had it not been for Kemal Ataturk who even though he
    himself claimed to be a secularist, nevertheless lead a strong Muslim Turkish force to expel the Greeks
    from Anatolia.
  language: en
