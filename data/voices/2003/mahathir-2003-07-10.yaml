  'lead' is the source's spelling. The remark serves the speech's argument that Muslims need modern knowledge
  to defend themselves, and calls Atatürk's force 'Muslim'. 2019 wreath-laying at Anıtkabir (see Anıtkabir)
  carries no sentence by him.
