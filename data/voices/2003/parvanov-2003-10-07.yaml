caveat: >-
  Handwritten in Bulgarian, 7.X.2003 (transcribed from handwriting): 'With respect and esteem for the work of
  the first builder of the Republic of Turkey! With wishes to the people and the country to preserve and
  develop the ideological and political legacy of Mustafa Kemal Atatürk!' The compilation's Turkish agrees in
  substance but is looser ('cause of the Leader and First Founder'). Source: Anıtkabir Özel Defteri (printed
  compilation, '1953'ten günümüze Anıtkabir'i ziyaret eden yerli ve yabancı heyet başkanlarının Atatürk
  hakkındaki duygu ve düşünceleri'), page images on ataturkarsivi.com, read on the image by the main agent (4
  Nov 2026).
