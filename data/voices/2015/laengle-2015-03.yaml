summary: >-
  In a headscarf and secularism debate calls Atatürk, in his own opinion, a very progressive statesman who
  aligned the new Turkey with Western principles.
quote:
  text: >-
    Der damals nach meiner Meinung sehr fortschrittliche Staatsmann Mustafa Kemal Atatürk hat auch die „sechs
    Pfeile“ des neuen türkischen Staatswesens eingeführt.
  language: de
caveat: >-
  Used to argue that the secular founder banned the fez and the headscarf, against Turkey's present course;
  the praise serves a point about Islam in Austria. Backs the claim with: 'dass gerade Mustafa Kemal Atatürk
  sich sehr wohl total nach westlichen Prinzipien ausgerichtet hat'. [Translation:] The statesman Mustafa
  Kemal Atatürk, in my opinion a very progressive one for his time, also introduced the 'six arrows' of the
  new Turkish state.
