summary: >-
  Credits the Atatürk legacy for making peaceful, prosperous, reasonably pluralist Turkey a beacon to the
  Islamic world.
quote:
  text: >-
    This is why Turkey has, for so long, thanks in large measure to the Ataturk legacy, been such a beacon to
    the Islamic World.
  language: en
caveat: >-
  Here Abbott speaks of Atatürk as state-builder, not of the Anzac words; an off-the-cuff doorstop. The same
  week (PM Transcripts 24391, Istanbul 23 April 2015) he called Mustafa Kemal Ataturk 'a worthy and
  resourceful leader, who embraced his fallen enemies as sons of Turkey'. The 'Johnnies and Mehmets' / 'your
  sons are now lying in our bosom' text that Anzac speakers attribute to Atatürk is itself contested: no 1934
  original has been found, it first appears in print in 1953 via Interior Minister Şükrü Kaya's recollection,
  and the 'Johnnies and Mehmets' clause is a 1978 Australian addition (see [[Johnnies and Mehmets]]). So this
  is a speaker's view of the Atatürk of the Anzac legend, spoken at a commemorative or diplomatic occasion
  that rewards praise. Cited as: Doorstop interview, HMAS Anzac, Anzac Cove, 24 April 2015.
