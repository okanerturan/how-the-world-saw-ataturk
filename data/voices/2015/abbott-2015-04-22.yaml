summary: >-
  Calls Atatürk's message to the grieving mothers of Australia wise and magnanimous, from a 'truly great
  inspirational leader' whose legacy lives on.
quote:
  text: >-
    That was the wise and magnanimous message of a truly great inspirational leader whose legacy lives on in
    modern Turkey.
  language: en
caveat: >-
  Spoken beside the Turkish prime minister on the eve of the Gallipoli centenary; occasion-bound praise. The
  'Johnnies and Mehmets' / 'your sons are now lying in our bosom' text that Anzac speakers attribute to
  Atatürk is itself contested: no 1934 original has been found, it first appears in print in 1953 via Interior
  Minister Şükrü Kaya's recollection, and the 'Johnnies and Mehmets' clause is a 1978 Australian addition (see
  [[Johnnies and Mehmets]]). So this is a speaker's view of the Atatürk of the Anzac legend, spoken at a
  commemorative or diplomatic occasion that rewards praise. Cited as: Joint press conference with Prime
  Minister Davutoğlu, Ankara, 22 April 2015.
