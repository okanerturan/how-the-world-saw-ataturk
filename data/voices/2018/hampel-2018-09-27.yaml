caveat: >-
  Bundestag DIP API (search.dip.bundestag.de/api/v1/plenarprotokoll-text), public key from the DIP
  documentation page; printed page checked in the dserver PDF. AfD foreign-policy speech in the debate on the
  EU-Turkey refugee agreement; Hampel then quotes 'there are many cultures but only one civilisation: the
  European' as Atatürk's answer and adds that 'if you say that today in Ankara or Istanbul you will get other
  answers'. The identical quotation is repeated in his speech of 30 Sept 2020 (19/179, p. 22564), a second
  record is not made. The quotation's attribution to Atatürk is the speaker's, not verified here. Cited as
