summary: >-
  Atatürk's rule as an 'authoritarian regime', one of the places where the exiled Ernst Reuter saw democratic
  virtues under challenge.
quote:
  text: >-
    Es sind demokratische Tugenden, wie Reuter selbst sie an jedem Ort, an jeder Station seiner Biographie
    angefochten und umkämpft erlebt hatte: in der Weimarer Republik unter dem Druck der Demokratiefeindschaft,
    in der Türkei unter dem autoritären Regime Atatürks, vor allem aber in den Jahren der russischen
    Revolution und des Bürgerkrieges an der Wolga.
  translation: >-
    These are democratic virtues such as Reuter himself had seen challenged and fought over at every place,
    every station of his life: in the Weimar Republic under the pressure of hostility to democracy, in Turkey
    under Atatürk's authoritarian regime, but above all in the years of the Russian Revolution and the civil
    war on the Volga.
  language: de
caveat: >-
  A passing characterisation in a Berlin speech, three weeks before Erdoğan's state visit; contrast his 2024
  Anıtkabir entry (frank-walter-steinmeier-2024-04-24).
