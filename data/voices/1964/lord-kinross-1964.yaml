summary: >-
  His biographer on the private man: 'without love in his nature', one who 'could not endure to be loved too
  much'.
quote:
  text: >-
    In human terms, Kemal was a man without love in his nature. He understood people. But he did not love
    them. […] Kemal was a man wedded to his career and his country and the society of other men, to whom women
    meant little save as a source of distraction, an outlet for his appetites, and a stimulus to his masculine
    vanity. […] Kemal liked, in his vanity, to be loved, and throughout his life chose women who took the
    initiative in showing their feelings. But he could not endure to be loved too much […]
  language: en
