summary: >-
  At a state dinner in Çankaya: the 'father of New Zealand's relationship with Turkey', a man of vision whose
  outstretched hand won New Zealanders' hearts.
quote:
  text: >-
    Ataturk was a man of vision. He had a clear understanding that Turkey's future could only be secure if it
    was settled as a nation, within a region and within a world at peace. He held out his hand to New Zealand,
    and to other countries that had been foes at Gallipoli. That noble gesture secured his place in the hearts
    of New Zealanders.
  language: en
caveat: >-
  Toast at the state dinner at the Çankaya Presidential Palace, Ankara, on his state visit, two days after
  Anzac Day at Gallipoli. He also says Kemal 'went on to transform Turkey into an independent, democratic,
  secular nation-state'.
