summary: >-
  After visiting the mausoleum, calls Atatürk a leader who changed history's shape whose greatest legacy is
  Turkey's living secular democracy.
quote:
  text: >-
    I was deeply impressed by this beautiful memorial to a man who did so much to shape the course of history.
    But it is also clear that the greatest monument to Ataturk's life is not something that can be cast in
    stone and marble. His greatest legacy is Turkey's strong, vibrant, secular democracy, and that is the work
    that this assembly carries on today.
  language: en
caveat: >-
