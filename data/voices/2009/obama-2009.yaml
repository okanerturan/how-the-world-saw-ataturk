  liderdir. Ama Atatürk’ün yaşamına ait en büyük anıt hiçbir şekilde taştan ya da mermerden inşa edilemez,
  kendisinin bırakmış olduğu en büyük miras Türkiye’nin canlı laik demokrasisidir". TBMM book PDF p. 254
  (printed p. 243).
