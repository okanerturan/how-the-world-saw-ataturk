  note: >-
    Verbatim match; speaker, office and date agree with book heading ('Amerika Birleşik Devletleri Başkanı
    Barack Hussein Obama, 72. Birleşim, 6 Nisan 2009'). Heading and quote on same page. ORIGINAL: 'This
    morning I had the great privilege of visiting the tomb of your extraordinary founder of your republic. And
    I was deeply impressed by this beautiful memorial to a man who did so much to shape the course of history.
    But it is also clear that the greatest monument to Ataturk's life is not something that can be cast in
    stone and marble. His greatest legacy is Turkey's strong, vibrant, secular democracy, and that is the work
    that this assembly carries on today.' (obamawhitehouse.archives.gov, Remarks By President Obama To The
    Turkish Parliament, 6 Apr 2009). The minutes' 'tarihin şeklini değiştiren bir lider' renders 'did so much
    to shape the course of history' loosely and drops 'strong'; not material.
