summary: >-
  On his 128th birthday calls Atatürk 'a unique and inspirational figure', an impatient reformer, and urges
  Muslim leaders to take inspiration from his revolution.
quote:
  text: >-
    Ataturk was a unique and inspirational figure who laid the foundation for the Republic of Turkey. … By any
    measure, Ataturk was an historic reformer.
  language: en
caveat: >-
  Her own statement; near-identical in structure to Tom Lantos's 2006 statement (a staged record), which she
  follows. She also spoke on 15 Oct 2007 ('the visionary leader of modern Turkey', Armenian resolution
  debate), 22 Apr 2008 and 28 May 2010 (a birthday-party speech by a 16-year-old, not counted). Cited as
  Extensions of Remarks (House), 19 May 2009, '128th Anniversary of the Birth of Kemal Ataturk, Founder of
  Modern Turkey', Congressional Record vol. 155, p. E1196 (granule CREC-2009-05-19-pt1-PgE1196-3).
