id: einstein-1933-09-17
voice: Albert Einstein
voice_type: person
role: Physicist; honorary president of the OSE (Union for the Protection of the Health of Jews)
country: Germany (in exile)
country_now: Germany
domain: science
date: "1933-09-17"
era: contemporary
polarity: witness
intensity: 2
artifact: letter
evidence: P+S
summary: >-
  Wrote to Prime Minister İnönü, not Atatürk, asking that forty scholars barred in Germany work in Turkey
  unpaid for a year; the ministry refused.
quote:
  text: >-
    These scientists are willing to work for a year without any remuneration in any of your institutions
    according to the orders of your Government.
  language: en
mediated_by: >-
  İnönü Foundation transcription ← Prime Ministry archive original; Reisman (HNN) for the ministry annotations
caveat: >-
  Counted under the first-hand contact rule for major figures (project rule, 5 Nov 2026). The letter (17 Sept
  1933, as honorary president of the OSE) is addressed to Prime Minister İsmet İnönü, not to Atatürk, and
  names neither him nor his reforms. İnönü sent it to the Education Ministry on 9 Oct 1933; marginal notes
  rejected it ('incompatible…', 'impossible to accept…') — Reisman attributes them to minister Reşit Galip
  (Galip may already have left office in Aug 1933). Neither Einstein archive (Princeton, Hebrew University)
  had seen the letter; one archivist suggested he signed an OSE-drafted text. Turkey did take in many German
  émigré scholars in 1933 through other channels.
node: Writers, Scientists and Artists in Contact with Kemal, 1919–1938
