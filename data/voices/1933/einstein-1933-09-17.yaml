  note: >-
    Quote verbatim in the İnönü Foundation text (addressed 'Your Excellency'; the site says it was sent to PM
    İsmet İnönü via the dentist Sami Günzberg). Reisman: İnönü passed it to the Education Ministry on 9 Oct
    1933, and the marginal notes read 'this proposal is incompatible with clauses [in the existing laws]' and
    'impossible to accept it due to prevailing conditions'. Corrections as the main agent asked: (1)
    what_they_saw must say it went to İnönü, not Atatürk, and was rejected; (2) the letter does not say
    'German-Jewish', only scholars who 'cannot practice further in Germany on account of the laws'; (3) the
    caveat omits Reisman's point that neither the Princeton nor the Hebrew University Einstein archivist had
    seen the letter, and one suggested Einstein signed an OSE-drafted text or presigned stationery. Lead (tier
    M, not used): Reşit Galip is usually said to have left the Education Ministry in Aug 1933, so the
    attribution of the notes to him is Reisman's and should read so. witness/letter is right under the contact
    rule (to Kemal's government, not to Kemal).
