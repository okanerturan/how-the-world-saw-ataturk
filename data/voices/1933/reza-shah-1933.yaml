summary: >-
  Tells the Turkish ambassador he very much wants to meet Gazi, and means to visit him with the crown prince
  in spring 1934.
quote:
  text: >-
    Sizin söylediğinize göre Gazi Hazretleri benimle görüşmek istemektedirler. Bende kendileri ile görüşmeyi
    son derece arzu etmekteyim.
  language: tr
mediated_by: >-
  Atuk, ÇTTAD XVII/35 (2017), p. 232 ← Hüsrev Gerede, Siyasi Hatıratım 1: İran (Vakit, 1952), p. 265
  (ambassador's memoir)
caveat: >-
  Reported in the ambassador's memoir, not a text of the Shah's own; Atuk places it 'early 1933'. Diplomatic
  courtesy that states a wish to meet rather than a judgement. Translation: 'According to what you tell me,
  His Excellency Gazi wants to meet me. I too very much wish to meet him.'
node: Interwar Leaders on Kemal in Their Own Words
