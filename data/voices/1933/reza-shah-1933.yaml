  method: tools/ms free fetch of the PDF; located the quote, page header 232 and fn 57
  note: >-
    Verbatim on p. 232: 'Sizin söylediğinize göre Gazi Hazretleri benimle görüşmek istemektedirler. Bende
    kendileri ile görüşmeyi son derece arzu etmekteyim. 1934 yılı ilkbaharında oğlum veliahtı ve Gazi
    Hazretlerini görmeye kararlıyım.' Atuk introduces it as Gerede (ambassador in Tehran) expressing in early
    1933 the Shah's wish to visit; fn 57 = Gerede, Siyasi Hatıratım 1 İran, Vakit 1952, p. 265. The memoir
    itself was not read; the Persian-to-Turkish rendering is Gerede's. Record's mediated_by and caveat are
    accurate. No correction needed (optionally: say the words are the ambassador's Turkish rendering of the
    Shah).
