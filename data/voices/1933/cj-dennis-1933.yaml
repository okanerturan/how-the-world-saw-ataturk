summary: >-
  Comic ode 'Kemal — The Posh Pasha': bastinado and bow-strings gone, veils banished, a fabulous land made
  'wide-awake, up to date' by one man.
quote:
  text: To the joy of the males he has banished the veils From the faces of Bosphorous belles.
  language: en
caveat: >-
  Light verse signed 'Den', The Herald (Melbourne), 1 Nov 1933, p. 6. The headnote ties it to the republic's
  10th anniversary and says Kemal, 'who fought against the Anzacs at Gallipoli, is spoken of by General Sir
  Harry Chauvel as a very great man': Chauvel's remark is reported there, not sourced. The Oriental clichés
  (harems, hookahs, bastinado) are the poem's own.
node: Four Poems on Atatürk — Melbourne, Damascus, Cairo and Hyderabad, 1933–1939
