summary: >-
  Comic ode to 'Kemal - The Posh Pasha': sultans' scimitars and bow-strings gone, veils banished, a nation
  made 'wide-awake, up to date' by one man.
quote:
  text: To the joy of the males he has banished the veils From the faces of Bosphorous belles.
  language: en
caveat: >-
  Light verse in Dennis's 'Den' signature, printed in the Melbourne Herald in 1933 (middlemiss.org's index
  lists it under 'Works in the Herald 1933'; the day was not given). Its headnote ties it to 'the 10th
  anniversary' of the Turkish republic (so late Oct or Nov 1933) and says Kemal 'fought against the Anzacs at
  Gallipoli, is spoken of by General Sir Harry Chauvel as a very great man' (headnote, so Dennis or the
  Herald's, and Chauvel's remark is reported, not sourced here). The Oriental clichés (harems, hookahs,
  bastinado) are the poem's own. Text verified on the Perry Middlemiss transcription of the Herald; the Herald
  page image itself (Trove) not seen. Check: Middlemiss gives 'Den', Herald (Melbourne), 1 November 1933, p.
  6; the Trove page itself not seen (bot check), so evidence S. UPGRADE 4 Nov 2026: read on Trove (article
  243202439; The Herald, Melbourne, 1 Nov 1933, p. 6, 'KEMAL — THE POSH PASHA' by 'Den'), via a headed browser
  that passed Trove's automatic check; the headnote reports Chauvel calling Kemal 'a very great man'. Evidence
  S → P.
