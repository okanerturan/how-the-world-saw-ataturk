  cites Şimşir vol. IV pp. 261, 278 for the visit
caveat: >-
  Turkish rendering of remarks reported from the visit; original language (French or Serbian) not given.
  Second line, same source: 'Devrin bu faik adamı ile anlaşmanın kolay olacağına dair bir intiba hasıl ettim'
  ('I formed the impression that agreement with this outstanding man of the age would be easy'). Motive:
  building the Balkan Pact.
