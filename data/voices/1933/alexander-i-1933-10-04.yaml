summary: >-
  After meeting him at Dolmabahçe he said Atatürk's bearing, voice and gaze marked a rare man, and agreement
  with this exceptional man would be easy.
quote:
  text: >-
    Hali, tavrı, konuşması, başı, bakışı ve sesi derhal insan üzerinde nadir bir adam karşısında bulunduğumuzu
    düşündüren bir tesir bırakıyor.
  language: tr
