summary: >-
  Sends Republic Day greetings and sketches Atatürk's revolution, calling the transformation of Turkey since
  1919 admirable and its modernisation 'the goal of Kemal Ataturk'.
quote:
  text: >-
    No one can fail to admire the courage with which this country has tackled its huge tasks. Turkey, under
    Mustafa Kemal Ataturk, set out to be a modern nation and became a healthy republic with amazing vitality.
  language: en
caveat: >-
  Delivered as one of his greetings on the anniversaries of the Bandung Conference states ('I announced that I
  would address the United States Congress each time there was an anniversary'); the account of the reforms
  reads like embassy-supplied material, so it is a courtesy text as well as a view. Page numbers from the
  running heads (OCR). Cited as Extensions of Remarks (House), 27 August 1957, Congressional Record vol. 103
  (bound), pp. ~16181-16182 (granule CRECB-1957-pt12-4-3). Check: the body reads like embassy fact-sheet text;
  the Record gives no source. Check (round 24): the same sentences appear in his 1956 extension and in an
  unsigned magazine article printed in the Appendix on 16 May 1956 (p. A4001); likely embassy-supplied text.
