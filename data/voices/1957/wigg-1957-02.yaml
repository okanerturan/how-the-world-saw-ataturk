summary: >-
  Notes Conservatives now respect Kemal Ataturk, though Britain tried to knock him off his perch in 1922 and
  only made him stronger.
quote:
  text: >-
    Today, hon. Gentlemen speak in terms of great respect of Kemal Ataturk. There was a time when we tried to
    knock down Kemal Ataturk.
  language: en
caveat: >-
  Army Supplementary Estimate, 1956-57, HC Deb 5 Feb 1957, c332. Transcription at TheyWorkForYou of the
  official Hansard. Used as a precedent against removing Nasser by force (Suez aftermath): Wigg's point is
  that the Middle East choice is 'authoritarian regimes based upon the army and chaos'. Wigg, who served in
  Constantinople in 1923, mentions Kemal in six contributions 1946-57 (24 May 1946, 16 Mar 1953, 29 Jul 1954
  on the Turks' goodwill, 24 Jan 1956 'another Kemal or ... Enver Pasha' of Nasser, 8 Nov 1956); this is the
  fullest statement. Check: the quote falls at c334 (historic-hansard); TWFY gives the column where the speech
  starts.
