summary: >-
  On the first German state visit since the Kaiser, likens post-war Germany to Turkey after 1918, which began
  a new chapter through Atatürk's great statesmanship.
quote:
  text: >-
    Wir werden mit ihnen fertig werden, wie die Türkei nach 1918 mit den Lasten einer Vergangenheit fertig
    wurde und in dem großen Staatsmanntum von Kemal Atatürk ein ganz neues Blatt der Staatsgeschichte zu
    schreiben begonnen hat.
  translation: >-
    We will cope with them, as Turkey after 1918 coped with the burdens of a past and, in the great
    statesmanship of Kemal Atatürk, began to write a wholly new page of its state history.
