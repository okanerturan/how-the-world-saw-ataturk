summary: >-
  Recalls Atatürk sending officials to Palestine to see if Zionist methods could revive Turkey, and why he
  sought Turkish mediation with the Arabs in 1938.
quote:
  text: >-
    Ataturk had sent a number of Government representatives to Palestine to see whether our methods could not
    be applied to the revival of Turkey.
  language: en
caveat: >-
  Written in 1949 about events up to 1938, so era is posthumous although the claim is about Atatürk's
  lifetime. Weizmann reports Atatürk's act and Turkey's 'progressive record'; he states no personal verdict on
  Atatürk and his purpose is to explain why Turkish mediation with the Arabs seemed worth trying. The sentence
  runs over the page break 459/460 ('Kemal' ends p. 459). Text read from the open Digital Library of India
  scan (OCR). No mention of Atatürk's death (he reached Istanbul on 27 Nov 1938).
