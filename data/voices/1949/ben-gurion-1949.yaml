caveat: >-
  Seen only as a search-engine excerpt of the dokumen.pub copy of Shalom's book; page, footnote 90 and
  Ben-Gurion's original (circulating web versions call it 'diary') were not reached. The book covers 1949-1956
  and the context is Ben-Gurion's argument that nations can revive suddenly; the exact date is unknown, 1949
  is the book's start year and a placeholder. Ellipses are the book's own. Confirm in the Ben-Gurion Archives
  diary or Shalom's notes. Date approximate: the statement is undated (c. 1949–56 per Shalom); it is not
  attested as a diary entry, and Ben-Gurion's own source and the occasion are unreached (Shalom fn. 90).
