  method: one tools/ms search; read the dokumen.pub excerpt (the page itself would not fetch)
  note: >-
    Excerpt confirms Shalom's text: 'In emotional tones BG described the sudden change in Turkey with the
    appearance of this leader. As a student in Turkey I was familiar with the wretched Turkish regime. . . I
    believed it to be decayed and hopeless. . . when suddenly. . . a new spirit arose from the people. A man
    appeared whose name was unknown. . . who breathed new life into the Turkish people. . .' followed by fn
    90. So the stored quote is a verbatim fragment of Shalom (ellipses are his). But Shalom's Ben-Gurion
    source (fn 90), the date and the occasion are not reached; The Tower says only 'reminiscing many years
    later', and Quora copies call it 'diary' without a citation. Date '1949' is a placeholder from the book's
    period, not a dated utterance. what_they_saw omits that the same passage credits him with expelling the
    Greek population; fair but selective. CORRECTION: verdict secondary-only; set date to 'undated (c.
    1949-56, per Shalom)' or leave year with a 'circa' hedge in caveat; mediated_by should keep 'Shalom, fn
    90, Ben-Gurion's source unseen' and the page remains unresolved. Do not describe it as a diary entry.
