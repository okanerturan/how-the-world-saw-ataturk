    archived: https://web.archive.org/web/20261005080226/https://www.marxists.org/reference/archive/mao/selected-works/volume-2/mswv2_26.htm
verification:
  verdict: confirmed
  quote_found: true
  checked_against: >-
    marxists.org/reference/archive/mao/selected-works/volume-2/mswv2_26.htm, 'On New Democracy', January 1940
    (Selected Works vol. 2, FLP)
  method: tools/ms free fetch of the marxists.org page
  note: >-
    Verbatim: 'Besides, even Kemalist Turkey eventually had to throw herself into the arms of Anglo-French
    imperialism, becoming more and more of a semi-colony and part of the reactionary imperialist world.' The
    'petty Kemalist dictatorship of the bourgeoisie' / 'certain specific conditions' sentence and 'where is
    China's Kemal?' are also verbatim. Date Jan 1940 fine. Polarity 'conflicted' is generous: the passage is
    dismissive (Kemalism as a dead-end model, 'no second Turkey'); the concession is only that it arose under
    special conditions. Consider 'critical' if the enum allows, otherwise keep conflicted with intensity 2.
    Note: the text judges Kemalism and 'China's Kemal', not Atatürk personally (caveat already says so).
  checked_on: "2026-11-01"
