summary: >-
  Calls Kemal 'a real soldier' who stopped the Greeks on the Sakarya and 'saw his chance' at Afyon; says
  Allied arms stocks fed his army.
quote:
  text: >-
    This must have rejoiced the heart of Mustapha Kemal, a real soldier, who held them up quite definitely on
    the River Sakaria.
  language: en
caveat: >-
  Tim Harington Looks Back (John Murray, 1940), p. 108 (page footers; the Afyon line is p. 110); open DLI scan
  in.ernet.dli.2015.176573. P. 110: 'With the Greeks weakened by their detachment in Eastern Thrace, Mustapha
  Kemal saw his chance and seized it. He struck a bit of the line near Afium Karahissar'. Elsewhere the Chanak
  commander says that the arms the Allies stored after 1918 were released to the Turks and 'formed the nucleus
  of the army which Mustapha Kemal built up', and that Kemal 'sent some very difficult men to Constantinople'.
  He prints Kemal's and Ismet's letters after the Mudania agreement (c. p. 150). Conflicted rather than
  admiring: professional respect with the grievance of the Chanak commander. Neutral voice on Chanak. The
  'difficult men … lessening the authority of the Allied Forces' sentence is p. 224.
node: Soldiers on Mustafa Kemal in Their Own Words, 1915–1940
