  note: >-
    Quote verbatim: 'This must have rejoiced the heart of Mustapha Kemal, a real soldier, who held them up
    quite definitely on the River Sakaria.' PAGE FIX: the folios are at the foot, so this is p. 108 (index
    lists Kemal at 108, 110), not 107; 'saw his chance and seized it. He struck a bit of the line near Afium
    Karahissar' is p. 110, not 109. The 'late President ... whose gallantry in the Gallipoli Campaign will
    ever be remembered' is also p. 108. 'Mustapha Kemal then sent some very difficult men to Constantinople
    ... with the idea of gaining power and lessening the authority of the Allied Forces of Occupation' and the
    arms 'formed the nucleus of the army which Mustapha Kemal built up' are p. 224 (not listed in the index).
    Harington says he never met Kemal. POLARITY: 'conflicted' is defensible (admiring soldier's verdict plus
    the grievance and 'collecting arms ... some quite wrongly'), but the stored quote and what_they_saw carry
    only the admiring pole; either add the p. 224 'difficult men' sentence as the second pole in the
    caveat/note or re-label admiring intensity 1-2. Era posthumous correct (1940, calls him 'the late
    President').
