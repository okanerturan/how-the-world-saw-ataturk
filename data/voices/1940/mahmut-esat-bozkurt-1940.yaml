  note: >-
    Quote verbatim, but on p. 129, not p. 130. The OCR page header '— 129 —' precedes 'Atatürk büyük ferağet
    sahibi idi ... Bu Türk oğlu, bu sade vatandaş ... kurtarıcısı olacaktı. Ve oldu.' followed by footnote '!
    Lârousse Üniversel'. '— 130 —' then opens with 'Atatürkten bir çok defalar işittim, diyordu ki: ...'.
    Corrections: caveat 'p. 130' → 'p. 129'; 'The same page begins ... and adds first-hand: Atatürkten bir çok
    defalar işittim' → 'p. 129 has the ferağet passage; p. 130 opens Atatürkten bir çok defalar işittim'.
    Strict test passes: his own evaluation ('büyük ferağet sahibi idi'), not only narration.
    Admiring/posthumous are right. Schema ok.
