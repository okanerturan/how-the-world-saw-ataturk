quote:
  text: Ben en çok Mustafa Kemal'e şaşarım
  language: tr
caveat: >-
  TRANSLATION of the gloss only; the quote is Turkish. 'I am most astonished by Mustafa Kemal, how such a
  genius could climb out of that rotten swamp ... despite all his human shortcomings.' Letter of 9/10 May 1987
  to the critic Tahsin Saraç, in Aziz Nesin - Tahsin Saraç Mektuplaşmaları (Düşün Yayıncılık, 1995), pp.
  131-132 (archive.org aziz-nesin-kac-aptaliz, OCR). Nesin adds: 'Biz küçümencik, adını anmaya değmez işleri
  kotaramazken - hem de ondan altmış yıl sonra - nasıl yaratmış o mucizeyi' (we cannot manage tiny things
  sixty years later, how did he create that miracle). The letter's context is the row over claiming Ibn Sina
  and Mimar Sinan as Turks; Nesin jokes that someday they will take 'Bosnian-descended Mustafa Kemal' too. A
  different letter in the same book (7 Dec 1988) calling Atatürk 'gerçekten dahi' is Saraç's, not Nesin's, and
  is not used. Nesin, a satirist who spent years in prison and was otherwise sharp about Atatürk-worship, is
  the ambivalent internal voice here.
node: Famous Pens on Atatürk II — Farrère, Halide Edib, Toynbee, Pamuk, Nesin
