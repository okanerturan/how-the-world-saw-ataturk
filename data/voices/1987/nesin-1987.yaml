  method: curl of the open djvu text; read the whole letter and its neighbours
  note: >-
    Writer is Nesin: the letter is headed '9/10 Mayıs 1987 / Can dostum Tahsin' and speaks of 'Nesin Vakfı',
    his new book 'Maçinli Kız İçin Ev' (Saraç's 21 May reply thanks him for it). Verbatim: 'İyi ki bir
    Nasrettin Hoca, bir Yunus, bir Sinan, bir Nâzım ve bir de Mustafa Kemal var. Ben en çok Mustafa Kemal'e
    şaşarım, o pis [OCR garbled: '«okuşmuş'] bataklıktan nasıl çikabilmiş öyle bir deha... Bütün insansal
    eksikliklerine karşın.' (one word of the swamp adjective is garbled in the OCR; the record's quote, which
    stops at 'şaşarım', is unaffected). Printed on pp. 131-132. The next page break splits 'Biz küçümencik ...
    kota-/ramazken'. Fair.
