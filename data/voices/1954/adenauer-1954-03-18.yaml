caveat: >-
  Opening of his reply to Menderes at the dinner on his arrival day; he goes on to Turkey as a factor of
  stability in the Near East and its place in the Western alliance. Earlier that day he laid a wreath at
  Anıtkabir and stood in silence (Milliyet p. 1, reporter's narration). The German original (Bulletin des
  Presse- und Informationsamtes der Bundesregierung, March 1954) was not seen. Read on the page image (Okan's
  Milliyet archive login).
