voice: Josip Broz Tito
voice_type: person
role: >-
  President of Yugoslavia; reply toast at President Bayar's dinner, Çankaya, Ankara, during his state visit
country: Yugoslavia
country_now: Serbia
domain: politics
date: "1954-04-13"
era: posthumous
polarity: admiring
intensity: 1
artifact: speech
evidence: J
summary: >-
  Ankara as the dignified expression of a national strength inspired by the memory of Atatürk's 'legendary
  personality'.
quote:
  text: >-
    Türkiyenin hükûmet merkezinde bulunmaktan derin bir memnunluk duymaktayım. Bu Türk milletinin büyük,
    Atatürkün efsanevî şahsiyeti hatırasından mülhem olan kuvvetinin ve canlı millî şuurunun vakur bir
    ifadesidir.
  translation: >-
    I feel deep satisfaction at being in the seat of government of Turkey. It is the dignified expression of
    the Turkish nation's great strength, inspired by the memory of Atatürk's legendary personality, and of its
    living national consciousness.
  is_translation: true
  language: tr
mediated_by: >-
  Milliyet, 14 Apr 1954, p. 7 ('Türk-Yugoslav siyasî görüşmeleri başladı', section 'Titonun nutku', misprinted
  'TITNUN NUTKU'): the paper's Turkish rendering of his toast
caveat: >-
  Opening lines of the reply toast; the rest is about Yugoslav sympathy, the Ankara Pact and Balkan peace. The
  page prints a comma after 'büyük' ('büyük, Atatürkün'), so 'great' reads with the nation's strength; if the
  comma is a compositor's slip the phrase is 'the great Atatürk'. The same day he laid a wreath at Anıtkabir
  (Milliyet p. 1); no book entry is printed. The original text (Borba / Politika, 14 Apr 1954; Govori i članci
  vol. IX) was not seen. The Instagram line 'Sizi hayatım boyunca daima ilham kaynağı olarak yaşattım'
  attributed to his Anıtkabir entry has no source. Read on the page image (Milliyet's subscriber archive).
