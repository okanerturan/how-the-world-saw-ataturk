summary: >-
  Ankara, the Turkish seat of government, as the dignified expression of a national strength inspired by the
  memory of 'the legendary personality of the great Atatürk'.
quote:
  text: >-
    Türkiyenin hükûmet merkezinde bulunmaktan derin bir memnunluk duymaktayım. Bu Türk milletinin büyük
    Atatürkün efsanevî şahsiyeti hatırasından mülhem olan kuvvetinin ve canlı millî şuurunun vakur bir
    ifadesidir.
  translation: >-
    I feel deep satisfaction at being in the seat of government of Turkey. It is the dignified expression of
    the Turkish nation's strength, inspired by the memory of the legendary personality of the great Atatürk,
    and of its living national consciousness.
