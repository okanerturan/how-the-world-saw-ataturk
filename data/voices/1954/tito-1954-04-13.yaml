caveat: >-
  Opening lines of the reply toast; the rest is about Yugoslav sympathy, the Ankara Pact and Balkan peace. The
  same day he laid a wreath at Anıtkabir (Milliyet p. 1); no book entry is printed. The original
  Serbo-Croatian text (Borba / Politika, 14 Apr 1954; Govori i članci vol. IX) was not seen. The Instagram
  line 'Sizi hayatım boyunca daima ilham kaynağı olarak yaşattım' attributed to his Anıtkabir entry has no
  source. Read on the page image (Okan's Milliyet archive login).
