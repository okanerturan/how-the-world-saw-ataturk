    headers)
  method: curl djvu text
  note: >-
    Sanusi-chapter quote verbatim on p.319 (between headers 'JIHAD 319' and '320 THE ROAD TO MECCA'),
    narrator's own judgement. 'petty masquerader' line verbatim on p.297 (under header 'DAJJAL 297'), spoken
    by Asad in the Iranian dialogue and explicitly about Ataturk ('How is it that Ataturk, that petty
    masquerader who denies all value to Islam...'). Pages are the reprint's, not the 1954 first edition's.
    Note: tone is predominantly hostile; 'conflicted' rests on his crediting the religious character of the
    war, defensible but generous.
