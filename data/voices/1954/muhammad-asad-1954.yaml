summary: >-
  Says the Turkish struggle first stood 'in the sign of Islam', then that Atatürk forsook religion and
  rejected Islamic values in his reforms.
quote:
  text: >-
    Instead of basing his social revolution on a revived and reinvigorated Islam, Ataturk forsook the
    spiritual force of religion (which alone had brought him to victory) and made, quite unnecessarily, a
    rejection of all Islamic values the basis of his reforms.
  language: en
caveat: >-
  Passage is in the Sanusi chapter ('Jihad'), p. 319 (text between the page headers 'JIHAD 319' and '320'),
  and describes Sayyid Ahmad al-Sanusi's disappointment; the judgement of Atatürk is the narrator's own. Read
  from the Islamic Book Service (New Delhi, 2004) reprint titled The Road to Makkah as scanned on archive.org;
  page numbers are that reprint's printed headers. Asad writes in 1954 about events of the 1920s-30s. Further
  passages: p. 297 (a dialogue set in Iran in the 1930s, Asad asks 'How is it that Ataturk, that petty
  masquerader who denies all value to Islam, has become to you Muslims a symbol of Muslim revival?'), p. 268
  (Reza Khan's 'obvious admiration of Kemal Ataturk' and Iranians' 'fear of losing their religion as the Turks
  had lost theirs'), p. 272 (Reza Shah seeking 'to emulate Kemal Ataturk in building a vainglorious Western
  facade'). Same voice and date, so merged into one record; polarity 'hostile' (he credits only the Islamic
  character of the war of independence, and calls Atatürk 'that petty masquerader', p. 297). Asad's Islam at
  the Crossroads (1934) and The Principles of State and Government in Islam were grepped and do not name
  Atatürk.
node: Leaders and Thinkers of the Muslim World and Asia on Atatürk in Their Own Words
sources:
  - url: https://archive.org/details/road-to-mecca_202409
verification:
  verdict: confirmed
  quote_found: true
