summary: >-
  Calls Kemal Pasha 'the dictator of Turkey' yet credits his reforms with creating a new nation 'dedicated to
  the principles of liberalism and progressivism'.
quote:
  text: >-
    Kemal Pasha, the dictator of Turkey. What a name to conjure with. … a new nation with new ideals,
    dedicated to the principles of liberalism and progressivism
  language: en
caveat: >-
  His own words, one passage in a survey of dictators (Mussolini, Hitler, Dollfuss, Stalin, Kemal) used to
  argue that the New Deal is none of them: Kemal is ranked as a dictator whose reforms nonetheless worked
  ('Turkey is growing and developing under the benign influence of occidental civilization'). The paragraph
  sits in two columns of OCR with hyphenation broken, so the quote is rebuilt from adjacent lines. Sirovich
  was a physician and playwright and chaired the House Patents Committee. Cited as House of Representatives,
  24 April 1934, hour-long special order 'The Administration of President Roosevelt', Congressional Record
  vol. 78 (bound), pp. ~7233-7234 (granule CRECB-1934-pt7-v78-6-2).
