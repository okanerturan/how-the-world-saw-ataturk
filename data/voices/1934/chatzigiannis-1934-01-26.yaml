summary: >-
  Holds up Kemal as a classic model of statecraft: legalised his revolt through a National Assembly while
  all-powerful, abolished caliphate and dynasty, paid deputies well.
quote:
  text: >-
    Τὸ παράδειγμα τοῦ Κεμάλ Μουσταφᾶ θὰ παραμείνῃ κλασσικὸν ὑπόδειγμα ἀπὸ πολιτειακῆς ἀπόψεως. Ἐπαναστατήσας
    εἰς τὰ βάθη τῆς Μικρᾶς Ἀσίας ἐνομιμοποίησε τὸ κίνημά του διὰ τῆς μεγάλης ἐθνοσυνελεύσεως ἐκπροσωπούσης τὴν
    θέλησιν τοῦ Τουρκικοῦ λαοῦ, ἐνῷ οὐσιαστικῶς αὐτὸς ἦτο παντοδύναμος.
  language: el
caveat: >-
  Βουλή Δ΄ περίοδος Α΄ σύνοδος Τόμος 2, part 3, session ΡΑ΄ of Friday 26 Jan 1934 (heading on p. 1780),
  printed pp. 1828-1829 (PDF page 153; page image read; verbatim stenographic text). Said in the debate on
  raising deputies' allowances, which the speaker supports: Kemal is a rhetorical example (the Turkish
  Assembly pays its members 37,000 drachmas a month). A minor deputy; the initial D. is the only forename
  given.
