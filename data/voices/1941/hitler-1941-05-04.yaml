    unfortunate result was as heavy a burden for Turkey as it was for us. The great and ingenious
    reconstructor of the new Turkey gave his Allies, beaten by fate, the first example of resurrection.'
    Atatürk is not named, so the identification is an inference (strong: WWI ally, 'new Turkey',
    'resurrection'; in 1941 the Turkish head of state was İnönü, so the reference is to the dead founder). The
