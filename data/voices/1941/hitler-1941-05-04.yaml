  first example of resurrection'.
quote:
  text: >-
    Der große geniale Neuschöpfer der jungen Türkei gab als erster ein wunderbares Vorbild für die Erhebung
    der damals vom Glück verlassenen und vom Schicksal so entsetzlich geschlagenen Verbündeten.
  language: de
caveat: >-
  [translation] 'The great, ingenious new creator of the young Turkey was the first to give a wonderful
  example of the rising-up of the allies who were then abandoned by fortune and so terribly struck by fate.'
  Verhandlungen des Reichstags, 4. Wahlperiode, Bd. 460, 6. Sitzung, 4 May 1941, p. 85 C (BSB bsb00000613,
  image 86; read on the page image by the main agent, 3 Nov 2026). The passage opens 'Die Türkei war im
  Weltkrieg unser Verbündeter' and goes on to praise 'the realistic attitude of her state leadership' (İnönü)
  for keeping Turkey out of the war. Atatürk is unnamed, identified by context. The BBC translation previously
  stored ('the great and ingenious reconstructor of the new Turkey … the first example of resurrection') is
  loose.
