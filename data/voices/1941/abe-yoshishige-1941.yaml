    近時のトルコが獨裁者ケマルによつて生氣を得たのは事實であり、彼は實に「トルコの父」とさへ呼ばれて居る。併し彼なき後のトルコの將來が憂慮せられるのは、一國が一人によつて興るのは一時のことであり、
  language: ja
caveat: >-
  Jidai to bunka (1941), essay 'Shakai to kojin', printed p. 63, NDL image 37 (page image read). Written in
  the present tense about the dictators of the day (essay probably earlier than 1941); the republication in
  1949 repeats the lines. Not a funeral-era text. Check: 1941 is the publication date; the preface dates the
  essays 1935–40, and the present tense ('彼なき後') reads as written while Kemal lived, so the era may be
  contemporary.
