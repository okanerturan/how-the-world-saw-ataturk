  note: >-
    Quote verbatim on printed p.63 (left page; ends mid-sentence at comma, but the next clause completes the
    thought: such a one-man revival is brief). Translation faithful. DATE/ERA PROBLEM: the preface (image 4)
    says the essays were written 'roughly 昭和十年から十五年' (1935-40) and gives dates only for two other essays; this
    one is undated. The text speaks of Kemal in the present tense ('呼ばれて居る', worry about Turkey 彼なき後, i.e. a
    future without him), which reads as written while he lived. So date 1941 is only the book date and era
    'posthumous' is not supported; best statement is 1935-1940, era unresolved (probably contemporary). Gaze
    test passes (own view of Kemal, conflicted).
