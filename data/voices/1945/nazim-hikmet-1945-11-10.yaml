  note: >-
    Under 'İSTİKLAL SAVAŞI DESTANINDAN : ATATÜRK', the Kocatepe passage contains 'Sarışın bir kurda benziyordu
    / Ve mavi gözleri çakmak çak- maktı', signed 'Nazım HİKMET'; the unsigned prose ('Atatürk, bu memlekette
    Tanzimatta doğup...') follows the signature, as the record says. Translation faithful. Date from the item
    title; the page's own masthead is garbled in OCR, but the front-page İnönü 1945 tribute to Atatürk fits an
    anniversary issue. Posthumous is right. A heroic portrait in his own verse, so admiring passes the strict
    test. Schema ok.
