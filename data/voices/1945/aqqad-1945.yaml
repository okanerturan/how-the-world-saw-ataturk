summary: >-
  Holds Mustafa Kemal up against Hitler: he spent a fraction of Hitler's armaments yet retook Istanbul with
  the Allied armies in it.
quote:
  text: واستطاع مع ذلك أن يفتح الآستانة فتحاً ثانياً وفيها جيوش الحلفاء
  translation: and yet he was able to conquer Istanbul a second time, with the Allied armies in it.
  language: ar
caveat: >-
  Cited as al-Risala no. 619, 14 May 1945, Wikisource page 'مجلة الرسالة/العدد 619/التربية السياسية'. Al-Aqqad
  cites his own earlier line from his book 'Hitler in the Balance' (1940). Argument: Kemal's success rested on
  shrewdness, not on spending on arms; he also had the Turks regain the forts and abolish the capitulations. A
  related remark in no. 629 (23 Jul 1945, 'Voice and Personality') says the voices of Churchill and Mustafa
  Kemal surprised him, and calls Kemal 'the hero of the Turks'; in no. 400 (3 Mar 1941) he lists 'the
  experiment of Mustafa Kemal in Turkey' among revolutions that needed state power. Passing but in his own
  words. Wikisource transcription.
node: Egyptian Pens in al-Risala on Atatürk, 1935–1946
