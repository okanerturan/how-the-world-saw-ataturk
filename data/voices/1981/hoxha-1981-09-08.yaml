caveat: >-
  Translation (the vault's): 'Mustafa Kemal Atatürk was a great statesman-leader and an outstanding political
  personality.' Albanian original in Enver Hoxha, Letra të zgjedhura, vol. 2 (Tiranë: 8 Nëntori, 1986), letter
  to the mayor of Gölcük, 8 Sept 1981, pp. 375–376 (sentence on p. 375); the portrait came through the
  'Rozafa' ensemble. Corrected at check: the builder had attached it to a 30 Apr 1973 letter to a Pakistani
  namesake, Mustafa Kemal Pasha, which does not mention Atatürk. The passage praises his democratic thought,
  'progress and modernization', trust in youth and goodwill toward Albanians.
