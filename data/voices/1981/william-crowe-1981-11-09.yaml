    "Her komutan Ata[türk]'ü tanımalı ve ondan ders al[mal]ıdır" […] "Onun [bir] komutanda bulunması gere[ken]
    tüm niteliklere sahip bulun[duğ]unu" belirtmiş, "O, devlet a[dam]lığı ile askerî dehayı birleş[tirm]iş,
