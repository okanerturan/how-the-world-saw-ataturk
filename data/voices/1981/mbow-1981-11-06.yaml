evidence: P
summary: >-
  Honorary doctorate in Ankara, centenary year: 'one of this century's most notable figures', whose long march
  holds lessons for the Third World.
quote:
  text: >-
    Bien des aspects de cet immense parcours d'Atatürk ont une portée universelle. […] ces peuples peuvent
    tirer de précieuses leçons de la longue marche entreprise par Atatürk, il y a déjà plus d'un demi-siècle,
    sur des cimes qui étaient encore vierges et dans un monde où les pionniers de sa trempe étaient encore des
    hommes seuls.
  language: fr
  translation: >-
    A good many aspects of Atatürk's vast work are universally valid. […] They can learn valuable lessons from
    the long march undertaken by Atatürk, over half a century ago now, across heights that were still
    untrodden, in a world where pioneers of his stamp were still solitary figures.
  translated_by: source
  note: >-
    The English is UNESCO's own version of the address, issued under the same document number; it is not the
    archive's translation. 'Ces peuples' are the peoples of the Third World, named in the part left out.
caveat: >-
  Address on receiving the degree of Doctor honoris causa of the University of Ankara (Faculty of Literature,
  History and Geography), Ankara, 6 November 1981, in the presence of the head of state (UNESCO document
  DG/81/43, a cover and three typed pages). It was his second visit in eighteen months, after mbow-1980-06-09.
  He also announced the symposium UNESCO would hold in Paris on 16–18 December 1981 and its volume 'Atatürk:
  fondateur d'un Etat moderne'. As in 1980, the document does not say which language he spoke.
node: Atatürk Centennial
