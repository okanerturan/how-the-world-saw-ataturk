summary: >-
  Says Albanians hold special admiration for Atatürk, who freed Turkey from the sultans' imperial complex and
  set it on a course of democracy and progress.
quote:
  text: >-
    The Albanian people have special admiration and respect for Mustafa Kemal Ataturk, that outstanding
    personality and statesman,
  language: en
caveat: >-
  Enver Hoxha, Selected Works, vol. VI (Tirana: 8 Nentori, English), 'Report to the 8th Congress of the PLA',
  1 Nov 1981, p. 417 (running head 'REPORT TO THE 8TH CONGRESS OF THE PLA 417'). The OCR prints 'Atattirk'.
  Continues: he 'liberated Turkey and its valiant people', 'consolidated the unity and genuine independence of
  the Turkish nation'; Hoxha adds that Atatürk was well disposed to Albania and opposed King Zog, and that
  Turkey sheltered hundreds of thousands of Kosova refugees (his words). Same passage in Spanish, Portuguese,
  Italian and German editions (fts). The Zog remark is Hoxha's; the vault records no independent confirmation.
node: Hoxha, Beneš, Brezhnev and the Soviet Presidium on Atatürk, 1939–1982
