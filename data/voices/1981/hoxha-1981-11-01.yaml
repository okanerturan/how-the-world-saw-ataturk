  method: curl of the open djvu text; running head with page number read in place
  note: >-
    Verbatim p. 417 (head 'REPORT TO THE 8th CONGRESS OF THE PLA 417'): 'The Albanian people have special
    admiration and respect for Mustafa Kemal Atattirk [OCR], that outstanding personality and statesman, who,
    with great courage and inspired by democratic progressive ideas, liberated Turkey and its valiant people
    from the complex of enslaving other peoples, which characterized the Sultans' empire, consolidated the
    unity and genuine independence of the Turkish nation and set Turkey on the course of democracy and
    progress.' Report dated November 1, 1981 in the volume. Caveat error: Hoxha says Turkey sheltered
    'hundreds of thousands of our brothers from Kosova' (not 'hundreds of Albanian exiles'); the Zog remark is
    Hoxha's own, as the record says. The record's quote ends in a comma where the sentence continues; fine.
    Polarity admiring, intensity 2 fair; era posthumous correct.
