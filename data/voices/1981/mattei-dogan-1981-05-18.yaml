summary: >-
  The first and greatest charismatic leader of the twentieth century, a model for Reza Shah, Gandhi, Nehru,
  Bourguiba, Kenyatta and Eva Perón.
quote:
  text: >-
    "Napolyon da bir liderdi, ama Atatürk ve de Gaulle gibi krizmatik bir lider değildi. Atatürk ve de
    Gaulle'ün ortak özellikleri, asker oluşlarıdır. Her ikisinin de etkileyici kişilikleri, başardıklarının
    kalıcı olmasını sağlamıştır. Atatürk 20. yüzyılın ilk ve en büyük karizmatik lideridir. Rıza Şah, Gandi,
    Nehru, Burgiba, Kenyatta ve Eva Peron'a örnek olmuştur."
  translation: >-
    Napoleon too was a leader, but not a charismatic leader like Atatürk and de Gaulle. What Atatürk and de
    Gaulle have in common is that they were soldiers. In both, an impressive personality ensured that what
    they achieved would last. Atatürk is the first and greatest charismatic leader of the 20th century. He was
    a model for Reza Shah, Gandhi, Nehru, Bourguiba, Kenyatta and Eva Perón.
  is_translation: true
  language: tr
