summary: >-
  Exceptional among soldiers who took power: he set aside his regime's military elements, and his republic was
  not a military dictatorship.
quote:
  text: >-
    "Atatürk'ün, bilinçli olarak, rejiminin bütünüyle askerî öğelerini önemsemeyerek, iktidara gelen askerî
    liderler arasındaki müstesna yerini aldığını" […] "Kemalizm sembolü, gelişmekte olan ülkelerin ilerici
    askerî rejimlerinin yönlerini tesbit için, geri kalmışlık ve dış bağımlılık koşulları hüküm sürdükçe,
    önemli ideolojik âmil olarak kalacaktır"
  translation: >-
    that Atatürk, by consciously disregarding the wholly military elements of his regime, took an exceptional
    place among military leaders who came to power […] 'As long as conditions of backwardness and external
    dependence prevail, the Kemalist symbol will remain an important ideological factor in setting the course
    of progressive military regimes in developing countries.'
  is_translation: true
  language: tr
