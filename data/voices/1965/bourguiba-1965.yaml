mediated_by: TBMM minutes (Turkish interpretation)
caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF p. 43 (printed p. 32). Speech printed in Turkish as in the TBMM
  minutes. Translation: "The Battle of Sakarya, the Victory of Sakarya, became the strongest memory of my
  twentieth year." Same speech: 'Sizin Kemalist ihtilâliniz ise, bizlere maya oldu' (PDF p. 48, 'your Kemalist
  revolution became leaven for us'), and on PDF p. 44 the Arab hesitation is traced to 'bu liderin din ve din
  müessesesine karşı takındığı tavırlar' (this leader's stance toward religion and religious institutions),
  with Bourguiba dissenting from the 'very radical judgments'. Heading: 'Tunus Cumhurbaşkanı Habib Burgiba',
  25 Mart 1965. Existing person note covers his later Kemalist programme. Checker's note: Bourguiba distances
  himself from the 'radical judgments' on Atatürk and religion; the critical passage explains Arab reserve
  rather than stating his own verdict.
node: Foreign Statesmen Address the Assembly, 1956–2010
