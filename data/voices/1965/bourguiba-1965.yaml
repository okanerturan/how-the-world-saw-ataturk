  note: >-
    Verbatim match; speaker, office and date agree with book heading ('Tunus Cumhurbaşkanı Habib Burgiba, 81.
    Birleşim, 25 Mart 1965 (heading on PDF p. 42)'). Cited paraphrase support also verified: 'Atatürk'ün
    mucizesi' and 'Mustafa Kemal ... bir kahramanın tam örneği' on p. 43; the Arab reserve traced to 'bu
    liderin din ve din müessesesine karşı takındığı tavırlar' and Bourguiba's dissent from the 'çok radikal
    yargılar' on PDF p. 44. 'conflicted' is defensible but Bourguiba himself dissents from the harsh judgment,
    so the critical note is an explanation of Arab reserve, not clearly his own verdict. Probably spoken in
    French; book prints Turkish; original not looked for.
