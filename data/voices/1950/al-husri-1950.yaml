summary: >-
  Rebutting Hifni Mahmud Pasha: Kemal succeeded by active nationalism, a Turkish state on language and
  history, wisely renouncing the Arab provinces.
quote:
  text: >-
    لا شك في أنه أظهر حكمة وكياسة بعدم الطمع في استرجاع الولايات العربية، بعد اجلاء المحتلين عن الولايات
    التركية.
  translation: >-
    There is no doubt that he showed wisdom and tact in not coveting the recovery of the Arab provinces, after
    expelling the occupiers from the Turkish provinces.
