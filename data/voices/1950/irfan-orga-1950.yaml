summary: >-
  A 'lean, fanatic's face' with a dazzling smile and an 'impatient, autocratic temperament'; Orga, who had met
  him, grieved 'as if a friend had gone'.
quote:
  text: >-
    I remembered how the lean, fanatic's face could light with a smile so dazzling that even his enemies
    forgave him much and how, more frequently, the pressed-in lips smiled when the eyes remained dark and
    sombre, challenging. […] the tall stern leader with the hard eyes that could so suddenly soften, the
    welcoming hand on the shoulder and the amused, harsh voice that said: 'Well, Lieutenant, still running the
    Air Force?' The lack of ceremony surrounding him upon formal occasions had not perhaps been in keeping
    with his impatient, autocratic temperament, yet sometimes he had affected simplicity.
  language: en
caveat: >-
  Chapter 28, on November 1938; read in a digitised text of the Eland edition, which has no page numbers. His
  later Atatürk (with Margarete Orga, Michael Joseph, 1962) drew a Turkish Embassy protest against 'the words
  used to describe Ataturk's character' (Evening Standard, Jan 1962), per Ateş Orga's afterword.
node: Writers and Thinkers on Atatürk — Round 30 Sweep
