date: "2005-11-22"
era: posthumous
polarity: admiring
intensity: 1
artifact: speech
evidence: P
summary: >-
  Toasting President Sezer in Ankara: Kemal Atatürk's 'choice of renewal' laid the ground for a Turkish state
  sharing the West's democracy and freedom.
quote:
  text: >-
    La scelta rinnovatrice di Kemal Atatürk ha posto le premesse per uno Stato turco capace di condividere con
    l'Occidente, oltre alla storia, anche la pienezza dei valori di democrazia e di libertà in cui esso si
    identifica.
  translation: >-
    Kemal Atatürk's choice of renewal laid the foundations for a Turkish state able to share with the West not
    only history but also the fullness of the values of democracy and freedom with which the West identifies.
  language: it
caveat: >-
  Toast at the state dinner given by President Ahmet Necdet Sezer, Presidential Palace, Ankara, 22 November
  2005, on his state visit. The sentence follows a passage on Rome, Byzantium and the Ottomans and leads into
  the Atlantic alliance and European solidarity. The next day, at a dinner given by the Speaker, Bülent Arınç,
  in Dolmabahçe Palace, he called the palace 'significativo - come ultima residenza di Kemal Atatürk - della
  svolta storica compiuta dalla Turchia, ottant'anni orsono, sulla via della modernità e del rinnovamento
  democratico'. The visit's programme also has him laying a wreath at the mausoleum and signing its Book of
  Honour on the morning of 22 November; the text of that entry is not on the portal.
