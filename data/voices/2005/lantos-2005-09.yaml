summary: >-
  Says he urged Musharraf to follow 'the great modernizer' Atatürk, and that Atatürk would admire Musharraf's
  path.
quote:
  text: >-
    I urged him to follow the example of the great modernizer Mustafa Kemal Ataturk, the founder of the
    modern, secular Republic of Turkey, a nation with which President Musharraf is intimately familiar. He
    has, in fact, blazed a trail that I believe Ataturk himself would admire.
  language: en
caveat: >-
  Lantos's own introduction to Musharraf's speech to the American Jewish Congress; Atatürk is the standard he
  held up to a Muslim head of state, which makes the praise partly diplomatic. Party, committee role and state
  are from the standard record, not from the passage. Cited as Extensions of Remarks, 27 September 2005,
  'Speech of Pakistani President Pervez Musharraf...', Congressional Record vol. 151, p. E1958 (granule
  CREC-2005-09-27-pt1-PgE1958).
