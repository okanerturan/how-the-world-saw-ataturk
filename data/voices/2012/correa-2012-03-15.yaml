summary: >-
  Says the Arab Spring countries would not be in their present plight had they had an Atatürk and made their
  political transformation in time.
quote:
  text: >-
    Turkey has become a model country in the Arab Spring. If those countries had had an Atatürk and
    accomplished their political transformations at the time, they would not have fallen into their current
    situation.
  language: en
mediated_by: >-
