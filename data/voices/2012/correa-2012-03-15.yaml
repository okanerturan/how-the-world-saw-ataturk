caveat: >-
  Joint press conference with President Abdullah Gül, Çankaya, 15 March 2012. The Spanish original was not
  found; the official Gül archive (abdullahgul.gen.tr, 82370) prints only Gül's own words. Turkish wording:
  'Eminim ki bu ülkelerin de zamanında bir Atatürk'ü olmuş olsaydı ve siyasi değişimlerini o zaman
  yapabilselerdi, şu anda yaşadıkları durumlara düşmezlerdi.' Two renderings of one interpreted remark, so
  independent only as reports. Check: the quote is the interpreter's English as printed by Hürriyet Daily
  News; no Spanish original found.
