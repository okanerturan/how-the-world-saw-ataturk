summary: >-
  Calls the Turkish leader at Gallipoli a man destined to become a great leader; says Ataturk ordered his men
  not only to attack but to die.
quote:
  text: >-
    a skilled enemy lay in wait, led by a man destined to become a great leader. ... for which Ataturk ordered
    his men not only to attack but to die.
  language: en
caveat: >-
  The quote joins two passages of the same speech (marked with an ellipsis; the first does not name him, the
  second names Ataturk). Descriptive more than praising; the 'Johnnies' words are not quoted in this speech.
  Polarity witness: a stated view of his generalship, not of the man as statesman. The 'Johnnies and Mehmets'
  / 'your sons are now lying in our bosom' text that Anzac speakers attribute to Atatürk is itself contested:
  no 1934 original has been found, it first appears in print in 1953 via Interior Minister Şükrü Kaya's
  recollection, and the 'Johnnies and Mehmets' clause is a 1978 Australian addition (see [[Johnnies and
  Mehmets]]). So this is a speaker's view of the Atatürk of the Anzac legend, spoken at a commemorative or
  diplomatic occasion that rewards praise. Cited as: Dawn Service address, Gallipoli, 25 April 2012.
node: Anzac Day Leaders on Atatürk, 1990–2024 — Australian and New Zealand Speeches
