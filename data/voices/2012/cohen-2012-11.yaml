summary: >-
  Marking Atatürk's death anniversary, calls him the leader who made an agrarian society a modern, secular,
  Western-facing model: 'a great man'.
quote:
  text: >-
    Kemal Ataturk, the leader of modern Turkey who transformed that country from an agrarian society caught in
    the past to a modern, secular and forward looking western model. … I join my friends in paying tribute to
    a great man and a great leader.
