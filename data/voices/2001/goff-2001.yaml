summary: >-
  Calls Atatürk the 'gallant Turkish commander' and founder of the Republic whose generous words are the
  foundation of NZ–Turkey friendship.
quote:
  text: >-
    It was Mustafa Kemal Ataturk, the gallant Turkish commander, and later the founder of the Turkish
    Republic, who said that the fallen rest in the soil of a friendly country.
  language: en
caveat: >-
  Government delegation leader, not prime minister. Goff later became Labour leader and High Commissioner to
  the UK. The 'Johnnies and Mehmets' / 'your sons are now lying in our bosom' text that Anzac speakers
  attribute to Atatürk is itself contested: no 1934 original has been found, it first appears in print in 1953
  via Interior Minister Şükrü Kaya's recollection, and the 'Johnnies and Mehmets' clause is a 1978 Australian
  addition (see [[Johnnies and Mehmets]]). So this is a speaker's view of the Atatürk of the Anzac legend,
  spoken at a commemorative or diplomatic occasion that rewards praise. Cited as: ANZAC Dawn Service speech,
  Gallipoli, 25 April 2001.
