summary: >-
  In an Afyon prison letter, cites Mustafa Kemal's twice-sent cipher requests that he come to Ankara as proof
  of his own wartime service.
quote:
  text: We have to have this heroic hoja here!
  language: en
mediated_by: >-
  Şükran Vahide's biography text hosted by iikv.org (page 330) quoting Nursi's letter to the Afyon governor ←
  Şualar p. 455 (Eng. tr. Rays, p. 533); the sentence is Nursi's report of Mustafa Kemal's words
caveat: >-
  Nursi's own letter, but the quoted sentence is what he says Mustafa Kemal told him, so it shows how Nursi
  chose to present the relationship, not an independent record. Date inferred: Vahide places the letter on a
  29 October Republic Day while Nursi was in Afyon Prison (1948–49), which leaves only 29 Oct 1948.
  Movement-sourced hosting; edition attribution of the hosted text unconfirmed. Distinct from the existing
  1923 record (the Ankara confrontation). Nursi's 'abominable current of atheism' passage (Lem'alar p. 170,
  Flashes p. 233) does not name Atatürk and is not stored. Date inferred: c. 29 Oct 1948, the only Republic
  Day of his Afyon imprisonment (arrested 23 Jan 1948, retrial from 31 Aug 1949).
node: Islamic Thinkers on Atatürk in Their Own Words
