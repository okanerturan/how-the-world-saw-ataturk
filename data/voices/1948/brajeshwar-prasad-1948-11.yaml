summary: >-
  Against parliamentary democracy, lists Kemal with Hitler, Mussolini and Stalin as builders of 'indirect'
  democracy; later, his record is 'as good' as parliamentarians'.
quote:
  text: >-
    The system of government set up by Hitler, Mussolini, Kemal Ataturk and Stalin represent the indirect
    forms of democracy. The whole of Germany, Italy and Turkey were behind the dictators.
  language: en
caveat: >-
  Constituent Assembly of India Debates, vol. VII, 9 Nov 1948, pp. 373-374. Official report digitised by the
  Lok Sabha Secretariat / Government of India Press, via archive.org OCR. Speaks for 'philosopher-kings' and
  one-party rule; the same speech says 'Germany, Italy and Turkey rose to grand heights under Hitler,
  Mussolini and Kemal Ataturk' and 'the records of Mushtapha Kemal and Mussolini are as good as that of the
  leaders of parliamentary democracy' (p. 374). Sensitive framing (fascist comparison) is the speaker's own.
  Text read from the OCR of the official report; obvious OCR slips are  in the quote.
