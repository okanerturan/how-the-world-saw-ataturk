  text: >-
    the Turks had abolished their archaic caliphate; and soon afterwards they established a republic under the
    dynamic leadership of Kemal Ataturk.
  language: en
caveat: >-
  Brief and in passing, so intensity 1. Page 39 is taken from the book's own index ('Ataturk, Kemal, 39'); the
  archive.org OCR text has no page markers. The next paragraph compares Iran in the 1920s with 'neighbouring
  Turkey, which my father visited in 1934 to observe the remarkable progress made' (about p. 39-40). The Shah
  is writing as monarch about his father's republic-or-monarchy choice; the sentence is context for that
  choice.
