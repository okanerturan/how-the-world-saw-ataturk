summary: >-
  A tough, brilliant soldier, hard drinker and wencher of immense will; a dictator, but one who respected
  decency and legality, without terror or camps.
quote:
  text: >-
    A tough and brilliant soldier, a hard drinker and wencher, he was in all things a man of immense will and
    abounding vitality. ... His was a dictatorship without the uneasy over-the-shoulder glance, the terror of
    the door-bell, the dark menace of the concentration camp.
  language: en
caveat: >-
  The Emergence of Modern Turkey, ch. VIII 'The Kemalist Republic', p. 290 in the 2nd edition (OUP/RIIA 1968),
  read in the open archive.org text (THEEMERGENCEOFMODERNTURKEY). The same wording is in the 1961 first
  edition (archive.org search-inside of emergenceofmoder0000bern_d0k7 and others); its page number is not
  confirmed. The paragraph also says 'By his contemporaries he was often called a dictator, and in a sense he
  certainly was', and that he showed 'a respect for decency and legality, for human and political standards'.
  The admiration is qualified: political activity against the regime was banned and the press was strictly
  controlled.
