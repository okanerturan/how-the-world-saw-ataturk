summary: >-
  In Ankara, calls Atatürk the shining example Nehru held up for India's freedom struggle and his secular
  Republic a remarkable, inspiring example.
quote:
  text: >-
    Kemal Ataturk was the shining example whom Jawaharlal Nehru often placed before himself and his people in
    describing the vision of India which inspired us to struggle for our freedom.
  language: en
caveat: >-
  Speech at the banquet hosted by Prime Minister Turgut Özal, Ankara, 17 July 1988; Selected Speeches and
  Writings, vol. 4, pp. 361–364 (archive.org open text). He quotes Nehru's 1928 Calcutta praise of 'Kemal
  Pasha' and Atatürk's line that the Republic 'can never be the land of sheikhs, dervishes', then says: 'The
  achievements of Ataturk's Republic of Culture remain a remarkable, inspiring example.' Also: 'Turkey under
  Ataturk became a byword for modernisation.' Diplomatic banquet speech. The Turkish rendering 'Kendi özgürlük
  mücadelemizde Kemal Atatürk'ten ilham aldık' circulating in Turkish books matches this passage in sense.
