caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF p. 61 (printed p. 50). Speech printed in Turkish as in the TBMM
  minutes. Translation: "I myself, in my youth, was an ardent admirer of Atatürk. Atatürk is a genius and a
  gift of God to the Turkish nation at its moment of greatest need." Same speech: 'O bizi özgür olmağa
  cesaretlendirdi' (he encouraged us to be free); The minutes print 1947 for liberation from colonial rule;
  Malaya's independence was 1957. Heading: 'Malezya Millet Meclisi Başkanı Tan Sri Dato Mohd Zahir Hacı
  İsmail', 23 Nisan 1988.
