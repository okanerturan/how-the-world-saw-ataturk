summary: >-
  Names Atatürk a remarkable soldier-statesman and 'one of the towering figures of history', citing Kinross,
  and says he proves history is made by great men.
quote:
  text: Our particular respect is reserved for that remarkable soldier/statesman Kemal Ataturk
  language: en
caveat: >-
  State-visit dinner given by Özal, so the praise is also hospitality. She says she re-read Lord Kinross's
  biography beforehand and quotes the phrase 'I don't act for public opinion, I act for the nation' (the
  Kinross attribution is hers; Kinross itself not opened here) and adds 'If ever one needed proof that history
  is made not by impersonal forces but by great men, Kemal Ataturk provided it.' Date is the Foundation's
  catalogue date; the document itself gives only 'Ankara' and a COI transcript.
