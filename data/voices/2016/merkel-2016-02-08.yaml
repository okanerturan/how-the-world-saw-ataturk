  note: >-
    Turkish verbatim in both outlets (same wording, same wire). But a snippet of the German Embassy's Facebook
    post titled 'Gedenkbucheintrag' gives the German original: 'In Gedenken an den Vater der modernen Republik
    Türkei, Mustafa Kemal Atatürk, und Wegbereiter nach Europa.' So 'Ata'sı' = 'Vater', and 'mimarı'
    (architect) is the translators' word for 'Wegbereiter' (pioneer/path-opener). The record's what_they_saw
    'architect of the road to Europe' follows the translation; and its caveat that 'Ata' is the translator's
    word is only half right (it is a rendering of 'Vater'). Correction: quote the German (full wording still
    to be read from the post), what_they_saw 'father of the modern Republic of Turkey and a pioneer of the way
    to Europe'. Date 8 Feb 2016 confirmed.
