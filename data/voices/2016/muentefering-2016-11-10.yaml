  text: >-
    Das ist eine Entwicklung, die von dem nicht unumstrittenen Staatsgründer Mustafa Kemal Atatürk einst
    begründet wurde und an den übrigens heute in der ganzen Türkei im Rahmen eines Gedenktages erinnert wird.
  translation: >-
    That is a development which was once founded by the not undisputed state founder Mustafa Kemal Atatürk and
    which, by the way, is being commemorated throughout Turkey today on a day of remembrance.
