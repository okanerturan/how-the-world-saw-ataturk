summary: >-
  Praising Egypt's Sisi, recalls Atatürk as a bridge between East and West and hopes Sisi can become 'the
  Ataturk for the world'.
quote:
  text: >-
    When I look at the work that was done by Ataturk in Turkey, how he provided a bridge between the East and
    the West, and that has been drifting back a bit the other way under Erdogan … could become the Ataturk for
    the world to bring about that bridge between the Muslim world and the Christian world and the West
  language: en
caveat: >-
  One-minute-style floor speech on Egypt; Atatürk is the template for what he wants Sisi to be. The second
  fragment follows after the page break to H267. A second King remark, 13 July 2017 (p. H5823), says Atatürk
  'for 40 years, moved Turkey to the West' (not staged separately). Cited as House of Representatives, 11
  January 2016, 'Egypt Talking Points', Congressional Record vol. 162, pp. H264-H267 (granule
  CREC-2016-01-11-pt1-PgH264).
