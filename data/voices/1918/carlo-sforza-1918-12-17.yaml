id: carlo-sforza-1918-12-17
voice: Carlo Sforza
voice_type: person
role: Italian High Commissioner at Constantinople; telegram to Foreign Minister Sonnino
country: Italy
country_now: Italy
domain: diplomacy
date: "1918-12-17"
era: contemporary
polarity: witness
intensity: 1
artifact: telegram
evidence: P
summary: >-
  Reported secretly receiving a delegation of Unionist leaders, among them 'the hero of the Dardanelles',
  judging that their party might soon return to power.
quote:
  text: >-
    Una delegazione dei capi della Unione e Progresso qui rimasta (fra cui Fetty bey, Ismail Kemal pascià,
    l'eroe dei Dardanelli, ecc.) chiese vedermi. Convinto che la principale forza viva, o per lo meno
    organizzata, risiede tuttora in quel partito e che se una Turchia rimane, non è escluso suo prossimo
    ritorno potere, li ricevetti, ma in modo che non si sapesse.
  translation: >-
    A delegation of the Union and Progress leaders who have remained here (among them Fethi Bey, Ismail Kemal
    Pasha, the hero of the Dardanelles, etc.) asked to see me. Convinced that the main living, or at least
    organised, force still lies in that party and that, if a Turkey remains, its early return to power is not
    excluded, I received them, but in such a way that it should not be known.
  language: it
caveat: >-
  A record of first-hand contact: Sforza gives no view of him beyond the epithet. The telegram prints 'Ismail
  Kemal pascià'; the volume's editors index the passage under 'KEMAL, Mustafà, generale turco', and 'the hero
  of the Dardanelles' in Fethi's company fits only him, but the identification is the editors'. The comma
  after 'pascià' also allows a reading as a list of three. 'Leaders of Union and Progress' is Sforza's
  description of his visitors. 17 December is the date of the telegram (received on the 19th); the day of the
  meeting is not given. He advised them on autonomy for the peoples of the empire and on asking the Western
  powers, above all Italy, for advisers; they answered that if they returned to power they wanted Italian
  support. Compare his later judgement (carlo-sforza-1931).
