summary: >-
  In an Armenian genocide commemoration, cites Atatürk as having recognised the crimes, quoting a 1926
  interview he says Atatürk gave.
quote:
  text: >-
    Indeed, the founder of modern Turkey, Kemal Ataturk, recognized the crimes committed by the Ottoman
    Empire. As I've discussed on this floor before, in a 1926 interview Ataturk himself stated that those
    responsible "should have been made to account for the lives of millions of our Chistian subjects who were
    ruthlessly driven en masse from their homes and massacred."
  language: en
caveat: >-
  Sensitive thread (the Armenian genocide): the Senator's framing and his attribution, which the vault does
  not endorse or test here; the 1926 interview is his citation ('Chistian' is the Record's misprint). He uses
  Atatürk to separate present-day Turkey from the Ottoman crimes. Cited as Senate, 19 April 1994, 'The
  Genocide of Armenians', Congressional Record vol. 140, no. 43, p. S38 (granule CREC-1994-04-19-pt1-PgS38).
  No printed page number (granule suffix S38 only). The 1926 interview he cites (Los Angeles Examiner) is of
  disputed authenticity; his citation, not the vault's.
