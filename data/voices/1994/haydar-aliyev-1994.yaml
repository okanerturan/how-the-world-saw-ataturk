summary: >-
  Bows before the memory of Mustafa Kemal Atatürk as the great figure of the whole Turkic world, who laid the
  foundation of the Turkish republic.
quote:
  text: >-
    böyük insan, bütün Türk dünyasının böyük şahsiyeti Mustafa Kemal Atatürk’ü bir daha yâd edirem; onun
    gördüğü işlere, onun koyduğu yola öz hörmetimi ve ihtiramımı bildirerem, onun hatırası karşısında baş
    eğirem.
  language: tr
mediated_by: TBMM minutes (Turkish interpretation)
caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF p. 97 (printed p. 86). Speech printed in Turkish as in the TBMM
  minutes. Translation: "I remember once again the great man, the great figure of the whole Turkic world,
  Mustafa Kemal Atatürk; I express my respect and reverence for his work and the road he laid down, and bow
  before his memory." Printed in Azerbaijani forms with Turkish glosses in brackets, so the speech was
  delivered in Azerbaijani Turkish. Heading: 'Azerbaycan Cumhurbaşkanı Haydar Aliyev', 9 Şubat 1994 (PDF pp.
  96-97; this passage on 97). He returned on 6 Mayıs 1997 (PDF p. 106ff: 'Böyük Önder Mustafa Kemal Atatürk',
  visit to Anıtkabir) and 13 Mart 2001 (PDF p. 149ff: 'beşer tarihinin meydana çıkardığı en büyük insanlardan
  biri'; announces an Atatürk-heritage research centre, p. 156-157) with the same praise; only the 1994 speech
  is stored as the record. He also cites Atatürk's tenth-anniversary speech at length (PDF p. 101).
node: Foreign Statesmen Address the Assembly, 1956–2010
