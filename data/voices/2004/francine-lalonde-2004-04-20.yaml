summary: >-
  Backing the Armenian genocide motion, said Mustapha Kemal had condemned the massacres 'dozens of times' and
  called for the guilty to be punished.
quote:
  text: >-
    Can we not remember that Mustapha Kemal, who founded the Turkish republic in 1923—the genocide we are
    discussing took place in 1915—repeatedly, dozens of times, condemned the massacres?
  language: en
  is_translation: true
caveat: >-
  Same debate as stockwell-day-2004-04-20. She goes on: 'Many times, he called them heinous acts and called
  for the guilty parties to be punished.' Her claim, not checked here. She spoke in French ('I do not have it
  in French, because it is the New York Times, so I will read it in English'), so the quote is the official
  English of the Hansard; the French has not been seen. In February 2003 she had said much the same while
  summarising the historian Taner Akçam (permalink 4239123).
