summary: >-
  Tells the Assembly that Turkey, a Muslim country that has struck a balance, carries Atatürk's legacy of a
  secular democratic republic.
quote:
  text: Burada, Müslüman bir ülke olarak bir denge kurdunuz, Atatürk’ün mirasını taşıyorsunuz.
