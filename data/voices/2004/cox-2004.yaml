caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF p. 210 (printed p. 199). Speech printed in Turkish as in the TBMM
  minutes. Translation: "Here, as a Muslim country, you have struck a balance; you carry Atatürk's legacy."
  Answers the 'Christian club' objection to Turkish EU membership. Heading: 'Avrupa Parlamentosu Başkanı Pat
  Cox', 2 Mart 2004. The English original (European Parliament press release sp0081, read by the checker; URL
  not re-verified) reads: 'you have found a special balance here - the legacy of the vision of Atatürk'.
