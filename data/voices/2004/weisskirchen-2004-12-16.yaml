summary: >-
  Reads Atatürk's 1920s concept as the attempt to Europeanise Turkey and link it to European values, a break
  with the Ottoman Empire.
quote:
  text: >-
    Das Konzept, das Kemal Atatürk in den 20er-Jahren entwickelt hat, ist der Versuch, die Türkei zu
    europäisieren und den Anschluss an Europa – das betrifft auch die europäischen Werte – zu erreichen.
  translation: >-
    The concept that Kemal Atatürk developed in the 1920s is the attempt to Europeanise Turkey and to gain
    connection to Europe — which also concerns European values.
