    Türk insanının Atatürk'e gösterdiği saygı ve hayranlığını paylaşıyoruz. Atatürk, reformculuğa önderlik
    ederek eşit haklara dayalı demokrasiye sahip Türkiye'yi parlayan bir örnek olarak kurdu.
