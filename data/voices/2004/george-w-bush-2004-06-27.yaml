mediated_by: Hürriyet (Turkish translation of the entry); Yeni Mesaj paraphrase
caveat: >-
  Hürriyet ('Çok duygulandım') prints the full Turkish text; Yeni Mesaj of 28.06.2004 (probably from the same
  agency report) only paraphrases ('eşit haklar ve laik bir demokrasiye dayalı parlayan bir örnek'). The
  English original is not located; Turkish Wikipedia's visitor list dates the visit 27 June, the press says
  the morning after Bush arrived in Ankara (the Istanbul NATO summit followed). Courtesy text on the eve of
  the Istanbul NATO summit. Date corrected at check: Hürriyet filed at 01:50 on 28 June and a 28 June press
  review says the visit was 'yesterday'. Yeni Mesaj paraphrases the same agency report (not independent).
