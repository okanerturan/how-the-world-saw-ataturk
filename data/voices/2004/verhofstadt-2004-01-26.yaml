caveat: >-
  Handwritten in Dutch, Ankara 26 Jan 2004 ('… mijn respect en waardering uit te drukken voor Mustafa Kemal
  Atatürk, de grondlegger van het moderne Turkije. Hij heeft zich in de wereldgeschiedenis een plaats
  verworven als een groot staatsman …'); the quote is the compilation's Turkish ('He has taken his place in
  world history as a great statesman. With his courageous reforms he opened the road to Europe for his
  country'). Ends: the secular state, equality of men and women, the right to education — 'Mustafa Kemal
  Atatürk, a man of vision, saw this eighty years ago'. Source: Anıtkabir Özel Defteri (printed compilation,
  '1953'ten günümüze Anıtkabir'i ziyaret eden yerli ve yabancı heyet başkanlarının Atatürk hakkındaki duygu ve
  düşünceleri'), page images on ataturkarsivi.com, read on the image by the main agent (4 Nov 2026).
