caveat: >-
  Handwritten in Arabic, 20.04.2004; the quote is the compilation's Turkish ('May God forgive this great
  statesman. He was one of the greatest people of our time and built a country with universal radiance
  today'). 'Great statesman' is the compilation's rendering of 'rajul' (a man), and 'forgive' renders
  'enveloped in His mercy'. Reading of the Arabic (last word of line 3 unclear): 'رجل تغمده الله برحمته كان من
  أعظم رجال هذا العصر وبنى بلدا له إشعاع …'. Source: Anıtkabir Özel Defteri (printed compilation, '1953'ten
  günümüze Anıtkabir'i ziyaret eden yerli ve yabancı heyet başkanlarının Atatürk hakkındaki duygu ve
  düşünceleri'), page images on ataturkarsivi.com, read on the image by the main agent (4 Nov 2026).
