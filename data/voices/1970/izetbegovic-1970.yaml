artifact: book
evidence: P+J
summary: >-
  Says Kemal was more commander than cultural reformer, his merits must be cut down, and his reforms made
  Turkey a third-rate European copy.
quote:
  text: >-
    Tako na primjer, Mustafa Kemal, koji je očigledno bio veći vojskovođa nego kulturni reformator i čije
    zasluge za Tursku treba svesti na pravu mjeru, jednom od svojih reformi zabranjuje nošenje fesa.
  translation: >-
    Thus, for example, Mustafa Kemal, who was obviously a greater military leader than a cultural reformer and
    whose merits for Turkey should be reduced to their true measure, bans the wearing of the fez in one of his
    reforms.
  language: bs
caveat: >-
  Islamska deklaracija, written 1970, circulated in samizdat and published in Sarajevo in 1990; it was the
  main exhibit in the 1983 Sarajevo trial. Read in a full-text PDF of the work hosted by a site hostile to its
  author (n-um.com), p. 5; the same sentences are quoted by DEPO Portal/Prometej.ba (2017) and the Preporod
  yearbook. The text also calls Turkey 'as a European plagiarism' a third-rate country and says abolishing the
  Arabic script dragged Turkey 'to the borders of barbarism'. A later SDA line ('Atatürk was mostly a great
  military commander', Google Books snippet) is not staged.
node: World Leaders on Atatürk — Round 30 Sweep
