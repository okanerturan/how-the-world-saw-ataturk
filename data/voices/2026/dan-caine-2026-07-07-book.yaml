  ve seçkin lideri', 'derin saygı ve hayranlık', 'bir temsilcisi'), probably a protocol template drafted by
  the embassy. Chairman of the US Joint Chiefs of Staff. English from en.haberler.com (snippet). Near-copy of
  the Tillerson 2017 template, so not an independent gaze.
