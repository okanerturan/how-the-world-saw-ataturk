summary: >-
  Says he disagrees with Atatürk on Islam, language and script, but this cannot erase his role in freeing
  Turkey.
quote:
  text: >-
    Tentunya, saya juga ada pendapat peribadi yang kuat, kerana tatkala dia memimpin dan menguasai, ada
    beberapa keputusan yang saya rasa tak serasi dengan pandangan saya, tentang Islam, pertukaran bahasa,
    tulisan dan sebagainya. …tetapi itu tidak boleh memadamkan sumbangan, peranan dan sikap rakyat Turkiye
    tentang seorang tokoh besar yang berjaya membebaskan negara mereka daripada percubaan meleburkan dan
    menjadikannya sebahagian daripada wilayah di bawah penjajah Eropah.
  translation: >-
    Of course I too have strong personal views, because when he led and ruled there were some decisions I feel
    are not compatible with my views, on Islam, the change of language, script and so on. …but that cannot
    erase the contribution, the role and the Turkish people's attitude towards a great figure who succeeded in
    freeing their country from attempts to dissolve it and make it part of territory under European
    colonisers.
  language: ms
mediated_by: Bernama, 8 Jan 2026; Free Malaysia Today, 9 Jan 2026 (English)
caveat: >-
  Press conference in Istanbul at the end of a three-day official visit, after photos of his wreath at
  Anıtkabir drew criticism in Malaysia. FMT's English: 'While I may personally have differing views on certain
  reforms implemented during his leadership, such as language and religious policies, this does not diminish
  his role.' He says the ceremony is required protocol for every visiting leader, as for Mahathir and Najib
  before him.
