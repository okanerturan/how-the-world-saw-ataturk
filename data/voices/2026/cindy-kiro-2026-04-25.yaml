summary: >-
  At Chunuk Bair on Anzac Day 2026, called Atatürk 'that great soldier and visionary statesman', whose statue
  stands beside the New Zealand Memorial.
quote:
  text: >-
    Here at Chunuk Bair, it is a fitting acknowledgement of New Zealand’s deep and enduring relationship with
    the people of Türkiye that the New Zealand Memorial and the statue of Mustafa Kemal Atatürk – that great
    soldier and visionary statesman – stand just a few metres apart.
