summary: >-
  Leader crediting the Mudanya armistice and peace to Kemal's personality: a restraining, reforming patriot,
  'no dictator', who could have had war but avoided it.
quote:
  text: >-
    We shall probably be very near the mark if we ascribe the Mudania success and the preservation of peace so
    far to the personality of Mustapha Kemal Pasha.
