voice: Mikhail Frunze
voice_type: person
role: Ukrainian SSR envoy extraordinary to Ankara, Red Army commander
country: Ukrainian SSR
country_now: Ukraine
domain: diplomacy
date: "1922-01-04"
era: contemporary
polarity: instrumental
intensity: 2
artifact: report
evidence: S
summary: >-
  Before the farewell talk, agreed the line: back Kemal, keep him under Soviet influence, steer his personal
  dictatorship toward a party one, publicise him.
quote:
  text: Mustafa Kemal'i desteklemek ve onun daima bizim etkimiz altında kalmasına çalışmak
  language: tr
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 12 (Kaynak 2005) pp. 203–206 ← Abilov's Russian record of the second
  Abilov–Frunze talk with Mustafa Kemal, 4 Jan 1922 (Azerbaijan State Archive of Recent History, f. 28, op. 1,
  d. 68, ll. 1–7) ← Y. Aslan (2002) pp. 46–56
caveat: >-
  Translation: 'to support Mustafa Kemal and work to keep him always under our influence'. The line was agreed
  jointly by Abilov, Frunze and Mikhailov and recorded by Abilov, so Frunze is one of three voices. In the
  talk Kemal described the Assembly's groups and his army controls. Distinct from frunze-1921-12-25 (the first
  talk).
