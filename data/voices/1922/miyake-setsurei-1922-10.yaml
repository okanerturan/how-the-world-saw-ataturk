summary: >-
  Marvels that Kemal, fighting Greece and bargaining with the great powers, has made 'a dead man' Turkey rise
  again and astonished diplomacy.
quote:
  text: >-
    近頃土耳古のケマルが希臘と戰ひ英佛伊等の强國と談判する所、從來の外交圈に意外の感を齎らしつゝある。土耳古は久しく瀕死の國と呼ばれ、講和會議に死人扱ひせられたるに、今や死人が甦り、新たに强國と對抗するに及ぶ。
  language: ja
caveat: >-
  Essay dated 'Taishō 11, October' (Nihon oyobi Nihonjin), reprinted in Eiyūron (1939), printed p. 10, NDL
  image 13 (page image read). First clause is the tail of a longer sentence; quote starts mid-sentence. Under
  the 1939 publication date the essay itself is 1922. Setsurei is also cited as Miyake Yūjirō (pids 1268197,
  1267866: list-type mentions only).
