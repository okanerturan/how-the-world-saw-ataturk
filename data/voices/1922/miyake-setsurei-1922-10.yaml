  note: >-
    Quote verbatim on printed p.10 (starts mid-sentence at 近頃). Essay is signed at its foot '大正十一年十月「日本及日本人」'
    = Oct 1922; the 1939 date is only the book's publication. 1922-10 and contemporary are right. Kemal Pasha
    vs Greece, Allied powers (not Mustafa Kamil). Own verdict: wonder that the 'dead man' revived; page
    continues that he beat Greece yet asks only for justice, which supports admiring. Translation faithful.
    Gaze test passes (his own judgement of Kemal).
