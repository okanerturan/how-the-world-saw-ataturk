caveat: >-
  Γ΄ Εθνοσυνέλευση, Πρακτικά Τόμος 4, session ΞΖ΄ of 18 May 1922 (heading read from a thumbnail of the page),
  printed pp. 2621-2622 (PDF pages 144-145; page images read). Matesis interpellates, with Tsoukalas and
  Sotiriadis, on the massacres of Christians by the 'Kemalists'; the summary has him blame Kemal personally
  for Pontus and describe Kemal's letter of 15 Feb 1922 to the three High Commissioners as written 'with
