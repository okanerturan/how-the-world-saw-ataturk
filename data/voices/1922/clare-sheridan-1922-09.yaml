  note: >-
    Quote verbatim on p.306 ('sphinx-like expression and unsmiling ultra-politeness were to me quite
    unfathomable'). 'The one man who from overwhelming defeat and humiliation had led the Turks to victory' is
    on p.303; 'blue eyes had a hard determination' and Latife 'adamantine Trotzki' on p.308; 'I will sit to
    you in Constantinople' on p.308. All as cited. Voice is hers; Kemal's remarks inside the interview are
    his, as the caveat says. Month 'September 1922' is not printed in the book; the visit follows the Smyrna
    fire ('smoke still rising from the ruins'), so Sept-Oct 1922 is an inference. Polarity admiring/intensity
    2 fair.
