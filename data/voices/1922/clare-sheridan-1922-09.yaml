summary: >-
  Finds the Ghazi sphinx-like and unfathomable, with 'hard determination' in his blue eyes; calls him the one
  man who led the Turks to victory.
quote:
  text: His sphinx-like expression and unsmiling ultra-politeness were to me quite unfathomable.
  language: en
caveat: >-
  Clare Sheridan, Naked Truth (1928), ch. 'Life as a Journalist', p. 306 (the quote); pp. 302-303 ('the one
  man who from overwhelming defeat and humiliation had led the Turks to victory'); p. 308 (the sculptor's
  request, 'I will sit to you in Constantinople'; Latife Hanım 'had captured this adamantine Trotzki, so well
  worth capturing!'). Written six years after the Smyrna interview and so partly hindsight; the Smyrna fire is
  in the background, and Sheridan's account of it is not the vault's. Kemal's remarks to her as she records
  them (the English Government, not the English people, is against him; 'Our feeling against them [the
  Armenians] has nothing to do with religion') are his, not hers. The sitting for the bust did not take place
  in this book. Bodurgil's centennial bibliography lists a separate Sheridan article 'Smyrna, September 1922;
  interview with Mustapha Kemal' (not seen). The month is inferred (smoke still rising from the Smyrna fire);
  the book does not print it.
node: Western Women Commentators on Atatürk, 1922–1936 — Sheridan, Mills, Woodsmall
