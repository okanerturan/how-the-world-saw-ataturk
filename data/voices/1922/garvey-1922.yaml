verification:
  verdict: confirmed
  quote_found: true
  checked_against: dangerouspress.org/papers/negro-world/1922-09-23 (OCR of the issue), fetched fresh
  method: free fetch
  note: >-
    Quote verbatim: 'Mustapha Kemal has become the man to the hour, even as the Kaiser was in 1914.' Also
    'Kemal is going to lay the foundation for a changed world', the 'barbarian ... burned Smyrna' passage and
    'Kemal's teacher...' are present. Correction to the caveat: the quote is in the Liberty Hall speech 'The
    Negro Attitude in the Next War' (section 'Some Reflections on the Eastern Situation', Garvey speaking in
    the first person, 'my subject for tonight', applause marked), printed in the issue of 23 Sept; it is not
    the front-page 'Message to Negro peoples' article, and the OCR gives no page number, so 'front-page lead'
    is unsupported. The speech was delivered before the issue date (it says the delegates spoke at Geneva 'on
    the 12th of this month'), probably Sunday 17 Sept; 23 Sept is the print date. Era unaffected.
