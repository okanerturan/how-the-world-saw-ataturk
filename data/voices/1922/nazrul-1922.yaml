summary: >-
  Hails Kemal as the fighter whose sharpened sword sent the enemy to Hades, with the refrain 'Kamal, you have
  worked a wonder, brother'.
quote:
  text: Kamal Tu Ne Kamal Kiya Bhai
  language: ur
caveat: >-
  The Bengali-script text was not retrieved (bn.wikisource does not hold Agni-Veena's 'Kamal Pasha'); the
  refrain is quoted in Latin transliteration by the peer-reviewed BRIQ article (p. 74) with the translation
  '(Kamal, you have achieved unbelievable success, brother!)' (TRANSLATION, by the article). Poem 'Kamal
  Pasha' in Agni-Veena (Calcutta, Kartik 1329 = Oct 1922; composed c. Aug-Sep 1921 according to BRIQ, 'as far
  as it is known'). Full English rendering ('Brother Kemal, the desperate son of a frenzied mother ... Bravo
  to your sharpened sword ... Tell me now, who is there on earth not afraid of Turkish sword?') on a forum
  (defencehub, translator unnamed); a Turkish translation of the poem (from Nurul Huda's English, 1997/1999)
  is printed in 'Dünya Şairlerinden Atatürk Şiirleri' with a reference to Kemal Özcan Davaz, 'Atatürk,
  Bangladeş, Kazi Nazrul İslam' (Atatürk Araştırma Merkezi, 2000, pp. 79-97). The poem also names Anwar Pasha
  (Enver), so it is not a pure Kemalist text; BRIQ reads Nazrul as folding Kemal into pan-Islamic 'Ummah'
  loyalty. Kemal is the poem's subject, so it counts. Check: the refrain is the soldiers' chorus in the
  Bengali text of 'Kamal Pasha' (bangla-kobita.com and other transcriptions), Agni-Veena (Oct 1922); BRIQ
  takes it from a 1988 recollection.
