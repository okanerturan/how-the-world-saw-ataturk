  note: >-
    Refrain found in the poem in Bengali ('কামাল! তু নে কামাল কিয়া ভাই!'), so it IS the refrain of 'Kamal
    Pasha', which is the sixth poem of Agni-Veena (Oct 1922). In the poem it is the chorus sung by marching
    soldiers (stage-style poem with a havildar-major), and the lines 'Bravo to your sword / sent the enemy to
    Hades / who does not fear the Turkish sword' are there. BRIQ p.74 prints the Latin refrain with the gloss,
    but takes it from a recollection by 'Odud 1988', not from the poem; its '(Kamal, you have achieved
    unbelievable success, brother!)' is a gloss. Date: 1922 is the Agni-Veena publication; earlier appearance
    (Moslem Bharat, composition Aug-Sep 1921 per BRIQ) is probable but not pinned, so 1921-22 either way
    contemporary. The caveat 'Bengali text not retrieved' is now out of date: the Bengali text can be cited.
