voice: Karl Radek
voice_type: person
role: Bolshevik Comintern leader
country: Soviet Russia
country_now: Russia
domain: politics
date: "1922-11-23"
era: contemporary
polarity: conflicted
intensity: 1
artifact: speech
evidence: P
summary: >-
  Told persecuted Turkish communists to defend themselves but keep defending Turkish sovereignty, because the
  moment for their own liberation struggle had not arrived.
quote:
  text: >-
    If they capitulate, then the role of Kemal Pasha is finished, haggling over the fate of Turkey will
    resume, and the Turkish people will be sold for baksheesh.
  language: en
mediated_by: >-
  Riddell (ed.), Toward the United Front (2012), English translation of the Fourth Congress protocol
caveat: >-
  Translation; conditional verdict on the Ankara leadership while Turkish communists were being persecuted.
node: The Comintern's Verdict on Kemal, 1922–1928
