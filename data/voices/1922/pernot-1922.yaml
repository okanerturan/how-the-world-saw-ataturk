summary: >-
  Portrays the Angora leader as adored by his soldiers and esteemed by generals, a national hero, while noting
  opponents' charges of dictatorship.
quote:
  text: >-
    Moustapha Kemal, adoré par les soldats, est estimé par les chefs, même par ceux dont la valeur technique
    est peut-être supérieure à la sienne.
  translation: >-
    Moustapha Kemal, adored by the soldiers, is esteemed by the generals, even by those whose technical
    ability is perhaps superior to his own.
  language: fr
caveat: >-
  Cited as Pernot, 'La Question turque' II, 'Angora', Revue des Deux Mondes, 7e période, tome 7 (1922), pp.
  549–579, quote on p. 567 (Wikisource page numbers). Wikisource transcription; the issue date within 1922 is
  not printed in the transcription (tome 7 = early 1922), so year-only. Pernot also calls him 'le jeune
  dictateur' and reports opponents' charge of 'allures de dictateur'; the 'adoré par les soldats' sentence is
  Pernot's own judgement, not a quoted source. Mixed: sympathetic portrait of a moderate against Unionist
  hard-liners, framed for French policy.
