summary: >-
  In the Chanak crisis, warns Mustapha Kemal not to forget what Australia's entry into war means, while
  wanting 'a fair deal' for the Turks.
quote:
  text: >-
    We are for peace, and we want the Turks to have a fair deal, but if war is to come Mustapha Kemal must not
    forget what the entry into war by Australia means.
  language: en
mediated_by: >-
  Australian press wire, Melbourne 29 Sept 1922: 'Menace to Kemal', Kalgoorlie Miner 30 Sept 1922, p. 5 (Trove
  93229155); same statement summarised in The Register (Adelaide) 30 Sept 1922, p. 11, 'Kemal Must Look Out'
  (Trove 64124806)
caveat: >-
  Said to reporters after the House of Representatives adjourned, amplifying his statement in the House that
  day; the preceding sentence: 'We shall do so again, if necessity arises, and it will be well if Mustapha
  Kemal remembers this.' In the House he also said 'Australia had no bias against Kemal' and that the Allies
  'could yield nothing to force, but everything to reason' (The Register's report). Read on Trove via a headed
  browser, 4 Nov 2026. A deterrent warning to an adversary, so polarity hostile at intensity 1; Commonwealth
  Hansard for 29 Sept 1922 not read.
