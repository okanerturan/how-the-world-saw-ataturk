caveat: >-
  Tone is reportorial irony, not a stated verdict; polarity 'witness' is the nearest enum. The 19 Oct 1922
  piece 'Waiting for an Orgy' says 'Kemal is hand in glove with the Soviets and his entry will wipe out the
  greatest Russian sanctuary.' A scholar (Studies in the Novel/TSL 2012) quotes a 19 Oct dispatch, Dateline p.
