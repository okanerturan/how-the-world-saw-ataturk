summary: >-
  In verse petitions to the Gazi, hails him as genius and saviour from the Greeks, begging him to save Turks
  from ignorance and backwardness.
quote:
  text: Sen dâhisin, buna çoktan inandık.. / Mefküresiz rehberlerden pek yandık..
  language: tr
mediated_by: >-
  Kanbak (comp.), Ziya Gökalp (archive.org, 2025), pp. 20-21, 73-74 ← Devrim Yazarlarının Kalemiyle Milli
  Mücadele ve Gazi Mustafa Kemal (Kültür Bakanlığı, 1981), p. 1020 ← Küçük Mecmua nos. 20-21 (Oct 1922);
  dating by Cavit Orhan Tütengil, Türk Dili no. 302 (Nov 1976), repr. Kanbak pp. 72–74: Küçük Mecmua nos.
  20–21, Oct 1922
caveat: >-
  TRANSLATION (this record's): 'You are a genius, we long believed it.. / We have suffered enough from guides
  without an ideal..' Poem 'İstid'â — Gazi Paşa Hazretleri'ne', each stanza ending 'Kurtar bizi...!' (Save
  us!), including from 'the Black Sultan' (Vahideddin). The essay reprinted in the same compilation dates the
  two İstid'âs to Küçük Mecmua nos. 20 and 21 (October 1922). In the second ('İkinci İstid'â') Gökalp argues
  against Kemal's stated wish to become a private citizen after the peace: 'Bu milletin hâli olur pek yaman, /
  Kılavuzu olmazsa bir kahraman'. His 1923 Altın Işık adds 'Mustafa Kemal'dir baş kahramanı!'. Küçük Mecmua
  itself not seen. Contact: the essay, citing E. B. Şapolyo, says Kemal summoned Gökalp to Çankaya, after
  which Gökalp wrote Doğru Yol on the party's nine principles. The vault note's 'My flesh and bones belong to
  my parents...' line is Kemal's saying about Gökalp, not Gökalp's gaze, and was not checked.
