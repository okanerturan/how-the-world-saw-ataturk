summary: >-
  Tells the Turkish parliament Atatürk was his youthful hero, keeps his statue at office and home, and calls
  him the Global South's icon of courage.
quote:
  text: >-
    Kalau Saudara datang ke kantor saya di Jakarta, kalau saudara datang ke rumah saya di Jakarta, ada patung
    Mustafa Kemal Atatürk di kantor saya, di rumah saya. Bagi kami, tidak hanya di Indonesia saya bicara, di
    Global South, di negara-negara yang sedang berkembang, Mustafa Kemal Atatürk adalah sebuah ikon, sebuah
    contoh keberanian, contoh kepemimpinan, contoh patriotisme, contoh semangat tidak mengenal menyerah.
  translation: >-
    If you come to my office in Jakarta, if you come to my house in Jakarta, there is a statue of Mustafa
    Kemal Atatürk in my office, in my house. For us, and I speak not only of Indonesia but of the Global
    South, the developing countries, Mustafa Kemal Atatürk is an icon, an example of courage, of leadership,
    of patriotism, of a never-surrender spirit.
  language: id
caveat: >-
  Official Indonesian transcript, Sekretariat Negara (setneg.go.id), 'Pidato Kenegaraan Presiden di Hadapan
  Parlemen Turki', 10 April 2025, read in full. Same passage also says 'sebagai anak muda pahlawan saya, ikon
  saya adalah Mustafa Kemal Atatürk dan Mehmed Sang Penakluk'; he pairs Atatürk with Mehmed II and calls
  Türkiye the continuation of the Ottomans. AA English renders it 'My hero, my icon was Mustafa Kemal Ataturk
  along with Ottoman Sultan Mehmed II'. BBC Indonesia (16 Apr 2025) reports a social-media controversy over
  praising Atatürk before an AKP-majority parliament.
node: World Leaders on Atatürk — Round 30 Sweep
