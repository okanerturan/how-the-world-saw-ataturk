summary: >-
  Recalls Atatürk as the republic's great founder who captured American imagination and says everyone in the
  chamber is there thanks to him.
quote:
  text: >-
    In a sense, we are all here today because of Kemal Ataturk. Not only because he chose Ankara to be the
    capital, not only because he chose Ankara to be your capital, but because he pledged Turkey's future to
    the democracy symbolized by this proud assembly.
