  note: >-
    Verbatim match; speaker, office and date agree with book heading ('Amerika Birleşik Devletleri Başkanı
    William Jefferson Clinton, 19. Birleşim, 15 Kasım 1999 (heading on PDF p. 142)'). Paraphrase items checked
    on p. 142-143. Delivered in English. ORIGINAL: 'In a sense, we are all here today because of Kemal
    Ataturk. Not only because he chose Ankara to be the capital, not only because he chose Ankara to be your
    capital, but because he pledged Turkey's future to the democracy symbolized by this proud assembly.'
    (American Presidency Project / Clinton White House archive / Public Papers 1999 II p. 2093). Differences
    from the minutes: the Turkish drops the hedge 'In a sense' and adds 'Mustafa'; the original also continues
