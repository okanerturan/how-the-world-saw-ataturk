summary: >-
  A creative force of a new republic, who made a book on Finland compulsory reading in military schools; his
  modernising work was admired in Finland.
quote:
  text: >-
    Mustafa Kemal Atatürk went even further and made it compulsory reading in military schools. […] It is
    noteworthy that Atatürk attached great importance to these things in a situation in which he himself was a
    creative force in developing a new republic. It should also be pointed out that Atatürk's work in
    modernizing Turkey also attracted respect and admiration in Finland.
  language: en
caveat: >-
  Official English text on the Finnish presidency's archived Ahtisaari site. The claim that Atatürk made the
  book compulsory in military schools is a long-standing Turkish tradition rather than something Ahtisaari
  documents.
