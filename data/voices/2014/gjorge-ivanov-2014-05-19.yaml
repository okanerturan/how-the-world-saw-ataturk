summary: >-
  The founder of modern Turkey claimed as Macedonia's own: the country is 'proud to be called the birthplace
  of Ataturk and of his father'.
quote:
  text: >-
    As the father's birthplace is dear to the son, the founder's birthplace is important to the state. The
    Republic of Macedonia is proud to be called the birthplace of Ataturk and of his father.
  language: en
caveat: >-
  Official English text on the president's site. Atatürk was born in Salonica (now Greece) and went to school
  in Bitola; Kodžadžik is his father's village, so 'birthplace of Ataturk' is a claim of kinship rather than a
  fact. Opening date chosen for 19 May, the Turkish youth day.
