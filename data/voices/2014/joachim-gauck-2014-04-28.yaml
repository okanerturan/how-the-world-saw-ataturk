summary: >-
  The author of the principle that sovereignty belongs unconditionally to the people, which Gauck turns into a
  gentle rebuke on free speech.
quote:
  text: >-
    Heute Morgen habe ich am Mausoleum des Gründers der türkischen Republik, Mustafa Kemal Atatürk, einen
    Kranz niedergelegt. Ein Satz von Atatürk beeindruckt mich ganz besonders. Er drückt einen Anspruch von
    großer Unbedingtheit aus. Der Satz lautet: "Die Souveränität liegt uneingeschränkt und bedingungslos beim
    Volke."
  translation: >-
    This morning I laid a wreath at the mausoleum of the founder of the Turkish Republic, Mustafa Kemal
    Atatürk. One sentence of Atatürk's impresses me especially. It expresses a claim of great
    unconditionality. The sentence reads: 'Sovereignty belongs to the people without restriction or
    condition.'
  language: de
caveat: >-
  Praise of a principle rather than a portrait; kept because the sentence is his own judgment of Atatürk's
  claim. His METU and Istanbul speeches on the same trip do not mention Atatürk.
node: World Leaders on Atatürk — Round 30 Sweep
