polarity: admiring
intensity: 2
summary: >-
  At Gate Pā's 150th commemoration, applied Atatürk's words of reconciliation for the Gallipoli dead to those
  of the New Zealand Wars.
quote:
  text: >-
    In the spirit of reconciliation expressed by Mustafa Kemal Ataturk of our men who were killed at
    Gallipoli, I say: / To the families / Wipe away your tears / Your forefathers lie here / In the bosom of
    our land / In peace / They are the forefathers of us all
  language: en
caveat: >-
  Gate Pā (Pukehinahina, Tauranga, 1864) was a battle between British forces and Māori. The closing lines
  rework Atatürk's 1934 words to the Anzac mothers for its dead, and he then says them in Māori. Four days
  earlier, at the Anzac Cove dawn service, he had called Atatürk 'a leader in the art of peace and the art of
  nation-building as much he was in the art of war' (gg.govt.nz/publications/dawn-service-gallipoli, 25 April
  2014).
