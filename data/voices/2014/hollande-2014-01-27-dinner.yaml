summary: >-
  At the state dinner in Çankaya Palace: 'I think inevitably of Mustafa Kemal Atatürk', whose government
  France was the first Western country to recognise.
quote:
  text: >-
    Nous sommes réunis dans ce palais de Cancaya et je pense forcément à Mustafa KEMAL ATATÜRK dont, je le
    rappelle, la France fut le premier pays occidental à reconnaitre le Gouvernement avant qu'il ne proclame
    lui-même la République.
  translation: >-
    We are gathered in this palace of Çankaya and I think inevitably of Mustafa Kemal Atatürk, whose
    government, let me recall, France was the first Western country to recognise, before he himself proclaimed
    the Republic.
  language: fr
caveat: >-
  Speech at the state dinner given by President Abdullah Gül, Ankara, 27 January 2014, on the first day of his
  state visit ('cette visite d'Etat', twice in the speech; the site's heading has 'Voyage officiel'). A
  courtesy that serves his theme, the age and strength of Franco-Turkish ties; the next sentence turns to the
  present. The transcript prints 'Cancaya' and 'reconnaitre'. His entry in the Anıtkabir book the same day is
  a separate record (hollande-2014-01-27-book).
