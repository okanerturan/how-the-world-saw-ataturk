summary: >-
  Argues, on Egypt's constitution, that Atatürk defeated radical Islam in Turkey and that Turkey rose because
  of it.
quote:
  text: >-
    this is something that Ataturk fought against and was able to overcome in Turkey so many decades ago. And
    because he was able to overcome and overwhelm radical Islam in Turkey, Turkey has surged to the forefront
    over the past decades in all kinds of areas.
  language: en
caveat: >-
  A floor aside in a special-order speech about the Egyptian referendum; Atatürk is used as proof for
  Gohmert's argument about the Muslim Brotherhood and the Egyptian constitution. On 7 January (p. H9) he says
  Atatürk 'overran radical Islam' and Turkey 'bloomed'. Cited as House of Representatives, 15 January 2014,
  'Conflict in the Middle East', Congressional Record vol. 160, p. H468 (granule CREC-2014-01-15-pt1-PgH468);
  the same theme in his 7 January 2014 floor speech (p. H9). Passage on p. H469.
