summary: >-
  On the first Greek premier's official visit since 1959, says Atatürk and Venizelos had the courage and
  vision not to let past tragedies block peace.
quote:
  text: >-
    Kemal Ataturk and [then Greek leader] Eleftherios Venizelos had the political courage, will and vision not
    to allow the conflicts and tragedies of the past to become an obstacle to… building a better future of
    peace and co-operation to the benefit of the two peoples.
  language: en
mediated_by: >-
  Cyprus Mail, 25 Jan 2008 (Reuters, English, with its own ellipsis and bracket); Hürriyet, 24 Jan 2008
  (Turkish rendering)
caveat: >-
  Entry in the Anıtkabir special book; Anıtkabir visits are a taboo in Greece and he did not tour the museum
  celebrating the 1922 victory over Greece. Hürriyet's Turkish: 'Atatürk ve Venizelos'un siyasi irade ve
  cesareti vardı. Biz de geçmiş trajedilerin bize engel olmaması için gerekli cesarete sahibiz.' Praise framed
  for Greek–Turkish rapprochement. Check: the quote is Reuters' English rendering; Hürriyet's Turkish differs;
  no original-language entry found.
