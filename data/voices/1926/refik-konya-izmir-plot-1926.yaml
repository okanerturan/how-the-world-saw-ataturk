summary: >-
  The Gazi is the nation's great genius and saviour; the plot against him was a plot against the homeland.
quote:
  text: >-
    Aziz Müncimiz ve büyük dahimiz Reisicumhur Gazi Mustafa Kemal Paşa Hazretlerinin hayatına müteveccih
    olarak tertip edilen mel'un suikastın akim kalmasından ve binnetice vatanın muhakkak bir felâketten
    kurtulmasından Milletçe duyulan nihayetsiz meserretleri bir defa daha izhar eden Meclisi Âlinin kalbi
    memnuniyet ve tebrikâtını Reisicumhur Hazretlerine iblağ etmek üzere...
