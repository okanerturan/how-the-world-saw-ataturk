summary: >-
  Complained of a a campaign against foreigners against foreign firms and schools, a 'Chinese wall' policy
  pursued with Kemal's characteristic remorseless pertinacity and popular support.
quote:
  text: >-
    This policy is being pursued with the remorseless pertinacity characteristic of Mustafa Kemal and it
    receives the cordial support of the whole population.
  language: en
mediated_by: >-
  Şimşir, İngiliz Belgelerinde Atatürk vol. VI No. 4 ← Lindsay to Austen Chamberlain, despatch No. 59,
  Constantinople, 8 Feb 1926
caveat: >-
  Quote normalised from poor OCR ('purnued', 'remorseles pertinaciy', 'charactertic'). In despatch No. 258 of
  31 Mar 1925 (Şimşir V) he wrote that the Sheikh Said revolt was probably being used to crush opposition to
  'the radical autocracy of Mustafa Kemal'.
