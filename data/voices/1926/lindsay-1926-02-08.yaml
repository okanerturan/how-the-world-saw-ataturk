  quote_found: true
  checked_against: >-
    archive.org ingiliz-belgelerinde-ataturk, djvu text of Şimşir vol. VI, No. 4 (Lindsay to Austen
    Chamberlain, No. 59, Constantinople, 8 Feb 1926, para. 14); archive.org ingiliz-belgelerinde-ataturk, djvu
    text of Şimşir vol. V (Lindsay to Chamberlain, No. 258, 31 Mar 1925, para. 6)
  method: archive.org open djvu text read
  note: >-
    OCR: 'This policy s being purnued with the remorseles pertinaciy charactertic of Mustafa Kemal and it
    receives the cordial support ofthe whole population.' The normalised quote is a faithful, unambiguous
    restoration and the cleaning is honest ('s' → 'is' and 'ofthe' → 'of the' were also silently fixed).
    'Chinese wall of exclusiveness', foreign firms, the British High School for Girls and 'a deliberate
    campaign to make the life of the foreigner here an intolerable burden' all support what_they_saw. The word
    'xenophobic' is not in the despatch; 'a campaign against foreigners' would be closer. CORRECTION: 'radical
    autocracy of Mustafa Kemal' is in despatch No. 258 of 31 March 1925 (Şimşir V), not 'No. 226 of 24 Mar
    1925' (No. 225 of 24 March is a different despatch). Hostile is fair.
  resolution: corrected 2026-11-05 — see LEDGER § Source-check corrections (round 31)
