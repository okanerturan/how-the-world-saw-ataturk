    gerichtet') and does not itself judge Kemal. (3) The article calls the opposition monarchist, reactionary,
    anglophile and utopian, and says Kemal values Russian friendship, so polarity 'hostile' is not supported;
    'conflicted' (or 'analytic') fits the text. Recommend: polarity conflicted, voice attributed to Abeghian
