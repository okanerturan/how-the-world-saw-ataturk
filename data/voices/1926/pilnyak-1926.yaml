  note: >-
    Quote verbatim (truncated mid-sentence, no ellipsis needed). Context: the sentence is a narrator's
    parenthesis inside a paragraph about the character Aleksandrov in Athens/Hagia Sophia; it lists 'точно так
    же' three mass killings (40,000 Greeks by janissaries, the Dardanelles dead, Smyrna), so the hostile
    reading rests on the list structure, not on any stated judgement of Kemal. The 'twenty-four hours' and
    '200,000' details are Pilnyak's (the text says 'обложив тяжелой артиллерией', 'до двухсот тысяч'); the
    1921 date is his error. Aleksandrov's later line ('Мустафа Кемаль-паша и его революция ... связаны с ночью
    Ирана, Азии') is real. PROBLEMS: (1) caveat says 'Year of composition taken from Wikisource metadata
    (1926)'; the field is ДАТАПУБЛИКАЦИИ (publication) and ДАТАСОЗДАНИЯ is empty. (2) artifact 'article' is
    wrong for a novella; use 'book'. (3) author-vs-narrator: fair only as hedged. CORRECTION: caveat 'Year of
