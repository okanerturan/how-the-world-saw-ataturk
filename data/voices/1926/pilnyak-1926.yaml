summary: >-
  A narrator's aside in fiction lists Mustafa Kemal Pasha among mass killings: he besieged Smyrna, gave the
  Greeks 24 hours, then burned it.
quote:
  text: >-
    точно так же, как в тысяча девятьсот двадцать первом году Мустафа Кемаль-паша, обложив тяжелой артиллерией
    Смирну, предложил грекам в двадцать четыре часа уйти из Смирны
  translation: >-
    just as in 1921 Mustafa Kemal Pasha, having surrounded Smyrna with heavy artillery, offered the Greeks
    twenty-four hours to leave Smyrna
  language: ru
caveat: >-
  Narrator's aside in fiction ('Повесть о ключах и глине'), not an essay; dated 1921 in the text (the Smyrna
  fire was September 1922, so the date is Pilnyak's error). The sentence goes on to say Kemal's artillery
  wrecked the ships in the roads, then 'razed and burned the city, throwing into the sea up to two hundred
  thousand Greeks'; those figures are Pilnyak's, not the vault's. Sensitive thread (Smyrna 1922): recorded as
  the narrator's framing, not as established fact. Elsewhere in the same text a character (the communist
  Aleksandrov) says that 'Mustafa Kemal Pasha and his revolution' are tied to the 'night of Iran, Asia', a
  persona's speech with no clear verdict. Year of composition taken from the Wikisource metadata (1926); text
  reproduced from the 1990 Pravda edition of Pilnyak's 'Povest nepogashennoi luny'. Check: the hostility is
  implied by the 'точно так же' list (with the janissary massacre and the Dardanelles dead), not stated; the
  24-hour offer, the figure and the 1921 date are Pilnyak's.
node: Soviet Pens on Mustafa Kemal — Aralov and Pilnyak
