summary: >-
  Calls him the inspiration and life of new Turkey, 'a God to his followers' with a dictator's power;
  brilliant, but she doubts his commercial sense.
quote:
  text: >-
    Now he is a God to his followers, that is to say to most of the new Turkey, and though his position is
    nominally but that of President, his power is that of Dictator.
  language: en
caveat: >-
  Lady Dorothy Mills, Beyond the Bosphorus (London: Duckworth, 1926), ch. 'Angora', p. 35 (the quote); p. 34:
  'To my great regret I did not have the pleasure of meeting the Ghazi ... The very inspiration and life of
  new Turkey, he must from all accounts be a man of amazingly powerful personality.' p. 35 goes on:
  'Undoubtedly a very brilliant man; but ... he is a trifle over-inclined ... "to hitch his waggon to a
  star"'. She did not meet him, so this is a view from reports and from what she saw in Anatolia; her
  biographical sketch has errors (e.g. 'Harbin'). p. 36 blames the Turk for 'casting' the Armenians and Greeks
  'into the sea', a judgement the vault does not adopt.
node: Western Women Commentators on Atatürk, 1922–1936 — Sheridan, Mills, Woodsmall
