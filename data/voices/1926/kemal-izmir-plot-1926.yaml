  text: >-
    Bu teşebbüsatın son tezahürü olarak meydana çıkan suikast hâdisesi, naçiz şahsımıza taallûku itibariyle
    değil, fakat Türk Milletinin merdane evsafına yaraşmayan ve Millet Vekâleti gibi yüksek bir mertebei
    itibarı vasıtai tecavüz kılmağı düşünecek kadar tereddi eden irticaî bir zihniyet göstermek itibariyle
    mucibi teessür olmuştur.
