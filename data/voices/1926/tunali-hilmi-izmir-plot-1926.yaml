summary: >-
  Turned the plot into a loyalty test: the banned Progressives would rather die than face the Gazi.
quote:
  text: >-
    Türk'ün tarihi bir sözü vardır: Ölümlerden ölüm beğen. Ben yerlerinde olsa idim idamı tercih ederdim. Yani
    terakkiperverler namı altında yaşamış olanlar Gazi'nin huzuruna çıkmak için bilmem bu ölümü tercih
    edebilirler mi?
