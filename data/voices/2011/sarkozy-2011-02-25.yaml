summary: >-
  Opposing Turkey's EU membership in a Turkish daily: new solutions must be invented, 'as visionaries like
  Mustafa Kemal were able to do in the past'.
quote:
  text: >-
    Je suis convaincu que nous devons inventer des solutions nouvelles, à la hauteur des défis communs qui
    sont les nôtres, comme ont su le faire dans le passé des visionnaires comme Mustafa Kemal.
  translation: >-
    I am convinced that we must invent new solutions, equal to the common challenges we face, as visionaries
    like Mustafa Kemal were able to do in the past.
  language: fr
caveat: >-
  Interview with the Turkish daily Posta, published on 25 February 2011, the day of his working visit to
  Ankara. Asked whether Turks are right to see him as 'un dirigeant qui n'aime pas la Turquie, qui veut la
  pousser en dehors de l'Union européenne', he says Turkey and the EU should be as close as possible 'sans
  aller jusqu'à l'intégration, qui ne profiterait en réalité ni à la Turquie ni à l'Union européenne', and
  proposes instead a common space of which 'l'UE et la Turquie, avec la Russie, seraient des piliers'. The
  quoted sentence closes that answer: Kemal is invoked as a model of boldness for an alternative to
  membership, not discussed in his own right. The next question accuses him of treating Turkey as a Middle
  Eastern country and pushing it away from the EU.
