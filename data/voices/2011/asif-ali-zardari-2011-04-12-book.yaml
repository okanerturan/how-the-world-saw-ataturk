quote:
  text: >-
    It is a great honour for me to pay homage to Ghazi Mustafa Kemal Pasha, an illustrious soldier, a great
    reformer and a visionary statesman. […] Modern Turkey is the living testimony of the glory of Ataturk's
    great accomplishments. It is a mark of Ataturk's greatness that his rejection of imperialism and espousal
    of the principles of sovereignty and non-interference are now accepted as pillars of a peaceful world
    order. Indeed he has left deep imprints on the sands of history.
