summary: >-
  Praises Atatürk's 'thorough and radical revolution' and says that under him and Inönü the Turks made
  'greater strides forward than any other people'.
quote:
  text: >-
    The astute Kemal Atatürk had perceived that the progressive Turkish people, who had been in constant
    contact with western civilization, were ripe for these innovations. … Thus, under the leadership of Kemal
    Atatürk and Ismet Inonu, the Turks have made greater strides forward than any other people in the years
    following the World War.
  language: en
caveat: >-
  His own speech (about 450 words) in the first year of America's war, when Turkey's neutrality mattered; he
  lists the reforms (religious courts abolished, Latin letters, Christian calendar) and warns of a German
  drive on Turkey. Not found in round 22 because the OCR prints the name as 'Atattirk'/'Atatiirk' (the GovInfo
  search hit the day on 'Kemal'). A third Pepper record after those of 17 April 1947 and 22 December 1950. The
  OCR prints 'Atattirk'; spelled Atatürk here. Cited as Senate, 23 April 1942, 'Twenty-third Anniversary of
  the Turkish National Assembly', Congressional Record vol. 88 (bound), pp. 3670-3671 (granule
  CRECB-1942-pt3-19-1). Check: the fragments were reordered to follow the speech.
node: >-
  Congressional Record Closing Pass — King, Owen, Davis, Sirovich, Pepper, Knowland and Others
