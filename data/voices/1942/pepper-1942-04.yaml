  note: >-
    Both sentences are verbatim in Pepper's own speech (Mr. PEPPER, 'today marks the twenty-third
    anniversary'; OCR 'Atattirk' is Atatürk), but the stored quote reverses their order: in the speech 'The
    astute Kemal Ataturk had perceived that the progressive Turkish people... were ripe for these innovations'
    comes first, and 'Thus, under the leadership of Kemal Ataturk and Ismet Inonu, the Turks have made greater
    strides forward than any other people in the years following the World War' comes after it (with the
    'thorough and radical revolution' of the what_they_saw line a few lines earlier: 'under the able
    leadership of the great Ataturk gradually effected a thorough and radical revolution'). Fix: swap the two
    fragments. Gaze is a clear view ('great', 'astute', 'genius'). Admiring 3 is defensible, 2 safer.
