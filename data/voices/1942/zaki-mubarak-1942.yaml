summary: >-
  Recalls that 'the late Mustafa Kemal' claimed Adam and Eve were Turks; he found the claim monstrous and
  wrote to Kemal that they were Arabs.
quote:
  text: كان المرحوم مصطفى كمال زعم أن آدم وحواء من أصل تركيّ، وقد أزعجني هذا الزعم الفظيع
  translation: >-
    The late Mustafa Kemal claimed that Adam and Eve were of Turkish origin, and this monstrous claim
    disturbed me.
  language: ar
caveat: >-
  Cited as al-Risala no. 458, 13 Apr 1942, Wikisource page 'مجلة الرسالة/العدد 458/اجتماع الملائكة في مسجد
  الفردوس'. Mubarak says he then wrote Kemal a letter arguing from etymology that Adam and Eve were Arabs; no
  reply or copy of the letter is cited, so the letter is his claim only. The Adam-and-Eve claim attributed to
  Kemal is Mubarak's report of the Turkish History Thesis era, not checked here. Humorous in tone. Wikisource
  transcription. Check: comic mockery of a claim attributed to Kemal (who is called 'al-marhum', 'may God
  forgive him'), not shown hostility; the page gives no source for the claim. Polarity hostile → witness.
