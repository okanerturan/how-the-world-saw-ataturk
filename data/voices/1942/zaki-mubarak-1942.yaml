  note: >-
    Arabic quote verbatim; header 'مؤلف= زكي مبارك', date 13-04-1942, signed 'زكي مبارك'. First-person aside
    ('وبهذه المناسبة أقول') in a comic piece on Adam, right after Abu al-'Ala quotations. He also writes that
    Kemal never answered 'غفر الله له' and that Turks told him Kemal would not read Arabic script. Translation
    and what_they_saw faithful. Problem is polarity: the thing he calls 'الفظيع' is the 'claim' (زعم)
    attributed to Kemal, in jest, and he uses 'المرحوم' and 'غفر الله له'; that is mockery of a thesis, not
    demonstrated hostility to Atatürk. The Adam-and-Eve claim and the letter are Mubarak's report only (caveat
    already says so). CORRECTION: polarity 'hostile' is an over-read; use 'witness' (or keep hostile only with
    an explicit 'comic, mild' hedge), intensity 1; add that the page itself gives no source for Kemal's Adam
    claim. Era posthumous correct; schema otherwise OK.
