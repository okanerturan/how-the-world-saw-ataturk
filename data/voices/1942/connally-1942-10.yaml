summary: >-
  Marks the Republic's 19th anniversary: 'the late great Kemal Ataturk', whose reforms rested on four
  foundations, none dependent on one man's life.
quote:
  text: >-
    The reforms and projects of Kemal Ataturk stood upon four square national foundations: peace, prosperity,
    honor, and strength. These foundations are not dependent upon one man's life or popularity for their
    execution.
  language: en
caveat: >-
  A formal felicitation to Turkey read with unanimous consent ('I feel certain that I am voicing the wishes of
  the United States Senate'), delivered in wartime when Turkey's neutrality was under Allied pressure;
  courtesy as well as view. Party, state and committee chairmanship are from the standard biographical record,
  not from the passage. Cited as Senate, 29 October 1942, Congressional Record vol. 88 (bound), pp. ~8679-8680
  (granule CRECB-1942-pt7-8-1).
