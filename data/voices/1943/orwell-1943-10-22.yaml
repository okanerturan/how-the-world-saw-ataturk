summary: >-
  Cites the Left's praise of Mustapha Kemal in 1935–39 as an example of its readiness to accept 'very doubtful
  allies' against Fascism.
quote:
  text: >-
    In the years 1935-9, when almost any ally against Fascism seemed acceptable, left-wingers found themselves
    praising Mustapha Kemal and then developing a tenderness for Carol of Rumania.
  language: en
caveat: >-
  'Who Are the War Criminals?', review of 'Cassius' (Michael Foot), The Trial of Mussolini, Tribune, 22 Oct
  1943; Collected Essays, Journalism and Letters vol. 2, item 54 (archive.org open text). The judgement is
  implied: the sentence follows 'the Left has also been willing to shut its eyes to a great deal and to accept
  some very doubtful allies'. The lead's attribution to 'Notes on Nationalism' (1945) is wrong; that essay
  does not mention Kemal.
