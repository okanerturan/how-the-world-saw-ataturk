  method: archive.org djvu download + free DuckDuckGo
  note: >-
    Quote verbatim: 'Bir gün Atatürk dirilecektir!!!' opens the passage printed on p.52 (Ethnographic Museum
    sarcophagus, 'sırtında mareşal üniforması', 'Atatürk'ten başkası olmıyacaktır'); n.122 (on the next page,
    p.53) gives Büyük Doğu, birinci devre, sayı 10, '19 İkinci teşrin 1943', s.2. Three independent web pages
    reproduce the same text and name issue 10, so the thesis is reliable here and the words are Necip Fazıl's.
    Admiring/2 fair; posthumous era right. (The record says 'p.52, footnote 122': the footnote is on p.53.)
