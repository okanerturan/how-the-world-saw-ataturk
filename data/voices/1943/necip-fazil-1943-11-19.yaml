summary: >-
  Imagines Atatürk rising from his tomb in the Ethnographic Museum, in marshal's uniform, to lead the nation
  when the world is reckoned up.
quote:
  text: Bir gün Atatürk dirilecektir!!!
  language: tr
mediated_by: >-
  Gültekin 2025, p. 52 ← Büyük Doğu, 1st series, no. 10, 19 Nov 1943, p. 2 ('Atatürk Dirilecektir!')
caveat: >-
  Turkish original, as printed in Deniz Gültekin's 2025 Istanbul University doctoral thesis 'Necip Fazıl
  Kısakürek'in Perspektifinden Atatürk ve Cumhuriyet Devrimlerinin Yansımaları' (p. 52, footnote 122). In the
  war year the article is wholly admiring: 'On that day the person at our head ... will be none other than
  Atatürk'. Gültekin notes the contrast with Necip Fazıl's later, opposition phase in the second series of
  Büyük Doğu (from 1948), when he serialised Rıza Nur's Hayat ve Hatıratım. Stored as the 1943 face of a voice
  usually counted hostile; the 1967 record is the other. Footnote 122 is on p. 53.
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
