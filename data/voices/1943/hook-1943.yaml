summary: >-
  Lists Atatürk among the 'midget followers' of the dictators' pattern who buried their monarchs.
quote:
  text: >-
    A century later, Lenin, Trotsky, Mussolini, Hitler, Ataturk, Metaxas, and other midget followers of the
    pattern set by the dictators either buried their monarchs or converted the seed of “the most superior”
    family in the world into paltry retainers.
  language: en
caveat: >-
  The Hero in History (John Day, 1943), chapter 3, Wikisource transcription of the scanned book (Page:The Hero
  in History.djvu/37). A one-clause mention inside a refutation of Wood's gametic theory of monarchy; 'midget'
  (polarity hostile) is read as a dismissal of the dictators as a type, with Atatürk named among them. Hook
  does not discuss Atatürk elsewhere in the chapter. Year 1943 from the work's first edition, from memory
  (tier M); the Wikisource text carries no date. Scan not viewed. 1943 confirmed by the copyright line.
