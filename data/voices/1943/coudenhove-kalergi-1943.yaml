caveat: >-
  Crusade for Pan-Europe: Autobiography of a Man and a Movement (Putnam, 1943), ch. XXVII 'The Future of
  Asia', around p. 280 (printed page not read; page markers 275 and 282 bracket the passage in the DLI scan
  dli.ernet.155751). The full sentence: 'The most important step toward such a new understanding between
  Europe and the Near East has been accomplished by modern Turkey, that recently under its great leader Kemal
  Ataturk, embraced without any European pressure all vital elements of Western civilization.' Also ch. XIV
  pp. 126-127: Greece and Turkey 'were blessed with far-sighted and energetic statesmen - Kemal Ataturk, the
  Turkish dictator, and Eleutherios Venizelos'. Venizelos' admiration of Kemal, told to Coudenhove in Vienna
  (pp. 125-126), is reported second-hand and not stored as Venizelos' gaze here.
