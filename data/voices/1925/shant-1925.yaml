quote:
  text: >-
    Այսինքն` հին թուրքեր եւ նոր թուրքեր, վերջիններս երէկ Իթթիհատական կը կոչուէին, այսօր քեմալական, վաղը նոր
    անունով մը պիտի իջնեն ասպարէզ, երբ խմբական նախանձը Քեմալին ալ տապալէ:
  translation: >-
    That is, old Turks and new Turks; the latter were called Ittihadists yesterday, are Kemalists today, and
    tomorrow will enter the arena under a new name, when factional envy topples Kemal too.
