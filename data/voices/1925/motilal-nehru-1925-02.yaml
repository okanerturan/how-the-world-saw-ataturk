summary: >-
  Arguing for a modest President's salary, holds up Kemal, head of the Turkish administration on £40 a month,
  as a government of the people.
quote:
  text: >-
    Now that is a government of the people by themselves, and if a person of the distinction of Mustapha Kemal
    Pasha and his position in the country as the head of the administration, can keep all the dignity attached
    to that position on £40 a month
  language: en
