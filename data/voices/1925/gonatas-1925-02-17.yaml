date: "1925-02-17"
era: contemporary
polarity: instrumental
intensity: 1
artifact: speech
evidence: P
summary: >-
  Says Kemal tirelessly rebuilt his army into a fanatical, well-supplied force, ran Turkey dictatorially, and
  waited for a chance to attack the Greek front.
quote:
  text: >-
    Ἐκ παραλλήλου ὅμως ὁ Κεμὰλ ἀναδιωργάνωνε συντόνως τὸν Στρατόν του. […] Πρὸς δὲ διωκεῖτο δικτατορικῶς ὑπὸ
    τοῦ Κεμὰλ
  language: el
mediated_by: >-
  As summarised in the Πρακτικά (third-person report of the speech; the quoted sentence is the recorder's
  wording)
caveat: >-
  Δ΄ Εθνοσυνέλευση, Πρακτικά Τόμος 4, session ΡΝ΄ of 17 Feb 1925, printed pp. 382-384 (PDF pages 193-194; page
  images read). The speech, on the proposed investigating committee into responsibility for the 1922 retreat,
  uses Kemal's strength to explain the army's collapse and to argue for dictatorship in war and democracy in
  peace; Kemal is a means to the speaker's argument. Session date read from the heading on p. 371; the speech
  is in the same sitting (no new heading between pp. 371 and 395). The index entries for Kemal under 'Δ΄
  Συντακτική 1924-25' (pp. 387, 393, 395) were checked: those pages in Τ.4 are other speakers on the same
  debate and do not name him.
