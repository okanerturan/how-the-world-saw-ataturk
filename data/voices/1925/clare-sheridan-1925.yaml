summary: >-
  Says the Turks owe their existence as a nation to the Ghazi, but reports terror and an arbitrary tribunal,
  and repeats a drinking slur.
quote:
  text: >-
    Nor had he anything with which to reproach her, except that she hampered his orgies of drunkenness
  language: en
caveat: >-
  Clare Sheridan, A Turkish Kaleidoscope (London: Duckworth, 1926), chapter 'Civilisation Revealed', p. 215,
  about Mustafa Kemal's divorce of Latife Hanım (January 1925; Sheridan's text says the divorce had 'just'
  happened). Same chapter, p. 214: 'The Turkish people are easily led; and they owe to their Ghazi the fact of
  their existence to-day as a nation.' and 'Terror reigns, and the Tribunal of Independence is as arbitrary as
  the Cheka.' The chapter reproduces the hat speech of Inebolu (24 Aug 1925) from the French edition of
  Cumhuriyet of 29 Aug 1925 and calls its reasoning ('we will, if necessary, sacrifice human lives') one that
  'no one is able to explain'. The date is that of the chapter, written on the eve of her departure; the book
  appeared in 1926. The 'orgies of drunkenness' line is her unsourced gossip, kept as a record of the Western
  tabloid view and not as fact. Also p. 133: 'During the life of Mustapha Kemal Pasha, yes' (Ankara will stay
  the capital).
node: Western Women Commentators on Atatürk, 1922–1936 — Sheridan, Mills, Woodsmall
