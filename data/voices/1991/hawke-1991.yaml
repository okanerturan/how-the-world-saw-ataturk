  text: >-
    the leadership and skill displayed by Kemal Ataturk in defending his homeland at Gallipoli paved the way
    for his building of the modern state of Turkey.
  language: en
caveat: >-
  A toast-style speech to a visiting head of state; praise is partly occasion. The 'Johnnies and Mehmets' /
  'your sons are now lying in our bosom' text that Anzac speakers attribute to Atatürk is itself contested: no
  1934 original has been found, it first appears in print in 1953 via Interior Minister Şükrü Kaya's
  recollection, and the 'Johnnies and Mehmets' clause is a 1978 Australian addition (see [[Johnnies and
  Mehmets]]). So this is a speaker's view of the Atatürk of the Anzac legend, spoken at a commemorative or
  diplomatic occasion that rewards praise. Cited as: Speech at Parliamentary dinner for President Özal of
  Turkey, Canberra, 9 May 1991.
