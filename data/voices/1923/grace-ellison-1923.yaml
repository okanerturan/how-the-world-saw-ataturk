summary: >-
  Met and lunched with Mustapha Kemal in Angora as Lausanne opened; called him the greatest man in Turkey,
  past-master as statesman, soldier and orator.
quote:
  text: >-
    It is not necessary to see M. Kemal Pasha to realise that he is the greatest man in Turkey to-day, quite
    apart from his actual achievements.
