summary: >-
  Writing to Prime Minister İsmet as 'consistent friends of new Turkey', urged keeping the Caliphate, sure
  President Mustafa Kemal could not calmly accept Islam's disintegration.
quote:
  text: >-
    a contingency which, we are sure, neither the Grand National Assembly nor His Excellency the President,
    Ghazi Mustafa Kemal Pasha, can view with equanimity
  language: en
