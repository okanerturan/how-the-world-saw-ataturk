  note: >-
    Quote verbatim (para. 3) in a letter headed 'To His Excellency Ghazi Ismet Pasha, Prime Minister of
    Turkey', signed by Ameer Ali and the Aga Khan; para. 7 also urges 'the Grand National Assembly and its
    great and far-sighted leaders'. Corrections: (1) what_they_saw is slightly off: the letter says Kemal
    could not view with equanimity Islam's disintegration if the Caliphate were diminished or removed, not
    that he 'could not see [the Caliphate] diminished'; (2) the register does not reprint 'İsmet's reply'. It
    quotes his remarks 'to an interviewer' objecting to the publication; (3) 'early Dec 1923' is not on the
    page, which says only that copies went to the Constantinople papers a week after the confidential
    dispatch; (4) the Independence Tribunal arrested three editors on a treason charge and 'soon acquitted'
    them, which the caveat should add. Conflicted is fair; P is right. Gaze test: to İsmet, not Kemal, but it
    invokes Kemal by name. Main agent's keep stands.
