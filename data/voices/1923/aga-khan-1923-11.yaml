caveat: >-
  Addressed to Prime Minister İsmet, not to Kemal; letter date not printed in the reprint (published in the
  Istanbul papers a week after dispatch, a week after dispatch). The register quotes İsmet's remarks to an
  interviewer objecting to its publication; the Independence Tribunal prosecution of the editors who printed
  it followed. The Istanbul editors who printed it were soon acquitted.
