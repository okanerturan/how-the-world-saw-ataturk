summary: >-
  Cites Kemal's Turkish revolution as proof that peasants make revolutions: Kemal 'and the others' had much
  peasant help, the whole country following him.
quote:
  text: 土耳其的革命，基玛尔等得农民的帮助不小。
  translation: In Turkey's revolution, Kemal and the others had no small help from the peasants.
  language: zh
caveat: >-
  Cited as Zhongguo Qingnian no. 11, signed 中夏, dated 29 Dec 1923 (Wikisource note), Wikisource page '論農民運動'.
  From 'On the Peasant Movement' (论农民运动), Wikisource transcription in simplified characters; the page header
  names the author as 鄧中夏 and the notes field gives the date 1923-12-29 and the original venue (Zhongguo
  Qingnian no. 11). Later in the piece he asks why, with no serfdom, 'the whole country followed the
  Nationalist Party leader Kemal' to drive the Greek army across the straits: 'why Turkey too had no serfdom,
  yet the whole country followed ... Kemal'. Kemal is an argument, not the subject; spelled 基玛尔. Instrumental
  use in a recruiting argument for the peasant movement.
node: Kemal in the Chinese Peasant and Federalist Debates, 1923–1927
