summary: >-
  Came to Ankara hoping for a Qur'an-based republic, found a current of atheism, rebuked Mustafa Kemal over
  prayer, then refused his offers of office.
quote:
  text: >-
    Pasha! Pasha! After belief, the most elevated truth in Islam is the obligatory prayers. Those who do not
    perform the prayers are traitors, and the opinions of traitors are to be rejected.
