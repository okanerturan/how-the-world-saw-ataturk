caveat: >-
  Translation of the quote: 'Had Mustafa not established the order of Angora / Curzon had already finished off
  Angora.' Poem 'Angora', printed p. 273 (contents list p. 274; PDF page 295) of Baharistan, Parts 1-2
  (Gujrat, 1937, 'forty years of verse'), read on the page image (4 Nov 2026). The poem is undated in the
  book; the 1923 date is inferred from the reference to Curzon (Lausanne talks, foreign secretary to Jan 1924)
  and Amanullah Khan, and may be a year or two off. Not a 1919-22 Khilafat-era text. Check: the date is
  inferred (Curzon and Amanullah references); the book is the 1937 Baharistan.
