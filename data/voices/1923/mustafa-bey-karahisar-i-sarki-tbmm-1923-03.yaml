summary: >-
  In a Lausanne-crisis motion, called Kemal the nation's saviour yet framed the Assembly's quarrel as Kemal
  versus Caliph Abdülmecid and demanded the cabinet's fall.
quote:
  text: >-
    Reisi Hükûmet Gazi Mustafa Kemal Paşa Hazretleri mi, yoksa Halife Abdülmecit Hazretleri midir?
  language: tr
caveat: >-
  Motion read at the 5 Mart 1339 sitting (4th session), dated 6 Mart; it opens at the foot of p. 168, the
  quoted sentence is on p. 169 and the three articles and signature on p. 170. Earlier in the same motion (p.
  169): 'Gazi âli şânımız ve sebebi necatımız Mustafa Kemal Paşa Hazretleri'. Signature reads 'Karahisarışarki
  Mebusu Mustafa'. Same-name deputies exist, so identify by constituency.
