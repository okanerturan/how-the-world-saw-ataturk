summary: >-
  Addresses Kemal as 'hero of the Greater East' whose victory over the Greeks threw the West into confusion
  and lit a new Eastern sun.
quote:
  text: نصرت على بني يونان نصرا أقام الغرب في هرج ومرج
  language: ar
caveat: >-
  TRANSLATION (this record's): 'You defeated the sons of Yunan with a victory that left the West in tumult and
  confusion.' Ode 'Ila batal al-sharq al-akbar' ('To the hero of the greater East', 'Büyük Doğu'nun
  Kahramanına'), whose opening verse puns on 'Mustafa' and 'Kemal'; printed in Diwan al-Rusafi (4th ed.,
  Cairo: I'timad, 1953), p. 440, which in Mustafa Saka's edition carries the heading 'said after Gazi Mustafa
  Kemal's victory over the Greeks in 1923' (Al-Chalaby, n. 10). Al-Chalaby judges 1923 a possible misprint for
  1922 (or the poem postdates Lausanne or the Republic). Arabic text as printed in Al-Chalaby 2019, RumeliDE
  Dil ve Edebiyat Araştırmaları Dergisi, Ö5, pp. 176-186, and in the compilation 'Dünya Şairlerinden Atatürk
  Şiirleri' (no. 46). The ode also calls Kemal a Jesus-like healer of the nation and says he saved the girls
  of Izmir from 'the hands of every lout'; Al-Chalaby adds that 'many Arab poets ignored' the victories. Not
  to be confused with Rusafi's Turkish-language work; the poem is in classical Arabic.
node: Poets, Reformers and the Black Press on Atatürk, 1921–1935
