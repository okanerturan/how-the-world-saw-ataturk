summary: >-
  Told Berthe Georges-Gaulis he had admired the Kemalists' struggle and told them so, but no longer understood
  men breaking with five centuries' history.
quote:
  text: >-
    Mücadelelerinde onlara hayran oldum ve bunu kendilerine bildirdim. Fakat bugün onları anlıyamıyorum
  language: tr
mediated_by: >-
  F. Pekin, 'Atatürk ve Lyautey', Belleten XX/80 (Oct 1956) p. 642 ← B. Georges-Gaulis, La question turque
  (1931)
caveat: >-
  Turkish translation of remarks Gaulis recorded years later. Translation: 'I admired them in their struggle
  and told them so. But today I do not understand them.' The same conversation praises their sincerity, energy
  and military worth but says such men 'grow weak once they succeed'. The PDF text layer drops Turkish letters
  (printed as 'onlar~~anhyam~yorum'); quote restored from the page.
node: Statesmen and Royals in Contact with Kemal, 1919–1938
