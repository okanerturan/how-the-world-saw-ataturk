    archived: https://web.archive.org/web/20250419044142/https://belleten.gov.tr/tam-metin-pdf/1240/tur
verification:
  verdict: confirmed
  quote_found: true
  checked_against: >-
    https://belleten.gov.tr/tam-metin-pdf/1240/tur (F. Pekin, 'Atatürk ve Lyautey', Belleten XX/80, 1956), p.
    642 (running head)
  method: curl + pdftotext
  note: >-
    On p. 642 the text layer reads 'Mücadele-lerinde onlara hayran oldum ve bunu kendilerine bildirdim. Fakat
    bugün onlar~~anhyam~yorum'. The restoration to 'onları anlıyamıyorum' is honest. 'Beş yüz yıllık tarihten
    yüz çevirmeyi', 'samimilik, aksyon, askeri kıymet, enerji' and 'başarı elde edince de zaafa düşerler' are
    all present. Note 13 gives the source as La Question Turque (1931), and the conversation is dated January
    1923. The view is of 'them' (the Kemalists) rather than of Kemal by name; what_they_saw says 'Kemalists',
    which is right. Conflicted fits.
  checked_on: "2026-11-05"
