summary: >-
  Creator of modern Turkey, ranked with Lenin and Mussolini: 'a kind of dictator in a democratic toga', yet 'a
  statesman of an entirely modern type'.
quote:
  text: >-
    The history of our times abounds in outstanding men. Mustapha Kemal, the creator of modern Turkey, stands
    alongside Lenin, the great revolutionary, and Mussolini, who has given actual form to a new conception of
    the State. […] He thus possessed both legislative and executive authority, and was therefore a kind of
    dictator in a democratic toga. But he never disregarded the national representatives or underrated their
    importance. […] In the exercise of this rare political art he was a statesman of an entirely modern type.
