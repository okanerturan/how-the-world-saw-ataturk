caveat: >-
  Only the phrase and the paraphrase ('Wahlen arrangiere', held up by 'Polizei und Gericht') are given in the
  secondary source; Heuss's article itself was not read. Mangold-Will (Begrenzte Freundschaft, 2013, p. 253
  snippet) says Heuss's 1928 assessment of Turkey was positive overall despite this. A judgement of Kemal's
  regime rather than of the man; hence conflicted.
