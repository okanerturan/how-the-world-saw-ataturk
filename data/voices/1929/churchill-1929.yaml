summary: >-
  Calls Kemal a 'Man of Destiny' with a 'Warrior Prince's' qualities and his 1922 offensive 'masterly', yet
  ties his army to Smyrna's burning.
quote:
  text: His operations were complicated and masterly.
  language: en
caveat: >-
  Second quote in the same volume, p. 367-368: 'Mustapha Kemal, the Man of Destiny whom we have met in these
  volumes on the Gallipoli Peninsula ... was furnished with the power, as he already possessed the qualities,
  of a Warrior Prince.' On p. 419 the same author writes that Kemal's army 'celebrated their triumph by the
  burning of Smyrna to ashes and by a vast massacre of its Christian population', so the book is both admiring
  of the general and hostile to the outcome. Page numbers taken from the running heads of the 1929 Thornton
  Butterworth edition's djvu text (OCR); p. 418 for the quoted line. Existing record churchill-1920 is a
  different, hostile Commons statement.
node: Western Statesmen and Churchmen on Atatürk in Their Own Words
