summary: >-
  In the Constituent Assembly's first session, tells Muslims that Kemal Pasha saw the unwisdom of mixing
  religion and politics; urges them to reject Jinnah's Pakistan.
quote:
  text: >-
    Kemal Pasha Ata-Turk saw the futility and unwisdom of combining politics with religion. The first thing he
    did was to put an end to Pakistan and establish the Republic of Turkey.
  language: en
caveat: >-
  Constituent Assembly of India Debates, vol. I, 19 Dec 1946, p. 149 (page header 150 follows the passage).
  Official report digitised by the Lok Sabha Secretariat / Government of India Press, via archive.org OCR.
  Gour's 'Pakistan' here means the old Ottoman Caliphate-Sultanate arrangement (his own use of the word); the
  vault does not adopt his framing of Muslim politics. Speaker header 'Dr. Sir Hari Singh Gour (C. P. and
  Berar' precedes the passage. Text read from the OCR of the official report; obvious OCR slips are silently
  corrected in the quote.
