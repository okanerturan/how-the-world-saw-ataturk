summary: >-
  Says Atatürk's secular reforms cost him orthodox Moslem admiration but won the young, and that eliminating
  the Khilafat's core collapsed the Indian Khilafat movement.
quote:
  text: >-
    This very policy, however, made him more popular among the younger generation of both Hindus and Moslems.
  language: en
caveat: >-
  The Discovery of India, ch. 'Kemal Pasha; Nationalism in Asia: Iqbal', pp. 416-417 (the book's index: 'Kemal
  Pasha, The Ataturk, 416-17'); open scans dli.scoerat.12288 (clean text) and in.gov.ignca.14765. Same
  passage: 'Kemal Pasha was naturally popular in India with Moslems and Hindus alike. He had not only rescued
  Turkey from foreign domination and disruption but had foiled the machinations of European imperialist
  powers, especially England'; 'The Ataturk partly destroyed the dream structure that had gradually grown up
  in the Indian Moslem mind'; 'when the core itself was eliminated by the Ataturk the superstructure
  collapsed'. Written in Ahmadnagar Fort 1944. Nehru's existing record is 1934 (Glimpses). A later Nehru
  letter to chief ministers (c. Aug 1951, Letters to Chief Ministers vol. 2, p. 459) says Kamal Ataturk 'drove
  out the allied occupation forces from Turkey and later defeated the Greek Army, which was supported by the
  British' (context only, not stored).
node: Statesmen on Atatürk in Their Own Words, Memoirs and Speeches
