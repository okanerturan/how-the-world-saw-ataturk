summary: >-
  Sees the Ghazi as one of the few in the East who acted after long thought; ends by predicting his
  'bewildered soul' will be explained.
quote:
  text: >-
    إذ هو من الأفراد القلائل في الشرق الذين عملوا بعد تفكير طويل، وأخضعوا أعمالهم لفكرتهم الأولى
  translation: >-
    For he is one of the few individuals in the East who acted after long reflection and made their deeds
    obedient to their first idea.
  language: ar
caveat: >-
  Cited as al-Risala no. 698, 18 Nov 1946, Wikisource page 'مجلة الرسالة/العدد 698/الغازي مصطفى كمال'. First
  instalment of 'The Ghazi Mustafa Kemal: study and analysis of the psychological motives that led him to
  leadership', signed Ahmad Ramzi Bey ('I write these words after seven years in Turkey'). Closing line of the
  instalment, verbatim: 'Mustafa Kemal is only one of those [who left the faith's path and will return to it];
  the days will reveal much of his bewildered soul'. Ramzi also translated Count Sforza's essay 'Mustafa Kemal
  the Turkish leader' in nos. 836-838 (Jul 1949) - the text Khalil Mutran was suspected of writing; Sforza is
  already a voice (1931). Identity of 'Ahmad Ramzi Bey' not established beyond the text. Religion: reported as
  the speaker's framing. Wikisource transcription. Check: country Egypt is inferred from publication in Cairo;
  identity not established on the page.
node: Egyptian Pens in al-Risala on Atatürk, 1935–1946
