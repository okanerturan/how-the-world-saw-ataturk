  note: >-
    Arabic quote verbatim, and it is Ramzi's own view, not a translation: the article is headed 'بحث وتحليل
    للدوافع النفسية ... للأستاذ أحمد رمزي بك' (signature 'أحمد رمزي'), date 18-11-1946; the sentence is 'وكلما
    مرت الأيام تمثلت إلي شخصية الغازي كأنموذج لكلمة جوتة الخالدة: إذ هو من الأفراد القلائل في الشرق ...', i.e.
    his own application of the Goethe epigraph (so the quote is a Goethe-based judgement; the translation is
    faithful). 'إنني أكتب هذه الكلمات بعد إقامة سبعة سنوات بتركيا' present; closing 'وما مصطفى كمال إلا واحد
    من هؤلاء ستكشف الأيام الكثير عن روحه الحائرة' matches (what_they_saw 'will be explained' is a loose gloss
    of 'will reveal much about'). Sforza caveat verified: no. 836, 11-07-1949, 'بقلم الكونت سفورزا ... للأستاذ
    أحمد رمزي بك', Ramzi presents it as 'بحث قديم عثرت عليه بين أوراقي'; Mutran suspicion not checked.
    PROBLEM: role 'Egyptian writer and historian' and country 'Egypt' are not supported by the page (the
    caveat itself admits identity is not established). CORRECTION: role -> 'writer in al-Risala, signed Ahmad
    Ramzi Bey, seven years resident in Turkey' and country/country_now -> 'Egypt (as published in Cairo;
    nationality not stated)' or flag as inference in caveat. Conflicted / 2 fair; schema OK.
