summary: >-
  Judged Mustafa Kemal far abler than Enver but without his magnetism, and too hesitant to act except in
  desperate or very favourable circumstances.
quote:
  text: >-
    Of course Mustafa Kemal is much the more able of the two, but lacks Enver's personal magnetism.
  language: en
caveat: >-
  Secret memorandum to the Foreign Office of 15 Sept 1919 (No. 115 in Garnett, The Letters of T. E. Lawrence,
  London: Cape 1938, pp. 288–291; quote p. 291, note G); an intelligence appraisal, not a public statement; no
  meeting is documented (his 1926 claim of 1918 talks, in a Childs FO minute, is doubted by Sonyel 1988).
node: Writers, Scientists and Artists in Contact with Kemal, 1919–1938
