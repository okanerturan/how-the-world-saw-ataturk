artifact: speech
evidence: P
summary: >-
  Receiving Turkey's new ambassador: Turkey owes its role as a link between Europe and the Near East to
  Atatürk's 'decisive choice' for the Western democracies.
quote:
  text: >-
    Ce rôle précieux de trait d'union entre l'Europe et le Proche-Orient, elle le doit au choix décisif
    d'Ataturk qui a marqué la place de son pays parmi les nations démocratiques occidentales.
  translation: >-
    This precious role as a link between Europe and the Near East she owes to the decisive choice of Ataturk,
    who marked out his country's place among the Western democratic nations.
  note: >-
    The official transcript is typed in capitals without accents; case and accents are restored here, the
    wording is unchanged.
  language: fr
caveat: >-
  Reply to the speech of Orhan Eralp on presenting his credentials as Turkey's ambassador, Paris, 23 September
  1976; 'elle' is modern Turkey. A diplomatic courtesy: he goes on to derive the alliance and the association
  with the European Community from that 'choix fondamental'. Two years later, receiving the next ambassador,
  Hamit Batu (the transcript prints 'Hatim Batu'), on 7 September 1978, he said: 'Les choix de la Turquie
  moderne, marqués par la grande figure d'Ataturk nous ont encore rapprochés.'
