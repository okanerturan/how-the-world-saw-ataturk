evidence: P
summary: >-
  Asked about '65 million Turkish Muslims' joining the Union: Turkey is secular, and must not undo the
  secularism won by 'the father of modern Turkey'.
quote:
  text: >-
    La Turquie est un pays laïc et dont nous attendons qu'elle ne remette pas en cause cette laïcité qui a été
    gagnée historiquement, notamment par le père de la Turquie moderne Kamal ATATURK.
  translation: >-
    Turkey is a secular country, and one we expect not to call into question this secularism, which was won
    historically, notably by the father of modern Turkey, Kemal Atatürk.
  language: fr
caveat: >-
  Press conference at the NATO summit in Prague, 22 November 2002, less than three weeks after the AKP's
  election victory. Asked why European opinion should not fear 'l'entrée éventuelle de 65 millions de
  musulmans turcs au sein de l'Union', he retorts 'Vous dites 60 millions de musulmans turcs. C'est curieux,
  parce que vous ne dites pas 60 millions de chrétiens français' and says the question is political, not
  religious: Turkey has its place in Europe to the extent that it shares Europe's values, which 'lui reste à
  démontrer'. Atatürk serves that argument. The transcript prints 'Kamal ATATURK'. On 19 February 1998, at the
  state dinner for President Demirel at the Élysée, he had said that France was the first, 'dès 1921, en écho
  à l'appel de Mustapha Kemal', to recognise 'le fait national turc'.
