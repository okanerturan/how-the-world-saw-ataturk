summary: >-
  Judging Egypt's Naguib after an Asian tour, says he has 'some of the zeal that Kemal Ataturk had' in
  modernising Turkey.
quote:
  text: >-
    I think they have some of the zeal that Kemal Ataturk had when he tried to modernize and clean up the
    situation in Turkey. … It is too early to tell whether these people have or will develop the same success
    that Kemal Ataturk had in modernizing and bringing Turkey up to the very strong position she is in today
  language: en
caveat: >-
  His own answers in a magazine interview which he had printed in the Record (the questions and editor's note
  are not counted); Atatürk is a yardstick for Naguib, i.e. instrumental. OCR 'moderniz.e' repaired. Cited as
  Interview in U.S. News & World Report of 30 October 1953, printed at his request in the Senate Appendix on 7
  January 1954, Congressional Record vol. 100 (bound), granule CRECB-1954-pt15-1.
