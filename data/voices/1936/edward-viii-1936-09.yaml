  note: >-
    Quote verbatim in the footnote on p. 283 ('Türkiye'de ilk ikametimden pek zevkli bir hatıra muhafaza
    edeceğim'). The London remark is on p. 281: 'Sizin de bir gün Londra'yı şereflendireceğinizi ümit ederim'.
    The British report para. 61 confirms arrival on the morning of 4 Sept, the President greeting him on
    landing and driving with him to the Embassy, the exchanged visits, and 'King Edward remained in Istanbul
    until the 6 September'. CORRECTION: the caveat's 'At Sirkeci station (5 Sept)' should be 6 Sept. Papers
