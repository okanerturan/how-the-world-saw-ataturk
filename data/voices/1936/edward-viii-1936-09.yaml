evidence: P+J
summary: >-
  Received by Atatürk at Istanbul, exchanged visits, drove with him through the city, invited him to London,
  and telegraphed thanks from Sofia.
quote:
  text: Türkiye'de ilk ikametimden pek zevkli bir hatıra muhafaza edeceğim.
  language: tr
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 28 (Kaynak 2010) pp. 281–283 ← Edward's telegram, Sofia 7 Sept 1936 (Şimşir,
  Atatürk ve Yabancı Devlet Başkanları vol. 2 pp. 342–343) and Cumhuriyet, Akşam, Kurun 7 Sept 1936
caveat: >-
  Translation of the Turkish rendering of his French telegram: 'I shall keep a most pleasant memory of my
  first stay in Turkey.' At Sirkeci station (6 Sept) he told Atatürk in French he hoped he would one day
  honour London. Corroborated by the British annual report for 1936 (para. 61) and NZ wire reports of 5–7 Sept
  1936; his memoir A King's Story (1951) recalls Atatürk greeting him ashore and leaving his bullet-proof car.
