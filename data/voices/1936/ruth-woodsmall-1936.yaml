summary: >-
  Calls him, for the Moslem East as a whole, the leading feminist, whose fearless leadership raised the status
  of Moslem women.
quote:
  text: >-
    For the Moslem East as a whole Kamal Ataturk may be rightly considered the leading feminist.
  language: en
caveat: >-
  Ruth Frances Woodsmall, Moslem Women Enter a New World (1936), p. 69 (index: 'Ataturk, Kamal, 69, 405');
  text read in the Bimla reprint, Women in the Changing Islamic System (Delhi), which keeps the original
  running heads. The next sentence (p. 70): 'Through his fearless leadership he has not only attained his
  primary objective of social reforms for Turkey, but has also affected the social thought of the entire
  Moslem world and contributed greatly to the elevation of the status of Moslem women.' Elsewhere (p. 399 of
  the reprint) she calls him 'the saviour of the new Turkey' whose 'virile and commanding leadership' enabled
  drastic religious reform. Her observation that the Turkish Women's Union (Kadin Birligi) was dissolved right
  after the 1935 Istanbul congress is neutral reporting. Woodsmall is a lesser-known name; she is stored for
  the mid-1930s women's-movement angle, not for fame.
node: Western Women Commentators on Atatürk, 1922–1936 — Sheridan, Mills, Woodsmall
