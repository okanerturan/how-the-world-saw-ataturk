summary: >-
  Dedicates 'New Atlantis' to Kemal Atatürk: Ankara reborn from the desert, legend turned into life forged
  with hammer and sledge.
quote:
  text: Легендата става живот (да живее животът!), живот, изкован с млат и чук!
  language: bg
caveat: >-
  TRANSLATION (this record's): 'The legend becomes life (long live life!), life forged with hammer and
  sledge!' Poem 'Nova Atlantida', dedication 'На Кемал Ататюрк'. DATE NOT ESTABLISHED: the only dated printing
  found is Amazonka. Izbrana lirika v dva toma (Balgarski pisatel, Sofia, 1973), as given by chitanka.info;
  the surname Atatürk (adopted 1934) and the present tense ('two piercing eyes do not sleep') suggest
  composition 1934-1938, but that is inference only (tier M). If an earlier printing is found, re-date to the
  contemporary era. Turkish translation by Hüseyin Mevsim in 'Dünya Şairlerinden Atatürk Şiirleri' (no. 37).
  Dated at check: the poem is in Сърце човешко (1932, 1936 editions; bagryana.litclub.bg); 1973 is only the
  selected-poems edition read.
