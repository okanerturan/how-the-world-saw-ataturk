summary: >-
  Credits Atatürk as the leader of extraordinary courage who grasped the infant nation's vitality and drove
  the invaders into the sea.
quote:
  text: >-
    Defeated, humiliated, exhausted, the people of Turkey found a leader of extraordinary ability and courage.
    … Under his leadership the people of Turkey swept the invaders into the sea
  language: en
caveat: >-
  Published in La Turquie kémaliste, the illustrated review of the Turkish Press Directorate (Direction
  Générale de la Presse, Ministry of the Interior), a Kemalist state propaganda venue that chose and printed
  (and for some items translated) what it ran; read in the OCR of archive.org item la_turquie_kemaliste.
  Signed English original, 'Romance and Revolution', no. 14 (August 1936); a Turkish translation ('Cazibe ve
  devrim') exists in the archive.org item. Page not shown in the OCR. Wright, a Protestant educator in
  Istanbul whose colleges operated under the Republic's regulation, writes for a Turkish government review; an
  American college head is a recognisable but not disinterested witness. In the same piece he calls the
  Turkish state 'a pattern for other nations' dissatisfied with ineffective governments (his words, not quoted
  here). Evidence P (signed original), venue noted. Cited as La Turquie kémaliste no. 14 (August 1936),
  'Romance and Revolution'.
