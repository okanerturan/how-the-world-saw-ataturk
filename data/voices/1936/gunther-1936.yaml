summary: >-
  Calls Atatürk the 'roughneck of dictators' (Hitler a milksop, Mussolini a dandy), a psychopath-patriot who
  nonetheless remade a rotten nation.
quote:
  text: Kamal Ataturk is the roughneck of dictators.
  language: en
caveat: >-
  Chapter XXXI 'The Turkish Colossus', pp. 418-423 of the Hamish Hamilton revised illustrated edition (1938
  scan, DLI in.ernet.dli.2015.13600; the quoted sentence is on p. 419). First edition January 1936: the
  chapter's 'Father of Turks' sentence is confirmed in the 1936 impression only by an archive.org
  search-inside snippet (insideeurope00gunt, lending), so the 1938 text is the one read. Same chapter: 'The
  blond, blue-eyed combination of patriot and psychopath who is dictator of Turkey'; 'Kamal Ataturk, who
  strides the Turkish landscape like a colossus'; 'This man ... resembles no one so much as Peter the Great';
  and, p. 422, 'Other people have created nations. Kamal's job was harder.' He also counts the 1926 hangings
  and the slapped Egyptian minister, and says 'it is no tribute to Kamal' that he ejected sultan and caliph.
  Gunther's anecdotes (the champagne party on the night of the hangings, the slap) are his own reportage and
  are not checked here. The sentence is in the 1936 first printing (Harper, New York; archive.org
  insideeurope00gunt, lending copy) as shown by archive.org full-text search, 3 Nov 2026, and in four other
  1936 copies; pages cited are from the 1938 revised edition read in full.
