caveat: >-
  The object is Reza Shah's modelling on Atatürk; the Shah states no personal verdict, only calls Atatürk 'the
  man he had sought to emulate' and recounts the 1934 State visit when the honor guard's standard bearer knelt
  before Reza Shah (p. 52). Polarity 'admiring' is therefore weak; it could be read as witness. The sentence
  goes on to say the republic plan failed because 'Persia, unlike Turkey, was an empire'. Page 51 per the
  book's index; the passage runs onto p. 52 (OCR page header '52 ANSWER TO HISTORY').
