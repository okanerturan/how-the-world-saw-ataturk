summary: >-
  At an Ankara symposium's opening: Atatürk is 'one of the most outstanding figures of our century'; his
  revolution influenced many countries fighting for liberation.
quote:
  text: >-
    Atatürk est certainement l'une des figures les plus marquantes de notre siècle. Et la révolution kémaliste
    a été l'une des premières à avoir posé certains des problèmes fondamentaux auxquels continuent d'être
    confrontés, encore de nos jours, tant de pays soumis à des transformations rapides.
  translation: >-
    Atatürk is indeed one of the most outstanding figures of our century. And the Kemalist revolution was
    among the first to raise some of the fundamental problems which still, even today, confront so many
    countries undergoing rapid change.
  note: >-
    The English is UNESCO's own version of the address, issued under the same document number; it is not the
    archive's translation.
  language: fr
caveat: >-
  Address at the opening of the Symposium on Atatürk, Ankara, 9 June 1980, after the Turkish Minister of
  Culture (UNESCO document DG/80/15, a cover and three typed pages), at the Turkish government's invitation
  during the preparations for the centenary of his birth. The document does not say which language he spoke;
  the French and English typescripts carry the same number. The praise is not unqualified. In UNESCO's
  English: 'Atatürk had to ride roughshod over age-old customs, defy powerful entrenched forces and act
  uncompromisingly in often painful dilemmas. … Inevitably he sometimes took controversial decisions and made
  choices some of which might today seem hazardous. But is that not the lot of all who lead their peoples down
  new paths, down avenues still untried?' The French is milder at the first point: 'Atatürk dut bousculer des
  habitudes séculaires, braver de puissantes forces établies, trancher des dilemmes souvent douloureux'. He
  also speaks of 'that period of history which bears the imprint of Atatürk's genius' ('la période historique
  qui porte l'empreinte du génie d'Atatürk'). He says the revolution led by Mustafa Kemal was 'to exert a
  profound influence in many countries fighting for their liberation', and ends on its foreign policy, 'in
  which its originality combines with its universality'.
