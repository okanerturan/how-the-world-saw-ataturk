summary: >-
  Calls his push for the 1925 Law on the Maintenance of Order a 'superb political game' that turned a
  democracy into a dictatorship.
quote:
  text: Then Mustafa Kemal Pasha played a superb political game.
  language: en
caveat: >-
  Turkey Faces West: A Turkish View of Recent Changes and Their Origin (Yale University Press, 1930; the
  frontispiece credits the Institute of Politics, Williamstown), ch. 'The Turkish Republic', p. 220 (the next
  running head is 221; scan archive.org in.ernet.dli.2015.183553, a Digital Library of India copy). The
  context is the March 1925 Law on the Maintenance of Order, after which 'the tribunals suppressed opposition
  and instituted a reign of terror which lasted nearly two years' and 'the moral responsibility ... rests on
  the majority in the National Assembly'. She adds, p. 222, that the personality of Mustafa Kemal 'played a
  great role' but that he, like any 'Great man', was carried by a wave, and, p. 182, that 'few men ... have
  shown better judgment and capacity than Mustafa Kemal Pasha' on the military and foreign-policy lines.
  Sensitive thread (Kurdish revolt, Independence Tribunals): the voice is hers, not the vault's.
node: Famous Pens on Atatürk II — Farrère, Halide Edib, Toynbee, Pamuk, Nesin
