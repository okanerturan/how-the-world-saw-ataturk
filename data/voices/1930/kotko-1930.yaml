summary: >-
  Sees a national revolution made by peasants who got little, and asks whether Kemal will put a capitalist
  'hat' on his constitution.
quote:
  text: >-
    Молодотурки, завівши конституцію, нап'яли на неї, за одним фігуральним виразом, чалму. Чи напне на власну
    конституцію Кемаль капелюха всеевропейського капіталістичного зразка?
  translation: >-
    The Young Turks, having introduced a constitution, put a turban on it, in one figurative expression. Will
    Kemal put on his own constitution a hat of the all-European capitalist pattern?
  language: uk
caveat: >-
  Кость Котко, Щоденник кількох міст (Kharkiv: Knyhospilka, 1930), chapter 'Через Анатолію'; Wikisource
  transcription of the scanned book. The same chapter says the Turkish peasant made the national revolution
  and 'received nothing for it' apart from the abolition of the ashar, a verdict on Kemalism rather than on
  the man; in the chapter 'В історичні дні Туреччини' he reports Kemal's order to halve the time for the new
  alphabet. Soviet-line travel journalism of 1930. Translation is the vault's own. Scan not viewed.
