caveat: >-
  Ijū to kaitaku (1930), printed p. 107, NDL image 63 (page image read). Chapter profiles Kemal as 'one
  generation's splendid fellow' aged 43, so it was probably written about 1924 and collected in 1930; the date
  given is the publication date. A later passage (p. 66 image) says Japan should not imitate Kemal, Lenin or
  Gandhi but achieve its task by Japanese spirit.
