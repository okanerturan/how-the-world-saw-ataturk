  note: >-
    Verbatim, p. 33 (head 'A NATURALLY STRONG LINE 33'): '...might almost have caused the destruction of the
    Turkish Army, if it had not been commanded by leaders of great military capacity as Mustapha Kemal Pasha
    and Ismet Pasha.' The 'might have destroyed' is Andrew's own reading of a manoeuvre open to the Greek
    army, so what_they_saw is fair but should say 'a manoeuvre open to the Greeks'. P. 173 report (captured
    Turkish officers said Kemal had been in the lines two days earlier 'encouraging and urging his men to a
    last desperate fight') confirmed, a report not a judgement. Intensity 1 fair (brief, backhanded). ERA FIX:
    'contemporary' (1930, Kemal alive), not 'posthumous'.
