  text: >-
    if it had not been commanded by leaders of great military capacity as Mustapha Kemal Pasha and Ismet Pasha.
  language: en
caveat: >-
  Towards Disaster: The Greek Army in Asia Minor in 1921 (John Murray, 1930), p. 33 (running head 'A NATURALLY
  STRONG LINE 33'); open scan towardsdisastergreekarmy1921. The quote ends the sentence; the complete clause
  is 'might almost have caused the destruction of the Turkish Army, if it had not been commanded by leaders of
  great military capacity as Mustapha Kemal Pasha and Ismet Pasha'. On p. 173 he reports that Turkish officers
  said Kemal had been 'in the lines' two days earlier 'encouraging and urging his men to a last desperate
  fight' (a report, no judgement). The book argues the Greek disaster was caused by the Greek command's own
  decisions, not by the enemy; the voice here is that of a defeated officer on his opponents. Used with
  neutral voice; Sakarya and Asia Minor are sensitive ground.
node: Soldiers on Mustafa Kemal in Their Own Words, 1915–1940
