summary: >-
  On a night stopover in Ankara she drove to Atatürk's floodlit mausoleum and thought it, with its rows of
  columns, somewhat like the Lincoln Memorial.
quote:
  text: >-
    We drove to Ataturk's monument but could not go inside, as it closes at sunset. They light it all night
    very brilliantly, so it stands out on the hillside with its rows of columns all around, looking somewhat
    similar to the Lincoln Memorial in Washington, D. C.
  language: en
caveat: >-
  From her column 'My Day', datelined Tel Aviv and published 24 March 1959, about the evening of Friday 13
  March: a stopover of a few hours in Ankara on the flight from Rome to Tehran, with her granddaughter Nina.
  The US embassy sent a Mr. Butler of its staff to meet them with an embassy car; they did not go inside. She
  calls it 'Ataturk's monument'; that it is the mausoleum is our identification. She adds what Butler said a
  guard had told him, that the monument opens at sunrise and closes at sunset 'so as not to disturb Ataturk's
  slumbers'. It is a visitor's description of the mausoleum, with no judgment of him; the comparison with
  Lincoln's memorial is her own. The digital edition marks this column as emended, but the only correction
  near this passage is the spelling of Tehran.
