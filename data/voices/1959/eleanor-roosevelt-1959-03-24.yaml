  note: >-
    The site search returns this one column for 'Ataturk' and nothing for 'Kemal'. A second reader fetched the
    edition's XML master of every listed column (7,996, 1936-1962) and searched them for his name in its usual
    spellings: no other column names him. Columns that speak of Turkey without naming him include 29 March
    1937 (a film showing 'what has been done in a very few years to change a country'), 21 May 1938 (a visit
    from the Turkish journalist Ismet Sanli, on 'the new Turkey of today') and 13 November 1958 (a pamphlet of
    Turkish cartoons). The quote is word for word in both versions of the column.
