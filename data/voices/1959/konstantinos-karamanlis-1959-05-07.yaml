summary: >-
  'The great Atatürk', who with Venizelos laid the foundations of a Turkish–Greek friendship that served both
  countries; invoked to cast renewed cooperation as historic necessity.
quote:
  text: >-
    Büyük Atatürk ve Elefterios Venizelos, Türk-Yunan dostluğunun temellerini attıkları zaman bu dostluk her
    iki memleket için faydalı olmuştur. Bugün ise Türk-Yunan müşterek çalışmaları bir tarihi zaruret halini
    almıştır.
  translation: >-
    When the great Atatürk and Eleftherios Venizelos laid the foundations of Turkish–Greek friendship, this
    friendship was beneficial to both countries. Today Turkish–Greek joint work has become a historic
    necessity.
  is_translation: true
  language: tr
