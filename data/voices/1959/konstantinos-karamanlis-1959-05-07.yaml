caveat: >-
  Arrival statement to the press, 7 May 1959; he visited Anıtkabir the same afternoon (narration only). A
  political invocation rather than a personal portrait. The archive already holds his nephew Kostas Karamanlis
  (PM 2004–09); this is the elder Konstantinos (1907–1998). Greek original not seen. Read on the page image
  (Milliyet's subscriber archive).
