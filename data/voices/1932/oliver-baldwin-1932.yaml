summary: >-
  Writing of Anatolian peasants, expects things to improve now that Kemal has limited the power of the
  priesthood.
quote:
  text: >-
    Since Mustapha Kemal has limited the power of the priesthood, things will probably be better in the future,
  language: en
caveat: >-
  Cited as Oliver Baldwin, The Questing Beast: An Autobiography (1932), p. 129 (and p. 130 for the Turks 'may
  become a very different race'). Open scan (Digital Library of India copy of the 1932 book). A passing view
  inside a travelogue of 1920s Anatolia; the sentence is a prediction about the peasants. Other 'Kemal's in
  the book are his Circassian fellow-prisoner Yusuf Kemal, not Mustafa Kemal; the other Kemalist mentions (p.
  165 the 17 September 1922 march; a later remark that Kemal's portrait hung in Indian Muslim shops) are
  descriptive. Sentence is cut off at the comma in the printed page; the text continues on p. 130.
