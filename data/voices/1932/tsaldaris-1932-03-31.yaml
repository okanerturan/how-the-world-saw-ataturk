id: tsaldaris-1932-03-31
voice: Panagis Tsaldaris
voice_type: person
role: Leader of the People's Party, later Prime Minister
country: Greece
country_now: Greece
domain: politics
date: "1932-03-31"
era: contemporary
polarity: instrumental
intensity: 1
artifact: speech
evidence: P
summary: >-
  Tells Venizelos that Kemal, sworn to the National Pact, lost no war material under Venizelos's treaty and
  accepted none of the compromises offered.
quote:
  text: >-
    Γνωρίζετε ἐν τούτοις, κύριε Πρόεδρε τῆς Κυβερνήσεως, τὸ Ἐθνικὸν Συμβόλαιον τοῦ Κεμάλ, καὶ γνωρίζετε ἀκόμη
    ὅτι διὰ τῆς συνθήκης, τὴν ὁποίαν σεῖς εἴχατε κάμει, αὐτὸς δὲν ἐστερήθη οὐδενὸς ὑλικοῦ πρὸς ἐξακολούθησιν
    τῆς ἐκστρατείας. Δυστυχῶς ὁ Κεμὰλ οὐδὲν ἐκ τούτων ἐδέχετο.
  language: el
caveat: >-
  Βουλή Β΄ περίοδος Δ΄ σύνοδος, Τόμος 1 part 2, session Ν΄ of Thursday 31 March 1932, printed p. 660 (PDF page
  137; page image read; verbatim stenography). The two sentences are about 20 lines apart (the first runs to
  the end of the left column, the second is in the right column). In the 1920-22 policy debate with Prime
  Minister Venizelos, Tsaldaris argues that agreeing terms with Kemal was never easy; Kemal is a means to his
  argument. Venizelos's reply (p. 671) only reports Tsaldaris's suggestion of peace with Kemal and states no
  view of Kemal; not staged.
