caveat: >-
  Kaiko manroku (1947), 'Toruko no senrei', printed p. 103, NDL image 57 (page image read). Hitler is still
  'unknown' in the passage, so the essay dates from the early 1930s; 1947 is the book date. Stronger and more
  personal than the 1934 record (a list with Mussolini and Hitler). The praise rests on the script change and
  does not touch other reforms. Check: the book's first part is headed '昭和七年英京に於て執筆' (written in London, 1932)
  and the passage calls Hitler '未知數', so c. 1932 (probable); published 1947.
