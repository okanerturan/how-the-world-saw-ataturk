  note: >-
    Quote verbatim on printed p.103 (left page), section 'Toruko no senrei' inside chapter 3 (pp.93ff). Praise
    rests on the script change; the next paragraph says Kemal's method and timing were good and he finished it
    almost without sacrifice, matching the record. DATE/ERA CORRECTION (probable, not certain): the 1947 book
    is a reprint of a 1932-33 tract; its first part is headed '(昭和七年英京に於て執筆)' (written in London, 1932; table
    of contents, image 6) and the Kemal passage calls Hitler '未知數' (still unknown), i.e. before Jan 1933.
    Chapter 3 itself carries no separate date. So date should be c.1932, era contemporary, not 1947
    posthumous. Gaze test passes (own, strong verdict).
