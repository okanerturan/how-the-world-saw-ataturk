summary: >-
  Pictures Kemal as drunk with a lucky, accidental victory, his hand bloody, eyeing the Ararat plain from the
  Araxes and dreaming of ruining it.
quote:
  text: >-
    երբ Քեմալը՝ բախտահաս պատահական յաղթութեամբ գինով, իր արնոտ ձեռքը ագռաւի թեւերին իջեցրած՝ Արաքսի ափէն իր
    պղտոր հայեացքով Արարատեան դաշտն է չափում, զայն մի օր սեւ հողերի վերածելու երազով.
  translation: >-
    when Kemal, drunk with a lucky accidental victory, his bloody hand lowered on the raven's wings, measures
    the Ararat plain from the bank of the Araxes with his murky gaze, dreaming of one day turning it into
    black earth.
  language: hy
caveat: >-
  'Ցեղի ոգու շարժը' ('The movement of the race's spirit'); the Wikisource header and footnote say it was
  printed in Sofia in 1932. Sensitive thread (Armenian genocide memory): recorded as Nzhdeh's own rhetoric in
  a polemical essay, not as the vault's description of Kemal. Translation (including the figurative 'raven's
  wings') is the vault's own; check with an Armenian reader. Scan not viewed.
