caveat: >-
  Quote from MacArthur, Reminiscences (1964) p. 98 (archive.org reminiscences00maca, search snippet), written
  32 years later; the adjective is his later view. Date and timing (17:00 to 18:20, during the Language
  Congress) from Atatürk'ün Bütün Eserleri vol. 26 p. 37 fn., which shows the long 'Atatürk–MacArthur
  conversation' text first printed in 1951 is a fabrication. Army and Navy Journal 10 Sept and 1 Oct 1932
  report the visit.
