caveat: >-
  Turkish rendering (AA) of an entry probably written in Azerbaijani; the original is not located. AA and
  Kıbrıs Gazetesi print it, one AA wire (the second has a typo, 'edebi' for 'ebedi'). The entry goes on to say
  that Atatürk 'knew Azerbaijan's joy as his own joy and its grief as his own grief'. Aliyev signed the book
  on earlier visits (5 Nov 2008, 12 Nov 2013, 15 Jan 2015, 25 Apr 2018 per the Turkish Wikipedia list); those
  entries were not found.
