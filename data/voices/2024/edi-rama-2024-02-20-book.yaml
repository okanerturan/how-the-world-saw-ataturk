mirror: emancipator-patriarch
artifact: quote
evidence: J
summary: >-
  A great leader of rare inclusiveness, peace and progress, whose intelligence saw the importance of women's
  emancipation.
quote:
  text: >-
    Adında, modern Türk devletinin köklerini bulduğumuz ve mirasında, Türk toplumunun kimliğini renklendiren
    büyük lideri hatırlıyoruz. Mustafa Kemal Atatürk'ün kalıcı varlığı, günümüzde bile eşine rastlanması zor
    bir kapsayıcılığı, barışı ve ilerlemeyi gösteriyor. Zekası, onun, kadınların özgürleşmesinin önemini fark
    etmesine yol açtı. Milletine olan sevgisi, onu, ilerlemeyi, okuryazarlığı sahiplenmeye ve gelişme tutkusu
    ile değerli vizyonunu kanıtlayan ekonomik reformları desteklemeye yöneltti. Burada, Atatürk'ün ebedi
    istirahatgahının kutsal mekanında, onun sevgi ve barış gibi beklenmedik yollarla başarılan modern Türkiye
    vizyonunu kutluyoruz.
  translation: >-
    We remember the great leader in whose name we find the roots of the modern Turkish state and whose legacy
    colours the identity of Turkish society. Mustafa Kemal Atatürk's enduring presence shows an inclusiveness,
    peace and progress hard to match even today. His intelligence led him to recognise the importance of
    women's emancipation. His love for his nation led him to embrace progress and literacy and to support
    economic reforms that proved his passion for development and his valuable vision. Here, in the sacred
    space of Atatürk's eternal resting place, we celebrate his vision of a modern Türkiye achieved by
    unexpected means such as love and peace.
  is_translation: true
  language: tr
