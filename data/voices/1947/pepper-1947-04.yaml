summary: >-
  Cites Atatürk's record to argue communism has no foothold in Turkey, and credits him with building a strong
  army and government.
quote:
  text: >-
    Anyone who has ever heard of Ataturk and his party and his government, which is now carried on by his
    chosen successor, President Inonu, knows that there is not any likelihood of communism getting a foothold
    in Turkey. … Finally Ataturk took advantage of the strife which existed in Europe and developed a strong
    army and a strong government in Turkey
  language: en
caveat: >-
  Truman Doctrine debate: Pepper argues against the bill, so Atatürk is used as evidence for his case (no
  communist threat; the Dardanelles question). The OCR reads 'like·uhood' for 'likelihood' (corrected); the
  second quote is rebuilt from the interleaved two-column text layer (the source reads 'de- veloped', 'gov-
  ernment'). Cited as Senate, 17 April 1947, Congressional Record vol. 93 (bound), pp. ~3593-3596 (granule
  CRECB-1947-pt3-13-1).
