  note: >-
    Quote verbatim (OCR 'de- gilsem'): 'O, Atatürk'e hayransa, ben de değilsem, bu, beni yarı yolda bırakmayı
    mazur gösterir mi?' Context: the lawyer Hâmit Şevket İnce dropped his May 1944 defence after Falih Rıfkı
    warned him, citing 'benim Atatürk düşmanı olduğumu'. The reply to 'Sıfır' (Yücel) is signed 'ATSIZ' and
    dated '22 Ekim 1947, Çarşamba — Maltepe'. 1947-11 (issue date 3 Nov 1947) is fine. 'Atatürk pozu vermeğe
    özenerek Atatürk bulvarında' present. Translation faithful. Minor: what_they_saw 'declines to call himself
    an admirer' is a little strong for a conditional; 'implies he is no admirer' is closer. Conflicted is
    defensible (no admirer, but he resents the 'enemy' label used against him); intensity 1 is right. Schema
    ok.
