summary: >-
  Says a lawyer dropped his 1944 defence when Falih Rıfkı called him an enemy of Atatürk, and implies he is no
  admirer.
quote:
  text: O, Atatürk'e hayransa, ben de değilsem, bu, beni yarı yolda bırakmayı mazur gösterir mi?
  language: tr
caveat: >-
  TRANSLATION (this record's): 'If he admires Atatürk and I do not, does that excuse leaving me halfway?'
  Signed 'ATSIZ', in his reply to Hasan Âli Yücel ('Sıfır'), Kür Şad no. 4-5 (1947; the issue marks the 23rd
  anniversary of Gökalp's death and carries the date 3 Kasım 1947), archive.org OCR ('ben de de- gilsem'
  normalised). The lawyer is Hâmit Şevket İnce. The sentence is conditional: it implies but does not state
  that Atatürk is not his hero. Kür Şad also mocks officials who strike 'Atatürk poses' on Atatürk Boulevard.
  The vault note's claims (blood nationalism, attacks on 'Peace at home', Nazi sympathies) are about the
  state, not Kemal, and were not checked here.
