summary: >-
  Invokes Atatürk against Erdoğan after the Christchurch remarks: Atatürk sought to make a modern, embracing
  nation and made a promise to Australians.
quote:
  text: >-
    Ataturk sought to transform his country into a modern nation, an embracing nation, and I think these
    comments are at odds with that spirit and the promise that was made to Australians
  language: en
caveat: >-
  Instrumental as much as admiring: Atatürk is used as a standard to rebuke Turkey's president Erdoğan over
  his remarks after the Christchurch attacks (the press conference calls them 'highly offensive' and
  'reckless'). Same day on 2GB (PM Transcripts 42207) Morrison said Erdoğan's comments were 'very much at odds
  with what Ataturk said', and on 28 March (42235) that Erdoğan 'had failed on the promise made by Ataturk to
  the mothers of Anzacs'. Polarity conflicted: he treats Atatürk as a benchmark Erdoğan fails, not as an
  object of study. The 'Johnnies and Mehmets' / 'your sons are now lying in our bosom' text that Anzac
  speakers attribute to Atatürk is itself contested: no 1934 original has been found, it first appears in
  print in 1953 via Interior Minister Şükrü Kaya's recollection, and the 'Johnnies and Mehmets' clause is a
  1978 Australian addition (see [[Johnnies and Mehmets]]). So this is a speaker's view of the Atatürk of the
  Anzac legend, spoken at a commemorative or diplomatic occasion that rewards praise. Cited as: Press
  conference, Canberra, 20 March 2019.
