  note: >-
    Verbatim in transcript 42211 (Morrison press conference, Canberra, 20 Mar 2019), his own words. Polarity
    'conflicted' is wrong: Morrison is not ambivalent about Atatürk, he uses Atatürk as the standard against
    Erdogan's Christchurch remarks. Fix: polarity instrumental, intensity 1 (2 is generous for one sentence),
    neutral wording 'Cites Ataturk's aim of a modern, embracing nation and the promise to Australians as the
    standard Erdogan's remarks fall short of'. The same transcript earlier says 'the promise of Ataturk to the
    mothers of our ANZACs', i.e. he adopts the legend.
