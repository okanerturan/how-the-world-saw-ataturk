summary: >-
  In the headscarf-ban debate presents Atatürk as neither a Muslim-hater nor right-wing, but a founder who
  banned the headscarf to end women's oppression.
quote:
  text: >-
    Das war kein Muslimhasser und das war auch kein Rechter. Der Gründer der Türkei hat das Kopftuch verboten,
    weil es eben genau mit der Unterdrückung der Frau zusammenhängt.
  language: de
caveat: >-
  Argument for the 2019 ban on headscarves in primary schools; Atatürk is invoked as authority, so the record
  is as much instrumental as admiring. The historical claim (a headscarf ban) is the speaker's, not the
  vault's. Speaker line: 'Abgeordneter Ing. Robert Lugar (FPÖ)'. [Translation:] That was no Muslim-hater and
  no right-winger either. The founder of Turkey banned the headscarf precisely because it is bound up with the
  oppression of women.
