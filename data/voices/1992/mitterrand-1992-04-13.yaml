summary: >-
  Places Turkey in the European sphere and names Atatürk the most valiant protagonist of its long effort to
  rejoin progress.
quote:
  text: >-
    Turkey's effort to put itself back in the current of progress, begun in the late eighteenth century, and
    of which Ataturk was, at the start of ours, the most valiant protagonist
  is_translation: true
  language: en
caveat: >-
  QUOTE IS A TRANSLATION (by the census). French original, vie-publique.fr: "l'effort de la Turquie pour se
