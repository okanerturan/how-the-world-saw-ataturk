summary: >-
  Names the Kemalist dogma of one nation in one state as a founding birth defect of modern Turkey, behind the
  Kurdish conflict.
quote:
  text: >-
    Der Dauerkonflikt mit der kurdischen Minderheit ist der deutlichste Ausdruck für einen der schwersten
    Geburtsfehler der modernen Türkei: das kemalistische Dogma, die Fiktion von einer Nation in einem Staat.
  translation: >-
    The permanent conflict with the Kurdish minority is the clearest expression of one of the gravest birth
    defects of modern Turkey: the Kemalist dogma, the fiction of one nation in one state.
