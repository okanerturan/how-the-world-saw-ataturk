summary: >-
  In Ankara, opening the first French state visit since de Gaulle's: 'Never have Kemal Atatürk's words, peace
  at home, peace abroad, been so timely.'
quote:
  text: >-
    Jamais les mots "Paix à l'intérieur, paix à l'extérieur" de Kemal Atatürk n'ont été autant d'actualité.
  translation: Never have the words of Kemal Atatürk, "Peace at home, peace abroad", been so timely.
  language: fr
caveat: >-
  Reply to the Turkish President on the first day of his state visit, Ankara, 13 April 1992, 'vingt-quatre ans
  exactement après la visite du Général de Gaulle'. Its wording ('près de cette ville capitale, que je ne
  connais pas') suggests the arrival ceremony; the site gives only 'Ankara'. Earlier in it he names Atatürk
  among the 'figures de proue' of the land's history (a phrase he credits to the historian René Grousset),
  'depuis les premiers rois Hittites, à Kemal Atatürk en passant par Darius, les Seldjoukides, les Ottomans et
  Soliman'. The toast at Çankaya that evening is a separate record (mitterrand-1992-04-13).
