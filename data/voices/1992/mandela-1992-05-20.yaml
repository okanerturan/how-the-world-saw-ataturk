  note: >-
    The AP text is short and returned in full: 'STOCKHOLM, Sweden (AP) _ South African black leader Nelson
    Mandela said Wednesday he was sorry he had to refuse the Ataturk Prize ... "I was very sorry it was not
    possible for me to accept this award," Mandela said at a news conference. "I have a great deal of respect
    for Ataturk and for the Turkish people themselves." "We are guided by the views of the masses of the
    people and if, on any issue, they take a position, I cannot ignore it."' Verbatim; Wednesday = 20 May
    1992; the $9,500 prize, the ANC giving no reason, human-rights link and Kurdish MPs' praise all match the
    caveat. The 'Single source' warning can be softened: this is the AP text itself, not just a snippet of it,
    though no second outlet (UPI, newspaper) was found. 'President of the ANC' is not in the AP text (it says
    'South African black leader'); role is outside knowledge. Polarity conflicted is a stretch: nothing in the
    AP text criticises Atatürk, so 'admiring' or 'witness' at intensity 1-2 would be closer; the 'conflicted'
    label rests on the refusal, which AP says was linked to human-rights questions and not to Atatürk. Suggest
    polarity 'witness' or keep conflicted with the existing caveat.
