summary: >-
  Honours Atatürk on his 125th birth anniversary as the revolutionary who showed Islam and modernity are
  compatible, an example 'for our own era'.
quote:
  text: >-
    I rise today, May 19, to commemorate the 125th anniversary of the birth of the founder of modern Turkey,
    Mustafa Kemal Ataturk, a post-World War I revolutionary leader who demonstrated that Islam and modernity
    are fully compatible. His example provides instruction and hope for our own era.
  language: en
caveat: >-
  A full commemorative statement (alphabet reform, 'his leadership style', secularism) in the Extensions of
  Remarks; it also quotes Atatürk's own words. Delivered in the period of Lantos's active support for the
  Turkey-US relationship and while he also backed Armenian-genocide recognition, which this statement does not
  mention. Cited as Extensions of Remarks, 19 May 2006, '125th Anniversary of Birth of Kemal Ataturk, Founder
  of Modern Turkey', Congressional Record vol. 152, no. 63, p. E917 (granule CREC-2006-05-19-pt1-PgE917-2).
