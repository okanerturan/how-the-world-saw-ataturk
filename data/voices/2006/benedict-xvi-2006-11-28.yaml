summary: >-
  In the Anıtkabir book, adopts the founder's 'peace at home, peace in the world' as his own wish for a bridge
  between religions.
quote:
  text: >-
    I gladly make my own the words of the founder of the Turkish Republic: I wish 'peace at home, peace in the
    world'
  language: en
mediated_by: AsiaNews and Deutsche Welle reports of the Anıtkabir book entry, 28 Nov 2006
caveat: >-
  Courtesy text on a visit that followed the Regensburg speech controversy. Wording varies between reports:
  AsiaNews 'In this land, meeting place and crossroads of different religions and cultures, hinge between Asia
  and Europe, I gladly make my own the words of the founder of the Turkish Republic'; DW 'I am pleased to
  adopt the words of the founder of the Turkish republic as my own'; Zenit (relayed) says he wrote in English.
  Atatürk is not named, only 'the founder'. Pope Francis (2014) and Pope Leo XIV (2025) signed the same book
  without mentioning Atatürk.
