summary: >-
  A statesman of foresight whose influence reaches to the present; his legacy an inspiration for Turkey's
  development and its ties with the EU.
quote:
  text: >-
    Bu vesile ile Mustafa Kemal Atatürk'e saygılarımızı sunuyoruz. Onun ileri görüşlülüğü ve sahip olduğu
    üstün devlet adamlığı vasıfları günümüze kadar uzanan derin bir etki yaratmış ve özellikle de ülkelerimiz
    arasındaki yakınlaşmaya önemli katkı sağlamıştır. Onun halkına bıraktığı manevi miras sadece Türk halkının
    huzur ve refahının temininde ve gelişmesinde değil, aynı zamanda AB ile ilişkilerin yoğunlaşarak
    ilerlemesine de daimi bir ilham kaynağı olmuştur.
  translation: >-
    On this occasion we pay our respects to Mustafa Kemal Atatürk. His foresight and outstanding qualities as
    a statesman have had a deep influence reaching to the present day and, in particular, have made an
    important contribution to the rapprochement between our countries. The spiritual legacy he left his people
    has been a lasting source of inspiration not only for the peace, prosperity and development of the Turkish
    people but also for the intensifying progress of relations with the EU.
  language: tr
