caveat: >-
  Other Colors: Essays and a Story (Knopf, 2007), the essay 'Andre Gide' (index p. 204; the hat and dress
  passage falls c. pp. 205-209; the printed page of the sentence is not shown by the snippet). The text is
  read only as archive.org full-text snippets of a lending item (othercolorsessay00pamu), so the sentence is
  cut off after 'by all'. Other snippets from the same essay: 'Both Gide and Ataturk see the ugly clothing
  worn by the Turks'; 'But Ataturk believed that Turkish apparel misrepresented the nation'; the Hat Law is
  'in a sense, a way of striking at the heart of shame'; 'Ataturk draws a line between the costume that he
  rejects ...'. His long Istanbul memoir (2005) gives a more hostile mood (the 'staunch disciples of Ataturk
  who dominated the press', 'the prohibitions of the Ataturk era') but a snippet was too short to quote as a
  view of the man. Polarity 'admiring' is the nearest enum for a sympathetic explanation of the reform; it
  rests on a short excerpt, so treat it as provisional until the printed essay is read. Snippet-only fragment,
  cut mid-sentence; page unknown (lending copy).
