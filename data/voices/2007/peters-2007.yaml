  language: en
caveat: >-
  Not a prime minister at the time (Foreign Minister, delivering the government's address). A near-identical
  passage appears in Nathan Guy's 2012 Gallipoli speech, i.e. the ministry's stock text. The 'Johnnies and
  Mehmets' / 'your sons are now lying in our bosom' text that Anzac speakers attribute to Atatürk is itself
  contested: no 1934 original has been found, it first appears in print in 1953 via Interior Minister Şükrü
  Kaya's recollection, and the 'Johnnies and Mehmets' clause is a 1978 Australian addition (see [[Johnnies and
  Mehmets]]). So this is a speaker's view of the Atatürk of the Anzac legend, spoken at a commemorative or
  diplomatic occasion that rewards praise. Cited as: Anzac Day Dawn Service address, Gallipoli, 25 April 2007.
node: Anzac Day Leaders on Atatürk, 1990–2024 — Australian and New Zealand Speeches
