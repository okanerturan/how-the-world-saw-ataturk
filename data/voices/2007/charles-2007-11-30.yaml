caveat: >-
  Not yet a head of state in 2007. Two Turkish renderings of the English entry differ (İHA as quoted;
  Milliyet: 'Mustafa Kemal'in mezarında ona saygılarımı sunmaktan mutluluk duyuyorum'); the English original
  is not located. No evaluation of Atatürk beyond the courtesy line. Date from Turkish Wikipedia's visitor
  list; the press pieces carry no day. English original seen only as a LondonNet snippet (cut after 'Turkey
  and Great Britain will continue to'); İHA and Milliyet give two different Turkish renderings. Date 30 Nov is
  probable (departure day); a Getty caption says 28 Nov.
