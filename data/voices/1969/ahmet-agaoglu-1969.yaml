voice: Ahmet Ağaoğlu
voice_type: person
role: Liberal deputy and publicist, co-founder of the Free Republican Party (1930)
country: Turkey
country_now: Turkey
domain: politics
date: "1969"
era: posthumous
polarity: conflicted
intensity: 2
artifact: memoir
evidence: S
summary: >-
  Recalls telling the Gazi at his Yalova table in 1930 that a pre-arranged opposition party was too
  artificial; Kemal grew angry, then laughed.
quote:
  text: >-
    Gazi'ye karşı takınılmasını daima bir namus ve şeref borcu, bir Vatan ve Türklüğün icabı olarak kabul
    etmiş olduğum doğruluktan ve açıklıktan bu kerre de ayrılmadım. "Bu biraz fazla sunidir!.." dedim
  language: tr
mediated_by: >-
  Soyak, Atatürk'ten Hatıralar (1973), vol. 2, pp. 416-417 ← Ağaoğlu, Serbest Fırka Hatıraları, pp. 4, 10
caveat: >-
  TRANSLATION (this record's): 'I did not depart this time either from the honesty and frankness that I had
  always held, towards the Gazi, to be a debt of honour and a duty to the Fatherland and Turkishness. I said:
  "This is a bit too artificial!"' Event: Yalova, August 1930, after Fethi's and Kemal's letters were read.
  DATE: Soyak calls the memoir 'kısmen neşredilen'; its first edition year 1969 is tier M (not verified);
  Ağaoğlu died 1939, so it was written 1930-39. Through Fethi he reports Kemal wanted 'biraz hürriyet havası'
  but a party that would be a wing of the RPP. Soyak is a Kemal loyalist and adds his own notes. Read from
  archive.org OCR; quotation marks normalised and the line-break 'suni- dir' joined. Check: a 1969 Baha
  Matbaası edition is cited, but an undated Nebioğlu edition also exists; 1969 may not be the first edition.
node: Turkish Writers and Contemporaries on Kemal — Round 33
