  note: >-
    Quote verbatim (OCR 'suni- dir' joined; quotation marks normalised). Soyak calls it 'kısmen neşredilen
    hatıratında'. İsmet Paşa reads the letters at Kemal's Yalova table; 'Bu cevap üzerine Atatürk
    sinirlenmiş'; p. 417 'Gazi kahkaha ile güldü'; Fethi passage 'biraz hürriyet havasının esmesini ...
    Cumhuriyet Halk Fırkası'nın bir cenahı olacaktır'. All present. Translation faithful. DATE: FTS shows a
    YÖK thesis citing 'Serbest Fırka Hatıraları, Baha Matbaası, İstanbul, 1969, s. 4', so a 1969 edition
    exists (J-tier). But another book cites a 'Nebioğlu Yayınevi, İstanbul, ta[rihsiz]' edition, and Avşar
