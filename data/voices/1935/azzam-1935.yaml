evidence: S
summary: >-
  In a serial against 'the Kemalists', says Muslims counted the Ghazi their undisputed hero, yet he led the
  Kemalists' break with Islam.
quote:
  text: >-
    وكان أشدهم إفراطاً في ذلك الغازي مصطفى كمال باشا الذي كان المسلمون جميعهم يعدونه بطل أبطالهم غير مدافع.
  translation: >-
    The most extreme of them in that was the Ghazi Mustafa Kemal Pasha, whom all Muslims used to count the
    hero of their heroes, beyond dispute.
  language: ar
caveat: >-
  Cited as al-Risala no. 104, 1 Jul 1935, Wikisource page 'مجلة الرسالة/العدد 104/النهضة التركية الأخيرة'.
  Part of the series 'The Latest Turkish Revival' by Dr Abd al-Wahhab Azzam in al-Risala nos. 101 (10 Jun
  1935), 104 (1 Jul), 108 (29 Jul) and 111 (19 Aug, by another hand on music); the quote is from no. 104. In
  no. 101 he writes that abolishing the caliphate 'was not a necessity required by reform, but an excess the
  revolution led to'; in no. 108 he faults the Kemalists' policy on women and tells of an Egyptian women's
  delegate who called the Ghazi 'Atashark'. Mostly he blames 'the Kemalists' collectively; the Ghazi is named
  for the Qur'an anecdote and as the leader in rejecting Islam. Wikisource transcription; no page image
  linked.
node: Egyptian Pens in al-Risala on Atatürk, 1935–1946
