summary: >-
  Counts Kemal among the contemporary 'national revolutions' of astonishing success beside Mussolini, Hitler
  and Stalin, in contrast with Spain.
quote:
  text: >-
    En nuestra época, es decir, en nuestros mismos días, las revoluciones nacionales se desarrollan también
    con éxito pasmoso. Véanse estos nombres que las representan: Mussolini, Kemal, Hitler y -¿por qué no?-
    Stalin.
  translation: >-
    In our age, that is, in our very days, national revolutions also develop with astonishing success. See
    these names that represent them: Mussolini, Kemal, Hitler and - why not? - Stalin.
  language: es
caveat: >-
  ¿Fascismo en España? by 'Roberto Lanzas' (Madrid, preface dated November 1935), a pseudonym of Ledesma Ramos
  per the archive.org item title and the text's own account of La Conquista del Estado; p. 12 by the OCR's
  footer sequence (chapter on the national revolution and the right). The same sentence appears in the 1942
  Breviarios del Pensamiento Español anthology of Ledesma. A single listing, but it places Kemal in the
  pantheon of successful nationalist revolutions. An earlier piece in La Conquista del Estado no. 23 (24
  October 1931, author not shown) speaks of 'la victoria presente del Gasi' and how 'Mustafá Kemal supo
  uncirse a la lejanía'; not recorded as Ledesma's.
node: Latin Pens on Mustafa Kemal — Ortega Munilla, Ortega y Gasset, Gramsci and Ledesma Ramos
