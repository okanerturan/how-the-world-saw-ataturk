summary: >-
  Told Nasik caste-Hindu reformers India needed a dictator like Kemal Pasha, who made Turkey powerful and
  reformed Muslim practice; no salvation without such a leader.
quote:
  text: >-
    I feel the greatest respect for Kemal Pasha, it is he that has made Turkey into a powerful nation.
  language: en
