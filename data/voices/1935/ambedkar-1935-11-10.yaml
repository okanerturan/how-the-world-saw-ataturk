caveat: >-
  Reported speech from a three-hour interview at his residence on 10 Nov 1935, after the Yeola conversion
  speech; also 'India wants a dictator, a Kemal Pasha or a Mussolini.' The vault card's claim that he cited
  Turkey in the Hindu Code Bill debates is not borne out (BAWS vol. 14's two Turkey mentions are other
  members).
