  note: >-
    Arabic quote verbatim, including the gap 'الـ. . (أتاتورك)'. Header date 20-05-1935; byline empty in
    template but 'للأستاذ علي الطنطاوي' and signature 'علي الطنطاوي / مكة المكرمة'. Only one mention of
    Atatürk in the piece, a scathing one aimed at 'الجمهورية التركية' as well. Nuance to add to the caveat:
    the grammatical subject of 'وشعروا أن أيا صوفيا قد ختمت ...' is 'المشركون' ('وعز فيها المشركون، وشعروا
    ...'), i.e. Tantawi says the idolaters felt the page of Islam closed in this man's name, with the epithet
    dropped as contempt; the English 'And they felt' leaves 'they' unidentified. Also 'an epithet left out or
    lost' is a guess; the dots are in the source, cause unknown. Hostile / 1 fair; the claim 'Syrian writer
    ... from Mecca' rests on the signature only. Schema OK.
