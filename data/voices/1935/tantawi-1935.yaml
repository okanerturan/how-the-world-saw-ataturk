voice: Ali al-Tantawi
voice_type: person
role: Syrian writer and jurist (writing from Mecca)
country: Syria
country_now: Syria
domain: letters
date: "1935-05-20"
era: contemporary
polarity: hostile
intensity: 1
mirror: apostate
artifact: article
evidence: S
summary: >-
  On Hagia Sophia: the page of Islam was closed there 'in the name of this ... Atatürk', as it opened in
  Muhammad the Conqueror's name.
quote:
  text: >-
    وشعروا أن أيا صوفيا قد ختمت فيها صفحة الإسلام، باسم هذا الـ. . (أتاتورك) كما فتحت باسم (محمد الفاتح)!
  translation: >-
    And they felt that in Hagia Sophia the page of Islam had been closed, in the name of this ... (Atatürk),
    as it was opened in the name of (Muhammad the Conqueror)!
  language: ar
caveat: >-
  Cited as al-Risala no. 98, 20 May 1935, Wikisource page 'مجلة الرسالة/العدد 98/أيا صوفيا'. Piece 'Aya Sufya'
  signed Ali al-Tantawi, Mecca; the gap '. .' before '(Atatürk)' is in the transcription (an epithet left out
  or lost). Same issue family as Amjad al-Tarabulsi's ode of no. 109, which is a separate record. Wikisource
  transcription. Check: the subject of 'وشعروا' is 'المشركون': the idolaters felt the page of Islam closed in
  this man's name (not a lost epithet).
node: Egyptian Pens in al-Risala on Atatürk, 1935–1946
