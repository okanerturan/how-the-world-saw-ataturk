summary: >-
  Rebukes Atatürk by name over Hagia Sophia: casting off the Arabs was ugly, casting off the faith uglier, and
  the West will devour him.
quote:
  text: لئِنْ كان قُبحاً نَبْذكَ العُرْبَ جانباً ... فَنَبْذُك للدينِ المقَدَّسُ أقبح
  language: ar
caveat: >-
  TRANSLATION (this record's): 'If your casting the Arabs aside was ugly, your casting aside the sacred faith
  is uglier.' Poem 'Ayasufya' (Hagia Sophia), a long qasida opening with an epigraph by Hafiz Ibrahim
  ('Ayasofya, the hour of parting has come'), printed in al-Risala (Cairo) no. 109, 5 Aug 1935, text from the
  Arabic Wikisource transcription of the issue; page number not given there. Atatürk is addressed twice by
  name ('Atatürk, do not let your command deceive you'; 'Atatürk, beware a leap from the sons of the West')
  and the second half of the poem is aimed at him, so he is the addressee, though the occasion is the
  church-mosque. Closes: 'Beware the West ... their peace is an armed peace.' The author is identified only by
  the signature 'Amjad al-Tarabulsi, Damascus'; his dates were not established.
node: Four Poems on Atatürk — Melbourne, Damascus, Cairo and Hyderabad, 1933–1939
