summary: >-
  Addresses the great Ghazi Atatürk: praises him for reviving the Sick Man, then says he wronged Turkey's
  history against nature and logic.
quote:
  text: ولكنك ظلمت تاريخك الخاص بمخالفة الطبيعة في التجديد، ومجانبة المنطق في الاصلاح.
  translation: >-
    But you wronged your own history by going against nature in renewal and shunning logic in reform.
  language: ar
caveat: >-
  Cited as al-Risala no. 88, 11 Mar 1935, Wikisource page 'مجلة الرسالة/العدد 88/إلى أين يساق الأتراك؟'.
  Editorial 'Where Are the Turks Being Driven?', signed Ahmad Hasan al-Zayyat, addressed to Atatürk in the
  second person. Just before the quote: 'You mended the broken wing and revived the Sick Man ... your name is
  the title of its modern history'. Just after: he fears history will record that Atatürk 'revived a state and
  killed a nation, built a constitution and demolished a creed'. Distinct from al-Zayyat's 14 Nov 1938
  obituary editorial already in the dataset. Wikisource transcription; no page image linked.
