summary: >-
  At the Istanbul women's congress she tells Atatürk that 'Father of the Turks' is not enough: for the East he
  is 'Atasharq'.
quote:
  text: فأنا أقول إن هذا لا يكفي بل أنت بالنسبة لنا أتاشرق
  language: ar
mediated_by: Muqaddam, 'Awdat al-hijab (Islamist critique) quoting Sha'arawi's memoirs
caveat: >-
  TRANSLATION (this record's): 'I say that this is not enough: for us you are Atasharq [Father of the East].'
  Arabic as quoted from her memoirs (Mudhakkirat) by Muhammad Ahmad Isma'il al-Muqaddam, 'Awdat al-hijab,
  section on Huda Sha'arawi (archive.org 06.0_20210520_20210520_1158; OCR, hamza missing in 'anta'), who cites
  her memoirs and a Hawwa' article of 1980; he quotes her to condemn her. Not seen in the memoir itself (the
  Arabic Mudhakkirat Huda Sha'rawi, Dar al-Hilal 1981, is not open). Independent corroboration of the saying:
  Libal, 'Staging Turkish Women's Emancipation: Istanbul, 1935', JMEWS 4(1), 2008, n. 13 ('reportedly asserted
  ... Father of the East (Atasark)'). Her speech was in Turkish, without interpreter, at the reception given
  by Atatürk for the delegates of the 12th IAW congress. Check: the Arabic is verbatim as quoted from her
  memoirs by a hostile critic (al-Muqaddam); the memoir itself not seen.
node: Poets, Reformers and the Black Press on Atatürk, 1921–1935
