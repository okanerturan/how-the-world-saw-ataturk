verification:
  verdict: confirmed
  quote_found: true
  checked_against: >-
    archive.org istiklal-marsi-ve-mehmet-akif-ersoy (TBMM 2021, İstiklâl Marşı ve Mehmet Âkif Ersoy:
    Belgeler), djvu text; contents: doc. 8.3 'İstanbul Valiliğinin ... Dâhiliye Vekiline gönderdiği cevabi
    yazı' from p. 84; extract '117 nin 6/ Eylül/935 tarih ve 5 Noslı raporunda'
  method: archive.org open djvu text read
  note: >-
    Quote verbatim (OCR 'Rauf be- yi', 'mevki- ini' joined): 'Şair Akif, Türkiye ricalinden de yeğân yeğân
    bahsederek Atatürk hakkında demişdir ki ( Rauf bey Türkiyeye avdet eylemiş, Fakat ... bir mevki ihraz
    edemez. Zira Gazi paşa Rauf beyi çekemez. Çünki Gazi paşa def'atla hayatını, şerefini ve mevkiini Rauf
    beye medyundur ... Rauf beyi mahva çalışmıştır'. The same report says he left Antakya on 31 Aug 1935 after
    a telegram; the 28 Aug 1935 report no. 3 says he had been there three weeks. Fair to attribute only as an
    informant's hearsay, and the record says so (mediated_by, caveat, 'Reportedly'). The report is hostile to
    him ('boş boğazlığile', 'zehirler saçmıştır'), so weigh it that way. Correction: what_they_saw 'told
    Antakya notables' → 'said in Antakya'. The report ties his general talk to banquets with the eşraf but
    does not say who heard this remark. Hostile is supported by the reported words; intensity 1 is right. Doc
    8.3 is the governor's reply written in mid-1936 (8.2, the minister's request, is dated 26/6/936) quoting
    the 1935 reports, so the chain in mediated_by is correct. Schema ok.
  resolution: corrected 2026-11-06 — see LEDGER § Source-check corrections (round 33)
