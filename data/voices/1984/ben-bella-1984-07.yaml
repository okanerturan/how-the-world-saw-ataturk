summary: >-
  Calls Mustafa Kemal extraordinary for defying the Greeks and Western powers and admires him, but says
  treating Turks as Western was a vital mistake.
quote:
  text: >-
    Türkleri Batılı sayması, çok hayati bir hataydı. Fakat bu bir yana, benim kendisine büyük hayranlığım var.
  translation: >-
    His counting the Turks as Western was a very vital mistake. But that aside, I have great admiration for
    him.
  language: tr
mediated_by: >-
  Cumhuriyet, 16 Jul 1984 p. 8, series 'Ben Bella anlatıyor' (Geneva interview, printed in Turkish translation)
caveat: >-
  Q&A interview printed in the newspaper (the 15 July instalment is bylined Cengiz Çandar), read in the
  Cumhuriyet e-archive OCR text of the page (OCR slips corrected: 'hayranhğım'). He also says Mustafa Kemal
  became 'olağanüstü bir insan' by resisting the Greeks and the Western powers behind them when Turkey was to
  be wiped off the map, that he admires his military personality, and, after 'Ancak' (however), that they do
  not share his later remedies (OCR 'getirdiği çarelerle ayru fikirde değiliz', read as 'aynı fikirde
  değiliz'). Says Algerian activists studied Kemal in the 1930s-40s.
