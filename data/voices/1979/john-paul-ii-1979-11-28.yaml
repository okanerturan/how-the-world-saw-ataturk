mediated_by: Milliyet, 29 Nov 1979, p. 12, as reproduced in Belenli & Birbudak 2021 (Belgi 22), p. 598
caveat: >-
  The quote is the French original reconstructed from the Vatican's Spanish text (vatican.va
  libro-oro-ataturk, 28 Nov 1979); the vault has seen only the Spanish ('El gobierno de los pueblos está en
  las manos del Señor. Él suscita en el momento oportuno los jefes que les conviene...') and the Turkish of
  Belenli & Birbudak, so the French is a back-translation: treat the quote as a translation of the entry.
  Turkish press (Milliyet 30 Nov 1979 p. 10) separately reports his words to President Korutürk that bowing at
  Anıtkabir 'before the saviour of Turkey and founder of its democratic republic' he was the first pope to do
  so, and that 'admiration for Atatürk and the Turkish State' rests on its treatment of minorities (Turkish
  text; the same sentences printed in Belenli & Birbudak 2021). The entry does not name Atatürk. Check: the
  book entry itself does not name Atatürk; the quote is his spoken remark to Korutürk (Turkish of the press
  report: 'these facts lie at the basis of my admiration for Atatürk and the Turkish State').
