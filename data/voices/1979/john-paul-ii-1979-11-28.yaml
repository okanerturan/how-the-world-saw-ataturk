  note: >-
    The guestbook entry is real ('El gobierno de los pueblos esta en las manos del Senor. El suscita en el
    momento oportuno los jefes que les conviene, porque el amor a la libertad y el respeto del derecho hacen
    grande a una nacion, pero es Dios quien garantiza el porvenir'), but it does not name Ataturk and says
    nothing about him: it fails the strict gaze test, and the record's quote is Spanish with an ellipsis-free
    truncation and an added accent. The Pope's real gaze is the spoken remark to President Korutürk reproduced
    by Belenli & Birbudak 2021 (printed p. 598): 'Ataturk'e ve Turk Devleti'ne hayranligimin temelinde bu
    gercekler yatmaktadir' (admiration grounded in the Turkish state's equal treatment of minorities), plus
    'Anitkabir'de Turkiye'nin kurtaricisi ve demokratik cumhuriyetinin kurucusu onunde saygiyla egilen ilk
    Papa'. That article cites Milliyet 29 Nov 1979 p. 12 ('Papa Ankara'da torenle karsilandi'), NOT 30 Nov p.
    10 as recorded; reception at the Presidency was 28/29 Nov. FIX: replace the quote with the Turkish
    sentence (translation, secondary: artifact visit/speech, evidence J, mediated_by the article <- Milliyet
    29 Nov 1979 p. 12, original Italian/French not seen); keep the guestbook entry only as caveat. As written:
    not a valid quote for a gaze.
