summary: >-
  Tells President Korutürk that his admiration for Atatürk and the Turkish state rests on its equal treatment
  of minorities.
quote:
  text: Atatürk'e ve Türk Devleti'ne hayranlığımın temelinde bu gerçekler yatmaktadır
  is_translation: true
