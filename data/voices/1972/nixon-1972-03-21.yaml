summary: >-
  Calls 'peace at home and peace in the world' the motto of 'your great leader Ataturk' and adopts it as an
  American goal.
quote:
  text: >-
    the motto which came from your great leader Ataturk, "Peace at home and peace in the world," is one that
    we in the United States can also say is our goal.
  language: en
caveat: >-
  Passing borrowing of the motto at an arrival ceremony; Nixon states no wider judgement. In the evening toast
  (https://presidency.ucsb.edu/documents/toasts-the-president-and-prime-minister-erim-turkey) it is Erim who
  speaks of 'the legacy of Kernel [sic] Ataturk'; Nixon there only repeats the motto.
