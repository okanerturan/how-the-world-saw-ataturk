  method: archive.org open djvu text read
  note: >-
    As described: 'long and admirably phrased speech', 'honourable enemies and were now honourable friends',
    'over half an hour's discourse', 'somewhat platitudinous generalities' but 'the sincerely friendly tone of
    the Ghazi's references to England', and the 'lying papers' remark to the French military attaché Sarrou.
    The F.O. 424/268 reference printed nearby belongs to the preceding document (No. 6); the reference for No.
    7 was not read. A minor figure, but he states a judgement (eloquent, platitudinous, sincerely friendly),
    so it is a borderline pass as witness.
