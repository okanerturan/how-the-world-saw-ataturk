caveat: >-
  OCR is poor, so no verbatim quote. Clerk notes the speech was 'admirably phrased' but 'somewhat
  platitudinous generalities', and that Kemal told the French attaché to have his 'lying papers' report he was
  not dying. Clerk's funeral-era view is already in data.
