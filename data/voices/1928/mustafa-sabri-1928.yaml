summary: >-
  Calls Kemal a rebel against Sultan Vahideddin and judges his separation of state from religion to be
  irreligion.
quote:
  text: Merhum Sultan Vahidüddin'e ve hükümetine Anadolu'da Mustafa Kemal asi geldiği zaman
  language: tr
mediated_by: Albayrak 1992 ← Yarın, no. 23, 23 Jun 1928, pp. 2-4
caveat: >-
  Article 'Sıyrılan İkinci Maske (Abdülmecid Komedisi)', aimed at the Cairo paper Müsavat and at Abdülmecid
  II; the print's citation 'Yarı[n], sayı: 23, 23 Haziran 1928, sh: 2-4' closes it. The sentence runs on: 'it
  is unnecessary to repeat here how far Abdülmecid secretly and openly backed this rebellion'. Quoted in
  Bardakçı's Şahbaba (p. 276 in the 1998 edition, with 'âsi'), via Albayrak. In the same article Sabri writes
  that Kemal's act, 'dinden devleti ayırması', is 'dinsizlik' (irreligion) while a religionless government can
  be imagined outside Islam but a religionless caliphate cannot (OCR slightly garbled, so paraphrased). Pages
  172-173 of the 1992 print. Sabri's own judgment; the vault does not endorse it.
node: Sabri Efendi and Mehmed Âkif on Mustafa Kemal, 1924–1935
