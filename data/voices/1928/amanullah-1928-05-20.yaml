    archived: https://web.archive.org/web/20240707111252/https://ataturkilkeleri.deu.edu.tr/ai/uploaded_files/file/yeni%20dergi%2016-17/ismail%20akkas%202.pdf
verification:
  verdict: confirmed
  quote_found: true
  checked_against: >-
    Akbaş, 'Afgan Kralı Emanullah Han'ın Türkiye Gezisi', ÇTTAD VII/16-17 (2008), p. 319, fn 33 (Sarıhan p.
    35; Hizmet 22 May 1928 p. 1); banquet dated 20 May 1928 evening (section 2.1.2)
  method: >-
    tools/ms free fetch of the open PDF at ataturkilkeleri.deu.edu.tr; located passage and page break
  note: >-
    Verbatim: 'Sizi bunun yegâne amili bildiğim cihetle Zatı biraderinize karşı büyük bir hissi muhabbet ve
    halel-i napezir bir imtina duymaktayım.' Page 319 as cited, the toast follows Atatürk's speech and
    Amanullah's reply is introduced as 'Emanullah Han da ... şöyle dile getirdi'. Printed 'imtina' as in the
    article (likely 'imtinan'). The Turkish is the translation printed in the press (speech was translated
    into French for the press per the article), not Amanullah's own language. The Şimşir page (I p. 33-34) is
    cited for the preceding paragraphs only; this paragraph rests on Sarıhan p. 35 and Hizmet, as the record
    says.
