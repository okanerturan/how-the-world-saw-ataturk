  method: fetched djvu text and Turkish original, compared line by line; tools/ms search
  note: >-
    French text verbatim. But it is a posthumous translation (Haşim died June 1933) of the essay 'Gazî' in
    Haşim's Bize Göre; the Turkish original title and text say 'Gazi', so 'Atatürk' (heading and text) is the
    review's insertion. Original is about the first Dolmabahçe meeting on the new letters (Aug 1928 by
    history, not stated in the text; Bize Göre is a 1928 book, first-edition date not seen). The French
    loosens 'Altı yüz senelik bir devri' (an era of six hundred years) into 'une ère longue de siècles'.
    Correction: date the utterance ~1928 (era contemporary either way), keep La Turquie kémaliste no. 10, Dec
    1935 as the mediation, and quote the Turkish original with the French as the 1935 translation; do not
    credit 'Atatürk' to Haşim.
