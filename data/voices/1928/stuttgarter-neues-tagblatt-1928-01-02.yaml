summary: >-
  Year-end report from Constantinople: German–Turkish business grew, but Kemal failed to congratulate
  Hindenburg on his birthday, though fond of statues of himself.
quote:
  text: >-
    Ein Mann wie Kemal Pascha durfte den Glückwunsch zu Hindenburgs Geburtstag einfach nicht übersehen, zumal
    er selber sehr auf die Ehrung seiner Person hält, wie die Duldung der in diesem Jahre wie Pilze aus dem
    Boden geschossenen Kemaldenkmäler jedermann deutlich beweist.
  language: de
  translation: >-
    A man like Kemal Pasha should simply not have neglected the congratulations on Hindenburg's birthday,
    especially as he himself sets great store by honours to his own person, as the tolerance of the Kemal
    monuments that have shot up like mushrooms this year plainly shows everyone.
  translated_by: "machine: claude-opus-5-5"
caveat: >-
  'Das Jahr 1927 in der Türkei', from the paper's Constantinople correspondent ('d. Konstantinopel, Ende
  Dezember 1927'), front page of the evening edition, 2 Jan 1928. The complaint closes a review that notes
  some 500 km of railway opened in 1927 and power stations and factories 'fast ausschließlich in deutschen
  Händen'. It calls the lapse one of 'internationale Höflichkeit' in a young state, and ends by congratulating
  the Turkish people 'von Herzen' on their successes in peaceful reconstruction.
node: A Stuttgart Daily on Kemal and Hindenburg, January 1928
