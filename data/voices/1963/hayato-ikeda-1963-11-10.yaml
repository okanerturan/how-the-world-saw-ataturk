date: "1963-11-10"
era: posthumous
polarity: admiring
intensity: 1
artifact: quote
evidence: J
summary: >-
  The 'great' and 'famous leader of the Turkish nation', for whom he expresses deep admiration.
quote:
  text: >-
    Büyük Kemal Atatürk'ün vefatının 25. yıldönümü münasebeti ile Türk Milletinin ünlü liderine duyduğum derin
    hayranlığı belirtmek ister ve Japon hükûmeti ve milletinin, Türk milletinin saadet ve refahı için
    beslediği en hâlishane dilekleri Türk Milleti ve Hükûmetine ulaştırmanızı istirham ederim.
  translation: >-
    On the 25th anniversary of the death of the great Kemal Atatürk I wish to express the deep admiration I
    feel for the famous leader of the Turkish nation, and ask you to convey to the Turkish nation and
    government the sincerest wishes of the Japanese government and people for the happiness and prosperity of
    the Turkish nation.
  is_translation: true
  language: tr
mediated_by: >-
  Milliyet, 10 Nov 1963, p. 7 (column of leaders' messages under 'Atatürk'ü anıyoruz'): the paper's Turkish
  rendering of a message for the 25th anniversary of Atatürk's death
caveat: >-
  Close to a protocol message; kept because it states admiration for the man. One of ten leaders' messages
  Milliyet printed on 10 Nov 1963 for the 25th anniversary (seven on p. 1, three on p. 7). Kennedy's
  (kennedy-1963-11) was a recorded message requested by the Turkish government, so the others were probably
  solicited the same way. Original-language text not seen. Read on the page image (Milliyet's subscriber
  archive).
