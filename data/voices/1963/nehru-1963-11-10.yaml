summary: >-
  'The hero of my youth': Nehru celebrated his Anatolian victory in prison, and remains 'among his greatest
  admirers'.
quote:
  text: >-
    Kemal Atatürk veya, bizim O'nu o zamanlar tanıdığımız adıyla Kemal Paşa, gençlik günlerimde, benim
    kahramanımdı. Biz o tarihlerde kendi bağımsızlık hareketimizle son derece meşguldük ve ben, diğer birçok
    kimselerle birlikte hapishane hayatıma başlamıştım. Kemal Paşa'nın Türkiye'yi yabancı hâkimiyet ve
    nüfuzundan kurtarmak yolundaki faaliyetleri ve mücadelesi ile ilgili haberleri hapishanede dahi büyük bir
    alâka ve heyecanla takip etmekte idik. Anadolu'da Yunanlılara karşı kazanılan büyük zaferin haberi
    hapishanede bize geldiği zaman bundan ne büyük bir memnuniyet duyduğumuzu ve bunu hapishanede dahi nasıl
    kutladığımızı çok iyi hatırlıyorum. […] O'nun dinamizmi, yılmak ve yorulmak bizmezliği insanda büyük bir
    tesir yaratıyordu... O, Doğuda modern çağın yapıcılarından biridir. O'nun en büyük hayranları arasında
    bulunmakta devam ediyorum.
  translation: >-
    Kemal Atatürk — or Kemal Pasha, as we knew him then — was my hero in the days of my youth. We were then
    deeply engaged in our own independence movement, and I, with many others, had begun my prison life. Even
    in prison we followed with great interest and excitement the news of Kemal Pasha's activities and struggle
    to free Turkey from foreign domination and influence. I remember very well how glad we were, and how we
    celebrated even in prison, when the news of the great victory over the Greeks in Anatolia reached us. […]
    His dynamism, his refusal to flag or tire, made a great impression... He is one of the builders of the
    modern age in the East. I remain among his greatest admirers.
  is_translation: true
  language: tr
mediated_by: >-
  Milliyet, 10 Nov 1963, p. 1 ('Bütün dünya anıyor…') with continuation on p. 7: the paper's Turkish rendering
  of a message for the 25th anniversary of Atatürk's death
caveat: >-
  Contrast his 1934 Glimpses of World History verdict (nehru-1934: 'the appetite for power of a dictator
  always grows with its use'). The omitted middle says the revolutions were hard to judge one by one from
  India but he 'greeted Atatürk's general effort to modernise Turkey with great appreciation'. 'bizmezliği' is
  the page's misprint for 'bilmezliği'. One of ten leaders' messages Milliyet printed on 10 Nov 1963 for the
  25th anniversary (seven on p. 1, three on p. 7). Kennedy's (kennedy-1963-11) was a recorded message
  requested by the Turkish government, so the others were probably solicited the same way. Original-language
  text not seen. Read on the page image (Milliyet's subscriber archive).
