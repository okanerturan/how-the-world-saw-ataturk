caveat: >-
  One of ten leaders' messages Milliyet printed on 10 Nov 1963 for the 25th anniversary (seven on p. 1, three
  on p. 7). Kennedy's (kennedy-1963-11) was a recorded message requested by the Turkish government, so the
  others were probably solicited the same way. Original-language text not seen. Read on the page image
  (Milliyet's subscriber archive).
