summary: >-
  One of the greatest men of all ages: a military genius, loved by Muslims everywhere, who set Turkey back on
  the road to greatness.
quote:
  text: >-
    Kemal Atatürk, yalnız bu asrın en büyük adamlarından biri değildir. Biz Pakistan'da O'nu, gelmiş geçmiş
    bütün çağların en büyük adamlarından biri olarak görüyoruz. Askeri bir dehâ, doğuştan bir lider ve büyük
    bir vatanperver olan Kemal Atatürk, memleketinizi yeniden büyüklük yoluna koydu. O, yalnız sizin
    milletinizin sevgili lideri değildi. Dünyadaki bütün Müslümanlar gözlerini sevgi ve hayranlık hisleriyle
    O'na çevirmişlerdi. O, Müslüman dünyasında yeniden siyasi uyanış istikametinde ileriye doğru cesur bir
    adım atan bir avuç insandan biriydi.
  translation: >-
    Kemal Atatürk is not only one of the greatest men of this century. We in Pakistan see him as one of the
    greatest men of all ages. A military genius, a born leader and a great patriot, Kemal Atatürk set your
    country once more on the road to greatness. He was not the beloved leader of your nation alone: all the
    Muslims of the world turned their eyes to him with love and admiration. He was one of the handful of men
    who took a bold step forward towards a new political awakening in the Muslim world.
  is_translation: true
  language: tr
mediated_by: >-
  Milliyet, 10 Nov 1963, p. 1 ('Bütün dünya anıyor…') with continuation on p. 7: the paper's Turkish rendering
