summary: >-
  Not only the symbol of new Turkey but one of the most remarkable personalities of the age; Turkey still
  follows in his footsteps.
quote:
  text: >-
    Kemal Atatürk sadece yeni Türkiye'nin sembolü değil, aynı zamanda çağımızın en dikkate şayan
    şahsiyetlerinden biridir. Faal, kuvvetli ve hür Avrupa'nın diğer ülkeleri ile işbirliğine sağlam şekilde
    bağlı olan bugünkü Türkiye hâlen onun izinden gitmektedir.
  translation: >-
    Kemal Atatürk is not only the symbol of the new Turkey but also one of the most remarkable personalities
    of our age. Today's Turkey, firmly committed to cooperation with the other countries of an active, strong
    and free Europe, still follows in his footsteps.
