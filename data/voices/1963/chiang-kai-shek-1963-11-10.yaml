summary: >-
  The great Turkish leader who won his nation freedom and democracy; his life and work an inspiration for all
  free nations.
quote:
  text: >-
    Türkiye Cumhutiyetinin kurucusu Mustafa Kemal Atatürk'ün ölümünün 25 inci yıldönümü münasebetiyle,
    memleketim ve milletim adına, milletini hürriyet ve demokrasiye kavuşturmak uğrunda mücadele ederek başarı
    kazanan büyük Türk önderi hakkındaki engin duygularımı ve hayranlığımı iletmek isterim, Atatürk'ün hayatı
    ve eseri sadece Türkiye için değil fakat dünyanın bütün hür milletleri için bir ilham kaynağı olmakta
    devam edecektir.
  translation: >-
    On the 25th anniversary of the death of Mustafa Kemal Atatürk, founder of the Turkish Republic, I wish to
    convey on behalf of my country and nation my deep feelings and admiration for the great Turkish leader who
    succeeded in his struggle to bring his nation freedom and democracy. Atatürk's life and work will continue
    to be a source of inspiration not only for Turkey but for all the free nations of the world.
  is_translation: true
  language: tr
mediated_by: >-
  Milliyet, 10 Nov 1963, p. 7 (column of leaders' messages under 'Atatürk'ü anıyoruz'): the paper's Turkish
  rendering of a message for the 25th anniversary of Atatürk's death
caveat: >-
  The census also holds his 1940 diary/speech record (chiang-kai-shek-1940-10). Printed under 'Çin
  Cumhurbaşkanı Çan-Kay-Şek'. 'Cumhutiyetinin' is the page's misprint for 'Cumhuriyetinin'. One of ten
  leaders' messages Milliyet printed on 10 Nov 1963 for the 25th anniversary (seven on p. 1, three on p. 7).
  Kennedy's (kennedy-1963-11) was a recorded message requested by the Turkish government, so the others were
  probably solicited the same way. Original-language text not seen. Read on the page image (Milliyet's
  subscriber archive).
