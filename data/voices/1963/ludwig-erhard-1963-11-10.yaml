summary: >-
  The soldier who won a seemingly hopeless struggle; the Republic was the work of his 'diplomatic genius', and
  he sought close ties with Europe.
quote:
  text: >-
    Bütün dünya 10 Kasımda, biz Almanların da dostluk ve saygı ile bağlı olduğumuz bir insanın, hayatını ve
    eserlerini takdirle anmaktadır... Atatürk bir asker olarak, amansız ve hattâ bâzı anlarında ümitsiz
    gözüken bir mücadeleden muzaffer çıkmış ve sonra da devlet sorumluluğunu üzerine almıştır. 29 Ekim 1923 te
    Türkiye Cumhuriyetini ilânı, onun diplomatik dehâsının bir eseridir. […] Cesurâne ve azimkârane ideallere
    sahipti ve yılmak bilmeyen bir yaratıcılıkla eserlerini gerçekleştirmeğe başladı... Atatürk, biz
    Almanlarla geleneksel, yürekten ve karşılıklı itimada dayanan münasebetler idame ettirmiştir... Atatürk,
    daima Türkiye ile Avrupa arasında sıkı bağlar kurmağa çalışmıştır.
  translation: >-
    On 10 November the whole world remembers with appreciation the life and works of a man to whom we Germans,
    too, are bound by friendship and respect... As a soldier Atatürk emerged victorious from a merciless and
    at moments seemingly hopeless struggle, and then took on the responsibility of the state. The proclamation
    of the Turkish Republic on 29 October 1923 is a work of his diplomatic genius. […] He had courageous and
    resolute ideals and began to realise his works with tireless creativity... Atatürk maintained with us
    Germans traditional, heartfelt relations based on mutual trust... Atatürk always strove to build close
    ties between Turkey and Europe.
  is_translation: true
  language: tr
mediated_by: >-
