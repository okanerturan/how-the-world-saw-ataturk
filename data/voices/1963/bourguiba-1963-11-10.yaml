summary: >-
  The 'Gazi' who refused defeat when all seemed lost, restored his country's sovereignty and built a modern
  state: an inspiration for newly sovereign nations.
quote:
  text: >-
    Milletimiz «Gazi» nin ölmez eseri için en büyük hayranlığı duymakta, hâtırasına da en büyük hürmeti
    beslemektedir. Biz O'nun şahsında, savaş meydanlarında, büyük bir asker olduğunu ispat ettikten sonra,
    herşeyin tamamen kaybolduğu zannedildiği bir anda, milletinden ümidini kesmeyi ve mağlûbiyeti kabul etmeyi
    şiddetle reddeden Tanrının seçtiği büyük insanı tebcil ediyoruz. […] Atatürk böylece, ölümü esarete tercih
    eden bir milletin neler yapabileceğini hayretler içinde bulunan dünyaya göstermiştir. Bu örnek
    unutulmayacaktır. Memleketinin eğemenliğinin mimarı olarak, biz Atatürk'ün şahsında, parçalanmak yolunda
    olan bir İmparatorluğun enkazı üstünde ilerlemeye yönelmiş, müessir ve modern bir devlet kurmuş devrimciye
    hayranlık duymaktayız. O'nun ölmez eseri, egemenliklerini elde etmiş milletlerin kaderlerine hükmedenler
    için ışıklı bir örnek ve bir ilham kaynağı olarak kalacaktır.
  translation: >-
    Our nation feels the greatest admiration for the immortal work of the 'Gazi' and holds his memory in the
    highest respect. In his person we glorify the great man chosen by God who, having proved himself a great
    soldier on the battlefields, at a moment when all seemed lost fiercely refused to despair of his nation or
    to accept defeat. […] Atatürk thus showed an astonished world what a nation that prefers death to slavery
    can do. This example will not be forgotten. As the architect of his country's sovereignty, we admire in
    Atatürk the revolutionary who, on the ruins of an empire breaking apart, built an effective, modern state
    turned towards progress. His immortal work will remain a shining example and a source of inspiration for
    those who govern the destinies of nations that have won their sovereignty.
  is_translation: true
  language: tr
mediated_by: >-
