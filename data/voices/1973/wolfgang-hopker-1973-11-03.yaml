summary: >-
  No dogmatist or ideologue but a practical statesman who knew when to wait; yet he misjudged the hold of
  Islamic tradition on Anatolian peasants.
quote:
  text: >-
    Atatürk, ne bir dogmatik idi ve ne de bir ideolog, bilâkis pratik fikirleri olan bir devlet adamı idi.
    Zamanının Türkiyesinde yapılması mümkün olanın sınırı aşmakta olduğunu gördüğü anda, durup münasip zamanı
    beklemesini biliyordu. İşte kendisinin asıl büyüklüğü de buradadır. […] Atatürk bu noktada, âdet ve
    geleneklerin içlerinde ne kadar büyük dirençler sakladıklarını, Anadolu köylüsünün içine İslâmî
    geleneklerin ne kadar derin kökler salmış olduğunu, karanlığın kuvvetini tahminde yanıldı.
  translation: >-
    Atatürk was neither a dogmatist nor an ideologue, but a statesman of practical ideas. The moment he saw
    that what was possible in the Turkey of his time was being exceeded, he knew how to stop and wait for the
    right moment. That is where his real greatness lies. […] At this point Atatürk misjudged how great a
    resistance customs and traditions hide, how deep Islamic traditions had rooted in the Anatolian peasant —
    the strength of the darkness.
  is_translation: true
  language: tr
