summary: >-
  A born leader who still valued organisation and legality, and a soldier who turned military into civilian
  rule; not a mere elitist.
quote:
  text: >-
    Atatürk, Türkiye'nin yaşadığı en uzun barış döneminde zaferleri her zaman hatırlanan bir askerdi ve
    yönetimi askerî rejimden sivil rejime çevirmeyi başarmıştı. […] Doğuştan bir liderdi; buna rağmen
    örgütlenmeye ve yasal gereklere çok önem veriyordu. Bütün bu kutuplar, tek bir diyalektik gerilimin
    parçalarını oluşturdu ve Atatürk'ün yaratıcı önderliğinin katkısıyla bir sentez yarattı. Kurduğu Batılı
    Türk Ulusu ve devletinin gücü, bu sentezin değerini göstermektedir. […] Gerçekte, Atatürk, salt bir
    elitist değildi; bu ve buna benzer birçok nedenlerde, birtakım birbirine karşı unsurları bir araya
    getirmiş ve belirli çelişmezlikleri uzlaştırmıştı.
  translation: >-
    Atatürk was a soldier whose victories were always remembered in the longest period of peace Turkey has
    known, and he succeeded in turning the government from military to civilian rule. […] He was a born
    leader, yet he attached great importance to organisation and legal requirements. All these poles formed
    parts of a single dialectical tension, and with the contribution of Atatürk's creative leadership they
    produced a synthesis. The strength of the Western Turkish nation and state he founded shows the value of
    this synthesis. […] In fact Atatürk was not a mere elitist; for this and many similar reasons he brought
    together a number of opposing elements and reconciled certain contradictions.
  is_translation: true
  language: tr
