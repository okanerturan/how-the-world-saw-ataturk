summary: >-
  In their crisis the Turks 'found a great leader', dynamic and inspiring, who like Churchill in 1940 could
  promise only victory through sacrifice.
quote:
  text: >-
    TÜRKLER Kurtuluş Savaşında heyecan verici bir zafer kazandılar. Bu zafer, cesaret ve sabırlarının
    armağanıydı. Ulusal tarihlerinin bu bunalımlı noktasında Türkler büyük bir önder buldular: Mustafa Kemal
    Atatürk... Hareketli ve ilham verici bir kişiydi Atatürk. Ne var ki, Türkler bedelini ödemekte istekli
    olmasalardı, yurddaşlarını, Atatürk de zafere ulaştıramazdı. 1919 da Atatürk kendi halkına, ancak aşırı
    fedakârlık isteyen bir zafer ihtimali vaadedebilirdi. 1940'da Churchill'in yaptığı da buydu. Türk halkı
    Atatürk'ün çağrısına soylu bir cevap verdi.
  translation: >-
    The Turks won a thrilling victory in the War of Liberation, the gift of their courage and patience. At
    this critical point in their national history the Turks found a great leader: Mustafa Kemal Atatürk…
    Atatürk was a dynamic and inspiring person. Yet had the Turks not been willing to pay the price, not even
    Atatürk could have led his compatriots to victory. In 1919 Atatürk could promise his people only the
    chance of a victory demanding extreme sacrifice. That is what Churchill did in 1940. The Turkish people
    gave Atatürk's call a noble answer.
  is_translation: true
  language: tr
mediated_by: >-
