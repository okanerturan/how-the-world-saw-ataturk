caveat: >-
  Written for the Republic's 50th anniversary, two years before his death; the English original was not seen.
  A striking shift from his 1922 The Western Question (arnold-toynbee-1922). The next day's article in the
  series was by Dankwart Rustow. Read on the page image (Milliyet's subscriber archive).
