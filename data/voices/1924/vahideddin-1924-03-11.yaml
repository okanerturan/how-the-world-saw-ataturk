  note: >-
    Verbatim on p.377: 'Mustafa Kemal ve hempaları Müslümanlar'ın sevgisi, Osmanlılar'ın şehameti ve Allah'ın
    inayetiyle Yunanlılara galip geldi (...ama) bunun kaynağı olan şeriata hemen karşı çıktılar.' Introduced
    as a letter sent from San Remo on 11 Mart 1924 to Şeyh Muhammed Farrac el-Minyevi, head of the Egyptian
    Ulema Union; the list (veil lifted, women in bars and cafés, mixed marriage, polygamy) follows. Bardakçı
    does not state the original language or give the original; the Turkish is his. Evidence S, not P: right.
    Hostile/2 fair.
