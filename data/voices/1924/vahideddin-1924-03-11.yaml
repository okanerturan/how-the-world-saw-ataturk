summary: >-
  After the abolition of the caliphate, says Kemal and his comrades won against the Greeks by Muslim love,
  then turned on the sharia.
quote:
  text: >-
    Mustafa Kemal ve hempaları Müslümanlar'ın sevgisi, Osmanlılar'ın şehameti ve Allah'ın inayetiyle
    Yunanlılara galip geldi
  language: tr
mediated_by: Vahideddin letter of 11 Mar 1924 ← Bardakçı 2006
caveat: >-
  Turkish rendering by Bardakçı of a letter (presumably Arabic) to Sheikh Muhammad Farraj al-Minyawi, head of
  the Egyptian Ulema Union. The sentence goes on (marked '(...ama)'): 'but they at once turned against the
  sharia that was its source'. The following lines, partly garbled in the OCR, list the veil lifted, women in
  bars and cafés, Muslim-Christian marriage allowed, polygamy abolished, hajj made 'a pretext', and that Kemal
  'humiliated the caliphate and the House of Osman'. Vahideddin's own list of grievances; the vault does not
  endorse it. Cited p. 377 (OCR folio).
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
