  note: >-
    Quote verbatim: 'Mustafa Kemal Paşa'nın rakipleri bu kudrette, bu idrakte adamlardı!' It closes the
    chapter on p.283 (next title '17') (folio 282 falls just before the sentence's page; footnotes precede the
    folio, so the sentence is on p.283, not 'uncertain 282-283'). DATE/ERA WRONG: the text was written in
    Lebanon and serialised in Akşam from early 1924 (telegram 10.1.1924 'Hatıratın mabadini yollayınız';
    edition note: second serialisation 24 years after the first, in 1948; 'Lübnan-3 Şubat 1924'); 1964 is only
    the book edition to which the author added footnotes marked as 1964 notes. Correction: date '1924', era
    'contemporary', id 'refik-halid-karay-1924' (page 283). The passage is in the main text, not in a 1964
    note. The wording is about the Istanbul officials, not about Kemal; polarity conflicted is generous but
    acceptable.
