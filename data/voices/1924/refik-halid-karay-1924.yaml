caveat: >-
  Turkish original; Minelbab İlelmihrab was first serialised in 1924 (per the edition's note) and published in
  book form in 1964 with notes (the text here is the 2009 İnkılâp edition, which says so). Karay writes of
  Istanbul in the weeks before the Sivas Congress, and the clause is about the Istanbul side, not a judgement
  of Kemal. He was an Istanbul minister's official then, and a rival of Kemal in that sense; he was exiled by
  the Ankara government in 1922 and allowed back in 1938. The OCR places the passage near folios 282-283; the
  exact page is not certain. A passing view, kept at intensity 1. Dated at check: Minelbab İlelmihrab was
  serialised in Akşam from early 1924 (telegram of 10.1.1924; 'Lübnan-3 Şubat 1924'); 1964 is the book edition
  with later notes. Page 283.
node: Rivals, Exiles and Islamist Critics on Mustafa Kemal in Their Own Words, 1920–1967
