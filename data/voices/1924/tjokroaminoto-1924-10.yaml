id: tjokroaminoto-1924-10
voice: H. O. S. Tjokroaminoto
voice_type: person
role: Sarekat Islam leader
country: Dutch East Indies
country_now: Indonesia
domain: politics
date: "1924-10"
era: contemporary
polarity: conflicted
intensity: 1
artifact: speech
evidence: S
summary: >-
  Answering a proposal to make Kemal caliph, said he approved of Turkey's attitude but it was too early to
  judge the aims of Kemal's secularization.
mediated_by: >-
  Martin van Bruinessen, 'Muslims of the Dutch East Indies and the Caliphate Question', Studia Islamika 2(3),
  1995 ← apparently R.A. Kern's report on the meeting to the governor general, 23 Oct 1924 ('Kalifaatsaktie',
  KITLV, Kern collection H 797 no. 316)
caveat: >-
  Reported speech, not his words: van Bruinessen's account, which seems to rest on the Dutch adviser's report
  (the footnote ties his opening speech to it, not this remark). The proposal he answered is
  al-islam-congress-committee-1924-10. In the same meeting he called the caliph the worldly and spiritual head
  of all Muslims; Formichi (2020, p. 128) also has him stating the need for a caliph in late 1924.
node: The Surabaya Caliphate Meeting, October 1924
