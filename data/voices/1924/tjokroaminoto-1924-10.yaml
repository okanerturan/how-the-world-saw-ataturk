summary: >-
  Answering a proposal to make Kemal caliph, said he approved of Turkey's attitude but it was too early to
  judge the aims of Kemal's secularization.
mediated_by: >-
  Martin van Bruinessen, 'Muslims of the Dutch East Indies and the Caliphate Question', Studia Islamika 2(3),
  1995 ← R.A. Kern's report on the meeting to the governor general, 23 Oct 1924 ('Kalifaatsaktie', KITLV, Kern
  collection H 797 no. 316)
caveat: >-
  Reported speech: the Dutch adviser's summary as van Bruinessen retells it, not his words. The proposal he
  answered is al-islam-congress-committee-1924-10. In the same meeting he called the caliph the worldly and
  spiritual head of all Muslims.
