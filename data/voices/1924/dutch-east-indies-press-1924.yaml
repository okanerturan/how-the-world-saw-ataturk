summary: >-
  Until late 1924, Formichi writes, Indies opinion was unconcerned by the Ottoman defeat and backed Kemal,
  urging a renewed caliphate; the press reported his bravery.
mediated_by: "Chiara Formichi, Islam and Asia: A History (Cambridge UP, 2020), ch. 4, p. 128"
caveat: >-
  A historian's characterisation written in 2020, not words of the period; the paragraph carries no footnote,
  so which newspapers it rests on is not stated. Van Bruinessen (Studia Islamika 1995) agrees that Kemal's
  movement 'enjoyed widespread sympathy among newspaper-reading Indonesian Muslims', but he also says the
  Ottoman defeat shocked many of them (Muhammadiyah protested Sèvres in 1920) and that the sympathy lasted
  after the first secularising reforms. Until 18 Nov 2026 the record quoted Formichi's phrase as if it were
  the press's, and its source link was an IIUM thesis about Malaya. The Surabaya meeting itself:
  al-islam-congress-committee-1924-10, tjokroaminoto-1924-10.
node: The Surabaya Caliphate Meeting, October 1924
