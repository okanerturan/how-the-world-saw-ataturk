summary: >-
  Until late 1924, Indies opinion was unconcerned with the Ottoman defeat
  and supported Kemal, a historian writes; the press praised his bravery.
mediated_by: "Chiara Formichi, Islam and Asia: A History (Cambridge UP, 2020), ch. 4, p. 128"
caveat: >-
  A historian's characterisation written in 2020, not words of the period; the sentence carries no footnote of
  its own (the paragraph ends with note 26 on p. 129, not seen), so which newspapers it rests on is not
  stated. Van Bruinessen (Studia Islamika 1995) says the same: Kemal's resistance movement 'enjoyed widespread
  sympathy among newspaper-reading Indonesian Muslims'. Until 18 Nov 2026 the record quoted Formichi's phrase
  as if it were the press's, and its source link was an IIUM thesis about Malaya, which is not about the
  Indies. The Surabaya meeting itself: al-islam-congress-committee-1924-10, tjokroaminoto-1924-10.
