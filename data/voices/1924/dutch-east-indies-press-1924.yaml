  note: >-
    Found on 18 Nov 2026: the record's 'Cambridge chapter' is ch. 4 of Formichi's Islam and Asia (online ISBN
    9781316226803). The summary now follows the page; 'unconcerned' and 'supportive' are hers. Formichi's full
    sentence: public opinion 'had been overall unconcerned with the Ottomans' defeat, and was supportive of
