  note: >-
    Verbatim: 'But like all bourgeois revolutions, the Turkish revolution is profitable only to one class: the
    moneyed class.' The text is about the Turkish republic of 1923-24: 'torn up the odious Sevres treaty',
    'overthrown the throne of the Sultans', 'united and strong republic', 'since the Lausanne event', and the
    Ankara Government's refusal to recognise the Istanbul workers' birlik. So it does concern Kemalist Turkey,
    though Kemal is never named and no 'Kemalist' label is used. The page carries no signature line; the
    Nguyen Ai Quoc authorship comes from the Ho Chi Minh Archive/Selected Works placement (caveat already says
    so). Polarity conflicted is fair (admiring first paragraph, class critique after). No page number (web
    edition). Suggest recording the article title 'The Workers’ Movement in Turkey'. No correction needed.
