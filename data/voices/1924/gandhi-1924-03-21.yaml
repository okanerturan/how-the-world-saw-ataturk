summary: >-
  Asked about Kemal's deposition of the Khalif, said it did not affect Hindu-Muslim unity, though the unity
  was weaker than before.
quote:
  text: >-
    Gandhi replied that it did not affect Hindu-Muslim unity which, however, he confessed was not so strong as
    formerly.
