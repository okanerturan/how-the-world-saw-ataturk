voice: Georgios Kondylis
voice_type: person
role: Greek general and deputy, later Prime Minister and regent
country: Greece
country_now: Greece
domain: military
date: "1924-06-21"
era: contemporary
polarity: admiring
intensity: 1
mirror: chivalrous-enemy
artifact: speech
evidence: P
summary: >-
  Calls Kemal's resistance to the Greek army 'masterly' and says comparing it shows the difference between the
  two sides' commanders.
quote:
  text: >-
    Ἀρκεῖ νὰ συγκρίνητε τὴν ἀριστοτεχνικὴν ἀντίστασιν τὴν ὁποίαν ὁ Μουσταφᾶ Κεμὰλ ἀντέταξε κατὰ τοῦ Ἑλληνικοῦ
    στρατοῦ διὰ νὰ κατανοήσητε τὴν διαφορὰν τῶν Ἀρχηγῶν.
  language: el
caveat: >-
  Δ΄ Εθνοσυνέλευση, Πρακτικά Τόμος 2, session ΞΒ΄ of 21 June 1924 (heading on p. 354), printed pp. 361-362
  (PDF pages 183-184; page images read). The passage continues Kondylis's reply in the debate on the army's
  responsibility for the Asia Minor defeat and sits between his rebuttal of Mazarakis (p. 361) and Minister
  Pangalos's reply (p. 362). The praise serves his argument that Greek command, not the soldiers, failed. Same
  Kondylis who is cited in 1933 as acting premier (see note); this is the only first-person view of Kemal
  found for him. Check (main agent, page image p. 362): direct speech in the minutes ('Ἀρκεῖ νὰ συγκρίνητε…'),
  verbatim.
