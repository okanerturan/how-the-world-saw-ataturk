  method: DergiPark PDF download
  note: >-
    Turkish line 'Ey Araplar! İçinizde mücadele ateşini tutuşturacak bir Mustafa Kemal yok mu?' is verbatim on
    article p.29 (between folios 28 and 29), as a translation by Benli; the Arabic was not retrieved, so it is
    the translator's words, not the poet's. n.74 'Dîvân, 83' follows the preceding stanza ('Vatanımın
    evlatları...'); the 'Ey Araplar' couplet carries no note of its own, so Diwan p.83 is approximate. Benli
    does not date the poem; the Diwan is dated 21 July 1924 at Haifa (1924/1925 editions) so 1924 is only an
    upper bound. The caveat statement 'written after his imprisonment by the French' is not in Benli's text as
    read (it is inferred from the order in the Diwan, pp.72-83). Keep secondary-only; do not present the line
    as his Arabic wording.
