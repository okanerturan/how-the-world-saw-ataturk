id: mustafa-sabri-1924
voice: Mustafa Sabri Efendi
voice_type: person
role: Last Ottoman Shaykh al-Islam, in exile in Beirut and Cairo
country: Lebanon (French mandate)
country_now: Lebanon
domain: religion
date: "1924"
era: contemporary
polarity: hostile
intensity: 2
mirror: apostate
artifact: book
evidence: P
summary: >-
  Argues that Kemal split caliphate from sultanate not to reform Turkish rule but to take power for himself.
quote:
  text: >-
    Çünkü Mustafa Kemal hilafet-saltanat ayrılığını Türk idaresini ıslah etmek için ortaya atmış değildir.
  language: tr
mediated_by: Turkish translation by Özgür Kavak in İsmail Kara (ed.), Hilafet Risaleleri 6 (2014)
caveat: >-
  Quoted from the Turkish translation by the volume's translator (the Arabic original was not read); the OCR
  has 'aynlığmı', read as 'ayrılığını'. The next paragraph says the Kemalists had 'only two aims': first, to
  take the sultanate from the Ottoman house by force and transfer it to Mustafa Kemal and to separate the
  caliphate from it; the transfer to the Assembly was 'nothing other than hiding the real intent'. Kara dates
  the book to 1923, first finished 1 Receb 1342 / 7 Feb 1924, with a 15-page appendix of 20 Mar 1924 after the
  caliphate fell. Sabri's own judgment; the vault does not endorse it. Cited by the editor's pagination as
  risale 59 ('Hilafetin Saltanattan Tefriki'), listed at p. 405 of the volume; the printed folio is not
  legible in the OCR (archive.org scan, PDF pp. 403-405). Check: risale 59 starts at PDF p. 395; the quote is
  on PDF p. 405. Sabri says he is repeating what he wrote earlier in al-Mukattam and al-Ahram.
node: Sabri Efendi and Mehmed Âkif on Mustafa Kemal, 1924–1935
sources:
  - url: https://archive.org/details/yakintarihhh2
