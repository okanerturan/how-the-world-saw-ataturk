summary: >-
  At Lone Pine on the 75th anniversary, honours the Turkish dead as inspired by the leadership of a 'Man of
  Destiny', Kemal Atatürk.
quote:
  text: >-
    dying in defence of their homeland, inspired by the indomitable leadership of a Man of Destiny, Mustaf a
    Kemal known to history as Kemal Ataturk.
  language: en
caveat: >-
  OCR text of the transcript (the name is printed 'Mustaf a Kemal'; the space is the transcript's). In the
  Ankara dinner speech two days earlier (PM Transcripts 8008, 23 April 1990, garbled OCR) Hawke calls him 'the
  great Mustapha Kema[l] Ataturk' whose Gallipoli defence 'demonstrated the singular qualities of leadership'
  and says the 1934 tribute 'written by Ataturk' shows 'complete reconciliation of former enemies'. The
  'Johnnies and Mehmets' / 'your sons are now lying in our bosom' text that Anzac speakers attribute to
  Atatürk is itself contested: no 1934 original has been found, it first appears in print in 1953 via Interior
  Minister Şükrü Kaya's recollection, and the 'Johnnies and Mehmets' clause is a 1978 Australian addition (see
  [[Johnnies and Mehmets]]). So this is a speaker's view of the Atatürk of the Anzac legend, spoken at a
  commemorative or diplomatic occasion that rewards praise. Cited as: Speech at Lone Pine Ceremony, Gallipoli,
  25 April 1990.
