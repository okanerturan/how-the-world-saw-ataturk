node: New Zealand's Governors-General at Gallipoli, 1990–2026
date: "1990-04-25"
polarity: admiring
intensity: 2
summary: >-
  On the 75th Anzac Day: Allied generals should have studied Kemal's record; his motto 'Peace at home and
  peace in the world' is our duty.
quote:
  text: >-
    If the Allied generals had studied his military record and, in particular, the brilliant defence of the
    Gallipoli Peninsula in the Balkan War a mere three years earlier, they might have had a more realistic
    appreciation of the difficulties that lay ahead.
  language: en
caveat: >-
  International ceremony at the Çanakkale Memorial on the 75th anniversary of the landings (the speech text
  spells the town 'Cannakklae'). He also quoted the opening of Atatürk's words on the Anzac dead ('Those
  heroes that shed their blood… Therefore rest in peace'). The 'Balkan War' defence of the peninsula he
  credits to Kemal is his own reading.
