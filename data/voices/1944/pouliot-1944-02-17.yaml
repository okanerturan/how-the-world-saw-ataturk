summary: >-
  Attacking the government for briefing only opposition leaders in secret, likened it to Kemal choosing his
  own leader of the opposition.
quote:
  text: >-
    I am reminded of Kemal Pasha who, in Turkey, chose his own leader of the opposition; and he was considered
    a very great man-both of them.
  language: en
caveat: >-
  A sarcastic aside in a debate on the war effort: the 'very great man' is said ironically of a leader who
  picked his own opposition, as Kemal did with the Free Republican Party in 1930 (the archive's gloss; Pouliot
  names no party). LiPaD shows the speaker as Mr. POULIOT, who calls himself 'elected by the people of
  Temiscouata'.
