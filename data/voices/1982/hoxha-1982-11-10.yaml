summary: >-
  Honours Atatürk as an outstanding democrat who destroyed the Ottoman Empire and Caliphate, and tells
  'pseudo-democrats' to follow him in cutting the Gordian knot.
quote:
  text: >-
    We honour and respect the great leader of the Turkish people, Mustafa Kemal Ataturk, who, as an
    outstanding democrat, destroyed the Ottoman Empire and the Caliphate and set up the new democratic Turkey.
  language: en
caveat: >-
  Selected Works, vol. VI, 'Address to the electors', dated 10 Nov 1982 (delivered in electoral zone no. 210,
  Tirana), p. 618 (running head '618 ENVER HOXHA'; the OCR prints 'Atatirk'). The next sentence: 'Let all the
  pseudo-democrats and pseudo-socialists who oppress the peoples ... follow the example of Kemal Ataturk who
  cut the Gordian knot of the Ottoman Empire with his sword.' Part of a tour of Albania's neighbours; the
  praise is also a barb at Hoxha's contemporaries. The attribution of the page to the 1982 address rests on
  the continuous run of the speech from p. 598 to p. 620+.
node: Hoxha, Beneš, Brezhnev and the Soviet Presidium on Atatürk, 1939–1982
