    sonuçları üzerinde duracak değilim' (125). Altınay confirms she learned of the operation late, flew to
    Ankara and asked him; he made it subject to Marshal Çakmak. DATE: Altınay p. 262 n. 1 gives the first
    edition as 'Atatürk'ün İzinde Bir Ömür Böyle Geçti, Kaleme Alan Oktay Verel, Türk Hava Kurumu Yayınları,
    1982'. Her quotations are from 'Atatürk'le Bir Ömür, Oktay Verel'in Kaleminden, 2. Basım, İstanbul, Altın
    Kitaplar, 1996'. Corrections: date 1996 → 1982 (id → sabiha-gokcen-1982); mediated_by → '... ← Gökçen,
    Atatürk'le Bir Ömür (2nd pr., Altın Kitaplar 1996), pp. 111, 117-118, 122, 125; 1st ed. Atatürk'ün İzinde
    Bir Ömür Böyle Geçti (THK 1982)'; caveat: replace 'printings of 1984 and 1994 ... not settled' with the
    1982 first edition. Ghost-written ('kaleme alan Oktay Verel') must stay in the caveat. Strict test: the
    episode is narration and the quote is her vow, not a view of Kemal. Admiring rests on the memoir's frame.
    A quote that is her view: '“erişilmeze erişmiştim”' on meeting him in 1925 (Gökçen 1996: 21, Altınay p.
    262). Schema ok.
