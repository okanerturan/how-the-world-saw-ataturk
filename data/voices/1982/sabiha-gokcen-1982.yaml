id: sabiha-gokcen-1982
voice: Sabiha Gökçen
voice_type: person
role: Military pilot, Atatürk's adopted daughter
country: Turkey
country_now: Turkey
domain: military
date: "1982"
era: posthumous
polarity: admiring
intensity: 2
mirror: emancipator-patriarch
artifact: memoir
evidence: S
summary: >-
  Recalls persuading Atatürk to let her fly in the 1937 Dersim operation; he consented and handed her his own
  pistol to guard her honour.
quote:
  text: erişilmeze erişmiştim
  translation: I had reached the unreachable
  note: on meeting him in 1925
  language: tr
mediated_by: >-
  Altınay, in Vatan Millet Kadınlar (İletişim, 2000), pp. 268-269 ← Gökçen, Atatürk'le Bir Ömür (1996
  printing), pp. 111, 117-118, 122
caveat: >-
  TRANSLATION (this record's): 'Should such bad luck happen, do not worry, I will not surrender myself to them
  alive.' Her reply to Kemal, who warned that a forced landing among the rebels would be worse than death. The
  memoir is 'Oktay Verel'in kaleminden' (ghost-written); bibliographies give printings of 1984 and 1994 as
  well, so the first date is not settled. The chapter title is 'Dersim Harekâtı ve Namusumu Koruyacak Silah!'.
  NUANCES vault claim: the vault says he 'deployed her'; in her account she learned of the operation late and
  asked him for permission, which he gave subject to Marshal Çakmak's consent. She says she does not dwell on
  the operation's causes or results (p. 125). Check: first edition *Atatürk'ün İzinde Bir Ömür Böyle Geçti*,
  written by Oktay Verel (Türk Hava Kurumu, 1982); later printings 1996. Quote as cited by Altınay 2000, p.
  262; the Dersim episode is narration about herself.
node: Turkish Writers and Contemporaries on Kemal — Round 33
