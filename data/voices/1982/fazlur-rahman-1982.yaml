summary: >-
  Names Atatürk and Inönü architects of a purely secular school system that expunged religion; says religion's
  subjugation to politics forced secularism, which is no answer.
quote:
  text: >-
    whose two chief architects, Kemal Ataturk and Ismet Inonu, considered it a violation of the sanctity of
    the secularist principle even to mention the word "Allah" in public!
  language: en
caveat: >-
  Islam and Modernity: Transformation of an Intellectual Tradition (University of Chicago Press, 1982), p. 63
  (archive.org scan, printed page headers). Other passages: p. 54 ('despite Atatürk's personal allergy to
  religion Islam returned to national education — via nationalism'); p. 62 (Atatürk's government, 'under the
  claim of unifying all education, eliminated the traditional schools'); p. 91 ('Even the great and powerful
  Atatürk could not reform traditional education'); p. 140 ('it was this pernicious phenomenon [subjugation of
  religion to politics] that forced Kemal Ataturk to opt for secularism. Secularism is not the answer').
  Polarity 'conflicted' because he sees both causes and failure; the dominant tone on education is critical.
  The scan's OCR spells the name 'Atatiirk'; the quote above is from a clean line.
