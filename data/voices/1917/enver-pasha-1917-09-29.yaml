  note: >-
    The quote follows the first printing on p. 510. On the facsimile of the draft's second page the words
    'كمال موفقيتله' are written in above a struck-out phrase, so 'kemal-i muvaffakıyetle' is the right reading
    and the later book dropped a word. P. 509 calls the document 'şifreli telgrafın müsveddesi'. That the book
    lacks the word is known from its OCR text only.
