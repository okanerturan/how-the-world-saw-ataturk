id: faisal-i-1931-07-06
voice: Faisal I of Iraq
voice_type: person
role: King of Iraq, on a state visit to Ankara
country: Iraq
country_now: Iraq
domain: politics
date: "1931-07-06"
era: contemporary
polarity: admiring
intensity: 2
artifact: meeting
evidence: J+S
summary: >-
  On his Ankara state visit, when Kemal mentioned ceded Mosul, answered that Turkey had won all Iraq, its
  streets full of the Gazi's admirers.
quote:
  text: >-
    Fakat buna karşılık bütün Irak'ı kazandınız. Bugün Bağdat caddelerini hep Gazi'nin hayranları ve sevenleri
    dolduruyorlar!
  language: tr
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 25 (Kaynak 2009) p. 188 ← Vakit 8 July 1931 p. 1, Cumhuriyet 9 July 1931;
  British despatch Clerk to Henderson, July 1931 (Şimşir, İngiliz Belgelerinde Atatürk vol. VII)
caveat: >-
  Translation: 'But in return you have won all of Iraq. Today Baghdad's streets are filled with admirers and
  lovers of the Gazi!' Press report of a ball at Ankara Palas conversation; flattery between hosts. On leaving
  (14–15 July) he told reporters Turkey's progress, owed to Atatürk's genius, was an example (Saygı 2017 pp.
  218–219).
node: Statesmen and Royals in Contact with Kemal, 1919–1938
