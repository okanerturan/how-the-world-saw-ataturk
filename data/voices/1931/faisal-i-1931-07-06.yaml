  checked_against: >-
    archive.org butuneserler, djvu text of ABE vol. 25, p. 188 ('Irak Kralı Faysal Şerefine Verilen Ziyafette
    Sohbet', 6 Jul 1931; ← Vakit 8 Jul 1931 p. 1, Cumhuriyet 9 Jul, Yeni Gün 10 Jul); archive.org
    ingiliz-belgelerinde-ataturk, djvu text of Şimşir vol. VII (Clerk to Henderson, July 1931, Nos. 228/230
