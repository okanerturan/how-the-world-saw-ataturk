  method: archive.org open djvu text read
  note: >-
    Quote verbatim on p. 188. Two small points. First, the text says the talk was at the ball given in his
    honour at Ankara Palas ('evvelki gece', in a dispatch dated 7 July), so 'banquet' in the caveat is loose
    and the night may be 5 rather than 6 July (ABE dates it 6 July). Second, Faisal asked that his impressions
    'not be taken as flattery' (gönül alma), which is worth keeping beside the caveat's 'flattery between
    hosts'. The British despatches on the visit are in vol. VII as cited. Saygı p. 218 has the departure
    remarks (the caveat says pp. 218–219).
