    (Pervillé 1974, reposted 2007)
  method: djvu text; archive.org full-text search; Gallica SRU
  note: >-
    Pervillé: 'Abbas a foi dans l'avenir glorieux du monde musulman, et se réjouit de son réveil. Il admire
    Mohammed Abdou, Ibn Séoud et Mustapha Kémal, en dépit de leurs divergences. Mais, en 1936, il nie ...' and
    pen name 'Kémal Abencerages' (undated). It is a historian's one-clause paraphrase; the tie to Le Jeune
    Algérien (1931) comes from the surrounding paragraph. Abbas's own text was not reached (FTS returns
    nothing for Kemal under creator Abbas; Gallica SRU returned nothing). No stated view in his own words.
