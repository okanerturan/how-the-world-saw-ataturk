  note: >-
    Quote verbatim in the footnote spanning pp. 267–268. Manchuria, the fear that Japan would turn on the
    USSR, and the Balkan briefing are all in the telegram, as is 'Türkiye bizimle dostluğa oldukça önem
    veriyor'. Vakit adds the ball and the conversation in French until morning. Litvinov is a foreign
