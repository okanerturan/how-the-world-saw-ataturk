summary: >-
  Reported to Moscow long talks with Kemal, who pressed him on Manchuria, feared Japan would turn on the USSR,
  and explained Turkey's Balkan policy.
quote:
  text: Kemal Paşa'yla, daha da fazla İsmet Paşa'yla uzun görüşmeler yaptım.
  language: tr
mediated_by: >-
  Atatürk'ün Bütün Eserleri vol. 25 pp. 267–268 fn. ← M. Perinçek, Atatürk'ün Sovyetler'le Görüşmeleri (2007)
