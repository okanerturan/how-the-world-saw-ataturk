  ff.)
caveat: >-
  Turkish translation of a Russian telegram. Translation: 'I had long talks with Kemal Pasha, and even more
  with İsmet Pasha.' He judged that Turkey valued Soviet friendship. Vakit (31 Oct 1931) adds that Kemal spoke
  with him in French until morning at the ball.
